# Fragments: what a Container App and a Container Job share  (MAPPING_FORMAT.md §1.3)
#
# Both run one container from an image with the same configuration, roles and links;
# they differ in what keeps it running. container_app.toml and container_job.toml take
# these with `include = "container.<name>"`. `{{noun}}` is "app" or "job".

# ---------------------------------------------------------------- Fields
[image_field]
name = "image"
label = "Image"
type = "string"
required_unless_relation = "attachment"
description = "A full image reference, used when no Container Registry is linked ('Runs image from'). Private registries need pull rights for the execution role (ECR) or identity (AcrPull on Azure)."

[[image_fields]]
name = "repository"
label = "Repository"
type = "string"
pattern = "^[a-z0-9]+([._/-][a-z0-9]+)*$"
pattern_hint = "a repository name: lowercase letters, digits and . _ / -"
description = "Which of the linked Container Registry's repositories the image comes from. Defaults to the first one the registry lists, or the registry itself when it lists none."

[[image_fields]]
name = "image_tag"
label = "Image tag"
type = "string"
pattern = "^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$"
pattern_hint = "a container image tag: letters, digits, '_', '.' and '-', up to 128 characters"
description = "The tag to run from the linked registry. Unset, it is an input variable (<{{noun}}>_image_tag), so a pipeline can pass the tag it just pushed."

[[image_fields]]
name = "size"
label = "Size"
type = "enum"
required = true
options = ["small", "medium", "large", "xlarge"]
default = "small"
description = "small = 0.25 vCPU / 0.5 GB, medium = 0.5 / 1, large = 1 / 2, xlarge = 2 / 4."

[[image_fields]]
name = "cpu_architecture"
label = "CPU architecture"
type = "enum"
options = ["x86_64", "arm64"]
default = "x86_64"
description = "arm64 runs on AWS Graviton (about 20% cheaper on Fargate); build the image for linux/arm64. Azure Container Apps and Cloud Run run linux/amd64 only."

[[env_fields]]
name = "env"
label = "Environment variables"
type = "struct_list"
description = "Plain configuration. Secrets go in Secret environment variables, never here."

[[env_fields.items]]
name = "name"
label = "Name"
type = "string"
required = true
pattern = "^[A-Za-z_][A-Za-z0-9_]*$"
pattern_hint = "an environment variable name: letters, digits and '_'"

[[env_fields.items]]
name = "value"
label = "Value"
type = "string"

[[env_fields]]
name = "secrets"
label = "Secret environment variables"
type = "struct_list"
description = "Environment variables injected from a Secret linked with 'Reads secrets' when the container starts. Name the Secret in a row when more than one is linked."

[[env_fields.items]]
name = "name"
label = "Variable"
type = "string"
required = true
pattern = "^[A-Za-z_][A-Za-z0-9_]*$"
pattern_hint = "an environment variable name: letters, digits and '_'"

[[env_fields.items]]
name = "secret"
label = "Secret"
type = "entity_ref"
targets = ["secret"]
description = "Defaults to the first linked Secret."

[[env_fields.items]]
name = "key"
label = "JSON key"
type = "string"
description = "AWS: read this key of a JSON secret (valueFrom <arn>:<key>::). Empty reads the whole value. Key Vault and Secret Manager secrets hold one value each, so there the whole secret is read."

[[env_fields]]
name = "database_env"
label = "Database variables"
type = "bool"
default = true
description = "Set DB_HOST, DB_PORT and DB_NAME for the database linked with 'Uses'. Clear it when the {{noun}} needs none of them, for instance because it reads the whole connection string from a Secret built from the database ('Value from database')."

[[access_fields]]
name = "delete_objects"
label = "May delete objects"
type = "bool"
default = false
description = "Add delete permission to the read/write bucket grant ('Uses'). Off by default: a service that writes objects rarely needs to erase them."

[[access_fields]]
name = "db_user"
label = "Database user"
type = "string"
pattern = "^[A-Za-z0-9_@.-]{1,63}$"
pattern_hint = "a database user name"
description = "The user the {{noun}} connects as when a linked database has IAM / directory authentication switched on. Defaults to the {{noun}}'s name."

# ---------------------------------------------------------------- Relations
# Everything but the task role, whose cardinality differs.

# A second role, attribute_reference only because iam_binding already names the task role.
[[relations]]
kind = "attribute_reference"
label = "Execution role (pulls the image, reads secrets)"
targets = ["iam_role"]
cardinality = "optional"

[[relations]]
kind = "network_membership"
label = "Subnets"
targets = ["subnet"]
cardinality = "many"
via_parent = true

[[relations]]
kind = "attribute_reference"
label = "Security group"
targets = ["security_group"]
cardinality = "optional"

[[relations]]
kind = "attribute_reference"
label = "Uses (read / write): queue, database, cache, bucket"
targets = ["event_queue", "relational_database", "cache", "object_storage"]
cardinality = "many"

[[relations]]
kind = "reads"
label = "Reads secrets"
targets = ["secret"]
cardinality = "many"

[[relations]]
kind = "reads"
label = "Reads (read-only bucket)"
targets = ["object_storage"]
cardinality = "many"

[[relations]]
kind = "sends_to"
label = "Sends to"
targets = ["event_queue", "topic"]
cardinality = "many"

[[relations]]
kind = "logs_to"
label = "Logs to"
providers = ["aws", "azure"]
targets = ["log_group"]
cardinality = "optional"

[[relations]]
kind = "attachment"
label = "Runs image from"
targets = ["container_registry"]
cardinality = "optional"

# ---------------------------------------------------------------- Every provider
[[secret_checks]]
for_each_field = "secrets"
when = { all = [ { item = "secret", absent = true }, { relation = "reads", target_type = "secret", absent = true } ] }
severity = "error"
message = "\"{name}\": secret variable {item.name} has no Secret to read; link one with 'Reads secrets'"

[[secret_checks]]
for_each_field = "secrets"
when = { all = [ { item = "secret" }, { item = "secret", linked = "reads", absent = true } ] }
severity = "error"
message = "\"{name}\": secret variable {item.name} names a Secret the {{noun}} is not linked to; link it with 'Reads secrets' so the {{noun}} may read it"

# The image is a repository of the linked registry at a tag, or the Image field. The tag
# is the Image tag field, or an input variable a pipeline sets.
[image_tag]
field = "image_tag"
fallback = { entity_var = "image_tag", description = "Image tag the container {{noun}} \"{name}\" runs (the tag your pipeline pushed)." }

# The repository: the Repository field, else the registry's first, else the registry itself.
[image_repository]
field = "repository"
transform = "kebab"
fallback = { if = { relation = "attachment", target_type = "container_registry", target_field = "repositories" }, then = { func = "element", args = [ { relation = "attachment", target_type = "container_registry", field = "repositories", transform = "kebab" }, { value = 0 } ] }, else = { relation = "attachment", target_type = "container_registry", field = "name", transform = "kebab" } }

# AWS: the URL of the repository itself, so a task depends on that repository alone. A
# repository the registry does not list is reached through the registry's host.
[ecs_image]
if = { relation = "attachment", target_type = "container_registry" }
then = { raw = "\"${@url@}:${@tag@}\"", refs = { url = { relation = "attachment", target_type = "container_registry", block = "repo", key = { field = "repository", optional = true }, attr = "repository_url", fallback = { if = { field = "repository" }, then = { raw = "\"${@registry@}/${@repository@}\"", refs = { registry = { relation = "attachment", target_type = "container_registry", connection = "REGISTRY" }, repository = { field = "repository", transform = "kebab" } } }, else = { relation = "attachment", target_type = "container_registry", attr = "repository_url" } } }, tag = { include = "container.image_tag" } } }
else = { field = "image" }

# Azure and Google Cloud: one registry, the repository a path inside it.
[registry_image]
if = { relation = "attachment", target_type = "container_registry" }
then = { raw = "\"${@registry@}/${@repository@}:${@tag@}\"", refs = { registry = { relation = "attachment", target_type = "container_registry", connection = "REGISTRY" }, repository = { include = "container.image_repository" }, tag = { include = "container.image_tag" } } }
else = { field = "image" }

# ---------------------------------------------------------------- AWS
# A task needs a cluster to run in: the enclosing environment's, or one of its own.
[ecs_cluster]
key = "cluster"
resource = "aws_ecs_cluster"
when = { ancestor = "container_environment", absent = true }

[ecs_cluster.args]
name = { template = "{name}-cluster", transform = "kebab" }
tags = { object = { Name = { field = "name" } } }

# The account only matters for the rds-db:connect ARN, which names the database user
# rather than a resource attribute (see kubernetes_workload.toml).
[ecs_account]
key = "account"
resource = "aws_caller_identity"
when = { relation = "attribute_reference", target_type = "relational_database", target_field = "iam_authentication" }

[ecs_task_args]
family                   = { field = "name", transform = "kebab" }
requires_compatibilities = { value = ["FARGATE"] }
network_mode             = { value = "awsvpc" }
cpu                      = { map = "size", table = { small = "256", medium = "512", large = "1024", xlarge = "2048" } }
memory                   = { map = "size", table = { small = "512", medium = "1024", large = "2048", xlarge = "4096" } }
execution_role_arn       = { relation = "attribute_reference", target_type = "iam_role", attr = "arn", fallback = { relation = "iam_binding", attr = "arn" } }
task_role_arn            = { relation = "iam_binding", attr = "arn" }

# The container definition's environment: the rows, then what the links say — the first
# queue, topic, database (unless 'Database variables' is off), cache and 'Uses' bucket.
[ecs_environment]
func = "concat"
args = [ { for_each_field = "env", each = { object = { name = { item = "name" }, value = { item = "value" } } } }, { list = [ { if = { relation = "sends_to", target_type = "event_queue" }, then = { object = { name = { value = "QUEUE_URL" }, value = { relation = "sends_to", target_type = "event_queue", attr = "url" } } } }, { if = { relation = "sends_to", target_type = "topic" }, then = { object = { name = { value = "TOPIC_ARN" }, value = { relation = "sends_to", target_type = "topic", attr = "arn" } } } }, { if = { all = [ { relation = "attribute_reference", target_type = "relational_database" }, { field = "database_env" } ] }, then = { object = { name = { value = "DB_HOST" }, value = { relation = "attribute_reference", target_type = "relational_database", connection = "HOST" } } } }, { if = { all = [ { relation = "attribute_reference", target_type = "relational_database" }, { field = "database_env" } ] }, then = { object = { name = { value = "DB_PORT" }, value = { func = "tostring", args = [ { relation = "attribute_reference", target_type = "relational_database", connection = "PORT" } ] } } } }, { if = { all = [ { relation = "attribute_reference", target_type = "relational_database" }, { field = "database_env" } ] }, then = { object = { name = { value = "DB_NAME" }, value = { relation = "attribute_reference", target_type = "relational_database", connection = "NAME" } } } }, { if = { relation = "attribute_reference", target_type = "cache" }, then = { object = { name = { value = "CACHE_HOST" }, value = { relation = "attribute_reference", target_type = "cache", connection = "HOST" } } } }, { if = { relation = "attribute_reference", target_type = "cache" }, then = { object = { name = { value = "CACHE_PORT" }, value = { func = "tostring", args = [ { relation = "attribute_reference", target_type = "cache", connection = "PORT" } ] } } } }, { if = { relation = "attribute_reference", target_type = "object_storage" }, then = { object = { name = { value = "BUCKET_NAME" }, value = { relation = "attribute_reference", target_type = "object_storage", connection = "NAME" } } } }, { if = { relation = "attribute_reference", target_type = "object_storage" }, then = { object = { name = { value = "BUCKET_REGION" }, value = { var = "region" } } } } ] } ]

# ECS reads each value with the execution role when the task starts: the whole secret,
# or one key of a JSON secret (<arn>:<key>::).
[ecs_secrets]
if = { field = "secrets" }
then = { for_each_field = "secrets", each = { object = { name = { item = "name" }, valueFrom = { if = { item = "key" }, then = { func = "format", args = [ { value = "%s:%s::" }, { if = { item = "secret" }, then = { item_ref = "secret", attr = "arn" }, else = { relation = "reads", target_type = "secret", attr = "arn" } }, { item = "key" } ] }, else = { if = { item = "secret" }, then = { item_ref = "secret", attr = "arn" }, else = { relation = "reads", target_type = "secret", attr = "arn" } } } } } }

[ecs_logs]
if = { relation = "logs_to" }
then = { object = { logDriver = { value = "awslogs" }, options = { object = { "awslogs-group" = { relation = "logs_to", attr = "name" }, "awslogs-region" = { var = "region" }, "awslogs-stream-prefix" = { value = "{{noun}}" } } } } }

# x86_64 is Fargate's default, so only Graviton needs saying.
[ecs_runtime_platform]
block = "runtime_platform"
when = { field = "cpu_architecture", equals = "arm64" }

[ecs_runtime_platform.args]
operating_system_family = { value = "LINUX" }
cpu_architecture        = { value = "ARM64" }

# The execution role reads the injected secrets when a task starts. The managed
# AmazonECSTaskExecutionRolePolicy (attached by the role itself) covers the image pull
# and the logs, but no secrets.
[[ecs_grants]]
key = "exec_secrets"
resource = "aws_iam_role_policy"
when = { all = [ { field = "secrets" }, { relation = "reads", target_type = "secret" } ] }

[ecs_grants.args]
name = { template = "{name}-exec-secrets", transform = "kebab" }
role = { relation = "attribute_reference", target_type = "iam_role", attr = "id", fallback = { relation = "iam_binding", attr = "id" } }

[ecs_grants.args.policy]
func = "jsonencode"

[[ecs_grants.args.policy.args]]
[ecs_grants.args.policy.args.object]
Version = { value = "2012-10-17" }

[[ecs_grants.args.policy.args.object.Statement.list]]
object = { Sid = { value = "InjectSecrets" }, Effect = { value = "Allow" }, Action = { value = ["secretsmanager:GetSecretValue"] }, Resource = { relation = "reads", target_type = "secret", attr = "arn", wrap = "list" } }

# Least-privilege inline policy on the task role, derived from the links — the
# statements a Kubernetes Workload gets for the same links.
[[ecs_grants]]
key = "policy"
resource = "aws_iam_role_policy"
when = { all = [ { relation = "iam_binding" }, { any = [ { relation = "attribute_reference", target_type = "event_queue" }, { relation = "attribute_reference", target_type = "object_storage" }, { relation = "attribute_reference", target_type = "relational_database", target_field = "iam_authentication" }, { relation = "sends_to", target_type = "event_queue" }, { relation = "sends_to", target_type = "topic" }, { all = [ { relation = "reads", target_type = "secret" }, { field = "secrets", absent = true } ] }, { relation = "reads", target_type = "object_storage" } ] } ] }

[ecs_grants.args]
name = { template = "{name}-policy", transform = "kebab" }
role = { relation = "iam_binding", attr = "id" }

[ecs_grants.args.policy]
func = "jsonencode"

[[ecs_grants.args.policy.args]]
[ecs_grants.args.policy.args.object]
Version = { value = "2012-10-17" }

# Consume the queue(s) it uses.
[[ecs_grants.args.policy.args.object.Statement.list]]
if = { relation = "attribute_reference", target_type = "event_queue" }
then = { object = { Sid = { value = "QueueConsume" }, Effect = { value = "Allow" }, Action = { value = ["sqs:ReceiveMessage", "sqs:DeleteMessage", "sqs:GetQueueAttributes", "sqs:GetQueueUrl"] }, Resource = { relation = "attribute_reference", target_type = "event_queue", attr = "arn", wrap = "list" } } }

[[ecs_grants.args.policy.args.object.Statement.list]]
if = { relation = "sends_to", target_type = "event_queue" }
then = { object = { Sid = { value = "QueueSend" }, Effect = { value = "Allow" }, Action = { value = ["sqs:SendMessage", "sqs:GetQueueUrl", "sqs:GetQueueAttributes"] }, Resource = { relation = "sends_to", target_type = "event_queue", attr = "arn", wrap = "list" } } }

[[ecs_grants.args.policy.args.object.Statement.list]]
if = { relation = "sends_to", target_type = "topic" }
then = { object = { Sid = { value = "TopicPublish" }, Effect = { value = "Allow" }, Action = { value = ["sns:Publish"] }, Resource = { relation = "sends_to", target_type = "topic", attr = "arn", wrap = "list" } } }

# Secrets the code reads itself at run time. When secrets are injected as environment
# variables the execution role reads them instead, and the task role gets nothing it
# does not need.
[[ecs_grants.args.policy.args.object.Statement.list]]
if = { all = [ { relation = "reads", target_type = "secret" }, { field = "secrets", absent = true } ] }
then = { object = { Sid = { value = "Secrets" }, Effect = { value = "Allow" }, Action = { value = ["secretsmanager:GetSecretValue", "secretsmanager:DescribeSecret"] }, Resource = { relation = "reads", target_type = "secret", attr = "arn", wrap = "list" } } }

[[ecs_grants.args.policy.args.object.Statement.list]]
if = { relation = "attribute_reference", target_type = "object_storage" }
then = { object = { Sid = { value = "Bucket" }, Effect = { value = "Allow" }, Action = { if = { field = "delete_objects" }, then = { value = ["s3:GetObject", "s3:PutObject", "s3:DeleteObject", "s3:ListBucket"] }, else = { value = ["s3:GetObject", "s3:PutObject", "s3:ListBucket"] } }, Resource = { func = "concat", args = [ { relation = "attribute_reference", target_type = "object_storage", attr = "arn", wrap = "list" }, { func = "formatlist", args = [ { value = "%s/*" }, { relation = "attribute_reference", target_type = "object_storage", attr = "arn", wrap = "list" } ] } ] } } }

[[ecs_grants.args.policy.args.object.Statement.list]]
if = { relation = "reads", target_type = "object_storage" }
then = { object = { Sid = { value = "BucketRead" }, Effect = { value = "Allow" }, Action = { value = ["s3:GetObject", "s3:ListBucket"] }, Resource = { func = "concat", args = [ { relation = "reads", target_type = "object_storage", attr = "arn", wrap = "list" }, { func = "formatlist", args = [ { value = "%s/*" }, { relation = "reads", target_type = "object_storage", attr = "arn", wrap = "list" } ] } ] } } }

[[ecs_grants.args.policy.args.object.Statement.list]]
if = { relation = "attribute_reference", target_type = "relational_database", target_field = "iam_authentication" }
then = { object = { Sid = { value = "DatabaseConnect" }, Effect = { value = "Allow" }, Action = { value = ["rds-db:connect"] }, Resource = { func = "formatlist", args = [ { value = "arn:aws:rds-db:%s:%s:dbuser:%s/%s" }, { var = "region" }, { self_data = "account", attr = "account_id" }, { relation = "attribute_reference", target_type = "relational_database", attr = "resource_id", wrap = "list" }, { field = "db_user", fallback = { field = "name", transform = "kebab" } } ] } } }

# ---------------------------------------------------------------- Azure
# VNet integration needs a subnet delegated to Microsoft.App/environments (and /23 or
# larger: checked by the built-in network checks). Inside a Container Environment the
# environment owns the subnet, so the container's own subnet links do not matter here.
[aca_subnet_check]
when = { all = [ { ancestor = "container_environment", absent = true }, { relation = "network_membership" }, { relation = "network_membership", target_provider_field = "delegation", equals = "app_environments", absent = true } ] }
message = "\"{name}\" is VNet-integrated but no linked subnet is delegated to app_environments (set the subnet's Azure Delegation field; the environment uses the first linked subnet)"

[aca_arm64_check]
when = { field = "cpu_architecture", equals = "arm64" }
message = "\"{name}\" is built for arm64, but Azure Container Apps run linux/amd64 only; publish a multi-architecture image"

[aca_environment]
key = "env"
resource = "azurerm_container_app_environment"
when = { ancestor = "container_environment", absent = true }

[aca_environment.args]
name                       = { template = "{name}-env", transform = "kebab" }
location                   = { var = "location" }
resource_group_name        = { ancestor = "resource_group", attr = "name" }
log_analytics_workspace_id = { relation = "logs_to", attr = "id" }
infrastructure_subnet_id   = { relation = "network_membership", attr = "id" }

[aca_container_args]
name   = { field = "name", transform = "kebab" }
image  = { include = "container.registry_image" }
cpu    = { map = "size", table = { small = 0.25, medium = 0.5, large = 1.0, xlarge = 2.0 } }
memory = { map = "size", table = { small = "0.5Gi", medium = "1Gi", large = "2Gi", xlarge = "4Gi" } }

# The container's environment: the rows, the secret variables, then what the links say.
[[aca_env]]
block = "env"
for_each_field = "env"

[aca_env.args]
name  = { item = "name" }
value = { item = "value" }

# A secret variable names one of the app's secrets (below), which is a Key Vault reference.
[[aca_env]]
block = "env"
for_each_field = "secrets"

[aca_env.args]
name        = { item = "name" }
secret_name = { item = "name", transform = "kebab" }

[[aca_env]]
block = "env"
when = { relation = "sends_to", target_type = "event_queue" }

[aca_env.args]
name  = { value = "QUEUE_NAME" }
value = { relation = "sends_to", target_type = "event_queue", attr = "name" }

[[aca_env]]
block = "env"
when = { all = [ { relation = "attribute_reference", target_type = "relational_database" }, { field = "database_env" } ] }

[aca_env.args]
name  = { value = "DB_HOST" }
value = { relation = "attribute_reference", target_type = "relational_database", connection = "HOST" }

[[aca_env]]
block = "env"
when = { all = [ { relation = "attribute_reference", target_type = "relational_database" }, { field = "database_env" } ] }

[aca_env.args]
name  = { value = "DB_PORT" }
value = { func = "tostring", args = [ { relation = "attribute_reference", target_type = "relational_database", connection = "PORT" } ] }

[[aca_env]]
block = "env"
when = { all = [ { relation = "attribute_reference", target_type = "relational_database" }, { field = "database_env" } ] }

[aca_env.args]
name  = { value = "DB_NAME" }
value = { relation = "attribute_reference", target_type = "relational_database", connection = "NAME" }

[[aca_env]]
block = "env"
when = { relation = "attribute_reference", target_type = "cache" }

[aca_env.args]
name  = { value = "CACHE_HOST" }
value = { relation = "attribute_reference", target_type = "cache", connection = "HOST" }

[[aca_env]]
block = "env"
when = { relation = "attribute_reference", target_type = "cache" }

[aca_env.args]
name  = { value = "CACHE_PORT" }
value = { func = "tostring", args = [ { relation = "attribute_reference", target_type = "cache", connection = "PORT" } ] }

# An Azure 'bucket' is a container in a storage account: both are needed to reach it.
[[aca_env]]
block = "env"
when = { relation = "attribute_reference", target_type = "object_storage" }

[aca_env.args]
name  = { value = "BUCKET_ACCOUNT" }
value = { relation = "attribute_reference", target_type = "object_storage", connection = "ACCOUNT" }

[[aca_env]]
block = "env"
when = { relation = "attribute_reference", target_type = "object_storage" }

[aca_env.args]
name  = { value = "BUCKET_CONTAINER" }
value = { relation = "attribute_reference", target_type = "object_storage", connection = "CONTAINER" }

# One secret per secret variable: a Key Vault reference, read with the execution
# identity. Key Vault secrets hold one value, so the whole secret is the variable.
[[aca_credentials]]
block = "secret"
for_each_field = "secrets"

[aca_credentials.args]
name                = { item = "name", transform = "kebab" }
identity            = { relation = "attribute_reference", target_type = "iam_role", attr = "id", fallback = { relation = "iam_binding", attr = "id" } }
key_vault_secret_id = { if = { item = "secret" }, then = { item_ref = "secret", attr = "versionless_id" }, else = { relation = "reads", target_type = "secret", attr = "versionless_id" } }

# A linked registry is pulled with the same identity, which gets AcrPull (below).
[[aca_credentials]]
block = "registry"
when = { all = [ { relation = "attachment", target_type = "container_registry" }, { any = [ { relation = "iam_binding" }, { relation = "attribute_reference", target_type = "iam_role" } ] } ] }

[aca_credentials.args]
server   = { relation = "attachment", target_type = "container_registry", connection = "REGISTRY" }
identity = { relation = "attribute_reference", target_type = "iam_role", attr = "id", fallback = { relation = "iam_binding", attr = "id" } }

# Least-privilege role assignments, one per linked resource.
[[aca_grants]]
key = "send"
resource = "azurerm_role_assignment"
for_each_relation = "sends_to"
for_each_target_type = "event_queue"
when = { relation = "iam_binding" }

[aca_grants.args]
scope                = { target = "id" }
role_definition_name = { value = "Azure Service Bus Data Sender" }
principal_id         = { relation = "iam_binding", attr = "principal_id" }

[[aca_grants]]
key = "publish"
resource = "azurerm_role_assignment"
for_each_relation = "sends_to"
for_each_target_type = "topic"
when = { relation = "iam_binding" }

[aca_grants.args]
scope                = { target = "id" }
role_definition_name = { value = "Azure Service Bus Data Sender" }
principal_id         = { relation = "iam_binding", attr = "principal_id" }

[[aca_grants]]
key = "receive"
resource = "azurerm_role_assignment"
for_each_relation = "attribute_reference"
for_each_target_type = "event_queue"
when = { relation = "iam_binding" }

[aca_grants.args]
scope                = { target = "id" }
role_definition_name = { value = "Azure Service Bus Data Receiver" }
principal_id         = { relation = "iam_binding", attr = "principal_id" }

# Injected secrets are read by the execution identity; secrets the code reads itself
# (no secret variables) by the identity it runs as.
[[aca_grants]]
key = "secret_read"
resource = "azurerm_role_assignment"
for_each_relation = "reads"
for_each_target_type = "secret"
when = { any = [ { relation = "iam_binding" }, { relation = "attribute_reference", target_type = "iam_role" } ] }

[aca_grants.args]
scope                = { target = "id" }
role_definition_name = { value = "Key Vault Secrets User" }
principal_id         = { if = { field = "secrets" }, then = { relation = "attribute_reference", target_type = "iam_role", attr = "principal_id", fallback = { relation = "iam_binding", attr = "principal_id" } }, else = { relation = "iam_binding", attr = "principal_id", fallback = { relation = "attribute_reference", target_type = "iam_role", attr = "principal_id" } } }

[[aca_grants]]
key = "blob_read"
resource = "azurerm_role_assignment"
for_each_relation = "reads"
for_each_target_type = "object_storage"
when = { relation = "iam_binding" }

[aca_grants.args]
scope                = { target = "id" }
role_definition_name = { value = "Storage Blob Data Reader" }
principal_id         = { relation = "iam_binding", attr = "principal_id" }

[[aca_grants]]
key = "blob"
resource = "azurerm_role_assignment"
for_each_relation = "attribute_reference"
for_each_target_type = "object_storage"
when = { relation = "iam_binding" }

[aca_grants.args]
scope                = { target = "id" }
role_definition_name = { value = "Storage Blob Data Contributor" }
principal_id         = { relation = "iam_binding", attr = "principal_id" }

[[aca_grants]]
key = "acr_pull"
resource = "azurerm_role_assignment"
when = { all = [ { relation = "attachment", target_type = "container_registry" }, { any = [ { relation = "iam_binding" }, { relation = "attribute_reference", target_type = "iam_role" } ] } ] }

[aca_grants.args]
scope                = { relation = "attachment", target_type = "container_registry", attr = "id" }
role_definition_name = { value = "AcrPull" }
principal_id         = { relation = "attribute_reference", target_type = "iam_role", attr = "principal_id", fallback = { relation = "iam_binding", attr = "principal_id" } }

# A linked Security Group becomes the NSG of the environment subnet(s).
[[aca_grants]]
key = "nsg"
resource = "azurerm_subnet_network_security_group_association"
for_each_relation = "network_membership"
when = { all = [ { ancestor = "container_environment", absent = true }, { relation = "attribute_reference", target_type = "security_group" } ] }

[aca_grants.args]
subnet_id                 = { target = "id" }
network_security_group_id = { relation = "attribute_reference", target_type = "security_group", attr = "id" }

# ---------------------------------------------------------------- GCP
[cloud_run_arm64_check]
when = { field = "cpu_architecture", equals = "arm64" }
message = "\"{name}\" is built for arm64, but Cloud Run runs linux/amd64 only; publish a multi-architecture image"

# Google Cloud has one identity per service or job: the task role, or the execution
# role when there is no task role.
[cloud_run_service_account]
relation = "iam_binding"
attr = "email"
fallback = { relation = "attribute_reference", target_type = "iam_role", attr = "email" }

[cloud_run_limits.object]
cpu    = { map = "size", table = { small = "1", medium = "1", large = "2", xlarge = "4" } }
memory = { map = "size", table = { small = "512Mi", medium = "1Gi", large = "2Gi", xlarge = "4Gi" } }

# The container's environment: the rows, the secret variables, then what the links say.
[[cloud_run_env]]
block = "env"
for_each_field = "env"

[cloud_run_env.args]
name  = { item = "name" }
value = { item = "value" }

[[cloud_run_env]]
block = "env"
for_each_field = "secrets"

[cloud_run_env.args]
name = { item = "name" }

[[cloud_run_env.nested]]
block = "value_source"

[[cloud_run_env.nested.nested]]
block = "secret_key_ref"

[cloud_run_env.nested.nested.args]
secret  = { if = { item = "secret" }, then = { item_ref = "secret", attr = "id" }, else = { relation = "reads", target_type = "secret", attr = "id" } }
version = { value = "latest" }

[[cloud_run_env]]
block = "env"
when = { relation = "sends_to", target_type = "event_queue" }

[cloud_run_env.args]
name  = { value = "QUEUE_TOPIC" }
value = { relation = "sends_to", target_type = "event_queue", attr = "id" }

[[cloud_run_env]]
block = "env"
when = { relation = "sends_to", target_type = "topic" }

[cloud_run_env.args]
name  = { value = "TOPIC" }
value = { relation = "sends_to", target_type = "topic", attr = "id" }

[[cloud_run_env]]
block = "env"
when = { all = [ { relation = "attribute_reference", target_type = "relational_database" }, { field = "database_env" } ] }

[cloud_run_env.args]
name  = { value = "DB_HOST" }
value = { relation = "attribute_reference", target_type = "relational_database", connection = "HOST" }

[[cloud_run_env]]
block = "env"
when = { all = [ { relation = "attribute_reference", target_type = "relational_database" }, { field = "database_env" } ] }

[cloud_run_env.args]
name  = { value = "DB_PORT" }
value = { func = "tostring", args = [ { relation = "attribute_reference", target_type = "relational_database", connection = "PORT" } ] }

[[cloud_run_env]]
block = "env"
when = { all = [ { relation = "attribute_reference", target_type = "relational_database" }, { field = "database_env" } ] }

[cloud_run_env.args]
name  = { value = "DB_NAME" }
value = { relation = "attribute_reference", target_type = "relational_database", connection = "NAME" }

[[cloud_run_env]]
block = "env"
when = { relation = "attribute_reference", target_type = "cache" }

[cloud_run_env.args]
name  = { value = "CACHE_HOST" }
value = { relation = "attribute_reference", target_type = "cache", connection = "HOST" }

[[cloud_run_env]]
block = "env"
when = { relation = "attribute_reference", target_type = "cache" }

[cloud_run_env.args]
name  = { value = "CACHE_PORT" }
value = { func = "tostring", args = [ { relation = "attribute_reference", target_type = "cache", connection = "PORT" } ] }

[[cloud_run_env]]
block = "env"
when = { relation = "attribute_reference", target_type = "object_storage" }

[cloud_run_env.args]
name  = { value = "BUCKET_NAME" }
value = { relation = "attribute_reference", target_type = "object_storage", connection = "NAME" }

# Subnets become direct VPC egress.
[cloud_run_vpc]
block = "vpc_access"
when = { relation = "network_membership" }

[cloud_run_vpc.args]
egress = { value = "ALL_TRAFFIC" }

[[cloud_run_vpc.nested]]
block = "network_interfaces"

[cloud_run_vpc.nested.args]
subnetwork = { relation = "network_membership", attr = "id" }
tags       = { relation = "attribute_reference", target_type = "security_group", block = "tag", attr = "output", wrap = "list", optional = true }

# Least-privilege IAM members for the service account, one per linked resource. Cloud
# Run reads injected secrets with that same account, so the secrets injected and the
# ones the code reads are granted the same way.
[[cloud_run_grants]]
key = "publish"
resource = "google_pubsub_topic_iam_member"
for_each_relation = "sends_to"
when = { relation = "iam_binding" }

[cloud_run_grants.args]
topic  = { target = "id" }
role   = { value = "roles/pubsub.publisher" }
member = { relation = "iam_binding", attr = "member" }

[[cloud_run_grants]]
key = "consume"
resource = "google_pubsub_subscription_iam_member"
for_each_relation = "attribute_reference"
for_each_target_type = "event_queue"
when = { relation = "iam_binding" }

[cloud_run_grants.args]
subscription = { target = "id", block = "sub" }
role         = { value = "roles/pubsub.subscriber" }
member       = { relation = "iam_binding", attr = "member" }

[[cloud_run_grants]]
key = "secret_read"
resource = "google_secret_manager_secret_iam_member"
for_each_relation = "reads"
for_each_target_type = "secret"
when = { any = [ { relation = "iam_binding" }, { relation = "attribute_reference", target_type = "iam_role" } ] }

[cloud_run_grants.args]
secret_id = { target = "id" }
role      = { value = "roles/secretmanager.secretAccessor" }
member    = { relation = "iam_binding", attr = "member", fallback = { relation = "attribute_reference", target_type = "iam_role", attr = "member" } }

[[cloud_run_grants]]
key = "bucket_read"
resource = "google_storage_bucket_iam_member"
for_each_relation = "reads"
for_each_target_type = "object_storage"
when = { relation = "iam_binding" }

[cloud_run_grants.args]
bucket = { target = "name" }
role   = { value = "roles/storage.objectViewer" }
member = { relation = "iam_binding", attr = "member" }

[[cloud_run_grants]]
key = "bucket_rw"
resource = "google_storage_bucket_iam_member"
for_each_relation = "attribute_reference"
for_each_target_type = "object_storage"
when = { relation = "iam_binding" }

[cloud_run_grants.args]
bucket = { target = "name" }
role   = { if = { field = "delete_objects" }, then = { value = "roles/storage.objectAdmin" }, else = { value = "roles/storage.objectCreator" } }
member = { relation = "iam_binding", attr = "member" }

[[cloud_run_grants]]
key = "bucket_rw_read"
resource = "google_storage_bucket_iam_member"
for_each_relation = "attribute_reference"
for_each_target_type = "object_storage"
when = { all = [ { relation = "iam_binding" }, { field = "delete_objects", not_equals = "true" } ] }

[cloud_run_grants.args]
bucket = { target = "name" }
role   = { value = "roles/storage.objectViewer" }
member = { relation = "iam_binding", attr = "member" }
