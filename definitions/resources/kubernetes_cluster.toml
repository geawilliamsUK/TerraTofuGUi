# Abstract type: Kubernetes Cluster
#
# AWS: EKS — cluster IAM role + policy, aws_eks_cluster, node IAM role + 3 policies,
#      aws_eks_node_group (the default pool) and one aws_eks_addon per add-on.
#      Link two subnets in different availability zones.
# Azure: AKS — azurerm_kubernetes_cluster with a system-assigned identity and an
#      autoscaling default node pool in the first linked subnet (Azure CNI).
# GCP: a regional GKE Standard cluster with one autoscaling node pool.
#
# Extra pools are Kubernetes Node Pool nodes linked with 'Runs on'; pods that need a cloud
# identity are Kubernetes Workload nodes. Workload identity is switched on for all three
# providers (EKS Pod Identity, AKS OIDC issuer, GKE workload pool) because the Workload
# type has nothing to bind to otherwise.

schema_version = 2

[resource]
type = "kubernetes_cluster"
category = "container"
display_name = "Kubernetes Cluster"
description = "A managed Kubernetes control plane with one autoscaling node pool. Link the subnets it runs in."
kind = "node"
allowed_parents = ["virtual_network", "resource_group"]
icon = "K8S"

[[fields]]
name = "node_size"
label = "Node size"
type = "enum"
required = true
options = ["small", "medium", "large", "xlarge"]
default = "small"
description = "Size of the default pool's nodes. Extra pools carry their own size."

[[fields]]
name = "node_count"
label = "Desired nodes"
type = "int"
required = true
default = 2

[[fields]]
name = "min_nodes"
label = "Min nodes"
type = "int"
required = true
default = 1

[[fields]]
name = "max_nodes"
label = "Max nodes"
type = "int"
required = true
default = 3

[[fields]]
name = "private_endpoint"
label = "Private API endpoint"
type = "bool"
default = false
description = "Keep the Kubernetes API off the public internet. Reachable only from inside the network (or over a peering / VPN) afterwards."

[[fields]]
name = "public_access_cidrs"
label = "Public API access from"
type = "string_list"
description = "CIDR ranges allowed to reach the public API endpoint. Empty means anywhere (the provider default)."

[[fields]]
name = "addons"
label = "Add-ons"
type = "string_list"
description = "Cluster add-ons to install: ebs_csi, efs_csi, pod_identity_agent, metrics_server, coredns, kube_proxy, vpc_cni, cluster_autoscaler. Only AWS installs them as resources; the others say what applies in MANUAL_STEPS. cluster_autoscaler is not an EKS add-on: on AWS it generates the discovery tags, a role and a pod identity for the Helm chart, and on AKS / GKE it is already built in."

[[fields]]
name = "container_insights"
label = "Container Insights"
type = "bool"
default = false
description = "Collect cluster, node and pod metrics (and on AWS container logs) so that node_count and pod-level alarms have something to watch. AWS installs the amazon-cloudwatch-observability add-on and grants the nodes CloudWatchAgentServerPolicy; AKS runs the OMS agent against the linked Log Analytics workspace; GKE switches on the system metric components and managed Prometheus."

[[relations]]
kind = "network_membership"
label = "Subnets"
targets = ["subnet"]
cardinality = "many"

[[relations]]
kind = "logs_to"
label = "Logs to"
targets = ["log_group"]
cardinality = "optional"

# ---------------------------------------------------------------- AWS
[providers.aws]
status = "partial"

[[providers.aws.fields]]
name = "version"
label = "Kubernetes version"
type = "string"
pattern = "^[0-9]+\\.[0-9]+$"
pattern_hint = "major.minor, e.g. 1.33"
description = "Leave empty to take the EKS default for the region. Pinning a version that the region has retired makes apply fail, which is why there is no default here."

[[providers.aws.checks]]
for_each_field = "addons"
severity = "error"
when = { all = [ { item = "value", not_equals = "ebs_csi" }, { item = "value", not_equals = "efs_csi" }, { item = "value", not_equals = "pod_identity_agent" }, { item = "value", not_equals = "metrics_server" }, { item = "value", not_equals = "coredns" }, { item = "value", not_equals = "kube_proxy" }, { item = "value", not_equals = "vpc_cni" }, { item = "value", not_equals = "cluster_autoscaler" } ] }
message = "\"{name}\": unknown add-on '{item.value}'; use ebs_csi, efs_csi, pod_identity_agent, metrics_server, coredns, kube_proxy, vpc_cni or cluster_autoscaler"

[[providers.aws.blocks]]
key = "cluster_role"
resource = "aws_iam_role"

[providers.aws.blocks.args]
name = { template = "{name}-cluster", transform = "kebab" }

[providers.aws.blocks.args.assume_role_policy]
func = "jsonencode"
[[providers.aws.blocks.args.assume_role_policy.args]]
[providers.aws.blocks.args.assume_role_policy.args.object]
Version = { value = "2012-10-17" }
[[providers.aws.blocks.args.assume_role_policy.args.object.Statement.list]]
[providers.aws.blocks.args.assume_role_policy.args.object.Statement.list.object]
Effect    = { value = "Allow" }
Action    = { value = "sts:AssumeRole" }
Principal = { object = { Service = { value = "eks.amazonaws.com" } } }

[[providers.aws.blocks]]
key = "cluster_policy"
resource = "aws_iam_role_policy_attachment"

[providers.aws.blocks.args]
role       = { self_block = "cluster_role", attr = "name" }
policy_arn = { value = "arn:aws:iam::aws:policy/AmazonEKSClusterPolicy" }

[[providers.aws.blocks]]
key = "main"
resource = "aws_eks_cluster"

[providers.aws.blocks.args]
name       = { field = "name", transform = "kebab" }
role_arn   = { self_block = "cluster_role", attr = "arn" }
version    = { provider_field = "version", optional = true }
# Which control-plane streams are switched on. Where they land is the linked Log Group's
# business: it renames itself to the name EKS would use.
enabled_cluster_log_types = { if = { relation = "logs_to" }, then = { value = ["api", "audit", "authenticator", "controllerManager", "scheduler"] } }
# EKS creates `/aws/eks/<cluster>/cluster` itself when logging starts and the group is
# missing, and then owns it. The linked Log Group takes that name (see log_group.toml), so
# the cluster waits for it instead of referring to it — a reference would be a cycle.
depends_on = { list = [ { self_block = "cluster_policy", attr = "" }, { relation = "logs_to", attr = "" } ] }

# Access to the API server. These belong in the vpc_config block the mapping already writes.
[[providers.aws.blocks.nested]]
block = "vpc_config"

[providers.aws.blocks.nested.args]
subnet_ids              = { relation = "network_membership", attr = "id", wrap = "list" }
endpoint_private_access = { field = "private_endpoint" }
endpoint_public_access  = { if = { field = "private_endpoint" }, then = { value = false }, else = { value = true } }
public_access_cidrs     = { field = "public_access_cidrs", optional = true }

# Pods assume IAM roles through EKS Pod Identity, which the Workload type relies on.
[[providers.aws.blocks.nested]]
block = "access_config"

[providers.aws.blocks.nested.args]
authentication_mode = { value = "API_AND_CONFIG_MAP" }

[[providers.aws.blocks]]
key = "node_role"
resource = "aws_iam_role"

[providers.aws.blocks.args]
name = { template = "{name}-nodes", transform = "kebab" }

[providers.aws.blocks.args.assume_role_policy]
func = "jsonencode"
[[providers.aws.blocks.args.assume_role_policy.args]]
[providers.aws.blocks.args.assume_role_policy.args.object]
Version = { value = "2012-10-17" }
[[providers.aws.blocks.args.assume_role_policy.args.object.Statement.list]]
[providers.aws.blocks.args.assume_role_policy.args.object.Statement.list.object]
Effect    = { value = "Allow" }
Action    = { value = "sts:AssumeRole" }
Principal = { object = { Service = { value = "ec2.amazonaws.com" } } }

[[providers.aws.blocks]]
key = "node_policy_worker"
resource = "aws_iam_role_policy_attachment"

[providers.aws.blocks.args]
role       = { self_block = "node_role", attr = "name" }
policy_arn = { value = "arn:aws:iam::aws:policy/AmazonEKSWorkerNodePolicy" }

[[providers.aws.blocks]]
key = "node_policy_cni"
resource = "aws_iam_role_policy_attachment"

[providers.aws.blocks.args]
role       = { self_block = "node_role", attr = "name" }
policy_arn = { value = "arn:aws:iam::aws:policy/AmazonEKS_CNI_Policy" }

[[providers.aws.blocks]]
key = "node_policy_ecr"
resource = "aws_iam_role_policy_attachment"

[providers.aws.blocks.args]
role       = { self_block = "node_role", attr = "name" }
policy_arn = { value = "arn:aws:iam::aws:policy/AmazonEC2ContainerRegistryReadOnly" }

[[providers.aws.blocks]]
key = "nodes"
resource = "aws_eks_node_group"

[providers.aws.blocks.args]
cluster_name    = { self_block = "main", attr = "name" }
node_group_name = { value = "default" }
node_role_arn   = { self_block = "node_role", attr = "arn" }
subnet_ids      = { relation = "network_membership", attr = "id", wrap = "list" }
instance_types  = { map = "node_size", table = { small = ["t3.medium"], medium = ["t3.large"], large = ["m5.xlarge"], xlarge = ["m5.2xlarge"] } }
# Cluster Autoscaler finds the groups it may resize by two tags, the second of which
# carries the cluster name. An object literal cannot have a computed key, so the map is
# built with zipmap.
tags            = { if = { field = "addons", equals = "cluster_autoscaler" }, then = { func = "zipmap", args = [ { list = [ { value = "Name" }, { value = "k8s.io/cluster-autoscaler/enabled" }, { func = "format", args = [ { value = "k8s.io/cluster-autoscaler/%s" }, { self_block = "main", attr = "name" } ] } ] }, { list = [ { field = "name" }, { value = "true" }, { value = "owned" } ] } ] }, else = { object = { Name = { field = "name" } } } }
depends_on      = { list = [ { self_block = "node_policy_worker", attr = "" }, { self_block = "node_policy_cni", attr = "" }, { self_block = "node_policy_ecr", attr = "" } ] }

[[providers.aws.blocks.nested]]
block = "scaling_config"

[providers.aws.blocks.nested.args]
desired_size = { field = "node_count" }
min_size     = { field = "min_nodes" }
max_size     = { field = "max_nodes" }

# One add-on resource per entry of the abstract list. `cluster_autoscaler` is not an EKS
# add-on at all — it is a Helm chart with an IAM identity, generated below.
[[providers.aws.blocks]]
key = "addon"
resource = "aws_eks_addon"
for_each_field = "addons"
when = { item = "value", not_equals = "cluster_autoscaler" }

[providers.aws.blocks.args]
cluster_name  = { self_block = "main", attr = "name" }
addon_name    = { map = "value", table = { ebs_csi = "aws-ebs-csi-driver", efs_csi = "aws-efs-csi-driver", pod_identity_agent = "eks-pod-identity-agent", metrics_server = "metrics-server", coredns = "coredns", kube_proxy = "kube-proxy", vpc_cni = "vpc-cni" } }
depends_on    = { list = [ { self_block = "nodes", attr = "" } ] }

# Container Insights: the CloudWatch agent and Fluent Bit, installed as an add-on, plus the
# policy the nodes need before either can publish anything.
[[providers.aws.blocks]]
key = "insights"
resource = "aws_eks_addon"
when = { field = "container_insights" }

[providers.aws.blocks.args]
cluster_name = { self_block = "main", attr = "name" }
addon_name   = { value = "amazon-cloudwatch-observability" }
depends_on   = { list = [ { self_block = "nodes", attr = "" } ] }

[[providers.aws.blocks]]
key = "node_policy_cloudwatch"
resource = "aws_iam_role_policy_attachment"
when = { field = "container_insights" }

[providers.aws.blocks.args]
role       = { self_block = "node_role", attr = "name" }
policy_arn = { value = "arn:aws:iam::aws:policy/CloudWatchAgentServerPolicy" }

# Cluster Autoscaler: a role the chart's pods assume through EKS Pod Identity, the standard
# autoscaler policy, and the association that binds kube-system/cluster-autoscaler to it.
# The chart itself is a manual step; everything it needs from AWS is here.
[[providers.aws.blocks]]
key = "autoscaler_role"
resource = "aws_iam_role"
when = { field = "addons", equals = "cluster_autoscaler" }

[providers.aws.blocks.args]
name = { template = "{name}-autoscaler", transform = "kebab" }

[providers.aws.blocks.args.assume_role_policy]
func = "jsonencode"
[[providers.aws.blocks.args.assume_role_policy.args]]
[providers.aws.blocks.args.assume_role_policy.args.object]
Version = { value = "2012-10-17" }
[[providers.aws.blocks.args.assume_role_policy.args.object.Statement.list]]
[providers.aws.blocks.args.assume_role_policy.args.object.Statement.list.object]
Effect    = { value = "Allow" }
Action    = { value = ["sts:AssumeRole", "sts:TagSession"] }
Principal = { object = { Service = { value = "pods.eks.amazonaws.com" } } }

[[providers.aws.blocks]]
key = "autoscaler_policy"
resource = "aws_iam_role_policy"
when = { field = "addons", equals = "cluster_autoscaler" }

[providers.aws.blocks.args]
name = { template = "{name}-autoscaler", transform = "kebab" }
role = { self_block = "autoscaler_role", attr = "id" }

[providers.aws.blocks.args.policy]
func = "jsonencode"
[[providers.aws.blocks.args.policy.args]]
[providers.aws.blocks.args.policy.args.object]
Version = { value = "2012-10-17" }
[[providers.aws.blocks.args.policy.args.object.Statement.list]]
[providers.aws.blocks.args.policy.args.object.Statement.list.object]
Sid      = { value = "Autoscale" }
Effect   = { value = "Allow" }
# The Describe* calls are how the autoscaler discovers the tagged groups; the two write
# calls are how it resizes them. Resource is "*" because the groups EKS creates for a node
# group have no name the diagram knows in advance.
Action   = { value = ["autoscaling:DescribeAutoScalingGroups", "autoscaling:DescribeAutoScalingInstances", "autoscaling:DescribeLaunchConfigurations", "autoscaling:DescribeScalingActivities", "autoscaling:DescribeTags", "autoscaling:SetDesiredCapacity", "autoscaling:TerminateInstanceInAutoScalingGroup", "ec2:DescribeLaunchTemplateVersions", "ec2:DescribeInstanceTypes", "eks:DescribeNodegroup"] }
Resource = { value = "*" }

[[providers.aws.blocks]]
key = "autoscaler_identity"
resource = "aws_eks_pod_identity_association"
when = { field = "addons", equals = "cluster_autoscaler" }

[providers.aws.blocks.args]
cluster_name    = { self_block = "main", attr = "name" }
namespace       = { value = "kube-system" }
service_account = { value = "cluster-autoscaler" }
role_arn        = { self_block = "autoscaler_role", attr = "arn" }

[providers.aws.outputs]
endpoint = { attr = "endpoint", description = "Kubernetes API endpoint" }
name     = { attr = "name", description = "Cluster name (kubectl / aws eks update-kubeconfig)" }

[[providers.aws.manual_steps]]
title = "Only the first Log Group becomes the control-plane group"
when = { relation = "logs_to", min_count = 2 }
body = """
EKS writes its control-plane logs to a single group named after the cluster, so only the
first linked Log Group is renamed to `/aws/eks/<cluster name>/cluster`. The others are
created but receive nothing from the control plane; keep them for application logs shipped
by Fluent Bit, or remove the extra links.
"""

[[providers.aws.manual_steps]]
title = "Node counts need the Cluster Autoscaler"
when = { field = "addons", not_equals = "cluster_autoscaler" }
body = """
EKS never changes a node group's size by itself: the min / max in the diagram are limits,
not a policy. Add **cluster_autoscaler** to the cluster's Add-ons — the role, the policy
and the pod identity are then generated and only the Helm chart is left to install — or
install Karpenter instead. AKS and GKE have this built in, AWS does not.
"""

[[providers.aws.manual_steps]]
title = "Install the Cluster Autoscaler chart"
when = { field = "addons", equals = "cluster_autoscaler" }
body = """
Everything the autoscaler needs from AWS is generated: the discovery tags on every node
group of this cluster, an IAM role with the autoscaler policy, and a pod identity
association for `kube-system/cluster-autoscaler`. What is left is the workload itself:

    helm repo add autoscaler https://kubernetes.github.io/autoscaler
    helm upgrade --install cluster-autoscaler autoscaler/cluster-autoscaler \\
      --namespace kube-system \\
      --set autoDiscovery.clusterName=<cluster name> \\
      --set awsRegion=<region> \\
      --set rbac.serviceAccount.name=cluster-autoscaler

The ServiceAccount name must stay `cluster-autoscaler` in `kube-system`: that is what the
pod identity association binds. A pool may then scale to zero.
"""

# ---------------------------------------------------------------- Azure
[providers.azure]
status = "partial"

[[providers.azure.fields]]
name = "version"
label = "Kubernetes version"
type = "string"
pattern = "^[0-9]+\\.[0-9]+(\\.[0-9]+)?$"
pattern_hint = "major.minor or major.minor.patch, e.g. 1.33"
description = "Leave empty to take the AKS default for the region."

[[providers.azure.blocks]]
key = "main"
resource = "azurerm_kubernetes_cluster"

[providers.azure.blocks.args]
name                      = { field = "name", transform = "kebab" }
location                  = { var = "location" }
resource_group_name       = { ancestor = "resource_group", attr = "name" }
dns_prefix                = { field = "name", transform = "kebab" }
kubernetes_version        = { provider_field = "version", optional = true }
private_cluster_enabled   = { field = "private_endpoint" }
# Workload identity: what a Kubernetes Workload's federated credential binds to.
oidc_issuer_enabled       = { value = true }
workload_identity_enabled = { value = true }

[[providers.azure.blocks.nested]]
block = "default_node_pool"

[providers.azure.blocks.nested.args]
name                 = { value = "default" }
vm_size              = { map = "node_size", table = { small = "Standard_B2s", medium = "Standard_D2s_v3", large = "Standard_D4s_v3" } }
node_count           = { field = "node_count" }
auto_scaling_enabled = { value = true }
min_count            = { field = "min_nodes" }
max_count            = { field = "max_nodes" }
vnet_subnet_id       = { relation = "network_membership", attr = "id" }

[[providers.azure.blocks.nested]]
block = "identity"

[providers.azure.blocks.nested.args]
type = { value = "SystemAssigned" }

[[providers.azure.blocks.nested]]
block = "network_profile"

[providers.azure.blocks.nested.args]
network_plugin = { value = "azure" }

[[providers.azure.blocks.nested]]
block = "api_server_access_profile"
when = { field = "public_access_cidrs" }

[providers.azure.blocks.nested.args]
authorized_ip_ranges = { field = "public_access_cidrs" }

# Container Insights is the OMS agent writing into the linked workspace with the cluster's
# own identity — which is why it belongs here and not on each Kubernetes Workload.
[[providers.azure.blocks.nested]]
block = "oms_agent"
when = { all = [ { field = "container_insights" }, { relation = "logs_to" } ] }

[providers.azure.blocks.nested.args]
log_analytics_workspace_id = { relation = "logs_to", attr = "id" }

# Control-plane logs to the linked Log Analytics workspace.
[[providers.azure.blocks]]
key = "diag"
resource = "azurerm_monitor_diagnostic_setting"
for_each_relation = "logs_to"

[providers.azure.blocks.args]
name                       = { template = "{name}-logs", transform = "kebab" }
target_resource_id         = { self_block = "main", attr = "id" }
log_analytics_workspace_id = { target = "id" }

[[providers.azure.blocks.nested]]
block = "enabled_log"

[providers.azure.blocks.nested.args]
category = { value = "kube-apiserver" }

[[providers.azure.blocks.nested]]
block = "enabled_log"

[providers.azure.blocks.nested.args]
category = { value = "kube-audit" }

[providers.azure.outputs]
fqdn        = { attr = "fqdn", description = "Kubernetes API host name" }
oidc_issuer = { attr = "oidc_issuer_url", description = "OIDC issuer URL used by workload identity" }
kube_config = { attr = "kube_config_raw", description = "Raw kubeconfig for the cluster", sensitive = true }

[[providers.azure.checks]]
when = { all = [ { field = "container_insights" }, { relation = "logs_to", absent = true } ] }
severity = "error"
message = "\"{name}\" asks for Container Insights, which writes into a Log Analytics workspace: link a Log Group with 'Logs to'"

[[providers.azure.manual_steps]]
title = "Add-ons on AKS"
when = { field = "addons" }
body = """
AKS has no per-add-on resource. `coredns`, `kube_proxy` and `metrics_server` are part of
every cluster already; the CSI drivers are cluster arguments (`storage_profile` with
`disk_driver_enabled` / `file_driver_enabled`) rather than separate resources, and
`pod_identity_agent` / `vpc_cni` are AWS concepts with no AKS counterpart — workload
identity (switched on here) and Azure CNI (the network profile) do the same jobs.
`cluster_autoscaler` needs nothing at all: the default node pool is generated with
`auto_scaling_enabled`, so AKS already scales it between the min and max in the diagram.
"""

# ---------------------------------------------------------------- GCP
[providers.gcp]
status = "partial"
notes = "A regional GKE Standard cluster with one autoscaling node pool on the linked subnet's network."

[[providers.gcp.fields]]
name = "version"
label = "Kubernetes version"
type = "string"
pattern = "^[0-9]+\\.[0-9]+(\\.[0-9]+.*)?$"
pattern_hint = "major.minor, e.g. 1.33"
description = "Minimum master version. Leave empty to take the GKE default for the release channel."

[[providers.gcp.blocks]]
key = "main"
resource = "google_container_cluster"

[providers.gcp.blocks.args]
name                     = { field = "name", transform = "kebab" }
location                 = { var = "region" }
network                  = { relation = "network_membership", ancestor = "virtual_network", attr = "id" }
subnetwork               = { relation = "network_membership", attr = "id" }
remove_default_node_pool = { value = true }
initial_node_count       = { value = 1 }
deletion_protection      = { value = false }
networking_mode          = { value = "VPC_NATIVE" }
min_master_version       = { provider_field = "version", optional = true }

[[providers.gcp.blocks.nested]]
block = "ip_allocation_policy"

# Workload identity: what a Kubernetes Workload's IAM binding refers to.
[[providers.gcp.blocks.nested]]
block = "workload_identity_config"

[providers.gcp.blocks.nested.args]
workload_pool = { func = "format", args = [ { value = "%s.svc.id.goog" }, { var = "project" } ] }

[[providers.gcp.blocks.nested]]
block = "logging_config"
when = { relation = "logs_to" }

[providers.gcp.blocks.nested.args]
enable_components = { value = ["SYSTEM_COMPONENTS", "WORKLOADS", "APISERVER"] }

# GKE's equivalent of Container Insights: per-object metrics plus managed Prometheus.
[[providers.gcp.blocks.nested]]
block = "monitoring_config"
when = { field = "container_insights" }

[providers.gcp.blocks.nested.args]
enable_components = { value = ["SYSTEM_COMPONENTS", "POD", "DEPLOYMENT", "STATEFULSET", "DAEMONSET", "HPA", "CADVISOR", "KUBELET"] }

[[providers.gcp.blocks.nested.nested]]
block = "managed_prometheus"

[providers.gcp.blocks.nested.nested.args]
enabled = { value = true }

[[providers.gcp.blocks.nested]]
block = "private_cluster_config"
when = { field = "private_endpoint" }

[providers.gcp.blocks.nested.args]
enable_private_nodes    = { value = true }
enable_private_endpoint = { value = true }

[[providers.gcp.blocks.nested]]
block = "master_authorized_networks_config"
when = { field = "public_access_cidrs" }

[[providers.gcp.blocks.nested.nested]]
block = "cidr_blocks"
for_each_field = "public_access_cidrs"

[providers.gcp.blocks.nested.nested.args]
cidr_block   = { item = "value" }
display_name = { template = "allowed-{item.index}" }

[[providers.gcp.blocks]]
key = "nodes"
resource = "google_container_node_pool"

[providers.gcp.blocks.args]
name               = { template = "{name}-nodes", transform = "kebab" }
cluster            = { self_block = "main", attr = "id" }
location           = { var = "region" }
initial_node_count = { field = "node_count" }

[[providers.gcp.blocks.nested]]
block = "autoscaling"

[providers.gcp.blocks.nested.args]
min_node_count = { field = "min_nodes" }
max_node_count = { field = "max_nodes" }

[[providers.gcp.blocks.nested]]
block = "node_config"

[providers.gcp.blocks.nested.args]
machine_type = { map = "node_size", table = { small = "e2-medium", medium = "e2-standard-4", large = "e2-standard-8" } }
oauth_scopes = { value = ["https://www.googleapis.com/auth/cloud-platform"] }

[providers.gcp.outputs]
endpoint = { attr = "endpoint", description = "Cluster API endpoint" }
name     = { attr = "name", description = "Cluster name (gcloud container clusters get-credentials)" }

[[providers.gcp.manual_steps]]
title = "Add-ons on GKE"
when = { field = "addons" }
body = """
GKE has no per-add-on resource either. `coredns` (kube-dns), `kube_proxy` and
`metrics_server` are part of every cluster; persistent-disk and Filestore CSI drivers are
cluster arguments (`addons_config` with `gcp_filestore_csi_driver_config` /
`gcs_fuse_csi_driver_config`); `pod_identity_agent` and `vpc_cni` are AWS concepts —
workload identity (switched on here) and the VPC-native networking mode do the same jobs.
`cluster_autoscaler` needs nothing either: the generated node pool has an `autoscaling`
block, so GKE scales it between the min and max in the diagram.
"""

[[providers.gcp.manual_steps]]
title = "A private cluster needs a master range and Cloud NAT"
when = { field = "private_endpoint" }
body = """
Private GKE nodes have no external address, so the cluster needs a **Cloud NAT** (a NAT
Gateway in the diagram) to pull images, and the control plane needs a `/28`
`master_ipv4_cidr_block` that does not overlap the VPC. Add both before applying.
"""
