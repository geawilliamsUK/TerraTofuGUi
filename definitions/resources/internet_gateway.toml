# Abstract type: Internet Gateway
#
# AWS: aws_internet_gateway attached to the enclosing VPC.
# Azure: LOGICAL — a VNet has internet egress by default and ingress arrives through public
# IPs, so there is nothing to create. The node stays on the canvas so route tables can
# still point at it ("default route via internet"), which Azure renders as an explicit
# `next_hop_type = "Internet"` route.

schema_version = 1

[resource]
type = "internet_gateway"
category = "network"
display_name = "Internet Gateway"
description = "Gives a virtual network a route to the internet. Point a Route Table at it."
kind = "node"
allowed_parents = ["virtual_network", "resource_group"]
icon = "IGW"

[[relations]]
kind = "network_membership"
label = "Attached to network"
targets = ["virtual_network"]
cardinality = "one"
via_parent = true

# ---------------------------------------------------------------- AWS
[providers.aws]
status = "full"

[[providers.aws.blocks]]
key = "main"
resource = "aws_internet_gateway"

[providers.aws.blocks.args]
vpc_id = { relation = "network_membership", attr = "id" }
tags   = { object = { Name = { field = "name" } } }

[providers.aws.outputs]
id = { attr = "id", description = "Internet gateway id" }

# ---------------------------------------------------------------- Azure
[providers.azure]
status = "logical"
notes = "Azure virtual networks reach the internet without a gateway resource; nothing is generated."
