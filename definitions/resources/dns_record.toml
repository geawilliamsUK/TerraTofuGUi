# Abstract type: DNS Record  (schema_version 2)
#
# Drawn inside a DNS Zone. AWS: one aws_route53_record whatever the type.
# Azure: record sets are per-type resources, so the A / CNAME / TXT block is chosen with a
# block-level `when` on the `record_type` field; TXT values become one nested `record`
# block per entry (`for_each_field` over a string_list).
#
# An 'Alias of' link to a Load Balancer or CDN replaces the literal values with the
# provider's own alias mechanism: a Route 53 `alias` block, an Azure `target_resource_id`,
# or the Google forwarding rule's address.

schema_version = 2

[resource]
type = "dns_record"
category = "dns"
display_name = "DNS Record"
description = "An A, CNAME or TXT record set inside a DNS Zone. Link 'Alias of' to point an A record at a load balancer or CDN."
kind = "node"
allowed_parents = ["dns_zone"]
icon = "REC"

[[fields]]
name = "record_name"
label = "Record name"
type = "string"
required = true
default = "www"
description = "Relative to the zone (\"www\" for www.example.com; \"@\" for the apex on Azure)."

[[fields]]
name = "record_type"
label = "Type"
type = "enum"
required = true
options = ["A", "CNAME", "TXT"]
default = "A"

[[fields]]
name = "ttl"
label = "TTL (s)"
type = "int"
required = true
default = 300

[[fields]]
name = "values"
label = "Values"
type = "string_list"
description = "Addresses, the single CNAME target, or TXT strings. Ignored (and not needed) when 'Alias of' is linked."

[[relations]]
kind = "attribute_reference"
label = "In zone"
targets = ["dns_zone"]
cardinality = "one"
via_parent = true

[[relations]]
kind = "attribute_reference"
label = "Alias of"
targets = ["load_balancer", "cdn"]
cardinality = "optional"

# ---------------------------------------------------------------- AWS
[providers.aws]
status = "full"

[[providers.aws.blocks]]
key = "main"
resource = "aws_route53_record"

[providers.aws.blocks.args]
zone_id = { relation = "attribute_reference", target_type = "dns_zone", attr = "zone_id" }
name    = { func = "format", args = [ { value = "%s.%s" }, { field = "record_name" }, { relation = "attribute_reference", target_type = "dns_zone", attr = "name" } ] }
type    = { field = "record_type" }
# An alias record carries neither ttl nor records; Route 53 takes both from the target.
ttl     = { if = { all = [ { relation = "attribute_reference", target_type = "load_balancer", absent = true }, { relation = "attribute_reference", target_type = "cdn", absent = true } ] }, then = { field = "ttl" } }
records = { if = { all = [ { relation = "attribute_reference", target_type = "load_balancer", absent = true }, { relation = "attribute_reference", target_type = "cdn", absent = true } ] }, then = { field = "values" } }

[[providers.aws.blocks.nested]]
block = "alias"
when = { any = [ { relation = "attribute_reference", target_type = "load_balancer" }, { relation = "attribute_reference", target_type = "cdn" } ] }

[providers.aws.blocks.nested.args]
name                   = { relation = "attribute_reference", target_type = "load_balancer", attr = "dns_name", fallback = { relation = "attribute_reference", target_type = "cdn", attr = "domain_name" } }
zone_id                = { relation = "attribute_reference", target_type = "load_balancer", attr = "zone_id", fallback = { relation = "attribute_reference", target_type = "cdn", attr = "hosted_zone_id" } }
evaluate_target_health = { value = false }

[providers.aws.outputs]
fqdn = { attr = "fqdn", description = "Fully qualified record name" }

[[providers.aws.checks]]
severity = "error"
when = { all = [ { field = "record_type", not_equals = "A" }, { any = [ { relation = "attribute_reference", target_type = "load_balancer" }, { relation = "attribute_reference", target_type = "cdn" } ] } ] }
message = "\"{name}\" is an alias of a load balancer or CDN, which only works for an A record; set the type to A or remove the link"

[[providers.aws.checks]]
severity = "error"
when = { all = [ { field = "values", absent = true }, { relation = "attribute_reference", target_type = "load_balancer", absent = true }, { relation = "attribute_reference", target_type = "cdn", absent = true } ] }
message = "\"{name}\" has no values and no 'Alias of' link; a record needs one or the other"

# ---------------------------------------------------------------- Azure
[providers.azure]
status = "full"

[[providers.azure.blocks]]
key = "a"
resource = "azurerm_dns_a_record"
when = { field = "record_type", equals = "A" }

[providers.azure.blocks.args]
name                = { field = "record_name" }
zone_name           = { relation = "attribute_reference", target_type = "dns_zone", attr = "name" }
resource_group_name = { ancestor = "resource_group", attr = "name" }
ttl                 = { field = "ttl" }
# Azure aliases an A record to a public IP resource; the Load Balancer's is its `pip` block.
target_resource_id  = { relation = "attribute_reference", target_type = "load_balancer", block = "pip", attr = "id", optional = true }
records             = { if = { relation = "attribute_reference", target_type = "load_balancer", absent = true }, then = { field = "values" } }

[[providers.azure.blocks]]
key = "cname"
resource = "azurerm_dns_cname_record"
when = { field = "record_type", equals = "CNAME" }

[providers.azure.blocks.args]
name                = { field = "record_name" }
zone_name           = { relation = "attribute_reference", target_type = "dns_zone", attr = "name" }
resource_group_name = { ancestor = "resource_group", attr = "name" }
ttl                 = { field = "ttl" }
record              = { func = "one", args = [ { field = "values" } ] }

[[providers.azure.blocks]]
key = "txt"
resource = "azurerm_dns_txt_record"
when = { field = "record_type", equals = "TXT" }

[providers.azure.blocks.args]
name                = { field = "record_name" }
zone_name           = { relation = "attribute_reference", target_type = "dns_zone", attr = "name" }
resource_group_name = { ancestor = "resource_group", attr = "name" }
ttl                 = { field = "ttl" }

[[providers.azure.blocks.nested]]
block = "record"
for_each_field = "values"

[providers.azure.blocks.nested.args]
value = { item = "value" }

[providers.azure.outputs]
a_fqdn     = { block = "a", attr = "fqdn", description = "Fully qualified record name" }
cname_fqdn = { block = "cname", attr = "fqdn", description = "Fully qualified record name" }
txt_fqdn   = { block = "txt", attr = "fqdn", description = "Fully qualified record name" }

[[providers.azure.checks]]
severity = "error"
when = { all = [ { field = "record_type", not_equals = "A" }, { any = [ { relation = "attribute_reference", target_type = "load_balancer" }, { relation = "attribute_reference", target_type = "cdn" } ] } ] }
message = "\"{name}\" is an alias of a load balancer or CDN, which only works for an A record; set the type to A or remove the link"

[[providers.azure.checks]]
severity = "error"
when = { all = [ { field = "values", absent = true }, { relation = "attribute_reference", target_type = "load_balancer", absent = true } ] }
message = "\"{name}\" has no values and no 'Alias of' link to a load balancer; a record needs one or the other"

[[providers.azure.manual_steps]]
title = "Point the record at the CDN endpoint by hand"
when = { relation = "attribute_reference", target_type = "cdn" }
body = """
Azure DNS can only alias an A record to one of its own resources (a public IP, Traffic
Manager profile or another zone) — a classic CDN endpoint is not one of them. Point the name
at the endpoint with a **CNAME** to its `fqdn` instead, and register the name on the
endpoint with an `azurerm_cdn_endpoint_custom_domain`. (The apex of a zone cannot hold a
CNAME, so an apex alias needs Front Door rather than the classic CDN.)
"""

# ---------------------------------------------------------------- GCP
[providers.gcp]
status = "full"

[[providers.gcp.blocks]]
key = "main"
resource = "google_dns_record_set"

[providers.gcp.blocks.args]
managed_zone = { relation = "attribute_reference", target_type = "dns_zone", attr = "name" }
name         = { func = "format", args = [ { value = "%s.%s" }, { field = "record_name" }, { relation = "attribute_reference", target_type = "dns_zone", attr = "dns_name" } ] }
type         = { field = "record_type" }
ttl          = { field = "ttl" }
# Cloud DNS has no alias record type: an aliased A record holds the forwarding rule's
# address (the global one when the load balancer is https).
rrdatas      = { if = { relation = "attribute_reference", target_type = "load_balancer" }, then = { relation = "attribute_reference", target_type = "load_balancer", block = "rule", attr = "ip_address", wrap = "list", fallback = { relation = "attribute_reference", target_type = "load_balancer", block = "grule", attr = "ip_address", wrap = "list" } }, else = { field = "values" } }

[providers.gcp.outputs]
name = { attr = "name", description = "Fully qualified record name" }

[[providers.gcp.checks]]
severity = "error"
when = { all = [ { field = "record_type", not_equals = "A" }, { any = [ { relation = "attribute_reference", target_type = "load_balancer" }, { relation = "attribute_reference", target_type = "cdn" } ] } ] }
message = "\"{name}\" is an alias of a load balancer or CDN, which only works for an A record; set the type to A or remove the link"

[[providers.gcp.checks]]
severity = "error"
when = { all = [ { field = "values", absent = true }, { relation = "attribute_reference", target_type = "load_balancer", absent = true } ] }
message = "\"{name}\" has no values and no 'Alias of' link to a load balancer; a record needs one or the other"

[[providers.gcp.manual_steps]]
title = "Point the record at the CDN by hand"
when = { relation = "attribute_reference", target_type = "cdn" }
body = """
On Google Cloud a CDN is a backend bucket or a flag on a backend service, not an endpoint
with an address of its own, so there is nothing for this record to point at. Put the backend
bucket behind an HTTPS load balancer and alias this record to that load balancer instead.
"""
