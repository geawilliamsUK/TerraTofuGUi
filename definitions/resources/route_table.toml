# Abstract type: Route Table  (schema_version 2)
#
# Decides where a set of subnets sends traffic. Two links define it:
#   * "Default route via" -> an Internet Gateway or a NAT Gateway,
#   * "Applies to" -> the subnets it is associated with (one block per subnet, via
#     `for_each_relation`).
# AWS: aws_route_table + aws_route + aws_route_table_association per subnet.
# Azure: azurerm_route_table + azurerm_subnet_route_table_association per subnet; an
#      internet default route becomes an explicit `Internet` next hop, a NAT default route
#      becomes azurerm_subnet_nat_gateway_association per subnet (Azure attaches NAT
#      gateways to subnets rather than routing to them).

schema_version = 2

[resource]
type = "route_table"
category = "network"
display_name = "Route Table"
description = "Routes for a set of subnets. Link 'Default route via' to a gateway and 'Attached to' the subnets it applies to."
kind = "node"
allowed_parents = ["virtual_network", "resource_group"]
icon = "RT"

[[relations]]
kind = "network_membership"
label = "Belongs to network"
targets = ["virtual_network"]
cardinality = "one"
via_parent = true

[[relations]]
kind = "attribute_reference"
label = "Default route via"
targets = ["internet_gateway", "nat_gateway"]
cardinality = "optional"

[[relations]]
kind = "attachment"
label = "Applies to subnets"
targets = ["subnet"]
cardinality = "many"

# ---------------------------------------------------------------- AWS
[providers.aws]
status = "full"

[[providers.aws.blocks]]
key = "main"
resource = "aws_route_table"

[providers.aws.blocks.args]
vpc_id = { relation = "network_membership", attr = "id" }
tags   = { object = { Name = { field = "name" } } }

[[providers.aws.blocks]]
key = "default"
resource = "aws_route"
when = { relation = "attribute_reference" }

[providers.aws.blocks.args]
route_table_id         = { self_block = "main", attr = "id" }
destination_cidr_block = { value = "0.0.0.0/0" }
gateway_id             = { relation = "attribute_reference", target_type = "internet_gateway", attr = "id", optional = true }
nat_gateway_id         = { relation = "attribute_reference", target_type = "nat_gateway", attr = "id", optional = true }

[[providers.aws.blocks]]
key = "assoc"
resource = "aws_route_table_association"
for_each_relation = "attachment"

[providers.aws.blocks.args]
subnet_id      = { target = "id" }
route_table_id = { self_block = "main", attr = "id" }

[providers.aws.outputs]
id = { attr = "id", description = "Route table id" }

# ---------------------------------------------------------------- Azure
[providers.azure]
status = "full"

[[providers.azure.blocks]]
key = "main"
resource = "azurerm_route_table"

[providers.azure.blocks.args]
name                = { field = "name", transform = "kebab" }
location            = { var = "location" }
resource_group_name = { ancestor = "resource_group", attr = "name" }

# Explicit internet route when the default route targets an Internet Gateway.
[[providers.azure.blocks]]
key = "internet"
resource = "azurerm_route"
when = { relation = "attribute_reference", target_type = "internet_gateway" }

[providers.azure.blocks.args]
name                = { value = "default-internet" }
resource_group_name = { ancestor = "resource_group", attr = "name" }
route_table_name    = { self_block = "main", attr = "name" }
address_prefix      = { value = "0.0.0.0/0" }
next_hop_type       = { value = "Internet" }

[[providers.azure.blocks]]
key = "assoc"
resource = "azurerm_subnet_route_table_association"
for_each_relation = "attachment"

[providers.azure.blocks.args]
subnet_id      = { target = "id" }
route_table_id = { self_block = "main", attr = "id" }

# NAT default route: Azure associates the NAT gateway with each subnet instead.
[[providers.azure.blocks]]
key = "nat"
resource = "azurerm_subnet_nat_gateway_association"
for_each_relation = "attachment"
when = { relation = "attribute_reference", target_type = "nat_gateway" }

[providers.azure.blocks.args]
subnet_id      = { target = "id" }
nat_gateway_id = { relation = "attribute_reference", target_type = "nat_gateway", attr = "id" }

[providers.azure.outputs]
id = { attr = "id", description = "Route table id" }
