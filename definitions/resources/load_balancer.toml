# Abstract type: Load Balancer  (schema_version 2)
#
# A layer-7 (http) or layer-4 (tcp) load balancer in front of compute instances.
# AWS: aws_lb (application or network) + target group + listener + one
#      aws_lb_target_group_attachment per 'Attached to' instance.
# Azure: azurerm_lb (Standard) + public IP (internet-facing) or subnet frontend (internal)
#      + backend pool + probe + rule + one NIC/backend-pool association per instance.
#      The association targets the instance's `nic` block (`{ target = "id", block = "nic" }`).

schema_version = 2

[resource]
type = "load_balancer"
category = "load_balancer"
display_name = "Load Balancer"
description = "Distributes traffic to compute instances. Link 'Subnets' (AWS needs two availability zones) and 'Forwards to' the instances."
kind = "node"
allowed_parents = ["virtual_network", "resource_group"]
icon = "LB"

[[fields]]
name = "scheme"
label = "Scheme"
type = "enum"
required = true
options = ["internet_facing", "internal"]
default = "internet_facing"

[[fields]]
name = "protocol"
label = "Protocol"
type = "enum"
required = true
options = ["http", "tcp"]
default = "http"
description = "http = application / layer-7 load balancer, tcp = network / layer-4."

[[fields]]
name = "listener_port"
label = "Listener port"
type = "int"
required = true
default = 80

[[fields]]
name = "target_port"
label = "Target port"
type = "int"
required = true
default = 80

[[relations]]
kind = "network_membership"
label = "Subnets"
targets = ["subnet"]
cardinality = "many"

[[relations]]
kind = "attribute_reference"
label = "Uses security group"
providers = ["aws"]
targets = ["security_group"]
cardinality = "optional"

[[relations]]
kind = "attachment"
label = "Forwards to"
targets = ["compute_instance", "kubernetes_cluster"]
cardinality = "many"

# ---------------------------------------------------------------- AWS
[providers.aws]
status = "partial"

[[providers.aws.blocks]]
key = "main"
resource = "aws_lb"

[providers.aws.blocks.args]
name               = { field = "name", transform = "kebab" }
internal           = { map = "scheme", table = { internet_facing = false, internal = true } }
load_balancer_type = { map = "protocol", table = { http = "application", tcp = "network" } }
subnets            = { relation = "network_membership", attr = "id", wrap = "list" }
security_groups    = { relation = "attribute_reference", target_type = "security_group", attr = "id", wrap = "list", optional = true }
tags               = { object = { Name = { field = "name" } } }

[[providers.aws.blocks]]
key = "tg"
resource = "aws_lb_target_group"

[providers.aws.blocks.args]
name        = { template = "{name}-tg", transform = "kebab" }
port        = { field = "target_port" }
protocol    = { map = "protocol", table = { http = "HTTP", tcp = "TCP" } }
vpc_id      = { relation = "network_membership", attr = "vpc_id" }
# Pods are registered by their IP, not as EC2 instances, so a cluster target changes the
# whole target group; the registration itself is the controller's job (manual step).
target_type = { if = { relation = "attachment", target_type = "kubernetes_cluster" }, then = { value = "ip" }, else = { value = "instance" } }

[[providers.aws.blocks]]
key = "listener"
resource = "aws_lb_listener"

[providers.aws.blocks.args]
load_balancer_arn = { self_block = "main", attr = "arn" }
port              = { field = "listener_port" }
protocol          = { map = "protocol", table = { http = "HTTP", tcp = "TCP" } }

[[providers.aws.blocks.nested]]
block = "default_action"

[providers.aws.blocks.nested.args]
type             = { value = "forward" }
target_group_arn = { self_block = "tg", attr = "arn" }

[[providers.aws.blocks]]
key = "attach"
resource = "aws_lb_target_group_attachment"
for_each_relation = "attachment"
for_each_target_type = "compute_instance"

[providers.aws.blocks.args]
target_group_arn = { self_block = "tg", attr = "arn" }
target_id        = { target = "id" }
port             = { field = "target_port" }

[providers.aws.outputs]
dns_name = { attr = "dns_name", description = "Public DNS name of the load balancer" }

[[providers.aws.manual_steps]]
title = "Bind the target group to a Kubernetes Service"
when = { relation = "attachment", target_type = "kubernetes_cluster" }
body = """
The target group is created with `target_type = "ip"` and no attachments: nothing in
Terraform knows which pods should be in it. Install the **AWS Load Balancer Controller** in
the cluster and apply a `TargetGroupBinding` that points at this target group's ARN and the
Service in front of the pods:

```yaml
apiVersion: elbv2.k8s.aws/v1beta1
kind: TargetGroupBinding
metadata:
  name: <service>
spec:
  serviceRef: { name: <service>, port: <target port> }
  targetGroupARN: <the tg arn from the plan>
```

The controller then keeps the target group in step with the pod IPs.
"""

# ---------------------------------------------------------------- Azure
[providers.azure]
status = "partial"

[[providers.azure.blocks]]
key = "pip"
resource = "azurerm_public_ip"
when = { field = "scheme", equals = "internet_facing" }

[providers.azure.blocks.args]
name                = { template = "{name}-pip", transform = "kebab" }
location            = { var = "location" }
resource_group_name = { ancestor = "resource_group", attr = "name" }
allocation_method   = { value = "Static" }
sku                 = { value = "Standard" }

[[providers.azure.blocks]]
key = "main"
resource = "azurerm_lb"

[providers.azure.blocks.args]
name                = { field = "name", transform = "kebab" }
location            = { var = "location" }
resource_group_name = { ancestor = "resource_group", attr = "name" }
sku                 = { value = "Standard" }

[[providers.azure.blocks.nested]]
block = "frontend_ip_configuration"
when = { field = "scheme", equals = "internet_facing" }

[providers.azure.blocks.nested.args]
name                 = { value = "frontend" }
public_ip_address_id = { self_block = "pip", attr = "id" }

[[providers.azure.blocks.nested]]
block = "frontend_ip_configuration"
when = { field = "scheme", equals = "internal" }

[providers.azure.blocks.nested.args]
name                          = { value = "frontend" }
subnet_id                     = { relation = "network_membership", attr = "id" }
private_ip_address_allocation = { value = "Dynamic" }

[[providers.azure.blocks]]
key = "pool"
resource = "azurerm_lb_backend_address_pool"

[providers.azure.blocks.args]
name            = { value = "backend" }
loadbalancer_id = { self_block = "main", attr = "id" }

[[providers.azure.blocks]]
key = "probe"
resource = "azurerm_lb_probe"

[providers.azure.blocks.args]
name            = { value = "probe" }
loadbalancer_id = { self_block = "main", attr = "id" }
protocol        = { map = "protocol", table = { http = "Http", tcp = "Tcp" } }
port            = { field = "target_port" }
request_path    = { if = { field = "protocol", equals = "http" }, then = { value = "/" } }

[[providers.azure.blocks]]
key = "rule"
resource = "azurerm_lb_rule"

[providers.azure.blocks.args]
name                           = { value = "rule" }
loadbalancer_id                = { self_block = "main", attr = "id" }
protocol                       = { value = "Tcp" }
frontend_port                  = { field = "listener_port" }
backend_port                   = { field = "target_port" }
frontend_ip_configuration_name = { value = "frontend" }
backend_address_pool_ids       = { self_block = "pool", attr = "id", wrap = "list" }
probe_id                       = { self_block = "probe", attr = "id" }

[[providers.azure.blocks]]
key = "attach"
resource = "azurerm_network_interface_backend_address_pool_association"
for_each_relation = "attachment"
for_each_target_type = "compute_instance"

[providers.azure.blocks.args]
network_interface_id    = { target = "id", block = "nic" }
ip_configuration_name   = { value = "internal" }
backend_address_pool_id = { self_block = "pool", attr = "id" }

[providers.azure.outputs]
public_ip = { block = "pip", attr = "ip_address", description = "Public IPv4 address of the load balancer" }

[[providers.azure.manual_steps]]
title = "AKS traffic goes through an ingress, not this load balancer"
when = { relation = "attachment", target_type = "kubernetes_cluster" }
body = """
An `azurerm_lb` backend pool takes network interfaces, and AKS pods have none of their own,
so nothing is attached for the linked cluster. Publish the workload either with a
Kubernetes `Service` of type `LoadBalancer` — AKS then manages its own Standard load
balancer, and this one is redundant — or with an **Application Gateway** fronted by AGIC
(`azurerm_application_gateway` plus the ingress controller add-on), which is the layer-7
equivalent of what the diagram asks for. The load balancer here is still created for any
instance targets.
"""

# ---------------------------------------------------------------- GCP
[providers.gcp]
status = "partial"
notes = "A regional passthrough Network Load Balancer (external or internal): health check, unmanaged instance group of the linked instances, backend service and forwarding rule. HTTP is served as TCP."

[[providers.gcp.blocks]]
key = "hc"
resource = "google_compute_region_health_check"

[providers.gcp.blocks.args]
name   = { template = "{name}-hc", transform = "kebab" }
region = { var = "region" }

[[providers.gcp.blocks.nested]]
block = "tcp_health_check"

[providers.gcp.blocks.nested.args]
port = { field = "target_port" }

[[providers.gcp.blocks]]
key = "group"
resource = "google_compute_instance_group"
when = { relation = "attachment", target_type = "compute_instance" }

[providers.gcp.blocks.args]
name      = { template = "{name}-targets", transform = "kebab" }
zone      = { var = "zone" }
instances = { relation = "attachment", target_type = "compute_instance", attr = "self_link", wrap = "list" }

[[providers.gcp.blocks.nested]]
block = "named_port"

[providers.gcp.blocks.nested.args]
name = { value = "app" }
port = { field = "target_port" }

[[providers.gcp.blocks]]
key = "main"
resource = "google_compute_region_backend_service"

[providers.gcp.blocks.args]
name                  = { field = "name", transform = "kebab" }
region                = { var = "region" }
protocol              = { value = "TCP" }
load_balancing_scheme = { map = "scheme", table = { internet_facing = "EXTERNAL", internal = "INTERNAL" } }
health_checks         = { self_block = "hc", attr = "id", wrap = "list" }

[[providers.gcp.blocks.nested]]
block = "backend"
when = { relation = "attachment", target_type = "compute_instance" }

[providers.gcp.blocks.nested.args]
group = { self_block = "group", attr = "self_link" }

[[providers.gcp.blocks]]
key = "rule"
resource = "google_compute_forwarding_rule"

[providers.gcp.blocks.args]
name                  = { template = "{name}-rule", transform = "kebab" }
region                = { var = "region" }
load_balancing_scheme = { map = "scheme", table = { internet_facing = "EXTERNAL", internal = "INTERNAL" } }
ip_protocol           = { value = "TCP" }
ports                 = { field = "listener_port", wrap = "list" }
backend_service       = { self_block = "main", attr = "id" }
network               = { if = { field = "scheme", equals = "internal" }, then = { relation = "network_membership", ancestor = "virtual_network", attr = "id" } }
subnetwork            = { if = { field = "scheme", equals = "internal" }, then = { relation = "network_membership", attr = "id" } }

[providers.gcp.outputs]
address = { block = "rule", attr = "ip_address", description = "Frontend IP address" }

[[providers.gcp.manual_steps]]
title = "GKE pods join the backend service through a NEG"
when = { relation = "attachment", target_type = "kubernetes_cluster" }
body = """
No backend is generated for the linked cluster: a GKE backend is a **network endpoint
group**, which the cluster creates when a `Service` is annotated
`cloud.google.com/neg: '{"exposed_ports": {"<port>":{}}}'`. Annotate the Service, then add
a `backend { group = <the NEG self link> }` to this backend service (or let a GKE `Ingress`
create its own load balancer instead of this one).
"""

[[providers.gcp.manual_steps]]
title = "Health-check probes must be allowed by the firewall"
body = """
Google's health-check ranges (35.191.0.0/16 and 130.211.0.0/22) must be allowed to reach
the target port on the backends; add an ingress rule for them to the instances' Security
Group. HTTP listeners are served as TCP passthrough; use a native
`google_compute_region_url_map` + target proxy for an HTTP(S) load balancer.
"""
