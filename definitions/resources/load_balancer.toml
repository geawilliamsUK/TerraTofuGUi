# Abstract type: Load Balancer  (schema_version 2)
#
# A layer-7 (http / https) or layer-4 (tcp) load balancer in front of compute instances
# or container apps.
# AWS: aws_lb (application or network) + target group + listener + one
#      aws_lb_target_group_attachment per 'Attached to' instance. https adds the
#      certificate and TLS policy to the listener, and optionally a port-80 listener that
#      redirects. Access logs add an access_logs block plus the bucket policy the ELB
#      service needs. A Container App target makes the target group `ip`, health-checked
#      on the app's path; the app's ECS service registers its tasks itself.
# Azure: azurerm_lb (Standard) + public IP (internet-facing) or subnet frontend (internal)
#      + backend pool + probe + rule + one NIC/backend-pool association per instance.
#      The association targets the instance's `nic` block (`{ target = "id", block = "nic" }`).
#      azurerm_lb is layer 4, so https is passed through to the backends untouched.
# GCP: a regional passthrough Network Load Balancer for http / tcp; https switches to a
#      global external Application Load Balancer (health check, backend service, URL map,
#      target HTTPS proxy and global forwarding rule). A Container App behind it is a
#      Cloud Run service, reached through a serverless network endpoint group.

schema_version = 2

[resource]
type = "load_balancer"
category = "load_balancer"
display_name = "Load Balancer"
description = "Distributes traffic to compute instances or container apps. Link 'Subnets' (AWS needs two availability zones) and 'Forwards to' the targets."
kind = "node"
allowed_parents = ["virtual_network", "resource_group"]
icon = "LB"

[[fields]]
name = "scheme"
label = "Scheme"
type = "enum"
required = true
options = ["internet_facing", "internal"]
default = "internet_facing"

[[fields]]
name = "protocol"
label = "Protocol"
type = "enum"
required = true
options = ["http", "https", "tcp"]
default = "http"
description = "http / https = application (layer-7) load balancer, tcp = network (layer-4). https needs a Certificate link."

[[fields]]
name = "listener_port"
label = "Listener port"
type = "int"
required = true
default = 80

[[fields]]
name = "target_port"
label = "Target port"
type = "int"
required = true
default = 80

[[fields]]
name = "redirect_http"
label = "Redirect HTTP to HTTPS"
type = "bool"
default = false
description = "With https, also listen on port 80 and answer every request with a 301 to the https URL."

[[fields]]
name = "drop_invalid_header_fields"
label = "Drop invalid headers"
type = "bool"
default = false
description = "Discard requests whose headers do not conform to HTTP before they reach the backends (layer 7 only)."

[[fields]]
name = "deletion_protection"
label = "Deletion protection"
type = "bool"
default = false
description = "Refuse to destroy the load balancer until the flag is cleared."

[[fields]]
name = "idle_timeout_seconds"
label = "Idle timeout (s)"
type = "int"
description = "How long an idle connection is kept open (layer 7 only). Unset means the provider default."

[[relations]]
kind = "network_membership"
label = "Subnets"
targets = ["subnet"]
cardinality = "many"

[[relations]]
kind = "attribute_reference"
label = "Uses security group"
providers = ["aws"]
targets = ["security_group"]
cardinality = "optional"

# Azure's azurerm_lb terminates nothing, so a certificate is not its business.
[[relations]]
kind = "attribute_reference"
label = "Certificate"
providers = ["aws", "gcp"]
targets = ["tls_certificate"]
cardinality = "optional"

# Only ELB access logs land in a bucket; Azure sends diagnostics to Log Analytics and
# Google logs through the backend service, neither of which is an Object Storage target.
[[relations]]
kind = "logs_to"
label = "Access logs to"
providers = ["aws"]
targets = ["object_storage"]
cardinality = "optional"

[[relations]]
kind = "attachment"
label = "Forwards to"
targets = ["compute_instance", "kubernetes_cluster", "container_app"]
cardinality = "many"

# ---------------------------------------------------------------- AWS
[providers.aws]
status = "partial"

[[providers.aws.blocks]]
key = "main"
resource = "aws_lb"

[providers.aws.blocks.args]
name                       = { field = "name", transform = "kebab" }
internal                   = { map = "scheme", table = { internet_facing = false, internal = true } }
load_balancer_type         = { map = "protocol", table = { http = "application", https = "application", tcp = "network" } }
subnets                    = { relation = "network_membership", attr = "id", wrap = "list" }
security_groups            = { relation = "attribute_reference", target_type = "security_group", attr = "id", wrap = "list", optional = true }
enable_deletion_protection = { field = "deletion_protection", optional = true }
# Application load balancers only: aws_lb rejects both arguments on a network LB.
drop_invalid_header_fields = { if = { field = "protocol", not_equals = "tcp" }, then = { field = "drop_invalid_header_fields", optional = true } }
idle_timeout               = { if = { field = "protocol", not_equals = "tcp" }, then = { field = "idle_timeout_seconds", optional = true } }
# The bucket policy must exist before the load balancer may write its first log file.
depends_on                 = { self_block = "logs_policy", attr = "", wrap = "list" }
tags                       = { object = { Name = { field = "name" } } }

[[providers.aws.blocks.nested]]
block = "access_logs"
when = { relation = "logs_to", target_type = "object_storage" }

[providers.aws.blocks.nested.args]
bucket  = { relation = "logs_to", target_type = "object_storage", attr = "id" }
prefix  = { field = "name", transform = "kebab" }
enabled = { value = true }

# Elastic Load Balancing writes the logs itself, so the bucket has to allow it.
[[providers.aws.blocks]]
key = "logs_policy"
resource = "aws_s3_bucket_policy"
when = { relation = "logs_to", target_type = "object_storage" }

[providers.aws.blocks.args]
bucket = { relation = "logs_to", target_type = "object_storage", attr = "id" }

[providers.aws.blocks.args.policy]
func = "jsonencode"

[[providers.aws.blocks.args.policy.args]]
[providers.aws.blocks.args.policy.args.object]
Version = { value = "2012-10-17" }

[[providers.aws.blocks.args.policy.args.object.Statement.list]]
[providers.aws.blocks.args.policy.args.object.Statement.list.object]
Sid       = { value = "AllowELBAccessLogs" }
Effect    = { value = "Allow" }
Action    = { value = "s3:PutObject" }
Principal = { object = { Service = { value = "logdelivery.elasticloadbalancing.amazonaws.com" } } }
Resource  = { func = "format", args = [ { value = "%s/*" }, { relation = "logs_to", target_type = "object_storage", attr = "arn" } ] }

[[providers.aws.blocks]]
key = "tg"
resource = "aws_lb_target_group"

[providers.aws.blocks.args]
name        = { template = "{name}-tg", transform = "kebab" }
# A container app is reached on its own container port.
port        = { if = { relation = "attachment", target_type = "container_app" }, then = { relation = "attachment", target_type = "container_app", field = "port" }, else = { field = "target_port" } }
# TLS terminates at the listener, so an https load balancer still talks HTTP to the targets.
protocol    = { map = "protocol", table = { http = "HTTP", https = "HTTP", tcp = "TCP" } }
vpc_id      = { relation = "network_membership", attr = "vpc_id" }
# Pods and Fargate tasks are registered by their IP, not as EC2 instances, so a cluster or
# container-app target changes the whole target group. Pods are registered by the
# controller (manual step); a container app's ECS service registers its own tasks.
target_type = { if = { any = [ { relation = "attachment", target_type = "kubernetes_cluster" }, { relation = "attachment", target_type = "container_app" } ] }, then = { value = "ip" }, else = { value = "instance" } }
# A draining task gets as long to finish its requests as it has to stop.
deregistration_delay = { if = { relation = "attachment", target_type = "container_app" }, then = { relation = "attachment", target_type = "container_app", field = "stop_timeout" } }

[[providers.aws.blocks.nested]]
block = "health_check"
when = { relation = "attachment", target_type = "container_app", target_field = "health_check_path" }

[providers.aws.blocks.nested.args]
path     = { relation = "attachment", target_type = "container_app", field = "health_check_path" }
interval = { relation = "attachment", target_type = "container_app", field = "health_check_interval" }

[[providers.aws.blocks]]
key = "listener"
resource = "aws_lb_listener"

[providers.aws.blocks.args]
load_balancer_arn = { self_block = "main", attr = "arn" }
port              = { field = "listener_port" }
protocol          = { map = "protocol", table = { http = "HTTP", https = "HTTPS", tcp = "TCP" } }
# Prefer the validation resource's arn so the listener waits for the certificate to be
# issued; a certificate with no DNS Zone has no validation block, so fall back to its own.
certificate_arn   = { relation = "attribute_reference", target_type = "tls_certificate", block = "issued", attr = "certificate_arn", optional = true, fallback = { relation = "attribute_reference", target_type = "tls_certificate", attr = "arn", optional = true } }
ssl_policy        = { if = { field = "protocol", equals = "https" }, then = { value = "ELBSecurityPolicy-TLS13-1-2-2021-06" } }

# Behind a CDN with a secret origin header, the listener refuses everything by default and
# a rule (`origin_guard`) forwards only the requests that carry the header.
[[providers.aws.blocks.nested]]
block = "default_action"

[providers.aws.blocks.nested.args]
type             = { if = { relation = "attribute_reference", incoming = true, target_type = "cdn", target_field = "secret_origin_header" }, then = { value = "fixed-response" }, else = { value = "forward" } }
target_group_arn = { if = { relation = "attribute_reference", incoming = true, target_type = "cdn", target_field = "secret_origin_header", absent = true }, then = { self_block = "tg", attr = "arn" } }

[[providers.aws.blocks.nested.nested]]
block = "fixed_response"
when = { relation = "attribute_reference", incoming = true, target_type = "cdn", target_field = "secret_origin_header" }

[providers.aws.blocks.nested.nested.args]
content_type = { value = "text/plain" }
message_body = { value = "Forbidden" }
status_code  = { value = "403" }

[[providers.aws.blocks]]
key = "origin_guard"
resource = "aws_lb_listener_rule"
when = { relation = "attribute_reference", incoming = true, target_type = "cdn", target_field = "secret_origin_header" }

[providers.aws.blocks.args]
listener_arn = { self_block = "listener", attr = "arn" }
priority     = { value = 1 }

[[providers.aws.blocks.nested]]
block = "action"

[providers.aws.blocks.nested.args]
type             = { value = "forward" }
target_group_arn = { self_block = "tg", attr = "arn" }

[[providers.aws.blocks.nested]]
block = "condition"

[[providers.aws.blocks.nested.nested]]
block = "http_header"

[providers.aws.blocks.nested.nested.args]
http_header_name = { relation = "attribute_reference", incoming = true, target_type = "cdn", field = "secret_header_name" }
values           = { relation = "attribute_reference", incoming = true, target_type = "cdn", block = "origin_secret", attr = "result", wrap = "list" }

[[providers.aws.blocks]]
key = "redirect"
resource = "aws_lb_listener"
when = { all = [ { field = "protocol", equals = "https" }, { field = "redirect_http" } ] }

[providers.aws.blocks.args]
load_balancer_arn = { self_block = "main", attr = "arn" }
port              = { value = 80 }
protocol          = { value = "HTTP" }

[[providers.aws.blocks.nested]]
block = "default_action"

[providers.aws.blocks.nested.args]
type = { value = "redirect" }

[[providers.aws.blocks.nested.nested]]
block = "redirect"

[providers.aws.blocks.nested.nested.args]
port        = { value = "443" }
protocol    = { value = "HTTPS" }
status_code = { value = "HTTP_301" }

[[providers.aws.blocks]]
key = "attach"
resource = "aws_lb_target_group_attachment"
for_each_relation = "attachment"
for_each_target_type = "compute_instance"

[providers.aws.blocks.args]
target_group_arn = { self_block = "tg", attr = "arn" }
target_id        = { target = "id" }
port             = { field = "target_port" }

# The target group a Kubernetes workload's TargetGroupBinding registers its pods with.
[providers.aws.connection]
TARGET_GROUP_ARN = { self_block = "tg", attr = "arn" }

[providers.aws.outputs]
dns_name = { attr = "dns_name", description = "Public DNS name of the load balancer" }
zone_id  = { attr = "zone_id", description = "Hosted zone id for a Route 53 alias record" }

[[providers.aws.checks]]
severity = "error"
when = { all = [ { field = "protocol", equals = "https" }, { relation = "attribute_reference", target_type = "tls_certificate", absent = true } ] }
message = "\"{name}\" listens on https but has no Certificate link; an HTTPS listener needs an ACM certificate"

[[providers.aws.checks]]
when = { all = [ { field = "redirect_http" }, { field = "protocol", not_equals = "https" } ] }
message = "\"{name}\": 'Redirect HTTP to HTTPS' only does something when the protocol is https"

[[providers.aws.manual_steps]]
title = "Check the access-log bucket policy for older Regions"
when = { relation = "logs_to", target_type = "object_storage" }
body = """
The generated bucket policy grants `s3:PutObject` to the
`logdelivery.elasticloadbalancing.amazonaws.com` service principal, which is what Elastic
Load Balancing uses in every Region launched **after August 2022**. In an older Region
(eu-west-1, eu-west-2, us-east-1 and friends) the writer is a regional AWS account instead:
replace the `Principal` with `{ AWS = data.aws_elb_service_account.main.arn }` and add the
matching `data "aws_elb_service_account" "main" {}` block, or logging silently never starts.
"""

# With the Kubernetes manifests on, a workload linked with 'Receives traffic from' gets its
# TargetGroupBinding generated, so the step is only for a cluster nobody says is behind it.
[[providers.aws.manual_steps]]
title = "Bind the target group to a Kubernetes Service"
when = { all = [ { relation = "attachment", target_type = "kubernetes_cluster" }, { any = [ { setting = "kubernetes_manifests", equals = "false" }, { relation = "attachment", incoming = true, target_type = "kubernetes_workload", absent = true } ] } ] }
body = """
The target group is created with `target_type = "ip"` and no attachments: nothing in
Terraform knows which pods should be in it. Install the **AWS Load Balancer Controller** in
the cluster and apply a `TargetGroupBinding` that points at this target group's ARN and the
Service in front of the pods:

```yaml
apiVersion: elbv2.k8s.aws/v1beta1
kind: TargetGroupBinding
metadata:
  name: <service>
spec:
  serviceRef: { name: <service>, port: <target port> }
  targetGroupARN: <the tg arn from the plan>
```

The controller then keeps the target group in step with the pod IPs.
"""

# ---------------------------------------------------------------- Azure
[providers.azure]
status = "partial"

[[providers.azure.blocks]]
key = "pip"
resource = "azurerm_public_ip"
when = { field = "scheme", equals = "internet_facing" }

[providers.azure.blocks.args]
name                = { template = "{name}-pip", transform = "kebab" }
location            = { var = "location" }
resource_group_name = { ancestor = "resource_group", attr = "name" }
allocation_method   = { value = "Static" }
sku                 = { value = "Standard" }

[[providers.azure.blocks]]
key = "main"
resource = "azurerm_lb"

[providers.azure.blocks.args]
name                = { field = "name", transform = "kebab" }
location            = { var = "location" }
resource_group_name = { ancestor = "resource_group", attr = "name" }
sku                 = { value = "Standard" }

[[providers.azure.blocks.nested]]
block = "frontend_ip_configuration"
when = { field = "scheme", equals = "internet_facing" }

[providers.azure.blocks.nested.args]
name                 = { value = "frontend" }
public_ip_address_id = { self_block = "pip", attr = "id" }

[[providers.azure.blocks.nested]]
block = "frontend_ip_configuration"
when = { field = "scheme", equals = "internal" }

[providers.azure.blocks.nested.args]
name                          = { value = "frontend" }
subnet_id                     = { relation = "network_membership", attr = "id" }
private_ip_address_allocation = { value = "Dynamic" }

[[providers.azure.blocks]]
key = "pool"
resource = "azurerm_lb_backend_address_pool"

[providers.azure.blocks.args]
name            = { value = "backend" }
loadbalancer_id = { self_block = "main", attr = "id" }

[[providers.azure.blocks]]
key = "probe"
resource = "azurerm_lb_probe"

[providers.azure.blocks.args]
name            = { value = "probe" }
loadbalancer_id = { self_block = "main", attr = "id" }
# https is probed as Tcp: the probe would need the certificate to speak Https.
protocol        = { map = "protocol", table = { http = "Http", https = "Tcp", tcp = "Tcp" } }
port            = { field = "target_port" }
request_path    = { if = { field = "protocol", equals = "http" }, then = { value = "/" } }

[[providers.azure.blocks]]
key = "rule"
resource = "azurerm_lb_rule"

[providers.azure.blocks.args]
name                           = { value = "rule" }
loadbalancer_id                = { self_block = "main", attr = "id" }
protocol                       = { value = "Tcp" }
frontend_port                  = { field = "listener_port" }
backend_port                   = { field = "target_port" }
frontend_ip_configuration_name = { value = "frontend" }
backend_address_pool_ids       = { self_block = "pool", attr = "id", wrap = "list" }
probe_id                       = { self_block = "probe", attr = "id" }

[[providers.azure.blocks]]
key = "attach"
resource = "azurerm_network_interface_backend_address_pool_association"
for_each_relation = "attachment"
for_each_target_type = "compute_instance"

[providers.azure.blocks.args]
network_interface_id    = { target = "id", block = "nic" }
ip_configuration_name   = { value = "internal" }
backend_address_pool_id = { self_block = "pool", attr = "id" }

[providers.azure.outputs]
public_ip = { block = "pip", attr = "ip_address", description = "Public IPv4 address of the load balancer" }

[[providers.azure.manual_steps]]
title = "AKS traffic goes through an ingress, not this load balancer"
when = { relation = "attachment", target_type = "kubernetes_cluster" }
body = """
An `azurerm_lb` backend pool takes network interfaces, and AKS pods have none of their own,
so nothing is attached for the linked cluster. Publish the workload either with a
Kubernetes `Service` of type `LoadBalancer` — AKS then manages its own Standard load
balancer, and this one is redundant — or with an **Application Gateway** fronted by AGIC
(`azurerm_application_gateway` plus the ingress controller add-on), which is the layer-7
equivalent of what the diagram asks for. The load balancer here is still created for any
instance targets.
"""

[[providers.azure.manual_steps]]
title = "Container Apps have a load balancer of their own"
when = { relation = "attachment", target_type = "container_app" }
body = """
Nothing is attached for the linked Container App: an app's **ingress** is its own managed
load balancer, with TLS and a host name, so a layer-4 `azurerm_lb` cannot sit in front of
it. The app's ingress is made external when an internet-facing load balancer forwards to
it, which is the entry point the diagram asks for. For a WAF or a custom domain in front,
put Front Door (or an Application Gateway) before the app's FQDN.
"""

[[providers.azure.manual_steps]]
title = "TLS is not terminated on an Azure Load Balancer"
when = { field = "protocol", equals = "https" }
body = """
`azurerm_lb` is a layer-4 load balancer: it forwards TCP on the listener port and never sees
the TLS handshake, so no certificate is attached and no HTTP-to-HTTPS redirect is possible.
Two honest options:

* **Terminate on the backends.** Install the certificate on each instance and serve https
  there; the generated configuration already forwards port 443 untouched.
* **Put a layer-7 service in front.** An Application Gateway
  (`azurerm_application_gateway` with an `ssl_certificate` from a Key Vault) or Front Door
  terminates TLS, redirects http and can run a WAF policy. Both need their own dedicated
  subnet, so they are drawn as native nodes rather than generated from this one.
"""

# ---------------------------------------------------------------- GCP
[providers.gcp]
status = "partial"
notes = "http / tcp become a regional passthrough Network Load Balancer (HTTP is served as TCP). https becomes a global external Application Load Balancer: health check, backend service, URL map, target HTTPS proxy and global forwarding rule."

[[providers.gcp.blocks]]
key = "hc"
resource = "google_compute_region_health_check"
when = { field = "protocol", not_equals = "https" }

[providers.gcp.blocks.args]
name   = { template = "{name}-hc", transform = "kebab" }
region = { var = "region" }

[[providers.gcp.blocks.nested]]
block = "tcp_health_check"

[providers.gcp.blocks.nested.args]
port = { field = "target_port" }

[[providers.gcp.blocks]]
key = "group"
resource = "google_compute_instance_group"
when = { relation = "attachment", target_type = "compute_instance" }

[providers.gcp.blocks.args]
name      = { template = "{name}-targets", transform = "kebab" }
zone      = { var = "zone" }
instances = { relation = "attachment", target_type = "compute_instance", attr = "self_link", wrap = "list" }

[[providers.gcp.blocks.nested]]
block = "named_port"

[providers.gcp.blocks.nested.args]
name = { value = "app" }
port = { field = "target_port" }

[[providers.gcp.blocks]]
key = "main"
resource = "google_compute_region_backend_service"
when = { field = "protocol", not_equals = "https" }

[providers.gcp.blocks.args]
name                  = { field = "name", transform = "kebab" }
region                = { var = "region" }
protocol              = { value = "TCP" }
load_balancing_scheme = { map = "scheme", table = { internet_facing = "EXTERNAL", internal = "INTERNAL" } }
health_checks         = { self_block = "hc", attr = "id", wrap = "list" }

[[providers.gcp.blocks.nested]]
block = "backend"
when = { relation = "attachment", target_type = "compute_instance" }

[providers.gcp.blocks.nested.args]
group = { self_block = "group", attr = "self_link" }

[[providers.gcp.blocks]]
key = "rule"
resource = "google_compute_forwarding_rule"
when = { field = "protocol", not_equals = "https" }

[providers.gcp.blocks.args]
name                  = { template = "{name}-rule", transform = "kebab" }
region                = { var = "region" }
load_balancing_scheme = { map = "scheme", table = { internet_facing = "EXTERNAL", internal = "INTERNAL" } }
ip_protocol           = { value = "TCP" }
ports                 = { field = "listener_port", wrap = "list" }
backend_service       = { self_block = "main", attr = "id" }
network               = { if = { field = "scheme", equals = "internal" }, then = { relation = "network_membership", ancestor = "virtual_network", attr = "id" } }
subnetwork            = { if = { field = "scheme", equals = "internal" }, then = { relation = "network_membership", attr = "id" } }

# ---- https: global external Application Load Balancer
# Serverless backends (Cloud Run) are not health-checked by the load balancer, so the
# health check only exists for instance groups.
[[providers.gcp.blocks]]
key = "ghc"
resource = "google_compute_health_check"
when = { all = [ { field = "protocol", equals = "https" }, { relation = "attachment", target_type = "container_app", absent = true } ] }

[providers.gcp.blocks.args]
name = { template = "{name}-hc", transform = "kebab" }

[[providers.gcp.blocks.nested]]
block = "http_health_check"

[providers.gcp.blocks.nested.args]
port = { field = "target_port" }

# A Cloud Run service joins the load balancer through a serverless network endpoint group.
[[providers.gcp.blocks]]
key = "neg"
resource = "google_compute_region_network_endpoint_group"
when = { all = [ { field = "protocol", equals = "https" }, { relation = "attachment", target_type = "container_app" } ] }

[providers.gcp.blocks.args]
name                  = { template = "{name}-neg", transform = "kebab" }
region                = { var = "region" }
network_endpoint_type = { value = "SERVERLESS" }

[[providers.gcp.blocks.nested]]
block = "cloud_run"

[providers.gcp.blocks.nested.args]
service = { relation = "attachment", target_type = "container_app", attr = "name" }

# A serverless backend takes no port name, health check or timeout: Cloud Run answers for
# all three itself.
[[providers.gcp.blocks]]
key = "gbs"
resource = "google_compute_backend_service"
when = { field = "protocol", equals = "https" }

[providers.gcp.blocks.args]
name                  = { field = "name", transform = "kebab" }
protocol              = { value = "HTTP" }
port_name             = { if = { relation = "attachment", target_type = "container_app", absent = true }, then = { value = "app" } }
load_balancing_scheme = { value = "EXTERNAL_MANAGED" }
# A serverless NEG backend (a container app) takes no timeout; otherwise a CDN in front
# sets how long the edge waits for the backends.
timeout_sec           = { if = { relation = "attachment", target_type = "container_app", absent = true }, then = { relation = "attribute_reference", incoming = true, target_type = "cdn", field = "origin_read_timeout", fallback = { field = "idle_timeout_seconds", fallback = { value = 30 } } } }
health_checks         = { self_block = "ghc", attr = "id", wrap = "list" }
# Cloud CDN is a property of the backend service: a CDN linked to this load balancer
# turns it on here rather than creating anything of its own.
enable_cdn            = { if = { relation = "attribute_reference", incoming = true, target_type = "cdn" }, then = { value = true } }
# Cloud Armor attaches here too: a firewall that protects this load balancer, or the one
# that protects a CDN in front of it.
security_policy       = { relation = "attachment", incoming = true, target_type = "web_application_firewall", attr = "id", fallback = { relation = "attribute_reference", incoming = true, target_type = "cdn", hop = { relation = "attribute_reference", target_type = "web_application_firewall" }, attr = "id" } }

[[providers.gcp.blocks.nested]]
block = "backend"
when = { relation = "attachment", target_type = "compute_instance" }

[providers.gcp.blocks.nested.args]
group = { self_block = "group", attr = "self_link" }

# A dynamic site caches only what the application marks cacheable; anything else caches
# static content types the way CloudFront's CachingOptimized does.
[[providers.gcp.blocks.nested]]
block = "cdn_policy"
when = { relation = "attribute_reference", incoming = true, target_type = "cdn" }

[providers.gcp.blocks.nested.args]
cache_mode  = { if = { relation = "attribute_reference", incoming = true, target_type = "cdn", target_field = "dynamic_site" }, then = { value = "USE_ORIGIN_HEADERS" }, else = { value = "CACHE_ALL_STATIC" } }
default_ttl = { if = { relation = "attribute_reference", incoming = true, target_type = "cdn", target_field = "dynamic_site", absent = true }, then = { value = 3600 } }
client_ttl  = { if = { relation = "attribute_reference", incoming = true, target_type = "cdn", target_field = "dynamic_site", absent = true }, then = { value = 3600 } }
max_ttl     = { if = { relation = "attribute_reference", incoming = true, target_type = "cdn", target_field = "dynamic_site", absent = true }, then = { value = 86400 } }

[[providers.gcp.blocks.nested.nested]]
block = "cache_key_policy"

[providers.gcp.blocks.nested.nested.args]
include_host         = { value = true }
include_protocol     = { value = true }
include_query_string = { value = true }

[[providers.gcp.blocks.nested]]
block = "backend"
when = { relation = "attachment", target_type = "container_app" }

[providers.gcp.blocks.nested.args]
group = { self_block = "neg", attr = "id" }

[[providers.gcp.blocks]]
key = "urlmap"
resource = "google_compute_url_map"
when = { field = "protocol", equals = "https" }

[providers.gcp.blocks.args]
name            = { template = "{name}-url-map", transform = "kebab" }
default_service = { self_block = "gbs", attr = "id" }

[[providers.gcp.blocks]]
key = "proxy"
resource = "google_compute_target_https_proxy"
when = { field = "protocol", equals = "https" }

[providers.gcp.blocks.args]
name             = { template = "{name}-https-proxy", transform = "kebab" }
url_map          = { self_block = "urlmap", attr = "id" }
ssl_certificates = { relation = "attribute_reference", target_type = "tls_certificate", attr = "id", wrap = "list" }

[[providers.gcp.blocks]]
key = "grule"
resource = "google_compute_global_forwarding_rule"
when = { field = "protocol", equals = "https" }

[providers.gcp.blocks.args]
name                  = { template = "{name}-https-rule", transform = "kebab" }
target                = { self_block = "proxy", attr = "id" }
port_range            = { value = "443" }
ip_protocol           = { value = "TCP" }
load_balancing_scheme = { value = "EXTERNAL_MANAGED" }

# An IPv6 front end on the same proxy, for an AAAA record that aliases this load balancer
# or a CDN in front of it.
[[providers.gcp.blocks]]
key = "grule6"
resource = "google_compute_global_forwarding_rule"
when = { all = [ { field = "protocol", equals = "https" }, { any = [
  { relation = "attribute_reference", incoming = true, target_type = "dns_record", target_field = "record_type", equals = "AAAA" },
  { relation = "attribute_reference", incoming = true, target_type = "cdn", hop = { relation = "attribute_reference", incoming = true, target_type = "dns_record" }, target_field = "record_type", equals = "AAAA" },
] } ] }

[providers.gcp.blocks.args]
name                  = { template = "{name}-https-rule-v6", transform = "kebab" }
target                = { self_block = "proxy", attr = "id" }
port_range            = { value = "443" }
ip_protocol           = { value = "TCP" }
ip_version            = { value = "IPV6" }
load_balancing_scheme = { value = "EXTERNAL_MANAGED" }

[providers.gcp.outputs]
address         = { block = "rule", attr = "ip_address", description = "Frontend IP address" }
global_address  = { block = "grule", attr = "ip_address", description = "Global frontend IP address of the HTTPS load balancer" }
global_address6 = { block = "grule6", attr = "ip_address", description = "Global frontend IPv6 address of the HTTPS load balancer" }

[[providers.gcp.checks]]
severity = "error"
when = { all = [ { field = "protocol", equals = "https" }, { relation = "attribute_reference", target_type = "tls_certificate", absent = true } ] }
message = "\"{name}\" listens on https but has no Certificate link; a target HTTPS proxy needs an SSL certificate"

[[providers.gcp.checks]]
severity = "error"
when = { all = [ { field = "protocol", equals = "https" }, { field = "scheme", equals = "internal" } ] }
message = "\"{name}\": the global HTTPS load balancer this mapping builds is external only; set the scheme to internet_facing or use tcp"

[[providers.gcp.checks]]
severity = "error"
when = { all = [ { relation = "attachment", target_type = "container_app" }, { field = "protocol", not_equals = "https" } ] }
message = "\"{name}\" forwards to a Container App, which on Google Cloud is a Cloud Run service that only the https (Application) load balancer reaches, through a serverless network endpoint group; set the protocol to https"

[[providers.gcp.checks]]
severity = "error"
when = { all = [ { relation = "attachment", target_type = "container_app" }, { any = [ { relation = "attachment", target_type = "compute_instance" }, { relation = "attachment", target_type = "container_app", min_count = 2 } ] } ] }
message = "\"{name}\" forwards to a Container App and to other targets, but a backend service cannot mix a serverless network endpoint group with anything else and this mapping builds one backend service; use one load balancer per app"

[[providers.gcp.checks]]
when = { all = [ { field = "redirect_http" }, { field = "protocol", equals = "https" } ] }
message = "\"{name}\": the HTTP-to-HTTPS redirect is not generated on Google Cloud; it needs a second URL map with a default_url_redirect and its own target HTTP proxy"

[[providers.gcp.manual_steps]]
title = "GKE pods join the backend service through a NEG"
when = { relation = "attachment", target_type = "kubernetes_cluster" }
body = """
No backend is generated for the linked cluster: a GKE backend is a **network endpoint
group**, which the cluster creates when a `Service` is annotated
`cloud.google.com/neg: '{"exposed_ports": {"<port>":{}}}'`. Annotate the Service, then add
a `backend { group = <the NEG self link> }` to this backend service (or let a GKE `Ingress`
create its own load balancer instead of this one). With the project's Kubernetes manifests
on, the Service of a workload linked with 'Receives traffic from' already carries the
annotation; the backend is still yours to add, because the NEG only exists once GKE has
created it.
"""

[[providers.gcp.manual_steps]]
title = "Health-check probes must be allowed by the firewall"
when = { field = "protocol", not_equals = "https" }
body = """
Google's health-check ranges (35.191.0.0/16 and 130.211.0.0/22) must be allowed to reach
the target port on the backends; add an ingress rule for them to the instances' Security
Group. HTTP listeners are served as TCP passthrough; use `https` (or a native
`google_compute_region_url_map` + target proxy) for a real HTTP(S) load balancer.
"""

[[providers.gcp.manual_steps]]
title = "Finish the global HTTPS load balancer"
when = { field = "protocol", equals = "https" }
body = """
The global external Application Load Balancer is generated (health check, backend service,
URL map, target HTTPS proxy, global forwarding rule), but two things live outside it:

* **Firewall.** Allow 35.191.0.0/16 and 130.211.0.0/22 to the target port on the backends,
  or every backend stays unhealthy.
* **Redirect and extra routing.** Only a default route to the single backend service is
  emitted. An http-to-https redirect needs a second URL map with `default_url_redirect` and
  a `google_compute_target_http_proxy`; host and path rules need `host_rule` / `path_matcher`
  entries on the URL map.

The Google-managed certificate is only issued once the domain resolves to the forwarding
rule's address, so apply this first and create the DNS record afterwards.
"""
