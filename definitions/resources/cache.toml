# Abstract type: Cache (Redis)
#
# AWS: aws_elasticache_subnet_group + single-node aws_elasticache_cluster (redis 7) in the
#      linked subnets, optionally in a Security Group.
# Azure: azurerm_redis_cache (Basic tier). Azure Basic/Standard caches are not deployed
#      into a subnet, so subnet and security-group links become manual steps.

schema_version = 2

[resource]
type = "cache"
category = "database"
display_name = "Cache"
description = "A managed Redis cache. Link subnets (AWS) and optionally a Security Group."
kind = "node"
allowed_parents = ["virtual_network", "resource_group"]
icon = "RED"

[[fields]]
name = "size"
label = "Size class"
type = "enum"
required = true
options = ["small", "medium", "large"]
default = "small"

[[relations]]
kind = "network_membership"
label = "Subnets"
providers = ["aws"]
targets = ["subnet"]
cardinality = "many"

[[relations]]
kind = "attribute_reference"
label = "Uses security group"
providers = ["aws"]
targets = ["security_group"]
cardinality = "optional"

# ---------------------------------------------------------------- AWS
[providers.aws]
status = "full"

[[providers.aws.checks]]
when = { relation = "network_membership", absent = true }
severity = "error"
message = "\"{name}\" needs at least one subnet on AWS: ElastiCache requires a subnet group (link the cache to its subnets, or draw it inside one)"

[[providers.aws.blocks]]
key = "subnets"
resource = "aws_elasticache_subnet_group"

[providers.aws.blocks.args]
name       = { template = "{name}-subnets", transform = "kebab" }
subnet_ids = { relation = "network_membership", attr = "id", wrap = "list" }

[[providers.aws.blocks]]
key = "main"
resource = "aws_elasticache_cluster"

[providers.aws.blocks.args]
cluster_id           = { field = "name", transform = "kebab" }
engine               = { value = "redis" }
node_type            = { map = "size", table = { small = "cache.t3.micro", medium = "cache.t3.medium", large = "cache.m5.large" } }
num_cache_nodes      = { value = 1 }
parameter_group_name = { value = "default.redis7" }
port                 = { value = 6379 }
subnet_group_name    = { self_block = "subnets", attr = "name" }
security_group_ids   = { relation = "attribute_reference", target_type = "security_group", attr = "id", wrap = "list", optional = true }
tags                 = { object = { Name = { field = "name" } } }

[providers.aws.outputs]
endpoint = { attr = "cache_nodes.0.address", description = "Redis endpoint address" }

# ---------------------------------------------------------------- Azure
[providers.azure]
status = "full"
notes = "Basic-tier Azure Cache for Redis is not placed in a subnet; restrict access with its firewall rules."

[[providers.azure.fields]]
name = "cache_name"
label = "Cache name"
type = "string"
required = true
pattern = "^[a-z0-9][a-z0-9-]{1,61}[a-z0-9]$"
pattern_hint = "3-63 lowercase letters, digits and hyphens; globally unique"
unique_scope = "redis_cache"

[[providers.azure.blocks]]
key = "main"
resource = "azurerm_redis_cache"

[providers.azure.blocks.args]
name                = { provider_field = "cache_name" }
location            = { var = "location" }
resource_group_name = { ancestor = "resource_group", attr = "name" }
capacity            = { map = "size", table = { small = 0, medium = 1, large = 2 } }
family              = { value = "C" }
sku_name            = { value = "Basic" }
minimum_tls_version = { value = "1.2" }

[providers.azure.outputs]
hostname = { attr = "hostname", description = "Redis host name" }

# ---------------------------------------------------------------- GCP
[providers.gcp]
status = "full"
notes = "Memorystore for Redis (Basic tier) on the network the cache is drawn in."

[[providers.gcp.blocks]]
key = "main"
resource = "google_redis_instance"

[providers.gcp.blocks.args]
name               = { field = "name", transform = "kebab" }
tier               = { value = "BASIC" }
memory_size_gb     = { map = "size", table = { small = 1, medium = 4, large = 16 } }
region             = { var = "region" }
redis_version      = { value = "REDIS_7_0" }
authorized_network = { relation = "network_membership", ancestor = "virtual_network", attr = "id", fallback = { ancestor = "virtual_network", attr = "id", optional = true } }

[providers.gcp.outputs]
host = { attr = "host", description = "Redis host" }
port = { attr = "port", description = "Redis port" }
