# Abstract type: Container App  (schema_version 2)
#
# A long-running container from an image, without servers or a cluster to manage.
#   AWS:   ECS on Fargate — aws_ecs_task_definition + aws_ecs_service, in the enclosing
#          Container Environment's cluster (or an aws_ecs_cluster of its own outside one).
#   Azure: azurerm_container_app in the enclosing environment (or its own
#          azurerm_container_app_environment outside one).
#   GCP:   a Cloud Run (v2) service.
#
# The app's configuration travels with it: environment variables, secrets injected as
# environment variables, the health check, the stop timeout and the image (from a linked
# Container Registry) are written in each provider's own shape.
#
# Roles: 'Task role' is what the code runs as; 'Execution role' is what the platform
# uses to start it — pull the image, read the injected secrets, write the logs. With
# only a task role linked it does both jobs, as it always has. The links to queues,
# topics, buckets, secrets and databases become a least-privilege policy on the task
# role, the same statements a Kubernetes Workload gets. As with the workload, 'Uses' is
# read and write and 'Reads' is read-only.
#
# A 'background worker' has no ingress: no port mapping, no load balancer, and on
# Google Cloud a CPU that is always allocated.

schema_version = 2

[resource]
type = "container_app"
category = "container"
display_name = "Container App"
description = "A long-running container (ECS Fargate / Azure Container Apps / Cloud Run). Draw it inside a Container Environment, link its task role, subnets (AWS), image registry, secrets and the resources it uses."
kind = "node"
allowed_parents = ["resource_group", "virtual_network", "container_environment", "subnet"]
icon = "APP"

[[fields]]
name = "image"
label = "Image"
type = "string"
default = "public.ecr.aws/nginx/nginx:latest"
required_unless_relation = "attachment"
description = "A full image reference, used when no Container Registry is linked ('Runs image from'). Private registries need pull rights for the execution role (ECR) or identity (AcrPull on Azure)."

[[fields]]
name = "repository"
label = "Repository"
type = "string"
pattern = "^[a-z0-9]+([._/-][a-z0-9]+)*$"
pattern_hint = "a repository name: lowercase letters, digits and . _ / -"
description = "Which of the linked Container Registry's repositories the image comes from. Defaults to the first one the registry lists, or the registry itself when it lists none."

[[fields]]
name = "image_tag"
label = "Image tag"
type = "string"
pattern = "^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$"
pattern_hint = "a container image tag: letters, digits, '_', '.' and '-', up to 128 characters"
description = "The tag to run from the linked registry. Unset, it is an input variable (<app>_image_tag), so a pipeline can pass the tag it just pushed."

[[fields]]
name = "size"
label = "Size"
type = "enum"
required = true
options = ["small", "medium", "large", "xlarge"]
default = "small"
description = "small = 0.25 vCPU / 0.5 GB, medium = 0.5 / 1, large = 1 / 2, xlarge = 2 / 4."

[[fields]]
name = "cpu_architecture"
label = "CPU architecture"
type = "enum"
options = ["x86_64", "arm64"]
default = "x86_64"
description = "arm64 runs on AWS Graviton (about 20% cheaper on Fargate); build the image for linux/arm64. Azure Container Apps and Cloud Run run linux/amd64 only."

[[fields]]
name = "port"
label = "Container port"
type = "int"
default = 80
description = "The port the container listens on: the load balancer's target, the ingress target port, and where an HTTP health check is sent."

[[fields]]
name = "replicas"
label = "Replicas"
type = "int"
required = true
default = 1

[[fields]]
name = "public"
label = "Public ingress"
type = "bool"
default = false
description = "Reachable from the internet (Azure: external ingress; Cloud Run: all traffic and public invocation; AWS: a public IP on the tasks). Prefer a load balancer forwarding to the app for production. For a public IP only so the app can call out, use 'Public IP for outbound' instead."

[[fields]]
name = "outbound_public_ip"
label = "Public IP for outbound"
type = "bool"
default = false
description = "Give the app a public IP so it can call out to the internet (image pulls, secrets, third-party APIs) from a public subnet with no NAT gateway, without making it reachable: inbound traffic is still only what its security groups admit. AWS: `assign_public_ip` on the Fargate tasks. Azure Container Apps and Cloud Run reach the internet without one, so there it changes nothing (Cloud Run with its egress through a linked subnet needs Cloud NAT on that network instead)."

[[fields]]
name = "background_worker"
label = "Background worker"
type = "bool"
default = false
description = "No ingress at all: no port mapping, no load balancer, nothing calls it. Google Cloud keeps its CPU allocated between requests (there are none)."

[[fields]]
name = "env"
label = "Environment variables"
type = "struct_list"
description = "Plain configuration. Secrets go in Secret environment variables, never here."

[[fields.items]]
name = "name"
label = "Name"
type = "string"
required = true
pattern = "^[A-Za-z_][A-Za-z0-9_]*$"
pattern_hint = "an environment variable name: letters, digits and '_'"

[[fields.items]]
name = "value"
label = "Value"
type = "string"

[[fields]]
name = "secrets"
label = "Secret environment variables"
type = "struct_list"
description = "Environment variables injected from a Secret linked with 'Reads secrets' when the container starts. Name the Secret in a row when more than one is linked."

[[fields.items]]
name = "name"
label = "Variable"
type = "string"
required = true
pattern = "^[A-Za-z_][A-Za-z0-9_]*$"
pattern_hint = "an environment variable name: letters, digits and '_'"

[[fields.items]]
name = "secret"
label = "Secret"
type = "entity_ref"
targets = ["secret"]
description = "Defaults to the first linked Secret."

[[fields.items]]
name = "key"
label = "JSON key"
type = "string"
description = "AWS: read this key of a JSON secret (valueFrom <arn>:<key>::). Empty reads the whole value. Key Vault and Secret Manager secrets hold one value each, so there the whole secret is read."

[[fields]]
name = "health_check_path"
label = "Health check path"
type = "string"
pattern = "^/"
pattern_hint = "an HTTP path starting with '/'"
description = "HTTP GET on the container port: the load balancer's health check (AWS target group, Google NEG backends have none) and the liveness probe on Azure and Google Cloud."

[[fields]]
name = "health_check_command"
label = "Health check command"
type = "string"
description = "A shell command run inside the container (AWS ECS healthCheck, CMD-SHELL); exit 0 means healthy. Azure and Google Cloud probe over HTTP only — set the path too."

[[fields]]
name = "health_check_interval"
label = "Health check interval (s)"
type = "int"
default = 30

[[fields]]
name = "health_check_timeout"
label = "Health check timeout (s)"
type = "int"
default = 5

[[fields]]
name = "health_check_retries"
label = "Health check retries"
type = "int"
default = 3
description = "Consecutive failures before the container is restarted."

[[fields]]
name = "health_check_start_period"
label = "Health check start period (s)"
type = "int"
description = "Grace after start before failures count (AWS startPeriod, at most 300; Azure initial delay, at most 60)."

[[fields]]
name = "stop_timeout"
label = "Stop timeout (s)"
type = "int"
description = "How long the container has after SIGTERM to finish before it is killed (Fargate: at most 120; Azure: the termination grace period). Also the load balancer's deregistration delay. Cloud Run's is fixed at 10 seconds."

[[fields]]
name = "delete_objects"
label = "May delete objects"
type = "bool"
default = false
description = "Add delete permission to the read/write bucket grant ('Uses'). Off by default: a service that writes objects rarely needs to erase them."

[[fields]]
name = "db_user"
label = "Database user"
type = "string"
pattern = "^[A-Za-z0-9_@.-]{1,63}$"
pattern_hint = "a database user name"
description = "The user the app connects as when a linked database has IAM / directory authentication switched on. Defaults to the app's name."

[[relations]]
kind = "iam_binding"
label = "Task role / identity (runs as)"
targets = ["iam_role"]
cardinality = "one"

# A second role, attribute_reference only because iam_binding already names the task role.
[[relations]]
kind = "attribute_reference"
label = "Execution role (pulls the image, reads secrets)"
targets = ["iam_role"]
cardinality = "optional"

[[relations]]
kind = "network_membership"
label = "Subnets"
targets = ["subnet"]
cardinality = "many"
via_parent = true

[[relations]]
kind = "attribute_reference"
label = "Security group"
targets = ["security_group"]
cardinality = "optional"

[[relations]]
kind = "attribute_reference"
label = "Uses (read / write): queue, database, cache, bucket"
targets = ["event_queue", "relational_database", "cache", "object_storage"]
cardinality = "many"

[[relations]]
kind = "reads"
label = "Reads secrets"
targets = ["secret"]
cardinality = "many"

[[relations]]
kind = "reads"
label = "Reads (read-only bucket)"
targets = ["object_storage"]
cardinality = "many"

[[relations]]
kind = "sends_to"
label = "Sends to"
targets = ["event_queue", "topic"]
cardinality = "many"

[[relations]]
kind = "logs_to"
label = "Logs to"
providers = ["aws", "azure"]
targets = ["log_group"]
cardinality = "optional"

[[relations]]
kind = "attachment"
label = "Runs image from"
targets = ["container_registry"]
cardinality = "optional"

# ---------------------------------------------------------------- AWS
[providers.aws]
status = "partial"
file = "container"

[[providers.aws.checks]]
when = { relation = "network_membership", absent = true }
severity = "error"
message = "\"{name}\" needs at least one subnet on AWS (Fargate tasks run inside a VPC)"

[[providers.aws.checks]]
when = { all = [ { field = "background_worker" }, { relation = "attachment", incoming = true, target_type = "load_balancer" } ] }
severity = "error"
message = "\"{name}\" is a background worker, so a load balancer cannot forward to it; clear 'Background worker' or remove the link"

[[providers.aws.checks]]
for_each_field = "secrets"
when = { all = [ { item = "secret", absent = true }, { relation = "reads", target_type = "secret", absent = true } ] }
severity = "error"
message = "\"{name}\": secret variable {item.name} has no Secret to read; link one with 'Reads secrets'"

[[providers.aws.checks]]
for_each_field = "secrets"
when = { all = [ { item = "secret" }, { item = "secret", linked = "reads", absent = true } ] }
severity = "error"
message = "\"{name}\": secret variable {item.name} names a Secret the app is not linked to; link it with 'Reads secrets' so the app may read it"

[[providers.aws.blocks]]
key = "cluster"
resource = "aws_ecs_cluster"
when = { ancestor = "container_environment", absent = true }

[providers.aws.blocks.args]
name = { template = "{name}-cluster", transform = "kebab" }
tags = { object = { Name = { field = "name" } } }

# The account only matters for the rds-db:connect ARN, which names the database user
# rather than a resource attribute (see kubernetes_workload.toml).
[[providers.aws.data]]
key = "account"
resource = "aws_caller_identity"
when = { relation = "attribute_reference", target_type = "relational_database", target_field = "iam_authentication" }

[[providers.aws.blocks]]
key = "task"
resource = "aws_ecs_task_definition"

[providers.aws.blocks.args]
family                   = { field = "name", transform = "kebab" }
requires_compatibilities = { value = ["FARGATE"] }
network_mode             = { value = "awsvpc" }
cpu                      = { map = "size", table = { small = "256", medium = "512", large = "1024", xlarge = "2048" } }
memory                   = { map = "size", table = { small = "512", medium = "1024", large = "2048", xlarge = "4096" } }
execution_role_arn       = { relation = "attribute_reference", target_type = "iam_role", attr = "arn", fallback = { relation = "iam_binding", attr = "arn" } }
task_role_arn            = { relation = "iam_binding", attr = "arn" }

[providers.aws.blocks.args.container_definitions]
func = "jsonencode"

[[providers.aws.blocks.args.container_definitions.args]]
[[providers.aws.blocks.args.container_definitions.args.list]]
[providers.aws.blocks.args.container_definitions.args.list.object]
name         = { field = "name", transform = "kebab" }
image        = { if = { relation = "attachment", target_type = "container_registry" }, then = { func = "format", args = [ { value = "%s/%s:%s" }, { relation = "attachment", target_type = "container_registry", connection = "REGISTRY" }, { field = "repository", transform = "kebab", fallback = { if = { relation = "attachment", target_type = "container_registry", target_field = "repositories" }, then = { func = "element", args = [ { relation = "attachment", target_type = "container_registry", field = "repositories", transform = "kebab" }, { value = 0 } ] }, else = { relation = "attachment", target_type = "container_registry", field = "name", transform = "kebab" } } }, { field = "image_tag", fallback = { entity_var = "image_tag", description = "Image tag the container app \"{name}\" runs (the tag your pipeline pushed)." } } ] }, else = { field = "image" } }
essential    = { value = true }
portMappings = { if = { field = "background_worker", not_equals = "true" }, then = { list = [ { object = { containerPort = { field = "port", fallback = { value = 80 } }, protocol = { value = "tcp" } } } ] } }
environment  = { func = "concat", args = [ { for_each_field = "env", each = { object = { name = { item = "name" }, value = { item = "value" } } } }, { list = [ { if = { relation = "sends_to", target_type = "event_queue" }, then = { object = { name = { value = "QUEUE_URL" }, value = { relation = "sends_to", target_type = "event_queue", attr = "url" } } } }, { if = { relation = "sends_to", target_type = "topic" }, then = { object = { name = { value = "TOPIC_ARN" }, value = { relation = "sends_to", target_type = "topic", attr = "arn" } } } }, { if = { relation = "attribute_reference", target_type = "relational_database" }, then = { object = { name = { value = "DB_HOST" }, value = { relation = "attribute_reference", target_type = "relational_database", connection = "HOST" } } } }, { if = { relation = "attribute_reference", target_type = "relational_database" }, then = { object = { name = { value = "DB_PORT" }, value = { func = "tostring", args = [ { relation = "attribute_reference", target_type = "relational_database", connection = "PORT" } ] } } } }, { if = { relation = "attribute_reference", target_type = "relational_database" }, then = { object = { name = { value = "DB_NAME" }, value = { relation = "attribute_reference", target_type = "relational_database", connection = "NAME" } } } }, { if = { relation = "attribute_reference", target_type = "cache" }, then = { object = { name = { value = "CACHE_HOST" }, value = { relation = "attribute_reference", target_type = "cache", connection = "HOST" } } } }, { if = { relation = "attribute_reference", target_type = "cache" }, then = { object = { name = { value = "CACHE_PORT" }, value = { func = "tostring", args = [ { relation = "attribute_reference", target_type = "cache", connection = "PORT" } ] } } } } ] } ] }
# ECS reads each value with the execution role when the task starts: the whole secret,
# or one key of a JSON secret (<arn>:<key>::).
secrets      = { if = { field = "secrets" }, then = { for_each_field = "secrets", each = { object = { name = { item = "name" }, valueFrom = { if = { item = "key" }, then = { func = "format", args = [ { value = "%s:%s::" }, { if = { item = "secret" }, then = { item_ref = "secret", attr = "arn" }, else = { relation = "reads", target_type = "secret", attr = "arn" } }, { item = "key" } ] }, else = { if = { item = "secret" }, then = { item_ref = "secret", attr = "arn" }, else = { relation = "reads", target_type = "secret", attr = "arn" } } } } } } }
healthCheck  = { if = { field = "health_check_command" }, then = { object = { command = { list = [ { value = "CMD-SHELL" }, { field = "health_check_command" } ] }, interval = { field = "health_check_interval", optional = true }, timeout = { field = "health_check_timeout", optional = true }, retries = { field = "health_check_retries", optional = true }, startPeriod = { field = "health_check_start_period", optional = true } } } }
stopTimeout  = { field = "stop_timeout", optional = true }
logConfiguration = { if = { relation = "logs_to" }, then = { object = { logDriver = { value = "awslogs" }, options = { object = { "awslogs-group" = { relation = "logs_to", attr = "name" }, "awslogs-region" = { var = "region" }, "awslogs-stream-prefix" = { value = "app" } } } } } }

# x86_64 is Fargate's default, so only Graviton needs saying.
[[providers.aws.blocks.nested]]
block = "runtime_platform"
when = { field = "cpu_architecture", equals = "arm64" }

[providers.aws.blocks.nested.args]
operating_system_family = { value = "LINUX" }
cpu_architecture        = { value = "ARM64" }

[[providers.aws.blocks]]
key = "main"
resource = "aws_ecs_service"

[providers.aws.blocks.args]
name                              = { field = "name", transform = "kebab" }
cluster                           = { if = { ancestor = "container_environment" }, then = { ancestor = "container_environment", attr = "id", optional = true }, else = { self_block = "cluster", attr = "id" } }
task_definition                   = { self_block = "task", attr = "arn" }
desired_count                     = { field = "replicas" }
launch_type                       = { value = "FARGATE" }
health_check_grace_period_seconds = { if = { relation = "attachment", incoming = true, target_type = "load_balancer" }, then = { field = "health_check_start_period", optional = true } }
# The target group only accepts registrations once a listener forwards to it.
depends_on                        = { relation = "attachment", incoming = true, target_type = "load_balancer", block = "listener", attr = "", wrap = "list" }

[[providers.aws.blocks.nested]]
block = "network_configuration"

[providers.aws.blocks.nested.args]
subnets          = { relation = "network_membership", attr = "id", wrap = "list" }
security_groups  = { relation = "attribute_reference", target_type = "security_group", attr = "id", wrap = "list" }
# A public IP for public ingress, or only for calling out (no NAT gateway).
assign_public_ip = { if = { field = "outbound_public_ip" }, then = { value = true }, else = { field = "public" } }

# A load balancer that forwards here: ECS registers each task's IP in its target group.
[[providers.aws.blocks.nested]]
block = "load_balancer"
when = { relation = "attachment", incoming = true, target_type = "load_balancer" }

[providers.aws.blocks.nested.args]
target_group_arn = { relation = "attachment", incoming = true, target_type = "load_balancer", block = "tg", attr = "arn" }
container_name   = { field = "name", transform = "kebab" }
container_port   = { field = "port", fallback = { value = 80 } }

# The execution role reads the injected secrets when a task starts. The managed
# AmazonECSTaskExecutionRolePolicy (attached by the role itself) covers the image pull
# and the logs, but no secrets.
[[providers.aws.blocks]]
key = "exec_secrets"
resource = "aws_iam_role_policy"
when = { all = [ { field = "secrets" }, { relation = "reads", target_type = "secret" } ] }

[providers.aws.blocks.args]
name = { template = "{name}-exec-secrets", transform = "kebab" }
role = { relation = "attribute_reference", target_type = "iam_role", attr = "id", fallback = { relation = "iam_binding", attr = "id" } }

[providers.aws.blocks.args.policy]
func = "jsonencode"

[[providers.aws.blocks.args.policy.args]]
[providers.aws.blocks.args.policy.args.object]
Version = { value = "2012-10-17" }

[[providers.aws.blocks.args.policy.args.object.Statement.list]]
object = { Sid = { value = "InjectSecrets" }, Effect = { value = "Allow" }, Action = { value = ["secretsmanager:GetSecretValue"] }, Resource = { relation = "reads", target_type = "secret", attr = "arn", wrap = "list" } }

# Least-privilege inline policy on the task role, derived from this app's links — the
# statements a Kubernetes Workload gets for the same links.
[[providers.aws.blocks]]
key = "policy"
resource = "aws_iam_role_policy"
when = { any = [ { relation = "attribute_reference", target_type = "event_queue" }, { relation = "attribute_reference", target_type = "object_storage" }, { relation = "attribute_reference", target_type = "relational_database", target_field = "iam_authentication" }, { relation = "sends_to", target_type = "event_queue" }, { relation = "sends_to", target_type = "topic" }, { all = [ { relation = "reads", target_type = "secret" }, { field = "secrets", absent = true } ] }, { relation = "reads", target_type = "object_storage" } ] }

[providers.aws.blocks.args]
name = { template = "{name}-policy", transform = "kebab" }
role = { relation = "iam_binding", attr = "id" }

[providers.aws.blocks.args.policy]
func = "jsonencode"

[[providers.aws.blocks.args.policy.args]]
[providers.aws.blocks.args.policy.args.object]
Version = { value = "2012-10-17" }

# Consume the queue(s) it uses.
[[providers.aws.blocks.args.policy.args.object.Statement.list]]
if = { relation = "attribute_reference", target_type = "event_queue" }
then = { object = { Sid = { value = "QueueConsume" }, Effect = { value = "Allow" }, Action = { value = ["sqs:ReceiveMessage", "sqs:DeleteMessage", "sqs:GetQueueAttributes", "sqs:GetQueueUrl"] }, Resource = { relation = "attribute_reference", target_type = "event_queue", attr = "arn", wrap = "list" } } }

[[providers.aws.blocks.args.policy.args.object.Statement.list]]
if = { relation = "sends_to", target_type = "event_queue" }
then = { object = { Sid = { value = "QueueSend" }, Effect = { value = "Allow" }, Action = { value = ["sqs:SendMessage", "sqs:GetQueueUrl", "sqs:GetQueueAttributes"] }, Resource = { relation = "sends_to", target_type = "event_queue", attr = "arn", wrap = "list" } } }

[[providers.aws.blocks.args.policy.args.object.Statement.list]]
if = { relation = "sends_to", target_type = "topic" }
then = { object = { Sid = { value = "TopicPublish" }, Effect = { value = "Allow" }, Action = { value = ["sns:Publish"] }, Resource = { relation = "sends_to", target_type = "topic", attr = "arn", wrap = "list" } } }

# Secrets the code reads itself at run time. When the app injects secrets as
# environment variables the execution role reads them instead, and the task role gets
# nothing it does not need.
[[providers.aws.blocks.args.policy.args.object.Statement.list]]
if = { all = [ { relation = "reads", target_type = "secret" }, { field = "secrets", absent = true } ] }
then = { object = { Sid = { value = "Secrets" }, Effect = { value = "Allow" }, Action = { value = ["secretsmanager:GetSecretValue", "secretsmanager:DescribeSecret"] }, Resource = { relation = "reads", target_type = "secret", attr = "arn", wrap = "list" } } }

[[providers.aws.blocks.args.policy.args.object.Statement.list]]
if = { relation = "attribute_reference", target_type = "object_storage" }
then = { object = { Sid = { value = "Bucket" }, Effect = { value = "Allow" }, Action = { if = { field = "delete_objects" }, then = { value = ["s3:GetObject", "s3:PutObject", "s3:DeleteObject", "s3:ListBucket"] }, else = { value = ["s3:GetObject", "s3:PutObject", "s3:ListBucket"] } }, Resource = { func = "concat", args = [ { relation = "attribute_reference", target_type = "object_storage", attr = "arn", wrap = "list" }, { func = "formatlist", args = [ { value = "%s/*" }, { relation = "attribute_reference", target_type = "object_storage", attr = "arn", wrap = "list" } ] } ] } } }

[[providers.aws.blocks.args.policy.args.object.Statement.list]]
if = { relation = "reads", target_type = "object_storage" }
then = { object = { Sid = { value = "BucketRead" }, Effect = { value = "Allow" }, Action = { value = ["s3:GetObject", "s3:ListBucket"] }, Resource = { func = "concat", args = [ { relation = "reads", target_type = "object_storage", attr = "arn", wrap = "list" }, { func = "formatlist", args = [ { value = "%s/*" }, { relation = "reads", target_type = "object_storage", attr = "arn", wrap = "list" } ] } ] } } }

[[providers.aws.blocks.args.policy.args.object.Statement.list]]
if = { relation = "attribute_reference", target_type = "relational_database", target_field = "iam_authentication" }
then = { object = { Sid = { value = "DatabaseConnect" }, Effect = { value = "Allow" }, Action = { value = ["rds-db:connect"] }, Resource = { func = "formatlist", args = [ { value = "arn:aws:rds-db:%s:%s:dbuser:%s/%s" }, { var = "region" }, { self_data = "account", attr = "account_id" }, { relation = "attribute_reference", target_type = "relational_database", attr = "resource_id", wrap = "list" }, { field = "db_user", fallback = { field = "name", transform = "kebab" } } ] } } }

[providers.aws.outputs]
service_name        = { attr = "name", description = "ECS service name", primary = true }
cluster_arn         = { block = "cluster", attr = "arn", description = "ECS cluster ARN" }
task_definition_arn = { block = "task", attr = "arn", description = "Task definition ARN (current revision)" }

[[providers.aws.manual_steps]]
title = "Front the service with a load balancer for real public traffic"
# Not when a load balancer already forwards to it (a link, or a `load_balancer` block set
# as an extra argument), and never for a background worker, which takes no traffic.
when = { all = [ { field = "public" }, { field = "background_worker", not_equals = "true" }, { relation = "attachment", incoming = true, target_type = "load_balancer", absent = true }, { extra = "load_balancer", absent = true } ] }
body = """
`assign_public_ip = true` gives each task a public IP that changes on every deployment.
For a stable public entry point add a Load Balancer and link it 'Forwards to' this app:
its target group then uses `target_type = "ip"` and the ECS service registers its tasks.
"""

[[providers.aws.manual_steps]]
title = "Make the roles assumable by ECS tasks"
when = { any = [ { relation = "iam_binding", target_field = "trusted_service", not_equals = "container" }, { relation = "attribute_reference", target_type = "iam_role", target_field = "trusted_service", not_equals = "container" } ] }
body = """
Fargate assumes both the task role and the execution role through
`ecs-tasks.amazonaws.com`. Set each linked Role's **Assumable by** field to `container`:
the trust policy then names ECS tasks, and the role the app starts with (its execution
role, or its only role) also gets `AmazonECSTaskExecutionRolePolicy` to pull images and
write logs.
"""

[[providers.aws.manual_steps]]
title = "Let the execution role decrypt the secrets"
when = { relation = "reads", target_type = "secret", where = { relation = "encrypted_with" } }
body = """
A linked Secret is encrypted with a customer-managed key, and ECS reads injected secrets
with the execution role, which also needs `kms:Decrypt` on that key. Add it to the key's
policy, or as a statement on the execution role.
"""

[[providers.aws.manual_steps]]
title = "Database access is not an IAM grant"
when = { relation = "attribute_reference", target_type = "relational_database", target_field = "iam_authentication", not_equals = "true" }
body = """
No policy statement is generated for the linked database: RDS wants a user name and a
password unless IAM database authentication is on. Put the connection string in a Secret,
link it with 'Reads secrets' and inject it as a secret environment variable, or tick
**IAM / directory authentication** on the database — an `rds-db:connect` statement for
this app's database user is then generated instead.
"""

[[providers.aws.manual_steps]]
title = "Create the database user the role connects as"
when = { relation = "attribute_reference", target_type = "relational_database", target_field = "iam_authentication" }
body = """
The policy grants `rds-db:connect` on
`arn:aws:rds-db:<region>:<account>:dbuser:<instance resource id>/<database user>`, with the
user taken from the app's **Database user** field (its name by default). Create that user
inside the database and grant it `rds_iam` (PostgreSQL) or `AWSAuthenticationPlugin`
(MySQL); the app then signs a token (`aws rds generate-db-auth-token`) as its password.
"""

[[providers.aws.manual_steps]]
title = "Cache access is not an IAM grant"
when = { relation = "attribute_reference", target_type = "cache" }
body = """
No policy statement is generated for a linked cache: ElastiCache has no IAM data plane for
the engines this type creates. Inject the auth token from a Secret instead.
"""

# ---------------------------------------------------------------- Azure
[providers.azure]
status = "full"
file = "container"
notes = "A Container App in the enclosing Container Environment (or one of its own). Secret variables are Key Vault references read with the execution identity (or the only one); a linked registry is pulled with that identity, which gets AcrPull. 'Public IP for outbound' changes nothing here: a Container App reaches the internet through its environment's own outbound addresses."

# VNet integration needs a subnet delegated to Microsoft.App/environments (and /23 or
# larger: checked by the built-in network checks). Inside a Container Environment the
# environment owns the subnet, so the app's own subnet links do not matter here.
[[providers.azure.checks]]
when = { all = [ { ancestor = "container_environment", absent = true }, { relation = "network_membership" }, { relation = "network_membership", target_provider_field = "delegation", equals = "app_environments", absent = true } ] }
message = "\"{name}\" is VNet-integrated but no linked subnet is delegated to app_environments (set the subnet's Azure Delegation field; the environment uses the first linked subnet)"

[[providers.azure.checks]]
when = { all = [ { field = "background_worker" }, { relation = "attachment", incoming = true, target_type = "load_balancer" } ] }
severity = "error"
message = "\"{name}\" is a background worker, so a load balancer cannot forward to it; clear 'Background worker' or remove the link"

[[providers.azure.checks]]
when = { field = "cpu_architecture", equals = "arm64" }
message = "\"{name}\" is built for arm64, but Azure Container Apps run linux/amd64 only; publish a multi-architecture image"

[[providers.azure.checks]]
when = { all = [ { field = "health_check_command" }, { field = "health_check_path", absent = true } ] }
message = "\"{name}\" has a health check command, which Container Apps cannot run (probes are HTTP or TCP); set the Health check path for an HTTP liveness probe"

[[providers.azure.checks]]
for_each_field = "secrets"
when = { all = [ { item = "secret", absent = true }, { relation = "reads", target_type = "secret", absent = true } ] }
severity = "error"
message = "\"{name}\": secret variable {item.name} has no Secret to read; link one with 'Reads secrets'"

[[providers.azure.checks]]
for_each_field = "secrets"
when = { all = [ { item = "secret" }, { item = "secret", linked = "reads", absent = true } ] }
severity = "error"
message = "\"{name}\": secret variable {item.name} names a Secret the app is not linked to; link it with 'Reads secrets' so the app may read it"

[[providers.azure.blocks]]
key = "env"
resource = "azurerm_container_app_environment"
when = { ancestor = "container_environment", absent = true }

[providers.azure.blocks.args]
name                       = { template = "{name}-env", transform = "kebab" }
location                   = { var = "location" }
resource_group_name        = { ancestor = "resource_group", attr = "name" }
log_analytics_workspace_id = { relation = "logs_to", attr = "id" }
infrastructure_subnet_id   = { relation = "network_membership", attr = "id" }

[[providers.azure.blocks]]
key = "main"
resource = "azurerm_container_app"

[providers.azure.blocks.args]
name                         = { field = "name", transform = "kebab" }
container_app_environment_id = { if = { ancestor = "container_environment" }, then = { ancestor = "container_environment", attr = "id", optional = true }, else = { self_block = "env", attr = "id" } }
resource_group_name          = { ancestor = "resource_group", attr = "name" }
revision_mode                = { value = "Single" }
tags                         = { object = { Name = { field = "name" } } }
# A revision only starts once its identity may read the Key Vault secrets and pull the image.
depends_on                   = { list = [ { if = { field = "secrets" }, then = { self_block = "secret_read", attr = "", wrap = "list" } }, { self_block = "acr_pull", attr = "" } ] }

[[providers.azure.blocks.nested]]
block = "template"

[providers.azure.blocks.nested.args]
min_replicas                     = { field = "replicas" }
max_replicas                     = { field = "replicas" }
termination_grace_period_seconds = { field = "stop_timeout", optional = true }

[[providers.azure.blocks.nested.nested]]
block = "container"

[providers.azure.blocks.nested.nested.args]
name   = { field = "name", transform = "kebab" }
image  = { if = { relation = "attachment", target_type = "container_registry" }, then = { func = "format", args = [ { value = "%s/%s:%s" }, { relation = "attachment", target_type = "container_registry", connection = "REGISTRY" }, { field = "repository", transform = "kebab", fallback = { if = { relation = "attachment", target_type = "container_registry", target_field = "repositories" }, then = { func = "element", args = [ { relation = "attachment", target_type = "container_registry", field = "repositories", transform = "kebab" }, { value = 0 } ] }, else = { relation = "attachment", target_type = "container_registry", field = "name", transform = "kebab" } } }, { field = "image_tag", fallback = { entity_var = "image_tag", description = "Image tag the container app \"{name}\" runs (the tag your pipeline pushed)." } } ] }, else = { field = "image" } }
cpu    = { map = "size", table = { small = 0.25, medium = 0.5, large = 1.0, xlarge = 2.0 } }
memory = { map = "size", table = { small = "0.5Gi", medium = "1Gi", large = "2Gi", xlarge = "4Gi" } }

[[providers.azure.blocks.nested.nested.nested]]
block = "env"
for_each_field = "env"

[providers.azure.blocks.nested.nested.nested.args]
name  = { item = "name" }
value = { item = "value" }

# A secret variable names one of the app's secrets (below), which is a Key Vault reference.
[[providers.azure.blocks.nested.nested.nested]]
block = "env"
for_each_field = "secrets"

[providers.azure.blocks.nested.nested.nested.args]
name        = { item = "name" }
secret_name = { item = "name", transform = "kebab" }

[[providers.azure.blocks.nested.nested.nested]]
block = "env"
when = { relation = "sends_to", target_type = "event_queue" }

[providers.azure.blocks.nested.nested.nested.args]
name  = { value = "QUEUE_NAME" }
value = { relation = "sends_to", target_type = "event_queue", attr = "name" }

[[providers.azure.blocks.nested.nested.nested]]
block = "env"
when = { relation = "attribute_reference", target_type = "relational_database" }

[providers.azure.blocks.nested.nested.nested.args]
name  = { value = "DB_HOST" }
value = { relation = "attribute_reference", target_type = "relational_database", connection = "HOST" }

[[providers.azure.blocks.nested.nested.nested]]
block = "env"
when = { relation = "attribute_reference", target_type = "relational_database" }

[providers.azure.blocks.nested.nested.nested.args]
name  = { value = "DB_PORT" }
value = { func = "tostring", args = [ { relation = "attribute_reference", target_type = "relational_database", connection = "PORT" } ] }

[[providers.azure.blocks.nested.nested.nested]]
block = "env"
when = { relation = "attribute_reference", target_type = "relational_database" }

[providers.azure.blocks.nested.nested.nested.args]
name  = { value = "DB_NAME" }
value = { relation = "attribute_reference", target_type = "relational_database", connection = "NAME" }

[[providers.azure.blocks.nested.nested.nested]]
block = "env"
when = { relation = "attribute_reference", target_type = "cache" }

[providers.azure.blocks.nested.nested.nested.args]
name  = { value = "CACHE_HOST" }
value = { relation = "attribute_reference", target_type = "cache", connection = "HOST" }

[[providers.azure.blocks.nested.nested.nested]]
block = "env"
when = { relation = "attribute_reference", target_type = "cache" }

[providers.azure.blocks.nested.nested.nested.args]
name  = { value = "CACHE_PORT" }
value = { func = "tostring", args = [ { relation = "attribute_reference", target_type = "cache", connection = "PORT" } ] }

[[providers.azure.blocks.nested.nested.nested]]
block = "liveness_probe"
when = { field = "health_check_path" }

[providers.azure.blocks.nested.nested.nested.args]
transport               = { value = "HTTP" }
port                    = { field = "port", fallback = { value = 80 } }
path                    = { field = "health_check_path" }
interval_seconds        = { field = "health_check_interval", optional = true }
timeout                 = { field = "health_check_timeout", optional = true }
failure_count_threshold = { field = "health_check_retries", optional = true }
initial_delay           = { field = "health_check_start_period", optional = true }

# A background worker has no ingress at all. Otherwise it is external when the app is
# public or an internet-facing load balancer forwards to it: Container Apps' ingress is
# its own load balancer.
[[providers.azure.blocks.nested]]
block = "ingress"
when = { field = "background_worker", not_equals = "true" }

[providers.azure.blocks.nested.args]
external_enabled = { if = { any = [ { field = "public" }, { relation = "attachment", incoming = true, target_type = "load_balancer", where = { field = "scheme", equals = "internet_facing" } } ] }, then = { value = true }, else = { value = false } }
target_port      = { field = "port", fallback = { value = 80 } }

[[providers.azure.blocks.nested.nested]]
block = "traffic_weight"

[providers.azure.blocks.nested.nested.args]
percentage      = { value = 100 }
latest_revision = { value = true }

[[providers.azure.blocks.nested]]
block = "identity"
when = { relation = "iam_binding" }

[providers.azure.blocks.nested.args]
type         = { value = "UserAssigned" }
identity_ids = { if = { relation = "attribute_reference", target_type = "iam_role" }, then = { func = "distinct", args = [ { func = "concat", args = [ { relation = "iam_binding", attr = "id", wrap = "list" }, { relation = "attribute_reference", target_type = "iam_role", attr = "id", wrap = "list" } ] } ] }, else = { relation = "iam_binding", attr = "id", wrap = "list" } }

# One app secret per secret variable: a Key Vault reference, read with the execution
# identity. Key Vault secrets hold one value, so the whole secret is the variable.
[[providers.azure.blocks.nested]]
block = "secret"
for_each_field = "secrets"

[providers.azure.blocks.nested.args]
name                = { item = "name", transform = "kebab" }
identity            = { relation = "attribute_reference", target_type = "iam_role", attr = "id", fallback = { relation = "iam_binding", attr = "id" } }
key_vault_secret_id = { if = { item = "secret" }, then = { item_ref = "secret", attr = "versionless_id" }, else = { relation = "reads", target_type = "secret", attr = "versionless_id" } }

[[providers.azure.blocks.nested]]
block = "registry"
when = { relation = "attachment", target_type = "container_registry" }

[providers.azure.blocks.nested.args]
server   = { relation = "attachment", target_type = "container_registry", connection = "REGISTRY" }
identity = { relation = "attribute_reference", target_type = "iam_role", attr = "id", fallback = { relation = "iam_binding", attr = "id" } }

# Least-privilege role assignments, one per linked resource.
[[providers.azure.blocks]]
key = "send"
resource = "azurerm_role_assignment"
for_each_relation = "sends_to"
for_each_target_type = "event_queue"

[providers.azure.blocks.args]
scope                = { target = "id" }
role_definition_name = { value = "Azure Service Bus Data Sender" }
principal_id         = { relation = "iam_binding", attr = "principal_id" }

[[providers.azure.blocks]]
key = "publish"
resource = "azurerm_role_assignment"
for_each_relation = "sends_to"
for_each_target_type = "topic"

[providers.azure.blocks.args]
scope                = { target = "id" }
role_definition_name = { value = "Azure Service Bus Data Sender" }
principal_id         = { relation = "iam_binding", attr = "principal_id" }

[[providers.azure.blocks]]
key = "receive"
resource = "azurerm_role_assignment"
for_each_relation = "attribute_reference"
for_each_target_type = "event_queue"

[providers.azure.blocks.args]
scope                = { target = "id" }
role_definition_name = { value = "Azure Service Bus Data Receiver" }
principal_id         = { relation = "iam_binding", attr = "principal_id" }

# Injected secrets are read by the execution identity; secrets the code reads itself
# (no secret variables) by the identity it runs as.
[[providers.azure.blocks]]
key = "secret_read"
resource = "azurerm_role_assignment"
for_each_relation = "reads"
for_each_target_type = "secret"

[providers.azure.blocks.args]
scope                = { target = "id" }
role_definition_name = { value = "Key Vault Secrets User" }
principal_id         = { if = { field = "secrets" }, then = { relation = "attribute_reference", target_type = "iam_role", attr = "principal_id", fallback = { relation = "iam_binding", attr = "principal_id" } }, else = { relation = "iam_binding", attr = "principal_id" } }

[[providers.azure.blocks]]
key = "blob_read"
resource = "azurerm_role_assignment"
for_each_relation = "reads"
for_each_target_type = "object_storage"

[providers.azure.blocks.args]
scope                = { target = "id" }
role_definition_name = { value = "Storage Blob Data Reader" }
principal_id         = { relation = "iam_binding", attr = "principal_id" }

[[providers.azure.blocks]]
key = "blob"
resource = "azurerm_role_assignment"
for_each_relation = "attribute_reference"
for_each_target_type = "object_storage"

[providers.azure.blocks.args]
scope                = { target = "id" }
role_definition_name = { value = "Storage Blob Data Contributor" }
principal_id         = { relation = "iam_binding", attr = "principal_id" }

[[providers.azure.blocks]]
key = "acr_pull"
resource = "azurerm_role_assignment"
when = { relation = "attachment", target_type = "container_registry" }

[providers.azure.blocks.args]
scope                = { relation = "attachment", target_type = "container_registry", attr = "id" }
role_definition_name = { value = "AcrPull" }
principal_id         = { relation = "attribute_reference", target_type = "iam_role", attr = "principal_id", fallback = { relation = "iam_binding", attr = "principal_id" } }

# A linked Security Group becomes the NSG of the environment subnet(s).
[[providers.azure.blocks]]
key = "nsg"
resource = "azurerm_subnet_network_security_group_association"
for_each_relation = "network_membership"
when = { all = [ { ancestor = "container_environment", absent = true }, { relation = "attribute_reference", target_type = "security_group" } ] }

[providers.azure.blocks.args]
subnet_id                 = { target = "id" }
network_security_group_id = { relation = "attribute_reference", target_type = "security_group", attr = "id" }

[providers.azure.outputs]
fqdn = { attr = "latest_revision_fqdn", description = "Latest revision FQDN", primary = true }

[[providers.azure.manual_steps]]
title = "Key Vault secrets hold one value each"
when = { field = "secrets" }
body = """
Each secret variable is an app secret referencing a Key Vault secret, read with the
execution identity (or the app's only one). A Key Vault secret is a single value: a row's
**JSON key** — how ECS picks one field of a JSON secret — has no counterpart, so the
variable receives the whole secret. Store one Key Vault secret per value, draw a Secret
for each, and name it in the row's **Secret** column.
"""

[[providers.azure.manual_steps]]
title = "Database access is not a role assignment"
when = { relation = "attribute_reference", target_type = "relational_database", target_field = "iam_authentication", not_equals = "true" }
body = """
No role assignment is generated for the linked database: a flexible server is reached with
a login and password unless directory authentication is on. Inject the connection string
from a Secret, or tick **IAM / directory authentication** on the database and map the
app's identity to a database role (`pgaadauth_create_principal`).
"""

[[providers.azure.manual_steps]]
title = "A blob contributor may also delete"
when = { all = [ { relation = "attribute_reference", target_type = "object_storage" }, { field = "delete_objects", equals = "false" } ] }
body = """
This app is marked as not deleting objects, but Azure has no built-in role between
*Storage Blob Data Reader* and *Storage Blob Data Contributor*: the assignment generated for
an 'Uses' bucket carries `.../blobs/delete`. Accept it, replace it with a custom role, or
link the bucket with 'Reads' when the app only reads it.
"""

# ---------------------------------------------------------------- GCP
[providers.gcp]
status = "full"
file = "container"
notes = "A Cloud Run (v2) service. Public ingress grants allUsers the invoker role; a load balancer in front makes it internal-and-load-balancer only; subnets become direct VPC egress. A background worker keeps its CPU allocated (min = max instances), and still answers Cloud Run's startup probe on its port. 'Public IP for outbound' changes nothing here: Cloud Run reaches the internet without one (with its egress through a linked subnet, that network needs Cloud NAT)."

[[providers.gcp.checks]]
when = { all = [ { field = "background_worker" }, { relation = "attachment", incoming = true, target_type = "load_balancer" } ] }
severity = "error"
message = "\"{name}\" is a background worker, so a load balancer cannot forward to it; clear 'Background worker' or remove the link"

[[providers.gcp.checks]]
when = { field = "cpu_architecture", equals = "arm64" }
message = "\"{name}\" is built for arm64, but Cloud Run runs linux/amd64 only; publish a multi-architecture image"

[[providers.gcp.checks]]
when = { all = [ { field = "health_check_command" }, { field = "health_check_path", absent = true } ] }
message = "\"{name}\" has a health check command, which Cloud Run cannot run (probes are HTTP, TCP or gRPC); set the Health check path for an HTTP liveness probe"

[[providers.gcp.checks]]
when = { field = "stop_timeout" }
message = "\"{name}\" asks for a stop timeout, but Cloud Run gives a container a fixed 10 seconds after SIGTERM; make shutdown fit in that"

[[providers.gcp.checks]]
for_each_field = "secrets"
when = { all = [ { item = "secret", absent = true }, { relation = "reads", target_type = "secret", absent = true } ] }
severity = "error"
message = "\"{name}\": secret variable {item.name} has no Secret to read; link one with 'Reads secrets'"

[[providers.gcp.checks]]
for_each_field = "secrets"
when = { all = [ { item = "secret" }, { item = "secret", linked = "reads", absent = true } ] }
severity = "error"
message = "\"{name}\": secret variable {item.name} names a Secret the app is not linked to; link it with 'Reads secrets' so the app may read it"

[[providers.gcp.blocks]]
key = "main"
resource = "google_cloud_run_v2_service"

[providers.gcp.blocks.args]
name                = { field = "name", transform = "kebab" }
location            = { var = "region" }
ingress             = { if = { all = [ { field = "public" }, { field = "background_worker", not_equals = "true" } ] }, then = { value = "INGRESS_TRAFFIC_ALL" }, else = { if = { relation = "attachment", incoming = true, target_type = "load_balancer" }, then = { value = "INGRESS_TRAFFIC_INTERNAL_LOAD_BALANCER" }, else = { value = "INGRESS_TRAFFIC_INTERNAL_ONLY" } } }
deletion_protection = { value = false }
# A revision fails to start if its service account cannot read a secret it injects.
depends_on          = { if = { field = "secrets" }, then = { self_block = "secret_read", attr = "", wrap = "list" } }

[[providers.gcp.blocks.nested]]
block = "template"

# Google Cloud has one identity per service; the task role is it.
[providers.gcp.blocks.nested.args]
service_account = { relation = "iam_binding", attr = "email", fallback = { relation = "attribute_reference", target_type = "iam_role", attr = "email" } }

[[providers.gcp.blocks.nested.nested]]
block = "scaling"

[providers.gcp.blocks.nested.nested.args]
min_instance_count = { field = "replicas" }
max_instance_count = { field = "replicas" }

[[providers.gcp.blocks.nested.nested]]
block = "containers"

[providers.gcp.blocks.nested.nested.args]
image = { if = { relation = "attachment", target_type = "container_registry" }, then = { func = "format", args = [ { value = "%s/%s:%s" }, { relation = "attachment", target_type = "container_registry", connection = "REGISTRY" }, { field = "repository", transform = "kebab", fallback = { if = { relation = "attachment", target_type = "container_registry", target_field = "repositories" }, then = { func = "element", args = [ { relation = "attachment", target_type = "container_registry", field = "repositories", transform = "kebab" }, { value = 0 } ] }, else = { relation = "attachment", target_type = "container_registry", field = "name", transform = "kebab" } } }, { field = "image_tag", fallback = { entity_var = "image_tag", description = "Image tag the container app \"{name}\" runs (the tag your pipeline pushed)." } } ] }, else = { field = "image" } }

[[providers.gcp.blocks.nested.nested.nested]]
block = "ports"

[providers.gcp.blocks.nested.nested.nested.args]
container_port = { field = "port", fallback = { value = 80 } }

# A background worker serves no requests, so its CPU must not be throttled between them.
[[providers.gcp.blocks.nested.nested.nested]]
block = "resources"

[providers.gcp.blocks.nested.nested.nested.args]
limits   = { object = { cpu = { map = "size", table = { small = "1", medium = "1", large = "2", xlarge = "4" } }, memory = { map = "size", table = { small = "512Mi", medium = "1Gi", large = "2Gi", xlarge = "4Gi" } } } }
cpu_idle = { if = { field = "background_worker" }, then = { value = false } }

[[providers.gcp.blocks.nested.nested.nested]]
block = "env"
for_each_field = "env"

[providers.gcp.blocks.nested.nested.nested.args]
name  = { item = "name" }
value = { item = "value" }

[[providers.gcp.blocks.nested.nested.nested]]
block = "env"
for_each_field = "secrets"

[providers.gcp.blocks.nested.nested.nested.args]
name = { item = "name" }

[[providers.gcp.blocks.nested.nested.nested.nested]]
block = "value_source"

[[providers.gcp.blocks.nested.nested.nested.nested.nested]]
block = "secret_key_ref"

[providers.gcp.blocks.nested.nested.nested.nested.nested.args]
secret  = { if = { item = "secret" }, then = { item_ref = "secret", attr = "id" }, else = { relation = "reads", target_type = "secret", attr = "id" } }
version = { value = "latest" }

[[providers.gcp.blocks.nested.nested.nested]]
block = "env"
when = { relation = "sends_to", target_type = "event_queue" }

[providers.gcp.blocks.nested.nested.nested.args]
name  = { value = "QUEUE_TOPIC" }
value = { relation = "sends_to", target_type = "event_queue", attr = "id" }

[[providers.gcp.blocks.nested.nested.nested]]
block = "env"
when = { relation = "sends_to", target_type = "topic" }

[providers.gcp.blocks.nested.nested.nested.args]
name  = { value = "TOPIC" }
value = { relation = "sends_to", target_type = "topic", attr = "id" }

[[providers.gcp.blocks.nested.nested.nested]]
block = "env"
when = { relation = "attribute_reference", target_type = "relational_database" }

[providers.gcp.blocks.nested.nested.nested.args]
name  = { value = "DB_HOST" }
value = { relation = "attribute_reference", target_type = "relational_database", connection = "HOST" }

[[providers.gcp.blocks.nested.nested.nested]]
block = "env"
when = { relation = "attribute_reference", target_type = "relational_database" }

[providers.gcp.blocks.nested.nested.nested.args]
name  = { value = "DB_PORT" }
value = { func = "tostring", args = [ { relation = "attribute_reference", target_type = "relational_database", connection = "PORT" } ] }

[[providers.gcp.blocks.nested.nested.nested]]
block = "env"
when = { relation = "attribute_reference", target_type = "relational_database" }

[providers.gcp.blocks.nested.nested.nested.args]
name  = { value = "DB_NAME" }
value = { relation = "attribute_reference", target_type = "relational_database", connection = "NAME" }

[[providers.gcp.blocks.nested.nested.nested]]
block = "env"
when = { relation = "attribute_reference", target_type = "cache" }

[providers.gcp.blocks.nested.nested.nested.args]
name  = { value = "CACHE_HOST" }
value = { relation = "attribute_reference", target_type = "cache", connection = "HOST" }

[[providers.gcp.blocks.nested.nested.nested]]
block = "env"
when = { relation = "attribute_reference", target_type = "cache" }

[providers.gcp.blocks.nested.nested.nested.args]
name  = { value = "CACHE_PORT" }
value = { func = "tostring", args = [ { relation = "attribute_reference", target_type = "cache", connection = "PORT" } ] }

[[providers.gcp.blocks.nested.nested.nested]]
block = "liveness_probe"
when = { field = "health_check_path" }

[providers.gcp.blocks.nested.nested.nested.args]
period_seconds        = { field = "health_check_interval", optional = true }
timeout_seconds       = { field = "health_check_timeout", optional = true }
failure_threshold     = { field = "health_check_retries", optional = true }
initial_delay_seconds = { field = "health_check_start_period", optional = true }

[[providers.gcp.blocks.nested.nested.nested.nested]]
block = "http_get"

[providers.gcp.blocks.nested.nested.nested.nested.args]
path = { field = "health_check_path" }
port = { field = "port", fallback = { value = 80 } }

[[providers.gcp.blocks.nested.nested]]
block = "vpc_access"
when = { relation = "network_membership" }

[providers.gcp.blocks.nested.nested.args]
egress = { value = "ALL_TRAFFIC" }

[[providers.gcp.blocks.nested.nested.nested]]
block = "network_interfaces"

[providers.gcp.blocks.nested.nested.nested.args]
subnetwork = { relation = "network_membership", attr = "id" }
tags       = { relation = "attribute_reference", target_type = "security_group", block = "tag", attr = "output", wrap = "list", optional = true }

[[providers.gcp.blocks]]
key = "invoker"
resource = "google_cloud_run_v2_service_iam_member"
when = { all = [ { field = "public" }, { field = "background_worker", not_equals = "true" } ] }

[providers.gcp.blocks.args]
name     = { self_block = "main", attr = "name" }
location = { var = "region" }
role     = { value = "roles/run.invoker" }
member   = { value = "allUsers" }

# Least-privilege IAM members for the service account, one per linked resource.
[[providers.gcp.blocks]]
key = "publish"
resource = "google_pubsub_topic_iam_member"
for_each_relation = "sends_to"

[providers.gcp.blocks.args]
topic  = { target = "id" }
role   = { value = "roles/pubsub.publisher" }
member = { relation = "iam_binding", attr = "member" }

[[providers.gcp.blocks]]
key = "consume"
resource = "google_pubsub_subscription_iam_member"
for_each_relation = "attribute_reference"
for_each_target_type = "event_queue"

[providers.gcp.blocks.args]
subscription = { target = "id", block = "sub" }
role         = { value = "roles/pubsub.subscriber" }
member       = { relation = "iam_binding", attr = "member" }

# Cloud Run reads injected secrets with the service's own account, so the secrets the
# app injects and the ones its code reads are granted the same way.
[[providers.gcp.blocks]]
key = "secret_read"
resource = "google_secret_manager_secret_iam_member"
for_each_relation = "reads"
for_each_target_type = "secret"

[providers.gcp.blocks.args]
secret_id = { target = "id" }
role      = { value = "roles/secretmanager.secretAccessor" }
member    = { relation = "iam_binding", attr = "member" }

[[providers.gcp.blocks]]
key = "bucket_read"
resource = "google_storage_bucket_iam_member"
for_each_relation = "reads"
for_each_target_type = "object_storage"

[providers.gcp.blocks.args]
bucket = { target = "name" }
role   = { value = "roles/storage.objectViewer" }
member = { relation = "iam_binding", attr = "member" }

[[providers.gcp.blocks]]
key = "bucket_rw"
resource = "google_storage_bucket_iam_member"
for_each_relation = "attribute_reference"
for_each_target_type = "object_storage"

[providers.gcp.blocks.args]
bucket = { target = "name" }
role   = { if = { field = "delete_objects" }, then = { value = "roles/storage.objectAdmin" }, else = { value = "roles/storage.objectCreator" } }
member = { relation = "iam_binding", attr = "member" }

[[providers.gcp.blocks]]
key = "bucket_rw_read"
resource = "google_storage_bucket_iam_member"
for_each_relation = "attribute_reference"
for_each_target_type = "object_storage"
when = { field = "delete_objects", not_equals = "true" }

[providers.gcp.blocks.args]
bucket = { target = "name" }
role   = { value = "roles/storage.objectViewer" }
member = { relation = "iam_binding", attr = "member" }

[providers.gcp.outputs]
uri = { attr = "uri", description = "Service URL", primary = true }

[[providers.gcp.manual_steps]]
title = "Secret Manager secrets hold one value each"
when = { field = "secrets" }
body = """
Each secret variable reads the latest version of a Secret Manager secret with the
service's own account. A secret is a single value: a row's **JSON key** — how ECS picks
one field of a JSON secret — has no counterpart, so the variable receives the whole
secret. Store one secret per value, draw a Secret for each, and name it in the row's
**Secret** column.
"""

[[providers.gcp.manual_steps]]
title = "Database access is not an IAM grant"
when = { relation = "attribute_reference", target_type = "relational_database" }
body = """
No IAM member is generated for the linked database. Cloud SQL accepts the service account
through the Cloud SQL Auth Proxy (or the Cloud SQL connection Cloud Run mounts) with
`roles/cloudsql.client`, or a password — inject the connection string from a Secret.
"""
