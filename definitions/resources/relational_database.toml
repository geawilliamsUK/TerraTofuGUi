# Abstract type: Relational Database  (schema_version 2)
#
# A managed PostgreSQL or MySQL server with one database.
# AWS: aws_db_subnet_group (link two subnets in different AZs) + aws_db_instance in a
#      linked Security Group, plus an aws_db_parameter_group when parameters are set. The
#      password comes from a linked Secret ('Password from'), the `db_password` input
#      variable, or RDS itself (Master password 'managed': no password argument at all).
# Azure: azurerm_postgresql_flexible_server / azurerm_mysql_flexible_server chosen by the
#      `engine` field. With a linked subnet the server is VNet-integrated (delegated
#      subnet + private DNS zone + zone link, public access off); without one it is
#      public with no firewall rules, which is reported as a manual step.

schema_version = 2

[resource]
type = "relational_database"
category = "database"
display_name = "Relational Database"
description = "A managed PostgreSQL or MySQL server. Link two subnets, a Security Group and optionally a Secret that holds its password."
kind = "node"
allowed_parents = ["virtual_network", "resource_group", "subnet"]
icon = "DB"
env_prefix = "DB"

[[fields]]
name = "engine"
label = "Engine"
type = "enum"
required = true
options = ["postgres", "mysql"]
default = "postgres"

[[fields]]
name = "size"
label = "Size class"
type = "enum"
required = true
options = ["small", "medium", "large"]
default = "small"
description = "Picks the instance class / SKU / tier from a table per provider. Ignored where the provider's own override is set: the AWS instance class, the Azure SKU or the Google Cloud tier."

[[fields]]
name = "storage"
label = "Storage (GB)"
type = "int"
required = true
default = 32
description = "Allocated storage in GB. Minimums: AWS 20 GB of gp2 / gp3 (100 GB of io1 / io2), Azure MySQL 20 GB, Cloud SQL 10 GB. An Azure PostgreSQL flexible server only comes in 32, 64, 128, 256 and 512 GB and 1-32 TB, so other figures are rounded up to the next of those."

[[fields]]
name = "max_storage_gb"
label = "Grow storage up to (GB)"
type = "int"
default = 0
description = "Let the server add storage by itself as it fills, up to this many GB: RDS storage autoscaling (`max_allocated_storage`), Cloud SQL automatic storage increase with a limit, Azure auto-grow (which has no upper limit). 0 keeps the size fixed; Cloud SQL and Azure MySQL grow by default, and 0 turns that off."

[[fields]]
name = "database_name"
label = "Database name"
type = "string"
required = true
default = "app"
pattern = "^[A-Za-z][A-Za-z0-9_]{0,62}$"
pattern_hint = "letters, digits and underscores, starting with a letter"

[[fields]]
name = "admin_username"
label = "Admin username"
type = "string"
required = true
default = "dbadmin"
pattern = "^[a-z][a-z0-9_]{1,15}$"
pattern_hint = "lowercase, 2-16 chars, starting with a letter"

[[fields]]
name = "high_availability"
label = "High availability"
type = "bool"
default = false
description = "Run a standby in a second zone and fail over to it (Multi-AZ / zone-redundant / regional)."

[[fields]]
name = "backup_retention_days"
label = "Backup retention (days)"
type = "int"
default = 7
description = "How long automated backups are kept. 0 turns automated backups off, which no production database should do."

[[fields]]
name = "deletion_protection"
label = "Deletion protection"
type = "bool"
default = false
description = "Refuse to delete the server until the flag is cleared. Turn it on for anything holding real data; a `destroy` then fails until you clear it and apply again."

[[fields]]
name = "final_snapshot"
label = "Take a final snapshot on destroy"
type = "bool"
default = true
description = "Keep a snapshot when the server is destroyed, named after it with a suffix drawn when the server is created (AWS), so destroying a recreated server does not collide with the last snapshot. Turning this off means a destroy takes the data with it; a disposable project (Settings) never takes one."

[[fields]]
name = "iam_authentication"
label = "IAM / directory authentication"
type = "bool"
default = false
description = "Let a cloud identity connect without a password: RDS IAM database authentication, Microsoft Entra on a PostgreSQL flexible server, Cloud SQL IAM authentication. A workload linked with 'Uses' then gets a connect grant instead of a password. The database user still has to be created inside the server and mapped to the identity."

[[fields]]
name = "parameters"
label = "Server parameters"
type = "struct_list"
description = "Engine settings for the server, e.g. `log_min_duration_statement` = `1000`. AWS puts them in a parameter group of the engine's family, Azure sets each as a server configuration, Google Cloud as a database flag. The names are each cloud's own: `rds.force_ssl` is AWS only, Azure PostgreSQL calls it `require_secure_transport`, and Cloud SQL enforces TLS through its SSL mode rather than a flag."

[[fields.items]]
name = "name"
label = "Parameter"
type = "string"
required = true

[[fields.items]]
name = "value"
label = "Value"
type = "string"
required = true

[[fields.items]]
name = "after_reboot"
label = "Static (after reboot)"
type = "bool"
default = false
description = "AWS: a static parameter such as `shared_preload_libraries` only takes effect at the next reboot, and RDS refuses to apply it immediately; tick it so the parameter group applies it at the next reboot (`pending-reboot`)."

[[relations]]
kind = "encrypted_with"
label = "Encrypted with"
providers = ["aws", "gcp"]
targets = ["encryption_key"]
cardinality = "optional"

[[relations]]
kind = "network_membership"
label = "Subnets"
targets = ["subnet"]
cardinality = "many"
min_targets = 2
via_parent = true

[[relations]]
kind = "attribute_reference"
label = "Uses security group"
providers = ["aws", "azure"]
targets = ["security_group"]
cardinality = "optional"

[[relations]]
kind = "reads"
label = "Password from secret"
targets = ["secret"]
cardinality = "optional"

# ---------------------------------------------------------------- AWS
[providers.aws]
status = "full"

[[providers.aws.checks]]
when = { relation = "network_membership", absent = true }
severity = "error"
message = "\"{name}\" needs subnets linked: RDS requires a subnet group with two subnets in different availability zones"

[[providers.aws.checks]]
when = { relation = "attribute_reference", target_type = "security_group", absent = true }
message = "\"{name}\" has no security group; it will use the VPC default group"

[[providers.aws.checks]]
when = { all = [ { field = "size", equals = "small" }, { provider_field = "performance_insights" }, { provider_field = "instance_class", absent = true } ] }
message = "\"{name}\" enables Performance Insights on the 'small' class (db.t3.micro), which does not support it; choose a larger size or an instance class override"

[[providers.aws.checks]]
when = { all = [ { provider_field = "instance_class", ends_with = ".micro" }, { provider_field = "performance_insights" } ] }
message = "\"{name}\" enables Performance Insights on a .micro instance class override, which does not support it; choose a larger instance class"

[[providers.aws.checks]]
when = { all = [ { setting = "disposable" }, { field = "deletion_protection" } ] }
message = "\"{name}\" has deletion protection on in a disposable project: `destroy` fails until it is cleared and applied"

[[providers.aws.checks]]
when = { field = "backup_retention_days", equals = "0" }
message = "\"{name}\" has automated backups turned off (retention 0): a deleted or corrupted database cannot be restored"

[[providers.aws.checks]]
severity = "error"
when = { all = [ { provider_field = "storage_type", one_of = ["gp2", "gp3"] }, { field = "storage", less_than = 20 } ] }
message = "\"{name}\" asks for less than 20 GB of storage, the smallest gp2 / gp3 volume RDS creates"

[[providers.aws.checks]]
severity = "error"
when = { all = [ { provider_field = "storage_type", one_of = ["io1", "io2"] }, { field = "storage", less_than = 100 } ] }
message = "\"{name}\" asks for less than 100 GB of provisioned-IOPS storage, the smallest io1 / io2 volume RDS creates"

[[providers.aws.checks]]
severity = "error"
when = { all = [ { field = "max_storage_gb" }, { field = "max_storage_gb", at_most = { field = "storage" } } ] }
message = "\"{name}\": 'Grow storage up to' must be larger than the storage it starts with (or 0 to keep the size fixed)"

[[providers.aws.checks]]
severity = "error"
when = { all = [ { provider_field = "master_password", equals = "secret" }, { relation = "reads", absent = true } ] }
message = "\"{name}\" takes its master password from a Secret, but no Secret is linked with 'Password from secret'"

[[providers.aws.checks]]
when = { all = [ { relation = "reads" }, { any = [ { provider_field = "master_password", equals = "managed" }, { provider_field = "master_password", equals = "variable" } ] } ] }
message = "\"{name}\" is linked to a Secret with 'Password from secret', which its Master password setting does not use"

[[providers.aws.checks]]
severity = "error"
when = { all = [ { relation = "reads", target_field = "value_outside", equals = "true" }, { any = [ { provider_field = "master_password", equals = "secret" }, { provider_field = "master_password", absent = true } ] } ] }
message = "\"{name}\" takes its password from a Secret whose value is managed outside OpenTofu, so there is no value to give RDS; choose the RDS-managed master password, or let OpenTofu hold the secret's value"

[[providers.aws.fields]]
name = "engine_version"
label = "Engine version"
type = "string"
description = "Major version to pin, e.g. `16` for PostgreSQL or `8.0` for MySQL. Defaults to the engine's current major."

[[providers.aws.fields]]
name = "instance_class"
label = "Instance class override"
type = "string"
pattern = "^db\\.[a-z0-9]+\\.[a-z0-9]+$"
pattern_hint = "an RDS instance class such as db.m6g.large"
description = "Overrides the class the size table picks."

[[providers.aws.fields]]
name = "performance_insights"
label = "Performance Insights"
type = "bool"
default = false
description = "Collect query-level performance data (not available on the db.t3.micro that 'small' selects)."

[[providers.aws.fields]]
name = "master_password"
label = "Master password"
type = "enum"
options = ["managed", "secret", "variable"]
description = "Where the admin password comes from. 'managed': RDS generates it and keeps it in a Secrets Manager secret of its own (`manage_master_user_password`), so it never reaches the OpenTofu state; workloads read that secret through the `master_user_secret_arn` output or the MASTER_SECRET_ARN connection value, and a linked Encryption Key encrypts it. 'secret': the Secret linked with 'Password from secret'. 'variable': the `db_password` input variable. Unset: the linked Secret when there is one, the variable otherwise. Azure and Google Cloud have no service-managed admin password; their nearest equivalent is IAM / directory authentication."

[[providers.aws.fields]]
name = "storage_type"
label = "Storage type"
type = "enum"
options = ["gp3", "gp2", "io1", "io2"]
default = "gp3"
description = "EBS volume type. gp3 gives a 3,000 IOPS baseline at any size for less than gp2, whose IOPS grow with the size (a small gp2 volume is slow); io1 / io2 need provisioned IOPS."

[[providers.aws.checks]]
when = { any = [ { provider_field = "storage_type", equals = "io1" }, { provider_field = "storage_type", equals = "io2" } ] }
message = "\"{name}\" uses provisioned-IOPS storage, which RDS will not create without an IOPS figure: add an `iops` extra argument (1000 or more), or choose gp3"

[[providers.aws.variables]]
name = "db_password"
type = "string"
description = "Administrator password for database servers that are not linked to a Secret."
sensitive = true

[[providers.aws.blocks]]
key = "subnets"
resource = "aws_db_subnet_group"

[providers.aws.blocks.args]
name       = { template = "{name}-subnets", transform = "kebab" }
subnet_ids = { relation = "network_membership", attr = "id", wrap = "list" }
tags       = { object = { Name = { field = "name" } } }

# Server parameters: a parameter group of the engine's family (`postgres16`, `mysql8.0`),
# taken from the pinned engine version when there is one.
[[providers.aws.blocks]]
key = "params"
resource = "aws_db_parameter_group"
when = { field = "parameters" }

[providers.aws.blocks.args]
name   = { template = "{name}-params", transform = "kebab" }
family = { if = { provider_field = "engine_version", absent = true }, then = { map = "engine", table = { postgres = "postgres16", mysql = "mysql8.0" } }, else = { if = { field = "engine", equals = "postgres" }, then = { raw = "format(\"postgres%s\", split(\".\", @version@)[0])", refs = { version = { provider_field = "engine_version" } } }, else = { raw = "format(\"mysql%s\", join(\".\", slice(split(\".\", @version@), 0, 2)))", refs = { version = { provider_field = "engine_version" } } } } }
tags   = { object = { Name = { field = "name" } } }

[[providers.aws.blocks.nested]]
block = "parameter"
for_each_field = "parameters"

[providers.aws.blocks.nested.args]
name         = { item = "name" }
value        = { item = "value" }
apply_method = { if = { item = "after_reboot" }, then = { value = "pending-reboot" }, else = { value = "immediate" } }

# A suffix for the final snapshot's name, drawn when the server is created and kept for
# its lifetime: destroyed with it, drawn afresh by the next create, so every destroy
# leaves a snapshot of its own name. `keepers` draws a new one when the server is renamed.
[[providers.aws.blocks]]
key = "final_id"
resource = "random_id"
when = { all = [ { field = "final_snapshot" }, { setting = "disposable", equals = "false" } ] }

[providers.aws.blocks.args]
byte_length = { value = 4 }
keepers     = { object = { identifier = { field = "name", transform = "kebab" } } }

[[providers.aws.blocks]]
key = "main"
resource = "aws_db_instance"

[providers.aws.blocks.args]
identifier                   = { field = "name", transform = "kebab" }
engine                       = { map = "engine", table = { postgres = "postgres", mysql = "mysql" } }
engine_version               = { provider_field = "engine_version", fallback = { map = "engine", table = { postgres = "16", mysql = "8.0" } } }
instance_class               = { provider_field = "instance_class", fallback = { map = "size", table = { small = "db.t3.micro", medium = "db.t3.medium", large = "db.m5.large" } } }
allocated_storage            = { field = "storage" }
max_allocated_storage        = { if = { field = "max_storage_gb" }, then = { field = "max_storage_gb" } }
storage_type                 = { provider_field = "storage_type", fallback = { value = "gp3" } }
db_name                      = { field = "database_name" }
username                     = { field = "admin_username" }
# The password: the variable, the linked Secret, or none at all when RDS manages it.
password                     = { if = { any = [ { provider_field = "master_password", equals = "variable" }, { all = [ { provider_field = "master_password", absent = true }, { relation = "reads", absent = true } ] } ] }, then = { var = "db_password" }, else = { if = { provider_field = "master_password", not_equals = "managed" }, then = { relation = "reads", block = "version", attr = "secret_string" } } }
manage_master_user_password  = { if = { provider_field = "master_password", equals = "managed" }, then = { value = true } }
master_user_secret_kms_key_id = { if = { provider_field = "master_password", equals = "managed" }, then = { relation = "encrypted_with", attr = "arn", optional = true } }
parameter_group_name         = { self_block = "params", attr = "name" }
db_subnet_group_name         = { self_block = "subnets", attr = "name" }
vpc_security_group_ids       = { relation = "attribute_reference", target_type = "security_group", attr = "id", wrap = "list", optional = true }
publicly_accessible          = { value = false }
multi_az                     = { if = { field = "high_availability" }, then = { value = true }, else = { value = false } }
backup_retention_period      = { field = "backup_retention_days", fallback = { value = 7 } }
deletion_protection          = { if = { field = "deletion_protection" }, then = { value = true }, else = { value = false } }
# The final snapshot is named per creation (`<name>-final-<random suffix>`): a fixed name
# would make the second destroy fail because the first one's snapshot still exists. A
# disposable project takes none at all.
skip_final_snapshot          = { if = { all = [ { field = "final_snapshot" }, { setting = "disposable", equals = "false" } ] }, then = { value = false }, else = { value = true } }
final_snapshot_identifier    = { if = { all = [ { field = "final_snapshot" }, { setting = "disposable", equals = "false" } ] }, then = { func = "format", args = [ { value = "%s-final-%s" }, { field = "name", transform = "kebab" }, { self_block = "final_id", attr = "hex" } ] } }
performance_insights_enabled = { if = { provider_field = "performance_insights" }, then = { value = true }, else = { value = false } }
storage_encrypted            = { value = true }
# With this on, a pod or function holding `rds-db:connect` on the instance's resource id
# authenticates with a token instead of a password; the password above stays as the
# fallback for the admin user, which IAM authentication does not replace.
iam_database_authentication_enabled = { if = { field = "iam_authentication" }, then = { value = true }, else = { value = false } }
kms_key_id                   = { relation = "encrypted_with", attr = "arn", optional = true }
tags                         = { object = { Name = { field = "name" } } }

[providers.aws.connection]
HOST = { self_block = "main", attr = "address" }
PORT = { self_block = "main", attr = "port" }
NAME = { field = "database_name" }
# The secret RDS keeps the managed master password in (JSON with username and password).
MASTER_SECRET_ARN = { if = { provider_field = "master_password", equals = "managed" }, then = { self_block = "main", attr = "master_user_secret.0.secret_arn" } }

[providers.aws.outputs]
endpoint = { attr = "endpoint", description = "Connection endpoint (host:port)" }
address  = { attr = "address", description = "Host name" }
master_user_secret_arn = { attr = "master_user_secret.0.secret_arn", description = "ARN of the Secrets Manager secret RDS keeps the master password in", when = { provider_field = "master_password", equals = "managed" } }

# What the server can reach (MAPPING_FORMAT.md §2.9): the connections alarms are checked
# against. RDS sets `max_connections` from DBInstanceClassMemory, the memory the class
# leaves the engine once RDS has taken its share: PostgreSQL LEAST(memory / 9531392, 5000),
# MySQL memory / 12582880. That memory, by the class's nominal size:
#   1 GiB (t3/t4g.micro) ~792 MiB    2 GiB (small) ~1800 MiB    4 GiB (medium) ~3757 MiB
#   8 GiB (t.large, m.large) ~7782 MiB    16 GiB (t.xlarge, m.xlarge, r.large) ~15650 MiB
#   32 GiB ~31600 MiB    64 GiB ~63700 MiB
# which gives the figures below (RDS's defaults: 87 on a micro, 856 on an m5.large). A
# class the table does not list, or a `max_connections` server parameter of its own, has
# no known limit, and nothing is checked against it.
[providers.aws.limits]
max_connections = { if = { not = { field = "parameters", has_row = { name = "max_connections", value = "*" } } }, then = { if = { field = "engine", equals = "mysql" }, then = { if = { provider_field = "instance_class", absent = true }, then = { map = "size", table = { small = 66, medium = 313, large = 648 } }, else = { map = "instance_class", optional = true, table = { "db.t3.micro" = 66, "db.t4g.micro" = 66, "db.t3.small" = 150, "db.t4g.small" = 150, "db.t3.medium" = 313, "db.t4g.medium" = 313, "db.t3.large" = 648, "db.t4g.large" = 648, "db.t3.xlarge" = 1304, "db.t4g.xlarge" = 1304, "db.t3.2xlarge" = 2633, "db.t4g.2xlarge" = 2633, "db.m5.large" = 648, "db.m6g.large" = 648, "db.m6i.large" = 648, "db.m7g.large" = 648, "db.m5.xlarge" = 1304, "db.m6g.xlarge" = 1304, "db.m6i.xlarge" = 1304, "db.m7g.xlarge" = 1304, "db.m5.2xlarge" = 2633, "db.m6g.2xlarge" = 2633, "db.m6i.2xlarge" = 2633, "db.m7g.2xlarge" = 2633, "db.m5.4xlarge" = 5308, "db.m6g.4xlarge" = 5308, "db.m6i.4xlarge" = 5308, "db.m7g.4xlarge" = 5308, "db.r5.large" = 1304, "db.r6g.large" = 1304, "db.r6i.large" = 1304, "db.r7g.large" = 1304, "db.r5.xlarge" = 2633, "db.r6g.xlarge" = 2633, "db.r6i.xlarge" = 2633, "db.r7g.xlarge" = 2633, "db.r5.2xlarge" = 5308, "db.r6g.2xlarge" = 5308, "db.r6i.2xlarge" = 5308, "db.r7g.2xlarge" = 5308 } } }, else = { if = { provider_field = "instance_class", absent = true }, then = { map = "size", table = { small = 87, medium = 413, large = 856 } }, else = { map = "instance_class", optional = true, table = { "db.t3.micro" = 87, "db.t4g.micro" = 87, "db.t3.small" = 198, "db.t4g.small" = 198, "db.t3.medium" = 413, "db.t4g.medium" = 413, "db.t3.large" = 856, "db.t4g.large" = 856, "db.t3.xlarge" = 1721, "db.t4g.xlarge" = 1721, "db.t3.2xlarge" = 3476, "db.t4g.2xlarge" = 3476, "db.m5.large" = 856, "db.m6g.large" = 856, "db.m6i.large" = 856, "db.m7g.large" = 856, "db.m5.xlarge" = 1721, "db.m6g.xlarge" = 1721, "db.m6i.xlarge" = 1721, "db.m7g.xlarge" = 1721, "db.m5.2xlarge" = 3476, "db.m6g.2xlarge" = 3476, "db.m6i.2xlarge" = 3476, "db.m7g.2xlarge" = 3476, "db.m5.4xlarge" = 5000, "db.m6g.4xlarge" = 5000, "db.m6i.4xlarge" = 5000, "db.m7g.4xlarge" = 5000, "db.r5.large" = 1721, "db.r6g.large" = 1721, "db.r6i.large" = 1721, "db.r7g.large" = 1721, "db.r5.xlarge" = 3476, "db.r6g.xlarge" = 3476, "db.r6i.xlarge" = 3476, "db.r7g.xlarge" = 3476, "db.r5.2xlarge" = 5000, "db.r6g.2xlarge" = 5000, "db.r6i.2xlarge" = 5000, "db.r7g.2xlarge" = 5000 } } } } }

# ---------------------------------------------------------------- Azure
[providers.azure]
status = "partial"

[[providers.azure.fields]]
name = "server_name"
label = "Server name"
type = "string"
required = true
pattern = "^[a-z0-9][a-z0-9-]{1,61}[a-z0-9]$"
pattern_hint = "3-63 lowercase letters, digits and hyphens; globally unique"
unique_scope = "database_server"

[[providers.azure.fields]]
name = "engine_version"
label = "Engine version"
type = "string"
description = "Flexible server version, e.g. `16` for PostgreSQL or `8.0.21` for MySQL. Defaults to the engine's current major."

[[providers.azure.fields]]
name = "sku_name"
label = "SKU override"
type = "string"
description = "Overrides the SKU the size table picks, e.g. `GP_Standard_D2s_v3`. Zone-redundant high availability needs a General Purpose or Memory Optimized SKU."

[[providers.azure.fields]]
name = "public_access_cidr"
label = "Allow public access from (CIDR)"
type = "cidr"
description = "Only used when no subnet is linked: an IPv4 range allowed through the server firewall (e.g. an office range). Empty means no client can connect."

[[providers.azure.variables]]
name = "db_password"
type = "string"
description = "Administrator password for database servers that are not linked to a Secret."
sensitive = true

# The Entra tenant the directory administrator lives in, read rather than configured.
[[providers.azure.data]]
key = "entra"
resource = "azurerm_client_config"
when = { all = [ { field = "engine", equals = "postgres" }, { field = "iam_authentication" } ] }

# Private DNS zone + VNet link, only when the server is VNet-integrated.
[[providers.azure.blocks]]
key = "dns"
resource = "azurerm_private_dns_zone"
when = { relation = "network_membership" }

[providers.azure.blocks.args]
name                = { if = { field = "engine", equals = "postgres" }, then = { template = "{provider.server_name}.private.postgres.database.azure.com" }, else = { template = "{provider.server_name}.private.mysql.database.azure.com" } }
resource_group_name = { ancestor = "resource_group", attr = "name" }

[[providers.azure.blocks]]
key = "dns_link"
resource = "azurerm_private_dns_zone_virtual_network_link"
when = { relation = "network_membership" }

[providers.azure.blocks.args]
name                  = { template = "{name}-dns-link", transform = "kebab" }
resource_group_name   = { ancestor = "resource_group", attr = "name" }
private_dns_zone_name = { self_block = "dns", attr = "name" }
virtual_network_id    = { ancestor = "virtual_network", attr = "id" }

# A linked Security Group becomes the NSG of the delegated subnet(s).
[[providers.azure.blocks]]
key = "nsg"
resource = "azurerm_subnet_network_security_group_association"
for_each_relation = "network_membership"
when = { relation = "attribute_reference", target_type = "security_group" }

[providers.azure.blocks.args]
subnet_id                 = { target = "id" }
network_security_group_id = { relation = "attribute_reference", target_type = "security_group", attr = "id" }

[[providers.azure.blocks]]
key = "pg"
resource = "azurerm_postgresql_flexible_server"
when = { field = "engine", equals = "postgres" }

[providers.azure.blocks.args]
name                          = { provider_field = "server_name" }
resource_group_name           = { ancestor = "resource_group", attr = "name" }
location                      = { var = "location" }
version                       = { provider_field = "engine_version", fallback = { value = "16" } }
administrator_login           = { field = "admin_username" }
administrator_password        = { if = { relation = "reads" }, then = { relation = "reads", attr = "value" }, else = { var = "db_password" } }
sku_name                      = { provider_field = "sku_name", fallback = { map = "size", table = { small = "B_Standard_B1ms", medium = "GP_Standard_D2s_v3", large = "GP_Standard_D4s_v3" } } }
# A flexible server only comes in fixed sizes; anything else is rounded up to the next.
storage_mb                    = { if = { field = "storage", one_of = ["32", "64", "128", "256", "512", "1024", "2048", "4096", "8192", "16384", "32767"] }, then = { map = "storage", table = { "32" = 32768, "64" = 65536, "128" = 131072, "256" = 262144, "512" = 524288, "1024" = 1048576, "2048" = 2097152, "4096" = 4194304, "8192" = 8388608, "16384" = 16777216, "32767" = 33553408 } }, else = { raw = "[for mb in [32768, 65536, 131072, 262144, 524288, 1048576, 2097152, 4194304, 8388608, 16777216, 33553408] : mb if mb >= @gb@ * 1024][0]", refs = { gb = { field = "storage" } } } }
auto_grow_enabled             = { if = { field = "max_storage_gb" }, then = { value = true } }
backup_retention_days         = { field = "backup_retention_days", fallback = { value = 7 } }
delegated_subnet_id           = { relation = "network_membership", attr = "id", optional = true }
private_dns_zone_id           = { self_block = "dns", attr = "id" }
public_network_access_enabled = { if = { relation = "network_membership" }, then = { value = false }, else = { value = true } }
depends_on                    = { list = [ { self_block = "dns_link", attr = "" } ] }

# Microsoft Entra authentication alongside the password login, so a workload's managed
# identity can connect once it has been added as a database role (see the manual step).
[[providers.azure.blocks.nested]]
block = "authentication"
when = { field = "iam_authentication" }

[providers.azure.blocks.nested.args]
active_directory_auth_enabled = { value = true }
password_auth_enabled         = { value = true }
tenant_id                     = { self_data = "entra", attr = "tenant_id" }

[[providers.azure.blocks.nested]]
block = "high_availability"
when = { field = "high_availability" }

[providers.azure.blocks.nested.args]
mode = { value = "ZoneRedundant" }

[[providers.azure.blocks]]
key = "pgdb"
resource = "azurerm_postgresql_flexible_server_database"
when = { field = "engine", equals = "postgres" }

[providers.azure.blocks.args]
name      = { field = "database_name" }
server_id = { self_block = "pg", attr = "id" }
charset   = { value = "UTF8" }
collation = { value = "en_US.utf8" }

[[providers.azure.blocks]]
key = "my"
resource = "azurerm_mysql_flexible_server"
when = { field = "engine", equals = "mysql" }

[providers.azure.blocks.args]
name                   = { provider_field = "server_name" }
resource_group_name    = { ancestor = "resource_group", attr = "name" }
location               = { var = "location" }
version                = { provider_field = "engine_version", fallback = { value = "8.0.21" } }
administrator_login    = { field = "admin_username" }
administrator_password = { if = { relation = "reads" }, then = { relation = "reads", attr = "value" }, else = { var = "db_password" } }
sku_name               = { provider_field = "sku_name", fallback = { map = "size", table = { small = "B_Standard_B1ms", medium = "GP_Standard_D2ds_v4", large = "GP_Standard_D4ds_v4" } } }
backup_retention_days  = { field = "backup_retention_days", fallback = { value = 7 } }
delegated_subnet_id    = { relation = "network_membership", attr = "id", optional = true }
private_dns_zone_id    = { self_block = "dns", attr = "id" }
depends_on             = { list = [ { self_block = "dns_link", attr = "" } ] }

[[providers.azure.blocks.nested]]
block = "storage"

[providers.azure.blocks.nested.args]
size_gb           = { field = "storage" }
auto_grow_enabled = { if = { field = "max_storage_gb" }, then = { value = true }, else = { value = false } }

[[providers.azure.blocks.nested]]
block = "high_availability"
when = { field = "high_availability" }

[providers.azure.blocks.nested.args]
mode = { value = "ZoneRedundant" }

[[providers.azure.blocks]]
key = "mydb"
resource = "azurerm_mysql_flexible_database"
when = { field = "engine", equals = "mysql" }

[providers.azure.blocks.args]
name                = { field = "database_name" }
resource_group_name = { ancestor = "resource_group", attr = "name" }
server_name         = { self_block = "my", attr = "name" }
charset             = { value = "utf8mb4" }
collation           = { value = "utf8mb4_unicode_ci" }

# Server parameters, one configuration resource each.
[[providers.azure.blocks]]
key = "pgconf"
resource = "azurerm_postgresql_flexible_server_configuration"
for_each_field = "parameters"
when = { field = "engine", equals = "postgres" }

[providers.azure.blocks.args]
name      = { item = "name" }
server_id = { self_block = "pg", attr = "id" }
value     = { item = "value" }

[[providers.azure.blocks]]
key = "myconf"
resource = "azurerm_mysql_flexible_server_configuration"
for_each_field = "parameters"
when = { field = "engine", equals = "mysql" }

[providers.azure.blocks.args]
name                = { item = "name" }
resource_group_name = { ancestor = "resource_group", attr = "name" }
server_name         = { self_block = "my", attr = "name" }
value               = { item = "value" }

# Public servers: a firewall rule for the allowed range, when one is given.
[[providers.azure.blocks]]
key = "pgfw"
resource = "azurerm_postgresql_flexible_server_firewall_rule"
when = { all = [ { field = "engine", equals = "postgres" }, { relation = "network_membership", absent = true }, { provider_field = "public_access_cidr" } ] }

[providers.azure.blocks.args]
name             = { value = "allowed-range" }
server_id        = { self_block = "pg", attr = "id" }
start_ip_address = { func = "cidrhost", args = [ { provider_field = "public_access_cidr" }, { value = 0 } ] }
end_ip_address   = { func = "cidrhost", args = [ { provider_field = "public_access_cidr" }, { value = -1 } ] }

[[providers.azure.blocks]]
key = "myfw"
resource = "azurerm_mysql_flexible_server_firewall_rule"
when = { all = [ { field = "engine", equals = "mysql" }, { relation = "network_membership", absent = true }, { provider_field = "public_access_cidr" } ] }

[providers.azure.blocks.args]
name                = { value = "allowed-range" }
resource_group_name = { ancestor = "resource_group", attr = "name" }
server_name         = { self_block = "my", attr = "name" }
start_ip_address    = { func = "cidrhost", args = [ { provider_field = "public_access_cidr" }, { value = 0 } ] }
end_ip_address      = { func = "cidrhost", args = [ { provider_field = "public_access_cidr" }, { value = -1 } ] }

[[providers.azure.checks]]
when = { all = [ { field = "engine", equals = "postgres" }, { relation = "network_membership" }, { relation = "network_membership", target_provider_field = "delegation", equals = "postgres_flexible", absent = true } ] }
message = "\"{name}\" is VNet-integrated but no linked subnet is delegated to postgres_flexible (set the subnet's Azure Delegation field; only the first linked subnet is used)"

[[providers.azure.checks]]
when = { all = [ { field = "engine", equals = "mysql" }, { relation = "network_membership" }, { relation = "network_membership", target_provider_field = "delegation", equals = "mysql_flexible", absent = true } ] }
message = "\"{name}\" is VNet-integrated but no linked subnet is delegated to mysql_flexible (set the subnet's Azure Delegation field; only the first linked subnet is used)"

[[providers.azure.checks]]
when = { all = [ { field = "high_availability" }, { field = "size", equals = "small" }, { provider_field = "sku_name", absent = true } ] }
message = "\"{name}\" asks for high availability on the 'small' size, whose Burstable SKU cannot be zone-redundant; choose a larger size or set the Azure SKU override"

[[providers.azure.checks]]
when = { relation = "encrypted_with" }
message = "\"{name}\" is linked to an Encryption Key, which the Azure mapping cannot use: a flexible server's customer-managed key needs a user-assigned identity holding Key Vault rights, which the diagram does not model. Storage stays encrypted with Microsoft-managed keys"

[[providers.azure.checks]]
when = { all = [ { field = "engine", equals = "mysql" }, { field = "iam_authentication" } ] }
message = "\"{name}\" asks for directory authentication, which a MySQL flexible server does not have as a server setting: it needs a user-assigned identity on the server plus an `azurerm_mysql_flexible_server_active_directory_administrator` resource. Only PostgreSQL is generated; wire MySQL by hand or keep the password login"

[[providers.azure.checks]]
when = { all = [ { field = "engine", equals = "postgres" }, { field = "storage", not_one_of = ["32", "64", "128", "256", "512", "1024", "2048", "4096", "8192", "16384", "32767"] }, { field = "storage", at_most = 32767 } ] }
message = "\"{name}\": an Azure PostgreSQL flexible server only comes in 32, 64, 128, 256 or 512 GB or 1, 2, 4, 8, 16 or 32 TB, so its storage is rounded up to the next of those"

[[providers.azure.checks]]
severity = "error"
when = { all = [ { field = "engine", equals = "postgres" }, { field = "storage", greater_than = 32767 } ] }
message = "\"{name}\" asks for more storage than an Azure PostgreSQL flexible server has (32 TB)"

[[providers.azure.checks]]
severity = "error"
when = { all = [ { field = "engine", equals = "mysql" }, { any = [ { field = "storage", less_than = 20 }, { field = "storage", greater_than = 16384 } ] } ] }
message = "\"{name}\": an Azure MySQL flexible server takes 20 to 16,384 GB of storage"

[[providers.azure.checks]]
when = { field = "max_storage_gb" }
message = "\"{name}\": Azure grows a flexible server's storage with no upper limit, so 'Grow storage up to' only switches auto-grow on"

[[providers.azure.checks]]
severity = "error"
when = { relation = "reads", target_field = "value_outside", equals = "true" }
message = "\"{name}\" takes its administrator password from a Secret whose value is managed outside OpenTofu, so there is no value to give the server; let OpenTofu hold the secret's value, or use the db_password variable"

[[providers.azure.checks]]
when = { field = "deletion_protection" }
message = "\"{name}\" asks for deletion protection, which Azure flexible servers have no setting for; protect it with a management lock on the resource group instead"

[providers.azure.connection]
HOST = { if = { field = "engine", equals = "postgres" }, then = { self_block = "pg", attr = "fqdn" }, else = { self_block = "my", attr = "fqdn" } }
PORT = { map = "engine", table = { postgres = 5432, mysql = 3306 } }
NAME = { field = "database_name" }

[providers.azure.outputs]
postgres_fqdn = { block = "pg", attr = "fqdn", description = "PostgreSQL server host name" }
mysql_fqdn    = { block = "my", attr = "fqdn", description = "MySQL server host name" }

# A flexible server's default `max_connections` by SKU (Azure keeps 15 of PostgreSQL's
# for itself). A `max_connections` parameter of the server's own leaves it unknown.
[providers.azure.limits]
max_connections = { if = { not = { field = "parameters", has_row = { name = "max_connections", value = "*" } } }, then = { if = { field = "engine", equals = "mysql" }, then = { if = { provider_field = "sku_name", absent = true }, then = { map = "size", table = { small = 341, medium = 1365, large = 2731 } }, else = { map = "sku_name", optional = true, table = { "B_Standard_B1s" = 171, "B_Standard_B1ms" = 341, "B_Standard_B2s" = 683, "B_Standard_B2ms" = 1365, "B_Standard_B4ms" = 2731, "B_Standard_B8ms" = 5461, "GP_Standard_D2ds_v4" = 1365, "GP_Standard_D4ds_v4" = 2731, "GP_Standard_D8ds_v4" = 5461, "GP_Standard_D16ds_v4" = 10923, "MO_Standard_E2ds_v4" = 2731, "MO_Standard_E4ds_v4" = 5461 } } }, else = { if = { provider_field = "sku_name", absent = true }, then = { map = "size", table = { small = 50, medium = 859, large = 1718 } }, else = { map = "sku_name", optional = true, table = { "B_Standard_B1ms" = 50, "B_Standard_B2s" = 429, "B_Standard_B2ms" = 859, "B_Standard_B4ms" = 1718, "B_Standard_B8ms" = 3437, "GP_Standard_D2s_v3" = 859, "GP_Standard_D4s_v3" = 1718, "GP_Standard_D8s_v3" = 3437, "GP_Standard_D16s_v3" = 5000, "GP_Standard_D2ds_v4" = 859, "GP_Standard_D4ds_v4" = 1718, "GP_Standard_D8ds_v4" = 3437, "GP_Standard_D2ds_v5" = 859, "GP_Standard_D4ds_v5" = 1718, "GP_Standard_D8ds_v5" = 3437, "MO_Standard_E2ds_v4" = 1718, "MO_Standard_E4ds_v4" = 3437, "MO_Standard_E8ds_v4" = 5000 } } } } }

[[providers.azure.manual_steps]]
title = "Create the directory role inside the database"
when = { all = [ { field = "engine", equals = "postgres" }, { field = "iam_authentication" } ] }
body = """
Entra authentication is switched on, but nothing can use it until the server has a
**directory administrator** (`azurerm_postgresql_flexible_server_active_directory_administrator`
for a user or group you choose) and that administrator has run
`SELECT * FROM pgaadauth_create_principal('<identity name>', false, false);` for each
managed identity that should connect. Clients then authenticate with an Entra access token
in place of the password.
"""

[[providers.azure.manual_steps]]
title = "Keep a copy before destroying the server"
when = { all = [ { field = "final_snapshot" }, { setting = "disposable", equals = "false" } ] }
body = """
Azure flexible servers have no "final snapshot on destroy": automated backups are deleted
with the server. Before `destroy`, take a manual copy — `az postgres flexible-server
backup create` / a restore into a new server, or a `pg_dump` / `mysqldump` to storage.
"""

[[providers.azure.manual_steps]]
title = "Open network access to the database server"
when = { all = [ { relation = "network_membership", absent = true }, { provider_field = "public_access_cidr", absent = true } ] }
body = """
No subnet is linked, so the flexible server is created with public network access and
**no** firewall rules; no client can connect yet. Either link a subnet (VNet integration is
then generated), set the Azure **Allow public access from** range (a firewall rule is
generated), or add `azurerm_*_flexible_server_firewall_rule` resources by hand.
"""

# ---------------------------------------------------------------- GCP
[providers.gcp]
status = "partial"
notes = "Cloud SQL. Linked to a subnet it gets a private IP through private services access on the subnet's network (one connection per network); without one it is public with no authorised networks."

[[providers.gcp.fields]]
name = "database_version"
label = "Database version override"
type = "string"
description = "A Cloud SQL database version such as `POSTGRES_15` or `MYSQL_8_0`. Defaults to the engine's current major."

[[providers.gcp.fields]]
name = "tier"
label = "Machine tier override"
type = "string"
description = "Overrides the tier the size table picks, e.g. `db-custom-2-7680`. Regional (high-availability) instances cannot use the shared-core `db-f1-micro` that 'small' selects."

[[providers.gcp.fields]]
name = "ssl_mode"
label = "SSL mode"
type = "enum"
options = ["ALLOW_UNENCRYPTED_AND_ENCRYPTED", "ENCRYPTED_ONLY", "TRUSTED_CLIENT_CERTIFICATE_REQUIRED"]
description = "Whether Cloud SQL accepts unencrypted connections (`settings.ip_configuration.ssl_mode`). Cloud SQL enforces TLS here rather than with a database flag. 'ENCRYPTED_ONLY' refuses plain connections, so a Secret built from this database ('Value from database', TLS mode 'auto') asks for `sslmode=require`; 'TRUSTED_CLIENT_CERTIFICATE_REQUIRED' also needs a client certificate, which a connection URI cannot carry. Unset: Cloud SQL's default, which allows both."

[[providers.gcp.checks]]
severity = "error"
when = { field = "parameters", has_row = { name = ["ssl_mode", "require_ssl"] } }
message = "\"{name}\" sets `ssl_mode` / `require_ssl` as a server parameter, which Cloud SQL does not have as a database flag and refuses; use the Google Cloud 'SSL mode' field instead"

[[providers.gcp.checks]]
severity = "error"
when = { relation = "reads", target_field = "value_outside", equals = "true" }
message = "\"{name}\" takes its admin password from a Secret whose value is managed outside OpenTofu, so there is no value to give Cloud SQL; let OpenTofu hold the secret's value, or use the db_password variable"

[[providers.gcp.checks]]
severity = "error"
when = { field = "storage", less_than = 10 }
message = "\"{name}\" asks for less than 10 GB of storage, the smallest disk Cloud SQL creates"

[[providers.gcp.checks]]
severity = "error"
when = { all = [ { field = "max_storage_gb" }, { field = "max_storage_gb", at_most = { field = "storage" } } ] }
message = "\"{name}\": 'Grow storage up to' must be larger than the storage it starts with (or 0 to keep the size fixed)"

[[providers.gcp.checks]]
when = { all = [ { field = "high_availability" }, { field = "size", equals = "small" }, { provider_field = "tier", absent = true } ] }
message = "\"{name}\" asks for high availability on the 'small' size, whose shared-core tier cannot be regional; choose a larger size or set the Google Cloud tier override"

[[providers.gcp.variables]]
name = "db_password"
type = "string"
description = "Administrator password for database instances that are not linked to a Secret."
sensitive = true

# Private services access: a reserved range plus the peering to Google's producer network.
[[providers.gcp.blocks]]
key = "psa_range"
resource = "google_compute_global_address"
when = { relation = "network_membership" }

[providers.gcp.blocks.args]
name          = { template = "{name}-psa-range", transform = "kebab" }
purpose       = { value = "VPC_PEERING" }
address_type  = { value = "INTERNAL" }
prefix_length = { value = 16 }
network       = { relation = "network_membership", ancestor = "virtual_network", attr = "id" }

[[providers.gcp.blocks]]
key = "psa"
resource = "google_service_networking_connection"
when = { relation = "network_membership" }

[providers.gcp.blocks.args]
network                 = { relation = "network_membership", ancestor = "virtual_network", attr = "id" }
service                 = { value = "servicenetworking.googleapis.com" }
reserved_peering_ranges = { self_block = "psa_range", attr = "name", wrap = "list" }

[[providers.gcp.checks]]
when = { all = [ { setting = "disposable" }, { field = "deletion_protection" } ] }
message = "\"{name}\" has deletion protection on in a disposable project: `destroy` fails until it is cleared and applied"

# Cloud SQL keeps a deleted instance's name for up to a week, so a disposable project
# gives each creation a name of its own: the display name plus a suffix drawn per create.
[[providers.gcp.blocks]]
key = "name_suffix"
resource = "random_id"
when = { setting = "disposable" }

[providers.gcp.blocks.args]
byte_length = { value = 3 }

[[providers.gcp.blocks]]
key = "main"
resource = "google_sql_database_instance"

[providers.gcp.blocks.args]
name                     = { if = { setting = "disposable" }, then = { func = "format", args = [ { value = "%s-%s" }, { field = "name", transform = "kebab" }, { self_block = "name_suffix", attr = "hex" } ] }, else = { field = "name", transform = "kebab" } }
region                   = { var = "region" }
database_version         = { provider_field = "database_version", fallback = { map = "engine", table = { postgres = "POSTGRES_16", mysql = "MYSQL_8_0" } } }
deletion_protection      = { if = { field = "deletion_protection" }, then = { value = true }, else = { value = false } }
encryption_key_name      = { relation = "encrypted_with", attr = "id", optional = true }

[[providers.gcp.blocks.nested]]
block = "settings"

[providers.gcp.blocks.nested.args]
tier                     = { provider_field = "tier", fallback = { map = "size", table = { small = "db-f1-micro", medium = "db-custom-2-7680", large = "db-custom-4-15360" } } }
disk_size                = { field = "storage" }
disk_autoresize          = { if = { field = "max_storage_gb" }, then = { value = true }, else = { value = false } }
disk_autoresize_limit    = { if = { field = "max_storage_gb" }, then = { field = "max_storage_gb" } }
availability_type        = { if = { field = "high_availability" }, then = { value = "REGIONAL" }, else = { value = "ZONAL" } }
retain_backups_on_delete = { if = { all = [ { field = "final_snapshot" }, { setting = "disposable", equals = "false" } ] }, then = { value = true }, else = { value = false } }

[[providers.gcp.blocks.nested.nested]]
block = "backup_configuration"
when = { field = "backup_retention_days" }

[providers.gcp.blocks.nested.nested.args]
enabled                        = { value = true }
point_in_time_recovery_enabled = { if = { field = "engine", equals = "postgres" }, then = { value = true }, else = { value = false } }
binary_log_enabled             = { if = { field = "engine", equals = "mysql" }, then = { value = true }, else = { value = false } }

[[providers.gcp.blocks.nested.nested.nested]]
block = "backup_retention_settings"

[providers.gcp.blocks.nested.nested.nested.args]
retained_backups = { field = "backup_retention_days", fallback = { value = 7 } }
retention_unit   = { value = "COUNT" }

[[providers.gcp.blocks.nested.nested]]
block = "ip_configuration"

[providers.gcp.blocks.nested.nested.args]
ipv4_enabled    = { if = { relation = "network_membership" }, then = { value = false }, else = { value = true } }
private_network = { if = { relation = "network_membership" }, then = { self_block = "psa", attr = "network" } }
ssl_mode        = { provider_field = "ssl_mode", optional = true }

# Cloud SQL IAM authentication is a database flag, and the two engines spell it
# differently: a dot for PostgreSQL, an underscore for MySQL.
[[providers.gcp.blocks.nested.nested]]
block = "database_flags"
when = { field = "iam_authentication" }

[providers.gcp.blocks.nested.nested.args]
name  = { if = { field = "engine", equals = "postgres" }, then = { value = "cloudsql.iam_authentication" }, else = { value = "cloudsql_iam_authentication" } }
value = { value = "on" }

[[providers.gcp.blocks.nested.nested]]
block = "database_flags"
for_each_field = "parameters"

[providers.gcp.blocks.nested.nested.args]
name  = { item = "name" }
value = { item = "value" }

[[providers.gcp.blocks]]
key = "db"
resource = "google_sql_database"

[providers.gcp.blocks.args]
name     = { field = "database_name" }
instance = { self_block = "main", attr = "name" }

[[providers.gcp.blocks]]
key = "user"
resource = "google_sql_user"

[providers.gcp.blocks.args]
name     = { field = "admin_username" }
instance = { self_block = "main", attr = "name" }
password = { if = { relation = "reads" }, then = { relation = "reads", block = "version", attr = "secret_data" }, else = { var = "db_password" } }

# A networked instance is reached on its private address, a public one on its public one.
[providers.gcp.connection]
HOST = { if = { relation = "network_membership" }, then = { self_block = "main", attr = "private_ip_address" }, else = { self_block = "main", attr = "public_ip_address" } }
PORT = { map = "engine", table = { postgres = 5432, mysql = 3306 } }
NAME = { field = "database_name" }

[providers.gcp.outputs]
private_ip      = { attr = "private_ip_address", description = "Private IPv4 address (VNet-integrated instances)" }
public_ip       = { attr = "public_ip_address", description = "Public IPv4 address (public instances)" }
connection_name = { attr = "connection_name", description = "Cloud SQL connection name (for the Auth Proxy)" }

# Cloud SQL's default `max_connections` by tier. PostgreSQL follows the tier's memory
# (0.6 GB 25, 1.7 GB 50, 3.75-6 GB 100, 6-7.5 GB 200, 7.5-15 GB 400, 15-30 GB 500,
# 30-60 GB 600, 60-120 GB 800); MySQL is 250 on db-f1-micro, 1,000 on db-g1-small and
# 4,000 on every other tier. A `max_connections` flag of the server's own leaves it unknown.
[providers.gcp.limits]
max_connections = { if = { not = { field = "parameters", has_row = { name = "max_connections", value = "*" } } }, then = { if = { field = "engine", equals = "mysql" }, then = { if = { provider_field = "tier", absent = true }, then = { map = "size", table = { small = 250, medium = 4000, large = 4000 } }, else = { if = { provider_field = "tier", equals = "db-f1-micro" }, then = { value = 250 }, else = { if = { provider_field = "tier", equals = "db-g1-small" }, then = { value = 1000 }, else = { value = 4000 } } } }, else = { if = { provider_field = "tier", absent = true }, then = { map = "size", table = { small = 25, medium = 400, large = 500 } }, else = { map = "tier", optional = true, table = { "db-f1-micro" = 25, "db-g1-small" = 50, "db-custom-1-3840" = 100, "db-custom-2-7680" = 400, "db-custom-2-8192" = 400, "db-custom-4-15360" = 500, "db-custom-4-16384" = 500, "db-custom-8-30720" = 600, "db-custom-8-32768" = 600, "db-custom-16-61440" = 800, "db-custom-16-65536" = 800, "db-perf-optimized-N-2" = 500, "db-perf-optimized-N-4" = 600, "db-perf-optimized-N-8" = 800 } } } } }

[[providers.gcp.manual_steps]]
title = "Let Cloud SQL use the encryption key"
when = { relation = "encrypted_with" }
body = """
A Cloud SQL instance can only be created with a customer-managed key once the Cloud SQL
service agent holds `roles/cloudkms.cryptoKeyEncrypterDecrypter` on that key. Create the
agent with `gcloud beta services identity create --service=sqladmin.googleapis.com` and
grant it the role on the key before the first `apply`.
"""

[[providers.gcp.manual_steps]]
title = "Add the service account as a database user"
when = { field = "iam_authentication" }
body = """
The `cloudsql.iam_authentication` flag lets a service account log in with an OAuth token,
but only once it exists as a user: add a `google_sql_user` with `type =
"CLOUD_IAM_SERVICE_ACCOUNT"` and `name` set to the account's email without the
`.gserviceaccount.com` suffix, and grant the account `roles/cloudsql.instanceUser` (plus
`roles/cloudsql.client` for the Auth Proxy).
"""

[[providers.gcp.manual_steps]]
title = "Open network access to the database instance"
when = { relation = "network_membership", absent = true }
body = """
No subnet is linked, so the instance has a public address and no authorised networks:
nothing can connect yet. Link a subnet (private IP through private services access is
then generated) or add `settings.ip_configuration.authorized_networks` by hand.
"""

[[providers.gcp.manual_steps]]
title = "One private-services-access connection per network"
when = { relation = "network_membership" }
body = """
Private IP needs a `google_service_networking_connection` on the network, and a network
can only have one. This database generates its own; if another database (or Memorystore
with private services access) shares the network, keep one connection and remove the
others' `psa` / `psa_range` resources.
"""
