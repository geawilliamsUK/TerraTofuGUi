# CLOUDFRONT one from us-east-1, so one entity that guards both a load balancer and a CDN
# needs two ACLs. The block is only emitted when a `cdn` actually points at this firewall.
[[providers.aws.blocks]]
key = "global"
resource = "aws_wafv2_web_acl"
