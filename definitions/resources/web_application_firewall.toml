# Abstract type: Web Application Firewall  (schema_version 2)
#
# Managed rule groups and per-path rate limits in front of a Load Balancer ('Protects')
# or a CDN (the CDN's 'Protected by'). Each provider builds what the links ask for and
# nothing else: a firewall that protects nothing is a warning, not a stray resource.
# AWS: a REGIONAL aws_wafv2_web_acl plus one aws_wafv2_web_acl_association per protected
#      load balancer, only when one is linked; a CLOUDFRONT-scoped copy of the same rules in
#      us-east-1, only when a CDN links here (the only kind of Web ACL CloudFront accepts).
#      Every row of 'Rate rules' is a rate-based rule whose scope-down statement matches
#      the row's path prefixes (STARTS_WITH, OR'ed) and HTTP method.
# Azure: an Application Gateway policy (azurerm_web_application_firewall_policy) for a
#      protected load balancer, which has to be attached to a gateway by hand because the
#      Load Balancer type emits a layer-4 azurerm_lb; and a Front Door policy
#      (azurerm_cdn_frontdoor_firewall_policy) for a CDN, which the CDN's Front Door profile
#      attaches with a security policy. Rate rules become RateLimitRule custom rules.
# GCP: google_compute_security_policy (Cloud Armor) with preconfigured WAF expressions and
#      one rate-based ban per rate rule, matched with request.path.startsWith(...). The
#      global HTTPS load balancer it protects (directly, or through a CDN) sets it on its
#      backend service.

schema_version = 2

[resource]
type = "web_application_firewall"
category = "network"
display_name = "Web Application Firewall"
description = "Managed rule groups and per-path rate limits. Link 'Protects' to the load balancers it guards, or 'Protected by' from a CDN."
kind = "node"
allowed_parents = ["resource_group"]
icon = "WAF"
network_agnostic = true

[[fields]]
name = "managed_rules"
label = "Managed rule groups"
type = "string_list"
required = true
default = ["AWSManagedRulesCommonRuleSet"]
description = "AWS managed rule group names. AWSManagedRulesCommonRuleSet, AWSManagedRulesKnownBadInputsRuleSet, AWSManagedRulesSQLiRuleSet, AWSManagedRulesLinuxRuleSet and AWSManagedRulesPHPRuleSet also translate to Cloud Armor; any other name is AWS-only. Azure uses its own default rule set for all of them."

[[fields]]
name = "rate_rules"
label = "Rate rules"
type = "struct_list"
description = "Requests per source IP per five minutes before a rule fires, optionally only for some path prefixes and one HTTP method. Each row is counted separately."

[[fields.items]]
name = "name"
type = "string"
required = true
default = "rate-limit"
pattern = "^[a-z][a-z0-9-]{0,40}$"
pattern_hint = "lower case letters, digits and '-', starting with a letter"

[[fields.items]]
name = "limit"
label = "Limit / 5 min"
type = "int"
required = true
default = 300
description = "Requests per source IP in five minutes. AWS needs at least 10."

[[fields.items]]
name = "paths"
label = "Path prefixes"
type = "string_list"
description = "Only count requests whose path starts with one of these, e.g. /api/auth/. Empty = every path."

[[fields.items]]
name = "method"
label = "Method"
type = "enum"
options = ["ANY", "GET", "POST", "PUT", "PATCH", "DELETE"]
default = "ANY"

[[fields.items]]
name = "action"
label = "Action"
type = "enum"
options = ["block", "count"]
default = "block"
description = "block rejects requests over the limit; count only records them. Mode = count downgrades every rule to count."

[[fields]]
name = "mode"
label = "Mode"
type = "enum"
required = true
options = ["block", "count"]
default = "block"
description = "block enforces the rules; count only records what would have been blocked (Detection / preview)."

[[relations]]
kind = "attachment"
label = "Protects"
targets = ["load_balancer"]
cardinality = "many"

# ---------------------------------------------------------------- AWS
[providers.aws]
status = "full"

# The regional Web ACL, for the load balancers this firewall protects.
[[providers.aws.blocks]]
key = "main"
resource = "aws_wafv2_web_acl"
when = { relation = "attachment", target_type = "load_balancer" }

[providers.aws.blocks.args]
name        = { field = "name", transform = "kebab" }
description = { template = "{name} (managed by TerraTofu GUI)" }
scope       = { value = "REGIONAL" }
tags        = { object = { Name = { field = "name" } } }

[[providers.aws.blocks.nested]]
block = "default_action"

[[providers.aws.blocks.nested.nested]]
block = "allow"

# One rule per managed rule group. `override_action` decides whether the group's own
# actions apply (none) or are downgraded to counting (count).
[[providers.aws.blocks.nested]]
block = "rule"
for_each_field = "managed_rules"

[providers.aws.blocks.nested.args]
name     = { item = "value" }
priority = { item_index = { base = 1, step = 1 } }

[[providers.aws.blocks.nested.nested]]
block = "override_action"

[[providers.aws.blocks.nested.nested.nested]]
block = "none"
when = { field = "mode", equals = "block" }

[[providers.aws.blocks.nested.nested.nested]]
block = "count"
when = { field = "mode", equals = "count" }

[[providers.aws.blocks.nested.nested]]
block = "statement"

[[providers.aws.blocks.nested.nested.nested]]
block = "managed_rule_group_statement"

[providers.aws.blocks.nested.nested.nested.args]
name        = { item = "value" }
vendor_name = { value = "AWS" }

[[providers.aws.blocks.nested.nested]]
block = "visibility_config"

[providers.aws.blocks.nested.nested.args]
cloudwatch_metrics_enabled = { value = true }
metric_name                = { item = "value" }
sampled_requests_enabled   = { value = true }

# One rate-based rule per row. A rate-based rule carries its own action rather than an
# override_action, and its scope-down statement narrows what it counts: the row's path
# prefixes (one byte match, or several OR'ed together) and its method. A scope-down
# statement nests three levels deep at most, so several prefixes together with a method
# are one regex match on the path instead of an OR.
[[providers.aws.blocks.nested]]
block = "rule"
for_each_field = "rate_rules"

[providers.aws.blocks.nested.args]
name     = { template = "{name}-{item.name}", transform = "kebab" }
priority = { item_index = { base = 100, step = 1 } }

[[providers.aws.blocks.nested.nested]]
block = "action"

[[providers.aws.blocks.nested.nested.nested]]
block = "block"
when = { all = [ { field = "mode", equals = "block" }, { item = "action", equals = "block" } ] }

[[providers.aws.blocks.nested.nested.nested]]
block = "count"
when = { any = [ { field = "mode", equals = "count" }, { item = "action", equals = "count" } ] }

[[providers.aws.blocks.nested.nested]]
block = "statement"

[[providers.aws.blocks.nested.nested.nested]]
block = "rate_based_statement"

[providers.aws.blocks.nested.nested.nested.args]
limit                 = { item = "limit" }
aggregate_key_type    = { value = "IP" }
evaluation_window_sec = { value = 300 }

[[providers.aws.blocks.nested.nested.nested.nested]]
block = "scope_down_statement"
when = { any = [ { item = "paths" }, { item = "method", not_equals = "ANY" } ] }

# One prefix, any method.
[[providers.aws.blocks.nested.nested.nested.nested.nested]]
block = "byte_match_statement"
for_each_item = "paths"
when = { all = [ { not = { item = "paths", min_count = 2 } }, { item = "method", equals = "ANY" } ] }

[providers.aws.blocks.nested.nested.nested.nested.nested.args]
search_string         = { item = "value" }
positional_constraint = { value = "STARTS_WITH" }

[[providers.aws.blocks.nested.nested.nested.nested.nested.nested]]
block = "field_to_match"

[[providers.aws.blocks.nested.nested.nested.nested.nested.nested.nested]]
block = "uri_path"

[[providers.aws.blocks.nested.nested.nested.nested.nested.nested]]
block = "text_transformation"

[providers.aws.blocks.nested.nested.nested.nested.nested.nested.args]
priority = { value = 0 }
type     = { value = "NONE" }

# Several prefixes, any method.
[[providers.aws.blocks.nested.nested.nested.nested.nested]]
block = "or_statement"
when = { all = [ { item = "paths", min_count = 2 }, { item = "method", equals = "ANY" } ] }

[[providers.aws.blocks.nested.nested.nested.nested.nested.nested]]
block = "statement"
for_each_item = "paths"

[[providers.aws.blocks.nested.nested.nested.nested.nested.nested.nested]]
block = "byte_match_statement"

[providers.aws.blocks.nested.nested.nested.nested.nested.nested.nested.args]
search_string         = { item = "value" }
positional_constraint = { value = "STARTS_WITH" }

[[providers.aws.blocks.nested.nested.nested.nested.nested.nested.nested.nested]]
block = "field_to_match"

[[providers.aws.blocks.nested.nested.nested.nested.nested.nested.nested.nested.nested]]
block = "uri_path"

[[providers.aws.blocks.nested.nested.nested.nested.nested.nested.nested.nested]]
block = "text_transformation"

[providers.aws.blocks.nested.nested.nested.nested.nested.nested.nested.nested.args]
priority = { value = 0 }
type     = { value = "NONE" }

# A method, any path.
[[providers.aws.blocks.nested.nested.nested.nested.nested]]
block = "byte_match_statement"
when = { all = [ { not = { item = "paths" } }, { item = "method", not_equals = "ANY" } ] }

[providers.aws.blocks.nested.nested.nested.nested.nested.args]
search_string         = { item = "method" }
positional_constraint = { value = "EXACTLY" }

[[providers.aws.blocks.nested.nested.nested.nested.nested.nested]]
block = "field_to_match"

[[providers.aws.blocks.nested.nested.nested.nested.nested.nested.nested]]
block = "method"

[[providers.aws.blocks.nested.nested.nested.nested.nested.nested]]
block = "text_transformation"

[providers.aws.blocks.nested.nested.nested.nested.nested.nested.args]
priority = { value = 0 }
type     = { value = "NONE" }

# Prefixes and a method.
[[providers.aws.blocks.nested.nested.nested.nested.nested]]
block = "and_statement"
when = { all = [ { item = "paths" }, { item = "method", not_equals = "ANY" } ] }

[[providers.aws.blocks.nested.nested.nested.nested.nested.nested]]
block = "statement"

[[providers.aws.blocks.nested.nested.nested.nested.nested.nested.nested]]
block = "byte_match_statement"
for_each_item = "paths"
when = { not = { item = "paths", min_count = 2 } }

[providers.aws.blocks.nested.nested.nested.nested.nested.nested.nested.args]
search_string         = { item = "value" }
positional_constraint = { value = "STARTS_WITH" }

[[providers.aws.blocks.nested.nested.nested.nested.nested.nested.nested.nested]]
block = "field_to_match"

[[providers.aws.blocks.nested.nested.nested.nested.nested.nested.nested.nested.nested]]
block = "uri_path"

[[providers.aws.blocks.nested.nested.nested.nested.nested.nested.nested.nested]]
block = "text_transformation"

[providers.aws.blocks.nested.nested.nested.nested.nested.nested.nested.nested.args]
priority = { value = 0 }
type     = { value = "NONE" }

[[providers.aws.blocks.nested.nested.nested.nested.nested.nested.nested]]
block = "regex_match_statement"
when = { item = "paths", min_count = 2 }

[providers.aws.blocks.nested.nested.nested.nested.nested.nested.nested.args]
regex_string = { raw = 'format("^(%s)", join("|", [for p in @paths@ : replace(p, "/[.^$*+?()[\\]{}|\\\\]/", "\\$0")]))', refs = { paths = { item = "paths" } } }

[[providers.aws.blocks.nested.nested.nested.nested.nested.nested.nested.nested]]
block = "field_to_match"

[[providers.aws.blocks.nested.nested.nested.nested.nested.nested.nested.nested.nested]]
block = "uri_path"

[[providers.aws.blocks.nested.nested.nested.nested.nested.nested.nested.nested]]
block = "text_transformation"

[providers.aws.blocks.nested.nested.nested.nested.nested.nested.nested.nested.args]
priority = { value = 0 }
type     = { value = "NONE" }

[[providers.aws.blocks.nested.nested.nested.nested.nested.nested]]
block = "statement"

[[providers.aws.blocks.nested.nested.nested.nested.nested.nested.nested]]
block = "byte_match_statement"

[providers.aws.blocks.nested.nested.nested.nested.nested.nested.nested.args]
search_string         = { item = "method" }
positional_constraint = { value = "EXACTLY" }

[[providers.aws.blocks.nested.nested.nested.nested.nested.nested.nested.nested]]
block = "field_to_match"

[[providers.aws.blocks.nested.nested.nested.nested.nested.nested.nested.nested.nested]]
block = "method"

[[providers.aws.blocks.nested.nested.nested.nested.nested.nested.nested.nested]]
block = "text_transformation"

[providers.aws.blocks.nested.nested.nested.nested.nested.nested.nested.nested.args]
priority = { value = 0 }
type     = { value = "NONE" }

[[providers.aws.blocks.nested.nested]]
block = "visibility_config"

[providers.aws.blocks.nested.nested.args]
cloudwatch_metrics_enabled = { value = true }
metric_name                = { template = "{name}-{item.name}", transform = "kebab" }
sampled_requests_enabled   = { value = true }

[[providers.aws.blocks.nested]]
block = "visibility_config"

[providers.aws.blocks.nested.args]
cloudwatch_metrics_enabled = { value = true }
metric_name                = { template = "{name}", transform = "alnum" }
sampled_requests_enabled   = { value = true }

# The same rules again, CLOUDFRONT-scoped, for a CDN that links here. A Web ACL is
