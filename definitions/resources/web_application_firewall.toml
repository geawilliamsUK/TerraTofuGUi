# ---------------------------------------------------------------- Azure
[providers.azure]
status = "partial"
notes = "A protected load balancer gets an Application Gateway policy (attached by hand: azurerm_lb is layer 4); a CDN gets a Front Door policy its profile attaches. Managed rule groups become Azure's own rule sets (OWASP 3.2 / Microsoft_DefaultRuleSet 2.1), which need Front Door Premium."

[[providers.azure.blocks]]
key = "main"
resource = "azurerm_web_application_firewall_policy"
when = { relation = "attachment", target_type = "load_balancer" }

[providers.azure.blocks.args]
name                = { field = "name", transform = "kebab" }
location            = { var = "location" }
resource_group_name = { ancestor = "resource_group", attr = "name" }
tags                = { object = { Name = { field = "name" } } }

[[providers.azure.blocks.nested]]
block = "policy_settings"

[providers.azure.blocks.nested.args]
enabled = { value = true }
mode    = { map = "mode", table = { block = "Prevention", count = "Detection" } }

[[providers.azure.blocks.nested]]
block = "managed_rules"

[[providers.azure.blocks.nested.nested]]
block = "managed_rule_set"

[providers.azure.blocks.nested.nested.args]
type    = { value = "OWASP" }
version = { value = "3.2" }

# One rate-limit custom rule per row. The match conditions of a rule are AND'ed; the values
# of one condition are OR'ed, so the prefixes share a condition and the method has its own.
[[providers.azure.blocks.nested]]
block = "custom_rules"
for_each_field = "rate_rules"

[providers.azure.blocks.nested.args]
name                 = { item = "name", transform = "alnum" }
priority             = { item_index = { base = 1, step = 1 } }
rule_type            = { value = "RateLimitRule" }
rate_limit_duration  = { value = "FiveMins" }
rate_limit_threshold = { item = "limit" }
group_rate_limit_by  = { value = "ClientAddr" }
action               = { if = { any = [ { field = "mode", equals = "count" }, { item = "action", equals = "count" } ] }, then = { value = "Log" }, else = { value = "Block" } }

[[providers.azure.blocks.nested.nested]]
block = "match_conditions"
when = { item = "paths" }

[providers.azure.blocks.nested.nested.args]
operator           = { value = "BeginsWith" }
negation_condition = { value = false }
match_values       = { item = "paths" }

[[providers.azure.blocks.nested.nested.nested]]
block = "match_variables"

[providers.azure.blocks.nested.nested.nested.args]
variable_name = { value = "RequestUri" }

[[providers.azure.blocks.nested.nested]]
block = "match_conditions"
when = { item = "method", not_equals = "ANY" }

[providers.azure.blocks.nested.nested.args]
operator           = { value = "Equal" }
negation_condition = { value = false }
match_values       = { item = "method", wrap = "list" }

[[providers.azure.blocks.nested.nested.nested]]
block = "match_variables"

[providers.azure.blocks.nested.nested.nested.args]
variable_name = { value = "RequestMethod" }

[[providers.azure.blocks.nested.nested]]
block = "match_conditions"
when = { all = [ { not = { item = "paths" } }, { item = "method", equals = "ANY" } ] }

[providers.azure.blocks.nested.nested.args]
operator           = { value = "IPMatch" }
negation_condition = { value = false }
match_values       = { value = ["0.0.0.0/0"] }

[[providers.azure.blocks.nested.nested.nested]]
block = "match_variables"

[providers.azure.blocks.nested.nested.nested.args]
variable_name = { value = "RemoteAddr" }

# The Front Door policy, for a CDN that links here. Managed rule sets need the Premium
# tier, so the policy (and the CDN's profile, whose tier must match) is Premium whenever
# there are managed rule groups — which the type requires.
[[providers.azure.blocks]]
key = "fd"
resource = "azurerm_cdn_frontdoor_firewall_policy"
when = { relation = "attribute_reference", incoming = true, target_type = "cdn" }

[providers.azure.blocks.args]
name                = { template = "{name}fd", transform = "alnum" }
resource_group_name = { ancestor = "resource_group", attr = "name" }
sku_name            = { if = { field = "managed_rules" }, then = { value = "Premium_AzureFrontDoor" }, else = { value = "Standard_AzureFrontDoor" } }
enabled             = { value = true }
mode                = { map = "mode", table = { block = "Prevention", count = "Detection" } }
tags                = { object = { Name = { field = "name" } } }

[[providers.azure.blocks.nested]]
block = "managed_rule"
when = { field = "managed_rules" }

[providers.azure.blocks.nested.args]
type    = { value = "Microsoft_DefaultRuleSet" }
version = { value = "2.1" }
action  = { map = "mode", table = { block = "Block", count = "Log" } }

# Front Door's RequestUri is the full URL (scheme and host included), so a path prefix
# is a regular expression anchored after the host.
[[providers.azure.blocks.nested]]
block = "custom_rule"
for_each_field = "rate_rules"

[providers.azure.blocks.nested.args]
name                           = { item = "name", transform = "alnum" }
enabled                        = { value = true }
priority                       = { item_index = { base = 1, step = 1 } }
type                           = { value = "RateLimitRule" }
rate_limit_duration_in_minutes = { value = 5 }
rate_limit_threshold           = { item = "limit" }
action                         = { if = { any = [ { field = "mode", equals = "count" }, { item = "action", equals = "count" } ] }, then = { value = "Log" }, else = { value = "Block" } }

[[providers.azure.blocks.nested.nested]]
block = "match_condition"
when = { item = "paths" }

[providers.azure.blocks.nested.nested.args]
match_variable = { value = "RequestUri" }
operator       = { value = "RegEx" }
match_values   = { func = "formatlist", args = [ { value = "^[a-z]+://[^/]+%s" }, { item = "paths" } ] }

[[providers.azure.blocks.nested.nested]]
block = "match_condition"
when = { item = "method", not_equals = "ANY" }

[providers.azure.blocks.nested.nested.args]
match_variable = { value = "RequestMethod" }
operator       = { value = "Equal" }
match_values   = { item = "method", wrap = "list" }

[[providers.azure.blocks.nested.nested]]
block = "match_condition"
when = { all = [ { not = { item = "paths" } }, { item = "method", equals = "ANY" } ] }

[providers.azure.blocks.nested.nested.args]
match_variable = { value = "RemoteAddr" }
operator       = { value = "IPMatch" }
match_values   = { value = ["0.0.0.0/0", "::/0"] }

[providers.azure.outputs]
id    = { attr = "id", description = "Application Gateway WAF policy id" }
fd_id = { block = "fd", attr = "id", description = "Front Door WAF policy id" }

[[providers.azure.checks]]
when = { all = [ { relation = "attachment", target_type = "load_balancer", absent = true }, { relation = "attribute_reference", incoming = true, target_type = "cdn", absent = true } ] }
message = "\"{name}\" protects nothing: link 'Protects' to a load balancer or 'Protected by' from a CDN; no WAF policy is generated until one exists"

[[providers.azure.manual_steps]]
title = "Attach the policy to an Application Gateway"
when = { relation = "attachment", target_type = "load_balancer" }
body = """
The Application Gateway policy exists but protects nothing yet. Azure WAF attaches to an
Application Gateway (`azurerm_application_gateway.firewall_policy_id`) or a Front Door; the
Standard `azurerm_lb` the Load Balancer type emits is a layer-4 load balancer and cannot run
a WAF. Add a native Application Gateway node in front of the backends and set its
`firewall_policy_id` to this policy's id — or put a CDN (Front Door) in front of the load
balancer and link this firewall from it, which is generated end to end.
"""

# ---------------------------------------------------------------- GCP
[providers.gcp]
status = "partial"

# One policy serves both a protected load balancer and a CDN in front of one: on Google
# Cloud the CDN is the load balancer's backend service, and that is where it attaches.
[[providers.gcp.blocks]]
key = "main"
resource = "google_compute_security_policy"
when = { any = [ { relation = "attachment", target_type = "load_balancer" }, { relation = "attribute_reference", incoming = true, target_type = "cdn" } ] }

[providers.gcp.blocks.args]
name        = { field = "name", transform = "kebab" }
description = { template = "{name} (managed by TerraTofu GUI)" }

# One rule per rule group Cloud Armor has a preconfigured expression for. The `when` list
# has to repeat the keys of the lookup table below: entries with no Cloud Armor equivalent
# produce no rule (and a check warns about them).
[[providers.gcp.blocks.nested]]
block = "rule"
for_each_field = "managed_rules"
when = { any = [
  { item = "value", equals = "AWSManagedRulesCommonRuleSet" },
  { item = "value", equals = "AWSManagedRulesKnownBadInputsRuleSet" },
  { item = "value", equals = "AWSManagedRulesSQLiRuleSet" },
  { item = "value", equals = "AWSManagedRulesLinuxRuleSet" },
  { item = "value", equals = "AWSManagedRulesPHPRuleSet" },
] }

[providers.gcp.blocks.nested.args]
action      = { value = "deny(403)" }
priority    = { item_index = { base = 1, step = 1 } }
description = { template = "{item.value}" }
preview     = { if = { field = "mode", equals = "count" }, then = { value = true } }

[[providers.gcp.blocks.nested.nested]]
block = "match"

[[providers.gcp.blocks.nested.nested.nested]]
block = "expr"

[providers.gcp.blocks.nested.nested.nested.args]
expression = { map = "value", optional = true, table = { AWSManagedRulesCommonRuleSet = "evaluatePreconfiguredWaf('xss-v33-stable') || evaluatePreconfiguredWaf('protocolattack-v33-stable') || evaluatePreconfiguredWaf('scannerdetection-v33-stable')", AWSManagedRulesKnownBadInputsRuleSet = "evaluatePreconfiguredWaf('cve-canary') || evaluatePreconfiguredWaf('rce-v33-stable')", AWSManagedRulesSQLiRuleSet = "evaluatePreconfiguredWaf('sqli-v33-stable')", AWSManagedRulesLinuxRuleSet = "evaluatePreconfiguredWaf('lfi-v33-stable') || evaluatePreconfiguredWaf('rfi-v33-stable')", AWSManagedRulesPHPRuleSet = "evaluatePreconfiguredWaf('php-v33-stable')" } }

# One rate-based ban per row: every source IP, or only requests whose path starts with
# one of the row's prefixes and / or that use its method.
[[providers.gcp.blocks.nested]]
block = "rule"
for_each_field = "rate_rules"

[providers.gcp.blocks.nested.args]
action      = { value = "rate_based_ban" }
priority    = { item_index = { base = 100, step = 1 } }
description = { template = "{item.name}: rate limit per source IP" }
preview     = { if = { any = [ { field = "mode", equals = "count" }, { item = "action", equals = "count" } ] }, then = { value = true } }

[[providers.gcp.blocks.nested.nested]]
block = "match"
when = { all = [ { not = { item = "paths" } }, { item = "method", equals = "ANY" } ] }

[providers.gcp.blocks.nested.nested.args]
versioned_expr = { value = "SRC_IPS_V1" }

[[providers.gcp.blocks.nested.nested.nested]]
block = "config"

[providers.gcp.blocks.nested.nested.nested.args]
src_ip_ranges = { value = ["*"] }

[[providers.gcp.blocks.nested.nested]]
block = "match"
when = { any = [ { item = "paths" }, { item = "method", not_equals = "ANY" } ] }

[[providers.gcp.blocks.nested.nested.nested]]
block = "expr"

[providers.gcp.blocks.nested.nested.nested.args.expression]
if   = { all = [ { item = "paths" }, { item = "method", equals = "ANY" } ] }
then = { func = "join", args = [ { value = " || " }, { func = "formatlist", args = [ { value = "request.path.startsWith('%s')" }, { item = "paths" } ] } ] }
else = { if = { not = { item = "paths" } }, then = { func = "format", args = [ { value = "request.method == '%s'" }, { item = "method" } ] }, else = { func = "format", args = [ { value = "(%s) && request.method == '%s'" }, { func = "join", args = [ { value = " || " }, { func = "formatlist", args = [ { value = "request.path.startsWith('%s')" }, { item = "paths" } ] } ] }, { item = "method" } ] } }

[[providers.gcp.blocks.nested.nested]]
block = "rate_limit_options"

[providers.gcp.blocks.nested.nested.args]
conform_action   = { value = "allow" }
exceed_action    = { value = "deny(429)" }
enforce_on_key   = { value = "IP" }
ban_duration_sec = { value = 600 }

[[providers.gcp.blocks.nested.nested.nested]]
block = "rate_limit_threshold"

[providers.gcp.blocks.nested.nested.nested.args]
count        = { item = "limit" }
interval_sec = { value = 300 }

# Cloud Armor requires a catch-all rule at the lowest priority.
[[providers.gcp.blocks.nested]]
block = "rule"

[providers.gcp.blocks.nested.args]
action      = { value = "allow" }
priority    = { value = 2147483647 }
description = { value = "default allow" }

[[providers.gcp.blocks.nested.nested]]
block = "match"

[providers.gcp.blocks.nested.nested.args]
versioned_expr = { value = "SRC_IPS_V1" }

[[providers.gcp.blocks.nested.nested.nested]]
block = "config"

[providers.gcp.blocks.nested.nested.nested.args]
src_ip_ranges = { value = ["*"] }

[providers.gcp.outputs]
id = { attr = "id", description = "Cloud Armor policy id" }

[[providers.gcp.checks]]
for_each_field = "managed_rules"
when = { all = [
  { item = "value", not_equals = "AWSManagedRulesCommonRuleSet" },
  { item = "value", not_equals = "AWSManagedRulesKnownBadInputsRuleSet" },
  { item = "value", not_equals = "AWSManagedRulesSQLiRuleSet" },
  { item = "value", not_equals = "AWSManagedRulesLinuxRuleSet" },
  { item = "value", not_equals = "AWSManagedRulesPHPRuleSet" },
] }
message = "\"{name}\": Cloud Armor has no preconfigured equivalent for \"{item.value}\"; that rule group is dropped on Google Cloud"

[[providers.gcp.checks]]
when = { all = [ { relation = "attachment", target_type = "load_balancer", absent = true }, { relation = "attribute_reference", incoming = true, target_type = "cdn", absent = true } ] }
message = "\"{name}\" protects nothing: link 'Protects' to a load balancer or 'Protected by' from a CDN; no security policy is generated until one exists"

[[providers.gcp.manual_steps]]
title = "Attach the policy to a passthrough load balancer"
when = { relation = "attachment", target_type = "load_balancer", target_field = "protocol", not_equals = "https" }
body = """
A protected load balancer whose protocol is http or tcp is a regional passthrough Network
Load Balancer, and Cloud Armor's WAF and rate-limit rules only run on an Application Load
Balancer's backend service. Set the load balancer's protocol to https — the global HTTPS
load balancer then attaches this policy itself — or put the backends behind a native
Application Load Balancer and set its backend service's `security_policy` to this id.
"""
