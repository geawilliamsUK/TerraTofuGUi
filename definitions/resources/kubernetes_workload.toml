# Abstract type: Kubernetes Workload  (schema_version 2)
#
# A deployment running *inside* a cluster, drawn so that its cloud permissions can be
# generated. The manifests stay in the repository; what the diagram owns is the identity
# plumbing and the least-privilege policy that the links imply — exactly what
# `function.toml` does for a Lambda, one layer up.
#
#   AWS:   aws_eks_pod_identity_association (cluster / namespace / service account -> role)
#          plus one aws_iam_role_policy on the linked role, built from the links.
#   Azure: azurerm_federated_identity_credential on the linked user-assigned identity
#          (issuer = the cluster's OIDC issuer, subject = system:serviceaccount:<ns>/<sa>)
#          plus one azurerm_role_assignment per linked resource.
#   GCP:   google_service_account_iam_member granting the Kubernetes service account
#          roles/iam.workloadIdentityUser on the linked service account, plus one IAM
#          member per linked resource.
#
# Every provider is `partial`: the Deployment and its ServiceAccount are yours to apply,
# and each provider needs a specific annotation or label on them.
#
# The links are deliberately split by intent: 'Uses' is read *and* write, 'Reads' is
# read-only, and deleting objects is a separate switch, so a bucket link cannot quietly
# hand a service the right to erase what it wrote. 'Calls' is documentation only.

schema_version = 2

[resource]
type = "kubernetes_workload"
category = "container"
display_name = "Kubernetes Workload"
description = "A deployment inside a Kubernetes cluster. Link the cluster it runs on, the role it runs as, and the queues, secrets and buckets it uses; the identity binding and a least-privilege policy are generated."
kind = "node"
allowed_parents = ["resource_group", "virtual_network"]
network_agnostic = true
icon = "POD"

[[fields]]
name = "namespace"
label = "Namespace"
type = "string"
required = true
default = "default"
pattern = "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$"
pattern_hint = "a Kubernetes namespace: lowercase letters, digits and hyphens"

[[fields]]
name = "service_account"
label = "Service account"
type = "string"
pattern = "^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$"
pattern_hint = "a Kubernetes service account name: lowercase letters, digits, hyphens and dots"
description = "Defaults to the display name in kebab case. This is the ServiceAccount the pods must use."

[[fields]]
name = "delete_objects"
label = "May delete objects"
type = "bool"
default = false
description = "Add delete permission to the read/write bucket grant. Off by default: a service that writes new objects rarely needs to erase the ones already there, and the difference is exactly what a compromised pod would use."

[[fields]]
name = "db_user"
label = "Database user"
type = "string"
pattern = "^[A-Za-z0-9_@.-]{1,63}$"
pattern_hint = "a database user name"
description = "The user the pods authenticate as when a linked database has IAM / directory authentication switched on. Defaults to the service account name."

[[relations]]
kind = "attachment"
label = "Runs on"
targets = ["kubernetes_cluster"]
cardinality = "one"

[[relations]]
kind = "attachment"
label = "Mounts (file system)"
targets = ["file_system"]
cardinality = "many"

[[relations]]
kind = "iam_binding"
label = "Runs as role / identity"
targets = ["iam_role"]
cardinality = "one"

[[relations]]
kind = "attribute_reference"
label = "Uses (read / write): queue, database, cache, bucket"
targets = ["event_queue", "relational_database", "cache", "object_storage"]
cardinality = "many"

[[relations]]
kind = "sends_to"
label = "Sends to (queue, topic)"
targets = ["event_queue", "topic"]
cardinality = "many"

[[relations]]
kind = "reads"
label = "Reads secrets"
targets = ["secret"]
cardinality = "many"

# The same kind, a second declaration with its own targets: a bucket reached through
# 'Reads' is read-only, where an 'Uses' bucket is read and write.
[[relations]]
kind = "reads"
label = "Reads (read-only bucket)"
targets = ["object_storage"]
cardinality = "many"

[[relations]]
kind = "logs_to"
label = "Logs to"
targets = ["log_group"]
cardinality = "many"

# Documentation only: nothing is generated, no depends_on, no manual step. It records
# which service talks to which so the diagram answers "what breaks if this one does".
[[relations]]
kind = "calls"
label = "Calls (documentation only)"
targets = ["kubernetes_workload"]
cardinality = "many"

# ---------------------------------------------------------------- AWS
[providers.aws]
status = "partial"
file = "container"

[[providers.aws.checks]]
when = { relation = "iam_binding", target_field = "trusted_service", not_equals = "kubernetes" }
severity = "error"
message = "\"{name}\" runs as a role that pods cannot assume; set the linked Role's 'Assumable by' to kubernetes so its trust policy names pods.eks.amazonaws.com"

# The account and region only matter for the rds-db:connect ARN, which cannot be built
# from a resource attribute: it names the database user, not the instance.
[[providers.aws.data]]
key = "account"
resource = "aws_caller_identity"
when = { relation = "attribute_reference", target_type = "relational_database", target_field = "iam_authentication" }

[[providers.aws.data]]
key = "region"
resource = "aws_region"
when = { relation = "attribute_reference", target_type = "relational_database", target_field = "iam_authentication" }

[[providers.aws.blocks]]
key = "main"
resource = "aws_eks_pod_identity_association"

[providers.aws.blocks.args]
cluster_name    = { relation = "attachment", target_type = "kubernetes_cluster", attr = "name" }
namespace       = { field = "namespace" }
service_account = { field = "service_account", fallback = { field = "name", transform = "kebab" } }
role_arn        = { relation = "iam_binding", attr = "arn" }
tags            = { object = { Name = { field = "name" } } }

# Least-privilege inline policy on the linked role, derived from this workload's links.
[[providers.aws.blocks]]
key = "policy"
resource = "aws_iam_role_policy"
when = { any = [ { relation = "attribute_reference", target_type = "event_queue" }, { relation = "attribute_reference", target_type = "object_storage" }, { relation = "attribute_reference", target_type = "relational_database", target_field = "iam_authentication" }, { relation = "sends_to", target_type = "event_queue" }, { relation = "sends_to", target_type = "topic" }, { relation = "reads" }, { relation = "logs_to" }, { relation = "attachment", target_type = "file_system" } ] }

[providers.aws.blocks.args]
name = { template = "{name}-policy", transform = "kebab" }
role = { relation = "iam_binding", attr = "id" }

[providers.aws.blocks.args.policy]
func = "jsonencode"

[[providers.aws.blocks.args.policy.args]]
[providers.aws.blocks.args.policy.args.object]
Version = { value = "2012-10-17" }

# Consume the queue(s) it reads from.
[[providers.aws.blocks.args.policy.args.object.Statement.list]]
if = { relation = "attribute_reference", target_type = "event_queue" }
then = { object = { Sid = { value = "QueueConsume" }, Effect = { value = "Allow" }, Action = { value = ["sqs:ReceiveMessage", "sqs:DeleteMessage", "sqs:GetQueueAttributes", "sqs:GetQueueUrl"] }, Resource = { relation = "attribute_reference", target_type = "event_queue", attr = "arn", wrap = "list" } } }

# Publish to the queue(s) it sends to.
[[providers.aws.blocks.args.policy.args.object.Statement.list]]
if = { relation = "sends_to", target_type = "event_queue" }
then = { object = { Sid = { value = "QueueSend" }, Effect = { value = "Allow" }, Action = { value = ["sqs:SendMessage", "sqs:GetQueueUrl", "sqs:GetQueueAttributes"] }, Resource = { relation = "sends_to", target_type = "event_queue", attr = "arn", wrap = "list" } } }

# Publish to the topic(s) it sends to.
[[providers.aws.blocks.args.policy.args.object.Statement.list]]
if = { relation = "sends_to", target_type = "topic" }
then = { object = { Sid = { value = "TopicPublish" }, Effect = { value = "Allow" }, Action = { value = ["sns:Publish"] }, Resource = { relation = "sends_to", target_type = "topic", attr = "arn", wrap = "list" } } }

# Read the secrets it reads.
[[providers.aws.blocks.args.policy.args.object.Statement.list]]
if = { relation = "reads", target_type = "secret" }
then = { object = { Sid = { value = "Secrets" }, Effect = { value = "Allow" }, Action = { value = ["secretsmanager:GetSecretValue", "secretsmanager:DescribeSecret"] }, Resource = { relation = "reads", target_type = "secret", attr = "arn", wrap = "list" } } }

# Read / write the bucket(s) it uses. `s3:DeleteObject` is only granted when the workload
# says it deletes objects, so the common case cannot erase what it wrote.
[[providers.aws.blocks.args.policy.args.object.Statement.list]]
if = { relation = "attribute_reference", target_type = "object_storage" }
then = { object = { Sid = { value = "Bucket" }, Effect = { value = "Allow" }, Action = { if = { field = "delete_objects" }, then = { value = ["s3:GetObject", "s3:PutObject", "s3:DeleteObject", "s3:ListBucket"] }, else = { value = ["s3:GetObject", "s3:PutObject", "s3:ListBucket"] } }, Resource = { func = "concat", args = [ { relation = "attribute_reference", target_type = "object_storage", attr = "arn", wrap = "list" }, { func = "formatlist", args = [ { value = "%s/*" }, { relation = "attribute_reference", target_type = "object_storage", attr = "arn", wrap = "list" } ] } ] } } }

# Read-only bucket(s): the 'Reads' link says this workload must not change them.
[[providers.aws.blocks.args.policy.args.object.Statement.list]]
if = { relation = "reads", target_type = "object_storage" }
then = { object = { Sid = { value = "BucketRead" }, Effect = { value = "Allow" }, Action = { value = ["s3:GetObject", "s3:ListBucket"] }, Resource = { func = "concat", args = [ { relation = "reads", target_type = "object_storage", attr = "arn", wrap = "list" }, { func = "formatlist", args = [ { value = "%s/*" }, { relation = "reads", target_type = "object_storage", attr = "arn", wrap = "list" } ] } ] } } }

# Ship logs to the linked group(s): the group ARN for the group itself, `<arn>:*` for the
# streams inside it, which is where the log lines actually go.
[[providers.aws.blocks.args.policy.args.object.Statement.list]]
if = { relation = "logs_to" }
then = { object = { Sid = { value = "Logs" }, Effect = { value = "Allow" }, Action = { value = ["logs:CreateLogStream", "logs:PutLogEvents", "logs:DescribeLogStreams"] }, Resource = { func = "concat", args = [ { relation = "logs_to", attr = "arn", wrap = "list" }, { func = "formatlist", args = [ { value = "%s:*" }, { relation = "logs_to", attr = "arn", wrap = "list" } ] } ] } } }

# Mount the linked EFS file system(s). ClientRootAccess is what lets a container write as
# a user other than the one the access point pins; drop it if the pods run unprivileged.
[[providers.aws.blocks.args.policy.args.object.Statement.list]]
if = { relation = "attachment", target_type = "file_system" }
then = { object = { Sid = { value = "FileSystem" }, Effect = { value = "Allow" }, Action = { value = ["elasticfilesystem:ClientMount", "elasticfilesystem:ClientWrite", "elasticfilesystem:ClientRootAccess"] }, Resource = { relation = "attachment", target_type = "file_system", attr = "arn", wrap = "list" } } }

# A database with IAM authentication is reached with the role itself. The resource names
# the *database user*, not the instance, so the ARN is assembled rather than referenced.
[[providers.aws.blocks.args.policy.args.object.Statement.list]]
if = { relation = "attribute_reference", target_type = "relational_database", target_field = "iam_authentication" }
then = { object = { Sid = { value = "DatabaseConnect" }, Effect = { value = "Allow" }, Action = { value = ["rds-db:connect"] }, Resource = { func = "formatlist", args = [ { value = "arn:aws:rds-db:%s:%s:dbuser:%s/%s" }, { self_data = "region", attr = "name" }, { self_data = "account", attr = "account_id" }, { relation = "attribute_reference", target_type = "relational_database", attr = "resource_id", wrap = "list" }, { field = "db_user", fallback = { field = "service_account", fallback = { field = "name", transform = "kebab" } } } ] } } }

[providers.aws.outputs]
service_account = { attr = "service_account", description = "ServiceAccount the pods must run as" }

[[providers.aws.manual_steps]]
title = "Apply the Deployment and its ServiceAccount"
body = """
The association binds `<namespace>/<service account>` in the cluster to the IAM role. The
ServiceAccount and the Deployment that uses it are not generated: apply a ServiceAccount of
that exact name in that namespace and set `serviceAccountName` on the pod template. EKS Pod
Identity needs no annotation on the ServiceAccount, but the cluster **must** run the
`eks-pod-identity-agent` add-on — tick it in the cluster's Add-ons field.
"""

[[providers.aws.manual_steps]]
title = "Database access is not an IAM grant"
when = { relation = "attribute_reference", target_type = "relational_database", target_field = "iam_authentication", not_equals = "true" }
body = """
No policy statement is generated for the linked database: RDS wants a user name and a
password unless IAM database authentication is on. Put the credentials in a Secret and link
it with 'Reads', or tick **IAM / directory authentication** on the database — an
`rds-db:connect` statement for this workload's database user is then generated instead.
"""

[[providers.aws.manual_steps]]
title = "Create the database user the role connects as"
when = { relation = "attribute_reference", target_type = "relational_database", target_field = "iam_authentication" }
body = """
The policy grants `rds-db:connect` on
`arn:aws:rds-db:<region>:<account>:dbuser:<instance resource id>/<database user>`, with the
database user taken from the workload's **Database user** field (the service account name
by default). That user has to exist inside the database and be told to trust IAM:

    CREATE USER "<database user>";
    GRANT rds_iam TO "<database user>";          -- PostgreSQL
    CREATE USER '<database user>' IDENTIFIED WITH AWSAuthenticationPlugin AS 'RDS';  -- MySQL

The pods then fetch a token (`aws rds generate-db-auth-token`, or the SDK's signer) and use
it as the password. TLS is mandatory for IAM authentication.
"""

[[providers.aws.manual_steps]]
title = "Cache access is not an IAM grant"
when = { relation = "attribute_reference", target_type = "cache" }
body = """
No policy statement is generated for a linked cache: ElastiCache has no IAM data plane
for the engines this type creates. Link a Secret holding the auth token instead.
"""

[[providers.aws.manual_steps]]
title = "Forward the container logs to the log group"
when = { relation = "logs_to" }
body = """
The policy lets these pods create streams and put events in the linked log group, but
nothing in the cluster forwards container logs on its own. Install **Fluent Bit** (the
`aws-for-fluent-bit` chart) or the CloudWatch agent as a DaemonSet, point its `cloudwatch_logs`
output at the group's name, and give its ServiceAccount this workload's role — or, more
usually, a role of its own with the same statement. Nothing else needs the credentials:
the agent picks them up from EKS Pod Identity.
"""

[[providers.aws.manual_steps]]
title = "Mount the file system with the EFS CSI driver"
when = { relation = "attachment", target_type = "file_system" }
body = """
The policy lets these pods mount the linked EFS file system; the volume itself is a
Kubernetes object. Tick `efs_csi` in the cluster's **Add-ons**, then apply a StorageClass,
a PersistentVolume and a claim, taking the file system id from the generated
`<file system>_id` output:

    apiVersion: v1
    kind: PersistentVolume
    metadata:
      name: models
    spec:
      capacity: { storage: 100Gi }
      accessModes: [ReadWriteMany]
      persistentVolumeReclaimPolicy: Retain
      storageClassName: efs-sc
      csi:
        driver: efs.csi.aws.com
        volumeHandle: <the file system id>
    ---
    apiVersion: v1
    kind: PersistentVolumeClaim
    metadata: { name: models, namespace: <namespace> }
    spec:
      accessModes: [ReadWriteMany]
      storageClassName: efs-sc
      resources: { requests: { storage: 100Gi } }

and mount the claim in the pod template. The mount targets must sit in subnets the nodes
can reach, and their security group must allow TCP 2049 from the nodes.
"""

# ---------------------------------------------------------------- Azure
[providers.azure]
status = "partial"
file = "container"

[[providers.azure.blocks]]
key = "main"
resource = "azurerm_federated_identity_credential"

[providers.azure.blocks.args]
name                = { template = "{name}-fic", transform = "kebab" }
resource_group_name = { ancestor = "resource_group", attr = "name" }
parent_id           = { relation = "iam_binding", attr = "id" }
audience            = { value = ["api://AzureADTokenExchange"] }
issuer              = { relation = "attachment", target_type = "kubernetes_cluster", attr = "oidc_issuer_url" }
subject             = { func = "format", args = [ { value = "system:serviceaccount:%s:%s" }, { field = "namespace" }, { field = "service_account", fallback = { field = "name", transform = "kebab" } } ] }

# Least-privilege role assignments for the identity, one per linked resource.
[[providers.azure.blocks]]
key = "send"
resource = "azurerm_role_assignment"
for_each_relation = "sends_to"
for_each_target_type = "event_queue"

[providers.azure.blocks.args]
scope                = { target = "id" }
role_definition_name = { value = "Azure Service Bus Data Sender" }
principal_id         = { relation = "iam_binding", attr = "principal_id" }

[[providers.azure.blocks]]
key = "publish"
resource = "azurerm_role_assignment"
for_each_relation = "sends_to"
for_each_target_type = "topic"

[providers.azure.blocks.args]
scope                = { target = "id" }
role_definition_name = { value = "Azure Service Bus Data Sender" }
principal_id         = { relation = "iam_binding", attr = "principal_id" }

[[providers.azure.blocks]]
key = "receive"
resource = "azurerm_role_assignment"
for_each_relation = "attribute_reference"
for_each_target_type = "event_queue"

[providers.azure.blocks.args]
scope                = { target = "id" }
role_definition_name = { value = "Azure Service Bus Data Receiver" }
principal_id         = { relation = "iam_binding", attr = "principal_id" }

[[providers.azure.blocks]]
key = "secret_read"
resource = "azurerm_role_assignment"
for_each_relation = "reads"
for_each_target_type = "secret"

[providers.azure.blocks.args]
scope                = { target = "id" }
role_definition_name = { value = "Key Vault Secrets User" }
principal_id         = { relation = "iam_binding", attr = "principal_id" }

# A 'Reads' bucket is read-only: the reader role cannot write or delete.
[[providers.azure.blocks]]
key = "blob_read"
resource = "azurerm_role_assignment"
for_each_relation = "reads"
for_each_target_type = "object_storage"

[providers.azure.blocks.args]
scope                = { target = "id" }
role_definition_name = { value = "Storage Blob Data Reader" }
principal_id         = { relation = "iam_binding", attr = "principal_id" }

[[providers.azure.blocks]]
key = "blob"
resource = "azurerm_role_assignment"
for_each_relation = "attribute_reference"
for_each_target_type = "object_storage"

[providers.azure.blocks.args]
scope                = { target = "id" }
role_definition_name = { value = "Storage Blob Data Contributor" }
principal_id         = { relation = "iam_binding", attr = "principal_id" }

[providers.azure.outputs]
subject = { attr = "subject", description = "Service account the pods must run as (system:serviceaccount:<ns>:<sa>)" }

[[providers.azure.manual_steps]]
title = "Label the pods and annotate the ServiceAccount"
body = """
Azure workload identity only injects a token into pods that ask for it. On the pod
template add the label

    azure.workload.identity/use: "true"

and annotate the ServiceAccount `<namespace>/<service account>` with

    azure.workload.identity/client-id: <client id of the linked identity>

taking the client id from the linked Role's managed identity (its `client_id` output).
"""

[[providers.azure.manual_steps]]
title = "Database access is not a role assignment"
when = { relation = "attribute_reference", target_type = "relational_database", target_field = "iam_authentication", not_equals = "true" }
body = """
No role assignment is generated for the linked database: a flexible server is reached with
a login and password unless directory authentication is on. Link a Secret with the
credentials, or tick **IAM / directory authentication** on the database.
"""

[[providers.azure.manual_steps]]
title = "Map the identity to a database role"
when = { relation = "attribute_reference", target_type = "relational_database", target_field = "iam_authentication" }
body = """
The server accepts Microsoft Entra tokens, but this identity still needs a principal
inside the database. With an Entra administrator on the server, run

    SELECT * FROM pgaadauth_create_principal('<identity name>', false, false);
    GRANT ... TO "<identity name>";

then have the pods request a token for `https://ossrdbms-aad.database.windows.net` and use
it as the password. The user name is the identity's name, not the **Database user** field
(which is an AWS concept).
"""

[[providers.azure.manual_steps]]
title = "Cache access is not a role assignment"
when = { relation = "attribute_reference", target_type = "cache" }
body = """
No role assignment is generated for a linked cache: Azure Cache for Redis authenticates
with access keys. Link a Secret with the key instead.
"""

[[providers.azure.manual_steps]]
title = "A blob contributor may also delete"
when = { all = [ { relation = "attribute_reference", target_type = "object_storage" }, { field = "delete_objects", equals = "false" } ] }
body = """
This workload is marked as not deleting objects, but Azure has no built-in role between
*Storage Blob Data Reader* and *Storage Blob Data Contributor*: the assignment generated
for an 'Uses' bucket carries `.../blobs/delete`. Either accept it, or replace the
assignment with a custom role definition that omits that action and
`.../blobs/deleteBlobVersion`. Link the bucket with 'Reads' instead when the workload only
reads it — that generates the reader role.
"""

[[providers.azure.manual_steps]]
title = "Container logs reach the workspace through the cluster"
when = { relation = "logs_to" }
body = """
Nothing is generated for this link. On AKS container logs are collected by **Container
Insights**, which runs as the *cluster's* add-on and writes with the *cluster's* identity,
not this workload's: switch on **Container Insights** on the Kubernetes Cluster and link the
same Log Analytics workspace there. The pods then need no credentials of their own; what
this link records is which workspace the logs are expected to land in.
"""

[[providers.azure.manual_steps]]
title = "Mount the file system with the Azure Files CSI driver"
when = { relation = "attachment", target_type = "file_system" }
body = """
Nothing is generated for this link: an Azure Files NFS share is mounted with the built-in
`file.csi.azure.com` driver, which reads the storage account key from a Kubernetes Secret
rather than from this workload's identity. Create that Secret (`azurestorageaccountname` /
`azurestorageaccountkey`), then a PersistentVolume with `csi.driver: file.csi.azure.com`,
`volumeHandle: <resource group>#<account>#<share>` and `mountOptions` of
`vers=4,minorversion=1,sec=sys`, and a claim for the pods. The share is only reachable
over a private route — see the File System's own manual step.
"""

# ---------------------------------------------------------------- GCP
[providers.gcp]
status = "partial"
file = "container"
notes = "The Kubernetes service account is bound to the linked Google service account with roles/iam.workloadIdentityUser; the links become IAM members on each resource."

[[providers.gcp.blocks]]
key = "main"
resource = "google_service_account_iam_member"

[providers.gcp.blocks.args]
service_account_id = { relation = "iam_binding", attr = "name" }
role               = { value = "roles/iam.workloadIdentityUser" }
# The member is `<workload pool>[<namespace>/<service account>]`, and the pool is read off
# the cluster rather than rebuilt from var.project, so the binding follows the cluster.
member             = { func = "format", args = [ { value = "serviceAccount:%s[%s/%s]" }, { relation = "attachment", target_type = "kubernetes_cluster", attr = "workload_identity_config.0.workload_pool" }, { field = "namespace" }, { field = "service_account", fallback = { field = "name", transform = "kebab" } } ] }

[[providers.gcp.blocks]]
key = "publish"
resource = "google_pubsub_topic_iam_member"
for_each_relation = "sends_to"
for_each_target_type = "event_queue"

[providers.gcp.blocks.args]
topic  = { target = "id" }
role   = { value = "roles/pubsub.publisher" }
member = { relation = "iam_binding", attr = "member" }

[[providers.gcp.blocks]]
key = "publish_topic"
resource = "google_pubsub_topic_iam_member"
for_each_relation = "sends_to"
for_each_target_type = "topic"

[providers.gcp.blocks.args]
topic  = { target = "id" }
role   = { value = "roles/pubsub.publisher" }
member = { relation = "iam_binding", attr = "member" }

[[providers.gcp.blocks]]
key = "consume"
resource = "google_pubsub_subscription_iam_member"
for_each_relation = "attribute_reference"
for_each_target_type = "event_queue"

[providers.gcp.blocks.args]
subscription = { target = "id", block = "sub" }
role         = { value = "roles/pubsub.subscriber" }
member       = { relation = "iam_binding", attr = "member" }

[[providers.gcp.blocks]]
key = "secret_read"
resource = "google_secret_manager_secret_iam_member"
for_each_relation = "reads"
for_each_target_type = "secret"

[providers.gcp.blocks.args]
secret_id = { target = "id" }
role      = { value = "roles/secretmanager.secretAccessor" }
member    = { relation = "iam_binding", attr = "member" }

# A 'Reads' bucket is read-only.
[[providers.gcp.blocks]]
key = "bucket_read"
resource = "google_storage_bucket_iam_member"
for_each_relation = "reads"
for_each_target_type = "object_storage"

[providers.gcp.blocks.args]
bucket = { target = "name" }
role   = { value = "roles/storage.objectViewer" }
member = { relation = "iam_binding", attr = "member" }

# Read / write without delete is objectViewer + objectCreator; objectAdmin is the only
# built-in role that also deletes, so it is used exactly when the workload asks for it.
[[providers.gcp.blocks]]
key = "bucket_rw"
resource = "google_storage_bucket_iam_member"
for_each_relation = "attribute_reference"
for_each_target_type = "object_storage"

[providers.gcp.blocks.args]
bucket = { target = "name" }
role   = { if = { field = "delete_objects" }, then = { value = "roles/storage.objectAdmin" }, else = { value = "roles/storage.objectCreator" } }
member = { relation = "iam_binding", attr = "member" }

[[providers.gcp.blocks]]
key = "bucket_rw_read"
resource = "google_storage_bucket_iam_member"
for_each_relation = "attribute_reference"
for_each_target_type = "object_storage"
when = { field = "delete_objects", not_equals = "true" }

[providers.gcp.blocks.args]
bucket = { target = "name" }
role   = { value = "roles/storage.objectViewer" }
member = { relation = "iam_binding", attr = "member" }

# Writing to Cloud Logging is a project-level role: there is no per-bucket log writer.
[[providers.gcp.blocks]]
key = "log_writer"
resource = "google_project_iam_member"
when = { relation = "logs_to" }

[providers.gcp.blocks.args]
project = { var = "project" }
role    = { value = "roles/logging.logWriter" }
member  = { relation = "iam_binding", attr = "member" }

[providers.gcp.outputs]
member = { attr = "member", description = "Workload identity member (serviceAccount:<workload pool>[<ns>/<sa>])" }

[[providers.gcp.manual_steps]]
title = "Annotate the ServiceAccount"
body = """
Create the ServiceAccount `<namespace>/<service account>` in the cluster and annotate it

    iam.gke.io/gcp-service-account: <email of the linked service account>

taking the email from the linked Role's `email` output, then set `serviceAccountName` on
the pod template. Without the annotation the pods fall back to the node's service account.
"""

[[providers.gcp.manual_steps]]
title = "Database access is not an IAM grant"
when = { relation = "attribute_reference", target_type = "relational_database", target_field = "iam_authentication", not_equals = "true" }
body = """
No IAM member is generated for the linked database. Cloud SQL accepts the service account
through the Cloud SQL Auth Proxy with `roles/cloudsql.client`, which also needs the proxy as
a sidecar; without it the instance wants a password. Link a Secret with the credentials, or
tick **IAM / directory authentication** on the database.
"""

[[providers.gcp.manual_steps]]
title = "Grant the service account the Cloud SQL instance-user role"
when = { relation = "attribute_reference", target_type = "relational_database", target_field = "iam_authentication" }
body = """
The instance has `cloudsql.iam_authentication` on, so this service account can log in with
an OAuth token — once it is a database user (a `google_sql_user` of type
`CLOUD_IAM_SERVICE_ACCOUNT`, named with the account's email minus the
`.gserviceaccount.com` suffix) and holds `roles/cloudsql.instanceUser` plus
`roles/cloudsql.client` on the project. Neither is generated here, because both are
project-level grants rather than links in the diagram.
"""

[[providers.gcp.manual_steps]]
title = "Cache access is not an IAM grant"
when = { relation = "attribute_reference", target_type = "cache" }
body = """
No IAM member is generated for a linked cache: Memorystore has no IAM data plane. Link a
Secret with the auth string instead.
"""

[[providers.gcp.manual_steps]]
title = "roles/logging.logWriter is project-wide"
when = { relation = "logs_to" }
body = """
Cloud Logging has no per-bucket write permission: the generated
`google_project_iam_member` lets this workload write **any** log in the project, and the
linked Log Group only decides where the entries are kept. Route them there with a log sink
whose filter matches this workload (`resource.labels.namespace_name` /
`labels."k8s-pod/app"`), and remember that GKE already forwards container stdout with the
node's own identity, so this grant is only needed when the pods call the Logging API
themselves.
"""

[[providers.gcp.manual_steps]]
title = "Mount the file system with the Filestore CSI driver"
when = { relation = "attachment", target_type = "file_system" }
body = """
Nothing is generated for this link: a Filestore share is mounted with the
`filestore.csi.storage.gke.io` driver, which needs no identity of its own — the nodes reach
the instance over the VPC. Switch on the Filestore CSI driver in the cluster
(`addons_config.gcp_filestore_csi_driver_config`), then create a PersistentVolume with
`volumeHandle: modeInstance/<zone>/<instance>/share` and a claim for the pods, taking the
address from the File System's own manual step.
"""
