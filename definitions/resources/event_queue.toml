# Abstract type: Event Queue
#
# AWS: aws_sqs_queue (standard or FIFO). Azure: azurerm_servicebus_namespace + azurerm_servicebus_queue.
#
# This is the portable queue. For Azure Storage Account queues use the Azure-only
# `storage_queue` type; for fan-out use `topic`.

schema_version = 2

[resource]
type = "event_queue"
category = "serverless"
display_name = "Event Queue"
description = "A message queue (SQS / Service Bus). Functions 'Send to' it and are triggered by it via 'Uses'. Provider options: FIFO on AWS, namespace SKU on Azure."
kind = "node"
allowed_parents = ["resource_group", "virtual_network", "servicebus_namespace"]
network_agnostic = true
icon = "Q"

[[fields]]
name = "visibility_timeout_seconds"
label = "Visibility timeout (s)"
type = "int"
required = true
default = 30
description = "How long a received message stays hidden from other consumers (max 300 on Azure)."

[[fields]]
name = "message_retention_seconds"
label = "Message retention (s)"
type = "int"
default = 345600
description = "How long an unprocessed message is kept before the service discards it. Four days by default; SQS allows up to 14 days, Pub/Sub up to 31."

[[fields]]
name = "receive_wait_time_seconds"
label = "Long-poll wait (s)"
type = "int"
default = 20
description = "How long a receive call waits for a message before returning empty. 20 seconds is long polling, which costs far fewer empty receives than 0."

[[fields]]
name = "max_receives"
label = "Deliveries before dead-lettering"
type = "int"
default = 5
description = "How often one message may be received and not deleted before it is moved to the dead-letter queue. Only used when a 'Dead-letters to' link exists; Pub/Sub requires at least 5."

[[relations]]
kind = "encrypted_with"
label = "Encrypted with"
providers = ["aws", "gcp"]
targets = ["encryption_key"]
cardinality = "optional"

[[relations]]
kind = "dead_letters_to"
label = "Dead-letters to"
targets = ["event_queue"]
cardinality = "optional"

# ---------------------------------------------------------------- AWS
[providers.aws]
status = "full"

[[providers.aws.fields]]
name = "fifo"
label = "FIFO queue"
type = "bool"
default = false
description = "Strict ordering and exactly-once processing (content-based deduplication). The queue name gets the required `.fifo` suffix."

[[providers.aws.blocks]]
key = "main"
resource = "aws_sqs_queue"

[providers.aws.blocks.args]
name                        = { if = { provider_field = "fifo" }, then = { func = "format", args = [ { value = "%s.fifo" }, { field = "name", transform = "kebab" } ] }, else = { field = "name", transform = "kebab" } }
fifo_queue                  = { if = { provider_field = "fifo" }, then = { value = true } }
content_based_deduplication = { if = { provider_field = "fifo" }, then = { value = true } }
visibility_timeout_seconds  = { field = "visibility_timeout_seconds" }
message_retention_seconds   = { field = "message_retention_seconds", fallback = { value = 345600 } }
receive_wait_time_seconds   = { field = "receive_wait_time_seconds", fallback = { value = 20 } }
kms_master_key_id           = { relation = "encrypted_with", attr = "arn", optional = true }
redrive_policy              = { if = { relation = "dead_letters_to" }, then = { func = "jsonencode", args = [ { object = { deadLetterTargetArn = { relation = "dead_letters_to", attr = "arn" }, maxReceiveCount = { field = "max_receives", fallback = { value = 5 } } } } ] } }
tags                        = { object = { Name = { field = "name" } } }

[providers.aws.outputs]
url = { attr = "url", description = "Queue URL" }
arn = { attr = "arn", description = "Queue ARN" }

# ---------------------------------------------------------------- Azure
[providers.azure]
status = "full"
notes = "Service Bus data is always encrypted at rest with Microsoft-managed keys, and long polling is a client-side receive timeout rather than a queue setting."

[[providers.azure.checks]]
when = { relation = "encrypted_with" }
message = "\"{name}\" is linked to an Encryption Key, which the Azure mapping cannot use: Service Bus customer-managed keys need a Premium namespace and a user-assigned identity. Messages stay encrypted with Microsoft-managed keys"

# A queue drawn inside a Service Bus Namespace container uses that namespace; otherwise
# it creates one of its own from these two fields.
[[providers.azure.fields]]
name = "namespace_name"
label = "Service Bus namespace"
type = "string"
pattern = "^[a-zA-Z][a-zA-Z0-9-]{4,48}[a-zA-Z0-9]$"
pattern_hint = "6-50 letters, digits and hyphens, starting with a letter; globally unique"
unique_scope = "servicebus_namespace"
description = "Name of the namespace created for this queue. Not needed when the queue sits inside a Service Bus Namespace container."

[[providers.azure.checks]]
when = { all = [ { ancestor = "servicebus_namespace", absent = true }, { provider_field = "namespace_name", absent = true } ] }
severity = "error"
message = "\"{name}\" needs a Service Bus namespace: set its namespace name, or place it inside a Service Bus Namespace container"

[[providers.azure.checks]]
when = { all = [ { relation = "dead_letters_to" }, { target_shares_ancestor = "servicebus_namespace", relation = "dead_letters_to", absent = true } ] }
message = "\"{name}\" dead-letters to a queue in another namespace: Service Bus only auto-forwards dead letters inside one namespace, so messages stay in this queue's own dead-letter sub-queue (draw both queues inside one Service Bus Namespace container to have them forwarded)"

[[providers.azure.fields]]
name = "sku"
label = "Namespace SKU"
type = "enum"
options = ["Basic", "Standard"]
default = "Basic"
description = "Basic is enough for a plain queue. Standard is required when a Topic forwards into this queue, or for sessions and duplicate detection."

[[providers.azure.blocks]]
key = "ns"
resource = "azurerm_servicebus_namespace"
when = { ancestor = "servicebus_namespace", absent = true }

[providers.azure.blocks.args]
name                = { provider_field = "namespace_name" }
location            = { var = "location" }
resource_group_name = { ancestor = "resource_group", attr = "name" }
sku                 = { provider_field = "sku", fallback = { value = "Basic" } }

[[providers.azure.blocks]]
key = "main"
resource = "azurerm_servicebus_queue"

[providers.azure.blocks.args]
name                = { field = "name", transform = "kebab" }
namespace_id        = { if = { ancestor = "servicebus_namespace" }, then = { ancestor = "servicebus_namespace", attr = "id", optional = true }, else = { self_block = "ns", attr = "id" } }
lock_duration       = { template = "PT{visibility_timeout_seconds}S" }
default_message_ttl = { func = "format", args = [ { value = "PT%dS" }, { field = "message_retention_seconds", fallback = { value = 345600 } } ] }
# Dead-lettering: the delivery count is always honoured; auto-forwarding the dead letters
# on to another queue only works inside one namespace, which is what the check is about.
dead_lettering_on_message_expiration = { if = { relation = "dead_letters_to" }, then = { value = true } }
max_delivery_count  = { if = { relation = "dead_letters_to" }, then = { field = "max_receives", fallback = { value = 5 } } }
forward_dead_lettered_messages_to = { if = { target_shares_ancestor = "servicebus_namespace", relation = "dead_letters_to" }, then = { relation = "dead_letters_to", attr = "name" } }

[providers.azure.outputs]
id   = { attr = "id", description = "Queue id" }
name = { attr = "name", description = "Queue name" }

# ---------------------------------------------------------------- GCP
[providers.gcp]
status = "partial"
notes = "A Pub/Sub topic with one pull subscription: publishers use the topic, consumers pull from the subscription. Pull subscriptions block until a message arrives, so long polling needs no setting."

[[providers.gcp.manual_steps]]
title = "Let Pub/Sub use the encryption key"
when = { relation = "encrypted_with" }
body = """
A topic with `kms_key_name` can only be created once the Pub/Sub service agent
(`service-<project number>@gcp-sa-pubsub.iam.gserviceaccount.com`) holds
`roles/cloudkms.cryptoKeyEncrypterDecrypter` on that key. Grant it before the first `apply`.
"""

[[providers.gcp.manual_steps]]
title = "A dead-letter queue shared by several queues is bound more than once"
when = { relation = "dead_letters_to" }
body = """
Each queue that dead-letters into another one generates its own
`google_pubsub_topic_iam_member` granting the Pub/Sub service agent `roles/pubsub.publisher`
on the target topic. The bindings are additive and identical, so if more than one queue
shares a dead-letter queue, delete all but one of them (or move the grant out of the
diagram) before applying.
"""

[[providers.gcp.checks]]
when = { all = [ { relation = "dead_letters_to" }, { field = "max_receives", equals = "1" } ] }
message = "\"{name}\": Pub/Sub needs at least 5 delivery attempts before dead-lettering; raise 'Deliveries before dead-lettering'"

# The project number is needed to name the Pub/Sub service agent the dead-letter policy
# requires; only looked up when there is a dead-letter link.
[[providers.gcp.data]]
key = "project"
resource = "google_project"
when = { relation = "dead_letters_to" }

[providers.gcp.data.args]
project_id = { var = "project" }

[[providers.gcp.blocks]]
key = "main"
resource = "google_pubsub_topic"

[providers.gcp.blocks.args]
name                       = { field = "name", transform = "kebab" }
labels                     = { object = { name = { field = "name", transform = "kebab" } } }
message_retention_duration = { func = "format", args = [ { value = "%ds" }, { field = "message_retention_seconds", fallback = { value = 345600 } } ] }
kms_key_name               = { relation = "encrypted_with", attr = "id", optional = true }

[[providers.gcp.blocks]]
key = "sub"
resource = "google_pubsub_subscription"

[providers.gcp.blocks.args]
name                       = { template = "{name}-sub", transform = "kebab" }
topic                      = { self_block = "main", attr = "id" }
ack_deadline_seconds       = { field = "visibility_timeout_seconds" }
message_retention_duration = { func = "format", args = [ { value = "%ds" }, { field = "message_retention_seconds", fallback = { value = 345600 } } ] }

[[providers.gcp.blocks.nested]]
block = "dead_letter_policy"
when = { relation = "dead_letters_to" }

[providers.gcp.blocks.nested.args]
dead_letter_topic     = { relation = "dead_letters_to", attr = "id" }
max_delivery_attempts = { field = "max_receives", fallback = { value = 5 } }

# Pub/Sub moves a message itself, as its own service agent: it publishes to the
# dead-letter topic and acknowledges on this subscription, so it needs both roles.
[[providers.gcp.blocks]]
key = "dlq_publisher"
resource = "google_pubsub_topic_iam_member"
when = { relation = "dead_letters_to" }

[providers.gcp.blocks.args]
topic  = { relation = "dead_letters_to", attr = "id" }
role   = { value = "roles/pubsub.publisher" }
member = { func = "format", args = [ { value = "serviceAccount:service-%s@gcp-sa-pubsub.iam.gserviceaccount.com" }, { self_data = "project", attr = "number" } ] }

[[providers.gcp.blocks]]
key = "dlq_subscriber"
resource = "google_pubsub_subscription_iam_member"
when = { relation = "dead_letters_to" }

[providers.gcp.blocks.args]
subscription = { self_block = "sub", attr = "name" }
role         = { value = "roles/pubsub.subscriber" }
member       = { func = "format", args = [ { value = "serviceAccount:service-%s@gcp-sa-pubsub.iam.gserviceaccount.com" }, { self_data = "project", attr = "number" } ] }

[providers.gcp.outputs]
topic        = { attr = "id", description = "Topic id (publish here)" }
subscription = { block = "sub", attr = "id", description = "Pull subscription (consume here)" }
