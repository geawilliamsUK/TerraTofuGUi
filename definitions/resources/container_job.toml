# Abstract type: Container Job  (schema_version 2)
#
# A container that runs to completion when something starts it — a database migration
# before a release, a nightly batch — with the same configuration, roles and environment
# as a Container App, and nothing kept running.
#   AWS:   an aws_ecs_task_definition only (no service): CI starts it with
#          `aws ecs run-task`, and the `<job>_run` output holds everything that needs.
#   Azure: an azurerm_container_app_job with a manual trigger.
#   GCP:   a google_cloud_run_v2_job.
#
# The links mean what they mean on a Container App: 'Task role' is what the code runs
# as (optional — a migration that only talks to its database needs none), 'Execution
# role' is what starts it, and 'Uses' / 'Reads' / 'Sends to' become a least-privilege
# policy on the task role. All of that is shared with the app through
# definitions/fragments/container.toml; this file holds what a job does differently.

schema_version = 2

[resource]
type = "container_job"
category = "container"
display_name = "Container Job"
description = "A container run to completion on demand (ECS task / Container Apps job / Cloud Run job): migrations, batches. Draw it inside a Container Environment and link its roles, image registry and secrets."
kind = "node"
allowed_parents = ["resource_group", "virtual_network", "container_environment", "subnet"]
icon = "JOB"

[[fields]]
include = "container.image_field"

[[fields]]
include = "container.image_fields"
with = { noun = "job" }

[[fields]]
name = "timeout_seconds"
label = "Timeout (s)"
type = "int"
default = 1800
description = "A run that takes longer is stopped (Azure: replica timeout; Cloud Run: task timeout). ECS has no limit of its own: the caller has to stop a stuck task."

[[fields]]
name = "retries"
label = "Retries"
type = "int"
default = 0
description = "How often a failed run is retried (Azure, Google Cloud). ECS retries nothing by itself. Keep 0 for anything that must not run twice."

[[fields]]
name = "outbound_public_ip"
label = "Public IP for outbound"
type = "bool"
default = false
description = "Give the task a public IP so it can call out to the internet (image pull, secrets, APIs) from a public subnet with no NAT gateway; it stays unreachable from outside. AWS: the `<job>_run` output says `assign_public_ip = ENABLED`, which `aws ecs run-task` passes on. Azure and Google Cloud jobs reach the internet without one, so there it changes nothing."

[[fields]]
include = "container.env_fields"
with = { noun = "job" }

[[fields]]
include = "container.access_fields"
with = { noun = "job" }

[[relations]]
kind = "iam_binding"
label = "Task role / identity (runs as)"
targets = ["iam_role"]
cardinality = "optional"

[[relations]]
include = "container.relations"

# ---------------------------------------------------------------- AWS
[providers.aws]
status = "partial"
file = "container"
notes = "A Fargate task definition and nothing that runs it: start it with aws ecs run-task. The <job>_run output carries the cluster, the task definition and the network configuration, including whether the task gets a public IP ('Public IP for outbound')."

[[providers.aws.checks]]
when = { all = [ { relation = "iam_binding", absent = true }, { relation = "attribute_reference", target_type = "iam_role", absent = true } ] }
severity = "error"
message = "\"{name}\" has no role: a Fargate task needs an execution role to pull its image and write its logs (link 'Execution role', or a task role that does both)"

[[providers.aws.checks]]
when = { relation = "network_membership", absent = true }
message = "\"{name}\" has no subnets, so the run configuration cannot say where the task runs; link the subnets it should start in"

[[providers.aws.checks]]
include = "container.secret_checks"
with = { noun = "job" }

[[providers.aws.blocks]]
include = "container.ecs_cluster"

[[providers.aws.data]]
include = "container.ecs_account"

[[providers.aws.blocks]]
key = "main"
resource = "aws_ecs_task_definition"

[providers.aws.blocks.args]
include = "container.ecs_task_args"
tags    = { object = { Name = { field = "name" } } }

[providers.aws.blocks.args.container_definitions]
func = "jsonencode"

[[providers.aws.blocks.args.container_definitions.args]]
[[providers.aws.blocks.args.container_definitions.args.list]]
[providers.aws.blocks.args.container_definitions.args.list.object]
name         = { field = "name", transform = "kebab" }
image        = { include = "container.ecs_image", with = { noun = "job" } }
essential    = { value = true }
environment  = { include = "container.ecs_environment" }
secrets      = { include = "container.ecs_secrets" }
logConfiguration = { include = "container.ecs_logs", with = { noun = "job" } }

[[providers.aws.blocks.nested]]
include = "container.ecs_runtime_platform"

# What `aws ecs run-task` needs, in one place for the pipeline to read
# (`<tool> output -json <job>_run`).
[[providers.aws.blocks]]
key = "run"
resource = "terraform_data"

[providers.aws.blocks.args.input]
object.cluster          = { if = { ancestor = "container_environment" }, then = { ancestor = "container_environment", attr = "name", optional = true }, else = { self_block = "cluster", attr = "name" } }
object.task_definition  = { self_block = "main", attr = "arn" }
object.subnets          = { relation = "network_membership", attr = "id", wrap = "list" }
object.security_groups  = { relation = "attribute_reference", target_type = "security_group", attr = "id", wrap = "list" }
object.assign_public_ip = { if = { field = "outbound_public_ip" }, then = { value = "ENABLED" } }

[[providers.aws.blocks]]
include = "container.ecs_grants"

[providers.aws.outputs]
task_definition_arn = { attr = "arn", description = "Task definition ARN (current revision)" }
run                 = { block = "run", attr = "output", description = "What aws ecs run-task needs: cluster, task definition, subnets, security groups", primary = true }

[[providers.aws.manual_steps]]
title = "Start the job with aws ecs run-task"
body = """
Only the task definition is created; nothing runs it. Start it from the pipeline (before
the services roll out, for a migration) with the values of the `<job>_run` output:

    aws ecs run-task --launch-type FARGATE \\
      --cluster <cluster> --task-definition <task definition> \\
      --network-configuration 'awsvpcConfiguration={subnets=[<subnets>],securityGroups=[<security groups>],assignPublicIp=<assign_public_ip>}'

where `<assign_public_ip>` is the output's `assign_public_ip` (`ENABLED` when the job has
'Public IP for outbound', so it can reach the internet without a NAT gateway), or
`DISABLED` when the output has none. Then wait for it (`aws ecs wait tasks-stopped`) and check the container's exit code
(`aws ecs describe-tasks`). The caller needs `ecs:RunTask` on the task definition and
`iam:PassRole` on its roles.
"""

[[providers.aws.manual_steps]]
title = "Make the roles assumable by ECS tasks"
when = { any = [ { relation = "iam_binding", target_field = "trusted_service", not_equals = "container" }, { relation = "attribute_reference", target_type = "iam_role", target_field = "trusted_service", not_equals = "container" } ] }
body = """
Fargate assumes both the task role and the execution role through
`ecs-tasks.amazonaws.com`. Set each linked Role's **Assumable by** field to `container`.
"""

[[providers.aws.manual_steps]]
title = "Let the execution role decrypt the secrets"
when = { relation = "reads", target_type = "secret", where = { relation = "encrypted_with" } }
body = """
A linked Secret is encrypted with a customer-managed key; the execution role reads injected
secrets and also needs `kms:Decrypt` on that key.
"""

[[providers.aws.manual_steps]]
title = "Database access is not an IAM grant"
when = { relation = "attribute_reference", target_type = "relational_database", target_field = "iam_authentication", not_equals = "true", except = { relation = "reads", target_type = "secret", hop = { relation = "reads", target_type = "relational_database" } } }
body = """
No policy statement is generated for the linked database: RDS wants a user name and a
password unless IAM database authentication is on. Inject the connection string from a
Secret as a secret environment variable.
"""

# ---------------------------------------------------------------- Azure
[providers.azure]
status = "full"
file = "container"
notes = "A Container Apps job with a manual trigger, in the enclosing Container Environment (or one of its own). Start it with az containerapp job start. 'Public IP for outbound' changes nothing here: a job reaches the internet through its environment's outbound addresses."

[[providers.azure.checks]]
include = "container.aca_subnet_check"

[[providers.azure.checks]]
include = "container.aca_arm64_check"

[[providers.azure.checks]]
include = "container.secret_checks"
with = { noun = "job" }

[[providers.azure.checks]]
when = { all = [ { field = "secrets" }, { relation = "iam_binding", absent = true }, { relation = "attribute_reference", target_type = "iam_role", absent = true } ] }
severity = "error"
message = "\"{name}\" injects Key Vault secrets but has no identity to read them with; link a task or execution role"

[[providers.azure.blocks]]
include = "container.aca_environment"

[[providers.azure.blocks]]
key = "main"
resource = "azurerm_container_app_job"

[providers.azure.blocks.args]
name                         = { field = "name", transform = "kebab" }
location                     = { var = "location" }
resource_group_name          = { ancestor = "resource_group", attr = "name" }
container_app_environment_id = { if = { ancestor = "container_environment" }, then = { ancestor = "container_environment", attr = "id", optional = true }, else = { self_block = "env", attr = "id" } }
replica_timeout_in_seconds   = { field = "timeout_seconds", fallback = { value = 1800 } }
replica_retry_limit          = { field = "retries", optional = true }
tags                         = { object = { Name = { field = "name" } } }
depends_on                   = { list = [ { if = { field = "secrets" }, then = { self_block = "secret_read", attr = "", wrap = "list" } }, { self_block = "acr_pull", attr = "" } ] }

[[providers.azure.blocks.nested]]
block = "manual_trigger_config"

[providers.azure.blocks.nested.args]
parallelism              = { value = 1 }
replica_completion_count = { value = 1 }

[[providers.azure.blocks.nested]]
block = "template"

[[providers.azure.blocks.nested.nested]]
block = "container"

[providers.azure.blocks.nested.nested.args]
include = "container.aca_container_args"
with = { noun = "job" }

[[providers.azure.blocks.nested.nested.nested]]
include = "container.aca_env"

[[providers.azure.blocks.nested]]
block = "identity"
when = { any = [ { relation = "iam_binding" }, { relation = "attribute_reference", target_type = "iam_role" } ] }

[providers.azure.blocks.nested.args]
type         = { value = "UserAssigned" }
identity_ids = { func = "distinct", args = [ { func = "concat", args = [ { relation = "iam_binding", attr = "id", wrap = "list" }, { relation = "attribute_reference", target_type = "iam_role", attr = "id", wrap = "list" } ] } ] }

[[providers.azure.blocks.nested]]
include = "container.aca_credentials"

[[providers.azure.blocks]]
include = "container.aca_grants"

[providers.azure.outputs]
name = { attr = "name", description = "Job name (az containerapp job start)", primary = true }

[[providers.azure.manual_steps]]
title = "Key Vault secrets hold one value each"
when = { field = "secrets" }
body = """
Each secret variable references a whole Key Vault secret: a row's **JSON key** has no
counterpart on Azure. Store one Key Vault secret per value and name it in the row's
**Secret** column.
"""

[[providers.azure.manual_steps]]
title = "Start the job"
body = """
The job has a manual trigger: start a run from the pipeline with
`az containerapp job start --name <job> --resource-group <resource group>` and follow it
with `az containerapp job execution list`.
"""

# ---------------------------------------------------------------- GCP
[providers.gcp]
status = "full"
file = "container"
notes = "A Cloud Run job; start it with gcloud run jobs execute. Subnets become direct VPC egress. 'Public IP for outbound' changes nothing here: a Cloud Run job reaches the internet without one (with its egress through a linked subnet, that network needs Cloud NAT)."

[[providers.gcp.checks]]
include = "container.cloud_run_arm64_check"

[[providers.gcp.checks]]
include = "container.secret_checks"
with = { noun = "job" }

[[providers.gcp.checks]]
when = { all = [ { field = "secrets" }, { relation = "iam_binding", absent = true }, { relation = "attribute_reference", target_type = "iam_role", absent = true } ] }
severity = "error"
message = "\"{name}\" injects secrets, which Cloud Run reads with the job's own service account; link a task or execution role"

[[providers.gcp.blocks]]
key = "main"
resource = "google_cloud_run_v2_job"

[providers.gcp.blocks.args]
name                = { field = "name", transform = "kebab" }
location            = { var = "region" }
deletion_protection = { value = false }
depends_on          = { if = { field = "secrets" }, then = { self_block = "secret_read", attr = "", wrap = "list" } }

[[providers.gcp.blocks.nested]]
block = "template"

[[providers.gcp.blocks.nested.nested]]
block = "template"

[providers.gcp.blocks.nested.nested.args]
service_account = { include = "container.cloud_run_service_account" }
timeout         = { func = "format", args = [ { value = "%ds" }, { field = "timeout_seconds", fallback = { value = 1800 } } ] }
max_retries     = { field = "retries", optional = true }

[[providers.gcp.blocks.nested.nested.nested]]
block = "containers"

[providers.gcp.blocks.nested.nested.nested.args]
image = { include = "container.registry_image", with = { noun = "job" } }

[[providers.gcp.blocks.nested.nested.nested.nested]]
block = "resources"

[providers.gcp.blocks.nested.nested.nested.nested.args]
limits = { include = "container.cloud_run_limits" }

[[providers.gcp.blocks.nested.nested.nested.nested]]
include = "container.cloud_run_env"

[[providers.gcp.blocks.nested.nested.nested]]
include = "container.cloud_run_vpc"

[[providers.gcp.blocks]]
include = "container.cloud_run_grants"

[providers.gcp.outputs]
name = { attr = "name", description = "Job name (gcloud run jobs execute)", primary = true }

[[providers.gcp.manual_steps]]
title = "Secret Manager secrets hold one value each"
when = { field = "secrets" }
body = """
Each secret variable reads the latest version of a whole Secret Manager secret: a row's
**JSON key** has no counterpart. Store one secret per value and name it in the row's
**Secret** column.
"""

[[providers.gcp.manual_steps]]
title = "Start the job"
body = """
Nothing runs the job by itself: start it from the pipeline with
`gcloud run jobs execute <job> --region <region> --wait`, which also waits for it to
finish and fails when it does.
"""
