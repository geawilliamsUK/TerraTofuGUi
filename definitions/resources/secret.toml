# Abstract type: Secret  (schema_version 2)
#
# The secret's value is never stored in the diagram. It is either
#   * a sensitive input variable named `<slug>_value` (`entity_var`),
#   * generated ('Generate the value'): one `random_password` per provider, which is why
#     the `hashicorp/random` helper provider appears in versions.tf when it is used, or
#   * derived from a linked Relational Database ('Value from database'): the connection
#     URI built from the server's host, admin user, password and database name.
# A Relational Database can in turn take its password from a Secret ('Password from').
# AWS: aws_secretsmanager_secret + aws_secretsmanager_secret_version.
# Azure: azurerm_key_vault_secret inside the enclosing Key Vault (required).

schema_version = 2

[resource]
type = "secret"
category = "secrets"
display_name = "Secret"
description = "A secret value supplied at apply time, or derived from a linked database's connection details. On Azure it must be drawn inside a Key Vault."
kind = "node"
allowed_parents = ["key_vault", "resource_group"]
icon = "SEC"

[[fields]]
name = "generate_value"
label = "Generate the value"
type = "bool"
default = false
description = "Create a 32-character random value with `random_password` instead of asking for one as an input variable. The value lives in the state file, so keep the state encrypted."

[[fields]]
name = "recovery_window_days"
label = "Recovery window (days)"
type = "int"
default = 7
description = "AWS only: how long a deleted secret can be restored (7-30; 0 destroys it immediately and irreversibly). Azure and Google Cloud use the vault's / project's own soft-delete period."

[[relations]]
kind = "reads"
label = "Value from database (connection URI)"
targets = ["relational_database"]
cardinality = "optional"

[[relations]]
kind = "encrypted_with"
label = "Encrypted with"
providers = ["aws", "gcp"]
targets = ["encryption_key"]
cardinality = "optional"

# ---------------------------------------------------------------- AWS
[providers.aws]
status = "full"

[[providers.aws.blocks]]
key = "generated"
resource = "random_password"
when = { field = "generate_value" }

[providers.aws.blocks.args]
length           = { value = 32 }
special          = { value = true }
override_special = { value = "!#$%&*()-_=+[]{}<>:?" }

[[providers.aws.blocks]]
key = "main"
resource = "aws_secretsmanager_secret"

[providers.aws.blocks.args]
name                    = { field = "name", transform = "kebab" }
recovery_window_in_days = { field = "recovery_window_days", fallback = { value = 7 } }
kms_key_id              = { relation = "encrypted_with", attr = "arn", optional = true }
tags                    = { object = { Name = { field = "name" } } }

[[providers.aws.blocks]]
key = "version"
resource = "aws_secretsmanager_secret_version"

[providers.aws.blocks.args]
secret_id = { self_block = "main", attr = "id" }

[providers.aws.blocks.args.secret_string]
if = { relation = "reads" }
then = { func = "format", args = [ { value = "postgresql://%s:%s@%s/%s" }, { relation = "reads", attr = "username" }, { relation = "reads", attr = "password" }, { relation = "reads", attr = "endpoint" }, { relation = "reads", attr = "db_name" } ] }
else = { if = { field = "generate_value" }, then = { self_block = "generated", attr = "result" }, else = { entity_var = "value", sensitive = true, description = "Value of the secret \"{name}\"." } }

[[providers.aws.checks]]
when = { field = "recovery_window_days", equals = "0" }
message = "\"{name}\" has a recovery window of 0 days: deleting it destroys the value immediately and it cannot be restored"

[providers.aws.outputs]
arn = { attr = "arn", description = "Secret ARN" }

# ---------------------------------------------------------------- Azure
[providers.azure]
status = "full"
notes = "Key Vault secrets are encrypted with the vault's own key, and how long a deleted secret can be recovered is the vault's soft-delete retention, not the secret's."

[[providers.azure.checks]]
when = { relation = "encrypted_with" }
message = "\"{name}\" is linked to an Encryption Key, which the Azure mapping cannot use: a Key Vault secret is always protected by its own vault's key"

[[providers.azure.blocks]]
key = "generated"
resource = "random_password"
when = { field = "generate_value" }

[providers.azure.blocks.args]
length           = { value = 32 }
special          = { value = true }
override_special = { value = "!#$%&*()-_=+[]{}<>:?" }

[[providers.azure.blocks]]
key = "main"
resource = "azurerm_key_vault_secret"

[providers.azure.blocks.args]
name         = { field = "name", transform = "kebab" }
key_vault_id = { ancestor = "key_vault", attr = "id" }

[providers.azure.blocks.args.value]
if = { relation = "reads" }
then = { func = "format", args = [ { value = "postgresql://%s:%s@%s:5432/%s" }, { relation = "reads", block = "pg", attr = "administrator_login" }, { relation = "reads", block = "pg", attr = "administrator_password" }, { relation = "reads", block = "pg", attr = "fqdn" }, { relation = "reads", block = "pgdb", attr = "name" } ] }
else = { if = { field = "generate_value" }, then = { self_block = "generated", attr = "result" }, else = { entity_var = "value", sensitive = true, description = "Value of the secret \"{name}\"." } }

[providers.azure.outputs]
id = { attr = "id", description = "Secret id" }

# ---------------------------------------------------------------- GCP
[providers.gcp]
status = "partial"
notes = "Secret Manager keeps a deleted secret for the project's own retention period, so the recovery window is not a per-secret setting. A linked key switches replication from automatic to a single regional replica, because a customer-managed key is regional."

[[providers.gcp.blocks]]
key = "generated"
resource = "random_password"
when = { field = "generate_value" }

[providers.gcp.blocks.args]
length           = { value = 32 }
special          = { value = true }
override_special = { value = "!#$%&*()-_=+[]{}<>:?" }

[[providers.gcp.blocks]]
key = "main"
resource = "google_secret_manager_secret"

[providers.gcp.blocks.args]
secret_id = { field = "name", transform = "kebab" }
labels    = { object = { name = { field = "name", transform = "kebab" } } }

[[providers.gcp.blocks.nested]]
block = "replication"

[[providers.gcp.blocks.nested.nested]]
block = "auto"
when = { relation = "encrypted_with", absent = true }

[[providers.gcp.blocks.nested.nested]]
block = "user_managed"
when = { relation = "encrypted_with" }

[[providers.gcp.blocks.nested.nested.nested]]
block = "replicas"

[providers.gcp.blocks.nested.nested.nested.args]
location = { var = "region" }

[[providers.gcp.blocks.nested.nested.nested.nested]]
block = "customer_managed_encryption"

[providers.gcp.blocks.nested.nested.nested.nested.args]
kms_key_name = { relation = "encrypted_with", attr = "id" }

[[providers.gcp.blocks]]
key = "version"
resource = "google_secret_manager_secret_version"

[providers.gcp.blocks.args]
secret = { self_block = "main", attr = "id" }

[providers.gcp.blocks.args.secret_data]
if = { relation = "reads" }
then = { func = "format", args = [ { value = "postgresql://%s:%s@%s/%s" }, { relation = "reads", block = "user", attr = "name" }, { relation = "reads", block = "user", attr = "password" }, { relation = "reads", attr = "private_ip_address", fallback = { relation = "reads", attr = "public_ip_address" } }, { relation = "reads", block = "db", attr = "name" } ] }
else = { if = { field = "generate_value" }, then = { self_block = "generated", attr = "result" }, else = { entity_var = "value", sensitive = true, description = "Value of the secret \"{name}\"." } }

[providers.gcp.outputs]
id = { attr = "id", description = "Secret resource id" }

[[providers.gcp.manual_steps]]
title = "Let Secret Manager use the encryption key"
when = { relation = "encrypted_with" }
body = """
A secret with a customer-managed key needs the Secret Manager service agent
(`service-<project number>@gcp-sa-secretmanager.iam.gserviceaccount.com`) to hold
`roles/cloudkms.cryptoKeyEncrypterDecrypter` on that key, and the key must live in the
same region as the replica. Grant it before the first `apply`.
"""
