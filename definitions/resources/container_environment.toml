# Abstract type: Container Environment  (schema_version 2)
#
# The place Container Apps and Container Jobs run, shared by everything drawn inside it.
#   AWS:   aws_ecs_cluster, with Container Insights switched on or off. The apps inside
#          become services of this cluster instead of each creating a cluster of its own.
#   Azure: azurerm_container_app_environment — which every Container App needs anyway;
#          an app drawn outside an environment still gets one of its own.
#   GCP:   logical. Cloud Run has no environment: services and jobs are regional
#          resources of the project.
#
# Drawing an app inside an environment is what joins them; an app outside one keeps
# its own cluster / environment, exactly as before.

schema_version = 2

[resource]
type = "container_environment"
category = "container"
display_name = "Container Environment"
description = "Where Container Apps and Jobs run, shared: an ECS cluster / a Container Apps environment. Draw the apps inside it."
kind = "container"
allowed_parents = ["resource_group", "virtual_network"]
icon = "ENV"

[[fields]]
name = "container_insights"
label = "Container Insights"
type = "bool"
default = false
description = "AWS: collect task and service metrics (CPU, memory, RunningTaskCount) into CloudWatch, which an alarm on a task count needs. Charged per metric. Azure and Google Cloud publish their apps' metrics without it."

# Azure only: an environment is either VNet-integrated on its own subnet or not at all;
# ECS services pick their subnets per service, and Cloud Run has no environment.
[[relations]]
kind = "network_membership"
label = "Infrastructure subnet (Azure)"
providers = ["azure"]
targets = ["subnet"]
cardinality = "optional"

[[relations]]
kind = "logs_to"
label = "Logs to (Azure: Log Analytics)"
providers = ["azure"]
targets = ["log_group"]
cardinality = "optional"

# ---------------------------------------------------------------- AWS
[providers.aws]
status = "full"
file = "container"
notes = "An ECS cluster. Fargate services and tasks need nothing else from it; the subnets and security groups stay on each app."

[[providers.aws.blocks]]
key = "main"
resource = "aws_ecs_cluster"

[providers.aws.blocks.args]
name = { field = "name", transform = "kebab" }
tags = { object = { Name = { field = "name" } } }

[[providers.aws.blocks.nested]]
block = "setting"

[providers.aws.blocks.nested.args]
name  = { value = "containerInsights" }
value = { if = { field = "container_insights" }, then = { value = "enabled" }, else = { value = "disabled" } }

[providers.aws.outputs]
name = { attr = "name", description = "ECS cluster name (aws ecs run-task --cluster)" }
arn  = { attr = "arn", description = "ECS cluster ARN" }

# ---------------------------------------------------------------- Azure
[providers.azure]
status = "full"
file = "container"
notes = "A Consumption Container Apps environment. With an infrastructure subnet it is VNet-integrated (the subnet must be delegated to Microsoft.App/environments); Container Insights has no counterpart, the apps' metrics are always published."

[[providers.azure.checks]]
when = { all = [ { relation = "network_membership" }, { relation = "network_membership", target_provider_field = "delegation", equals = "app_environments", absent = true } ] }
message = "\"{name}\" is VNet-integrated but its subnet is not delegated to app_environments (set the subnet's Azure Delegation field)"

[[providers.azure.blocks]]
key = "main"
resource = "azurerm_container_app_environment"

[providers.azure.blocks.args]
name                       = { field = "name", transform = "kebab" }
location                   = { var = "location" }
resource_group_name        = { ancestor = "resource_group", attr = "name" }
log_analytics_workspace_id = { relation = "logs_to", attr = "id" }
infrastructure_subnet_id   = { relation = "network_membership", attr = "id" }

[providers.azure.outputs]
id             = { attr = "id", description = "Container Apps environment id" }
default_domain = { attr = "default_domain", description = "Domain the environment's apps are served under" }

# ---------------------------------------------------------------- GCP
[providers.gcp]
status = "logical"
notes = "Cloud Run has no environment or cluster: each service and job is a regional resource of the project, so the apps inside are exported as they are."
