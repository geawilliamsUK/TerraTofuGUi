# Abstract type: Log Group
#
# AWS: aws_cloudwatch_log_group. Azure: azurerm_log_analytics_workspace (PerGB2018).
#
# One special case: EKS writes its control-plane logs to a group it names itself,
# `/aws/eks/<cluster>/cluster`, and creates it if it is absent. A group a Kubernetes
# Cluster logs to therefore takes that name, so Terraform owns it (and its retention)
# instead of racing EKS for it. The name is built from the cluster's *display name*, not
# from the cluster resource, so nothing here refers to a resource that depends on it.

schema_version = 2

[resource]
type = "log_group"
category = "monitoring"
display_name = "Log Group"
description = "A destination for application logs with a retention period."
kind = "node"
allowed_parents = ["resource_group", "virtual_network"]
network_agnostic = true
icon = "LOG"
env_prefix = "LOG_GROUP"
expects_incoming = true

[[fields]]
name = "retention_days"
label = "Retention (days)"
type = "int"
required = true
default = 30
description = "How long log entries are kept. Each cloud has its own allowed values: CloudWatch Logs 1, 3, 5, 7, 14, 30, 60, 90, 120, 150, 180, 365, 400, 545, 731, 1096, 1827, 2192, 2557, 2922, 3288 or 3653 days (0 keeps them for ever); a Log Analytics workspace 30 to 730; a Cloud Logging bucket 1 to 3650."

[[relations]]
kind = "encrypted_with"
label = "Encrypted with"
providers = ["aws", "gcp"]
targets = ["encryption_key"]
cardinality = "optional"

# ---------------------------------------------------------------- AWS
[providers.aws]
status = "full"
notes = "Log groups are encrypted with an AWS-managed key by default; a linked Encryption Key replaces it. Its key policy already lets the CloudWatch Logs service principal of the region use it."

[[providers.aws.checks]]
when = { relation = "logs_to", incoming = true, target_type = "kubernetes_cluster", min_count = 2 }
severity = "error"
message = "\"{name}\" receives the control-plane logs of more than one Kubernetes Cluster, and EKS names that group after the cluster: give each cluster a Log Group of its own"

[[providers.aws.checks]]
severity = "error"
when = { field = "retention_days", not_one_of = ["0", "1", "3", "5", "7", "14", "30", "60", "90", "120", "150", "180", "365", "400", "545", "731", "1096", "1827", "2192", "2557", "2922", "3288", "3653"] }
message = "\"{name}\": CloudWatch Logs keeps logs for 1, 3, 5, 7, 14, 30, 60, 90, 120, 150, 180, 365, 400, 545, 731, 1096, 1827, 2192, 2557, 2922, 3288 or 3653 days (or 0, for ever); pick one of those"

[[providers.aws.blocks]]
key = "main"
resource = "aws_cloudwatch_log_group"

[providers.aws.blocks.args]
name              = { if = { relation = "logs_to", incoming = true, target_type = "kubernetes_cluster" }, then = { func = "format", args = [ { value = "/aws/eks/%s/cluster" }, { relation = "logs_to", incoming = true, target_type = "kubernetes_cluster", field = "name", transform = "kebab" } ] }, else = { field = "name", transform = "kebab" } }
retention_in_days = { field = "retention_days" }
kms_key_id        = { relation = "encrypted_with", attr = "arn", optional = true }
tags              = { object = { Name = { field = "name" } } }

[providers.aws.connection]
NAME = { self_block = "main", attr = "name" }

[providers.aws.outputs]
arn = { attr = "arn", description = "Log group ARN" }

# ---------------------------------------------------------------- Azure
[providers.azure]
status = "full"
notes = "Log Analytics encrypts data with Microsoft-managed keys; a customer-managed key is a property of a dedicated Log Analytics cluster, not of a workspace."

[[providers.azure.checks]]
when = { relation = "encrypted_with" }
message = "\"{name}\" is linked to an Encryption Key, which the Azure mapping cannot use: a customer-managed key for Log Analytics is set on a dedicated cluster the workspace is linked to"

[[providers.azure.checks]]
severity = "error"
when = { any = [ { field = "retention_days", less_than = 30 }, { field = "retention_days", greater_than = 730 } ] }
message = "\"{name}\": a Log Analytics workspace keeps logs for 30 to 730 days (longer is the archive tier, configured per table)"

[[providers.azure.blocks]]
key = "main"
resource = "azurerm_log_analytics_workspace"

[providers.azure.blocks.args]
name                = { field = "name", transform = "kebab" }
location            = { var = "location" }
resource_group_name = { ancestor = "resource_group", attr = "name" }
sku                 = { value = "PerGB2018" }
retention_in_days   = { field = "retention_days" }

[providers.azure.connection]
WORKSPACE_ID = { self_block = "main", attr = "workspace_id" }

[providers.azure.outputs]
id = { attr = "id", description = "Workspace id" }

# ---------------------------------------------------------------- GCP
[providers.gcp]
status = "partial"
notes = "A Cloud Logging bucket in the project. Workloads log to Cloud Logging automatically; route logs into this bucket with a sink if you want them separated."

[[providers.gcp.checks]]
severity = "error"
when = { any = [ { field = "retention_days", less_than = 1 }, { field = "retention_days", greater_than = 3650 } ] }
message = "\"{name}\": a Cloud Logging bucket keeps logs for 1 to 3650 days"

[[providers.gcp.blocks]]
key = "main"
resource = "google_logging_project_bucket_config"

[providers.gcp.blocks.args]
project        = { var = "project" }
location       = { value = "global" }
bucket_id      = { field = "name", transform = "kebab" }
retention_days = { field = "retention_days" }

[[providers.gcp.blocks.nested]]
block = "cmek_settings"
when = { relation = "encrypted_with" }

[providers.gcp.blocks.nested.args]
kms_key_name = { relation = "encrypted_with", attr = "id" }

[providers.gcp.connection]
BUCKET = { self_block = "main", attr = "id" }

[providers.gcp.outputs]
id = { attr = "id", description = "Log bucket id" }

[[providers.gcp.manual_steps]]
title = "Put the encryption key where the log bucket can use it"
when = { relation = "encrypted_with" }
body = """
This bucket is created in the `global` location, and Cloud Logging only accepts a CMEK key
in the bucket's own location. Either move the linked key to a global key ring, or give the
bucket a regional location that matches the key. Either way the Log Router service account
(`cmek_settings.service_account_id` on this resource) needs
`roles/cloudkms.cryptoKeyEncrypterDecrypter` on the key before logs can be written.
"""
