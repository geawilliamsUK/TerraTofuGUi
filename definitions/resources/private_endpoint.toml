# Abstract type: Private Endpoint  (schema_version 2)
#
# Private connectivity from a subnet to a managed service, so traffic never leaves the
# network. Link the subnet ('Subnet') and the service it fronts ('Connects to').
#
# Azure: azurerm_private_endpoint with a private_service_connection to the linked
#        service (storage account, database server, key vault, Service Bus namespace,
#        Cosmos DB account). The sub-resource (blob, postgresqlServer, vault, ...) is a field.
# AWS:   aws_vpc_endpoint of type Interface in the subnet's VPC. AWS endpoints target a
#        *service* (com.amazonaws.<region>.<name>) rather than one resource, so the AWS
#        service name is a provider field; S3 is a Gateway endpoint (route-table based).

schema_version = 2

[resource]
type = "private_endpoint"
category = "network"
display_name = "Private Endpoint"
description = "Private connectivity from a subnet to a managed service (storage, database, vault, queue). Link the subnet and the service."
kind = "node"
allowed_parents = ["resource_group", "virtual_network"]
icon = "PE"

[[fields]]
name = "subresource"
label = "Sub-resource (Azure)"
type = "enum"
required = true
options = ["blob", "file", "queue", "table", "postgresqlServer", "mysqlServer", "vault", "namespace", "Sql"]
default = "blob"
description = "Which endpoint of the service to expose privately: blob/file/queue/table for storage, postgresqlServer / mysqlServer for databases, vault for Key Vault, namespace for Service Bus, Sql for Cosmos DB."

[[relations]]
kind = "network_membership"
label = "Subnet"
targets = ["subnet"]
cardinality = "one"

[[relations]]
kind = "attribute_reference"
label = "Connects to"
targets = ["object_storage", "relational_database", "key_vault", "event_queue", "servicebus_namespace", "nosql_table"]
cardinality = "one"

[[relations]]
kind = "attachment"
label = "Security group (AWS)"
targets = ["security_group"]
cardinality = "optional"

# ---------------------------------------------------------------- AWS
[providers.aws]
status = "partial"
notes = "Interface endpoint in the subnet's VPC. The service is chosen by the AWS service name field, not by the linked resource."

[[providers.aws.fields]]
name = "service"
label = "AWS service"
type = "enum"
required = true
options = ["secretsmanager", "sqs", "sns", "dynamodb", "rds", "kms", "logs", "ecr.api", "ecr.dkr", "s3"]
default = "secretsmanager"
description = "Service name suffix of com.amazonaws.<region>.<service>. s3 and dynamodb are Gateway endpoints and attach to the subnet's route table instead."

[[providers.aws.blocks]]
key = "main"
resource = "aws_vpc_endpoint"

[providers.aws.blocks.args]
vpc_id              = { relation = "network_membership", ancestor = "virtual_network", attr = "id" }
service_name        = { template = "com.amazonaws.{settings.region}.{provider.service}" }
vpc_endpoint_type   = { if = { any = [ { provider_field = "service", equals = "s3" }, { provider_field = "service", equals = "dynamodb" } ] }, then = { value = "Gateway" }, else = { value = "Interface" } }
subnet_ids          = { if = { any = [ { provider_field = "service", equals = "s3" }, { provider_field = "service", equals = "dynamodb" } ] }, then = { list = [] }, else = { relation = "network_membership", attr = "id", wrap = "list" } }
security_group_ids  = { relation = "attachment", target_type = "security_group", attr = "id", wrap = "list" }
private_dns_enabled = { if = { any = [ { provider_field = "service", equals = "s3" }, { provider_field = "service", equals = "dynamodb" } ] }, then = { value = false }, else = { value = true } }
tags                = { object = { Name = { field = "name" }, Target = { relation = "attribute_reference", attr = "id" } } }

[providers.aws.outputs]
id = { attr = "id", description = "VPC endpoint id" }

[[providers.aws.manual_steps]]
title = "Gateway endpoints need a route-table association"
when = { any = [ { provider_field = "service", equals = "s3" }, { provider_field = "service", equals = "dynamodb" } ] }
body = """
S3 and DynamoDB endpoints are Gateway endpoints: associate the endpoint with the route
table of the linked subnet (`aws_vpc_endpoint_route_table_association`, or add the
endpoint's route by hand) so traffic from the subnet is routed through it.
"""

[[providers.aws.manual_steps]]
title = "Interface endpoints need a security group that allows HTTPS from the subnet"
when = { relation = "attachment", target_type = "security_group", absent = true }
body = """
No security group is linked, so the endpoint gets the VPC default group. Link a Security
Group that allows inbound 443 from the subnet's CIDR, or confirm the default group does.
"""

# ---------------------------------------------------------------- Azure
[providers.azure]
status = "full"

[[providers.azure.blocks]]
key = "main"
resource = "azurerm_private_endpoint"

[providers.azure.blocks.args]
name                = { field = "name", transform = "kebab" }
location            = { var = "location" }
resource_group_name = { ancestor = "resource_group", attr = "name" }
subnet_id           = { relation = "network_membership", attr = "id" }
tags                = { object = { Name = { field = "name" } } }

[[providers.azure.blocks.nested]]
block = "private_service_connection"

[providers.azure.blocks.nested.args]
name                 = { template = "{name}-connection", transform = "kebab" }
is_manual_connection = { value = false }
subresource_names    = { field = "subresource", wrap = "list" }

# The linked service's id: each target type has a different primary block.
[providers.azure.blocks.nested.args.private_connection_resource_id]
relation = "attribute_reference"
target_type = "object_storage"
attr = "id"
fallback = { relation = "attribute_reference", target_type = "relational_database", block = "pg", attr = "id", fallback = { relation = "attribute_reference", target_type = "relational_database", block = "my", attr = "id", fallback = { relation = "attribute_reference", target_type = "key_vault", attr = "id", fallback = { relation = "attribute_reference", target_type = "servicebus_namespace", attr = "id", fallback = { relation = "attribute_reference", target_type = "event_queue", block = "ns", attr = "id", fallback = { relation = "attribute_reference", target_type = "event_queue", ancestor = "servicebus_namespace", attr = "id", fallback = { relation = "attribute_reference", target_type = "nosql_table", block = "acct", attr = "id" } } } } } } }

[providers.azure.outputs]
id         = { attr = "id", description = "Private endpoint id" }
private_ip = { attr = "private_service_connection.0.private_ip_address", description = "Private IP inside the subnet" }

[[providers.azure.checks]]
when = { all = [ { relation = "attribute_reference", target_type = "object_storage" }, { field = "subresource", not_equals = "blob" }, { field = "subresource", not_equals = "file" }, { field = "subresource", not_equals = "queue" }, { field = "subresource", not_equals = "table" } ] }
message = "\"{name}\" connects to a storage account: the sub-resource should be blob, file, queue or table"

[[providers.azure.checks]]
when = { all = [ { relation = "attribute_reference", target_type = "key_vault" }, { field = "subresource", not_equals = "vault" } ] }
message = "\"{name}\" connects to a Key Vault: the sub-resource should be vault"
