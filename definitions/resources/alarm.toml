# Abstract type: Alarm  (schema_version 2)
#
# A metric alarm on one linked resource: fires when a metric crosses a threshold for
# a number of periods, optionally notifying a Topic.
#   AWS:   aws_cloudwatch_metric_alarm (namespace / metric name / dimension follow the
#          linked resource type).
#   Azure: azurerm_monitor_metric_alert scoped to the linked resource.
# Metric names differ per provider, so each provider mapping carries its own metric field
# with a sensible default (CPU); the threshold and timing are abstract.

schema_version = 2

[resource]
type = "alarm"
category = "monitoring"
display_name = "Alarm"
description = "A metric alarm on a linked resource (CPU by default). Link the resource it watches and, optionally, a Topic to notify."
kind = "node"
allowed_parents = ["resource_group", "virtual_network"]
network_agnostic = true
icon = "ALM"

[[fields]]
name = "threshold"
label = "Threshold"
type = "int"
required = true
default = 80

[[fields]]
name = "comparison"
label = "Fires when metric is"
type = "enum"
required = true
options = ["greater_than", "less_than"]
default = "greater_than"

[[fields]]
name = "period_seconds"
label = "Period (s)"
type = "enum"
required = true
options = ["60", "300", "900"]
default = "300"

[[fields]]
name = "evaluation_periods"
label = "Consecutive periods"
type = "int"
required = true
default = 2

[[relations]]
kind = "attribute_reference"
label = "Watches"
targets = ["compute_instance", "relational_database", "function", "event_queue", "load_balancer", "container_app"]
cardinality = "one"

[[relations]]
kind = "sends_to"
label = "Notifies topic"
providers = ["aws"]
targets = ["topic"]
cardinality = "optional"

# ---------------------------------------------------------------- AWS
[providers.aws]
status = "full"

[[providers.aws.fields]]
name = "metric_name"
label = "CloudWatch metric"
type = "string"
required = true
default = "CPUUtilization"
description = "Metric name in the resource's namespace, e.g. CPUUtilization (EC2, RDS), Errors / Duration (Lambda), ApproximateNumberOfMessagesVisible (SQS), TargetResponseTime (ALB)."

[[providers.aws.fields]]
name = "statistic"
label = "Statistic"
type = "enum"
required = true
options = ["Average", "Sum", "Maximum", "Minimum"]
default = "Average"

[[providers.aws.blocks]]
key = "main"
resource = "aws_cloudwatch_metric_alarm"

[providers.aws.blocks.args]
alarm_name          = { field = "name", transform = "kebab" }
comparison_operator = { map = "comparison", table = { greater_than = "GreaterThanThreshold", less_than = "LessThanThreshold" } }
evaluation_periods  = { field = "evaluation_periods" }
metric_name         = { provider_field = "metric_name" }
statistic           = { provider_field = "statistic" }
period              = { map = "period_seconds", table = { "60" = 60, "300" = 300, "900" = 900 } }
threshold           = { field = "threshold" }
alarm_description   = { template = "{name}" }
alarm_actions       = { relation = "sends_to", target_type = "topic", attr = "arn", wrap = "list" }
tags                = { object = { Name = { field = "name" } } }

# Namespace and dimension follow the type of the watched resource.
[providers.aws.blocks.args.namespace]
if = { relation = "attribute_reference", target_type = "compute_instance" }
then = { value = "AWS/EC2" }
else = { if = { relation = "attribute_reference", target_type = "relational_database" }, then = { value = "AWS/RDS" }, else = { if = { relation = "attribute_reference", target_type = "function" }, then = { value = "AWS/Lambda" }, else = { if = { relation = "attribute_reference", target_type = "event_queue" }, then = { value = "AWS/SQS" }, else = { if = { relation = "attribute_reference", target_type = "container_app" }, then = { value = "AWS/ECS" }, else = { value = "AWS/ApplicationELB" } } } } }

[providers.aws.blocks.args.dimensions]
if = { relation = "attribute_reference", target_type = "compute_instance" }
then = { object = { InstanceId = { relation = "attribute_reference", target_type = "compute_instance", attr = "id" } } }
else = { if = { relation = "attribute_reference", target_type = "relational_database" }, then = { object = { DBInstanceIdentifier = { relation = "attribute_reference", target_type = "relational_database", attr = "identifier" } } }, else = { if = { relation = "attribute_reference", target_type = "function" }, then = { object = { FunctionName = { relation = "attribute_reference", target_type = "function", attr = "function_name" } } }, else = { if = { relation = "attribute_reference", target_type = "event_queue" }, then = { object = { QueueName = { relation = "attribute_reference", target_type = "event_queue", attr = "name" } } }, else = { if = { relation = "attribute_reference", target_type = "container_app" }, then = { object = { ClusterName = { relation = "attribute_reference", target_type = "container_app", block = "cluster", attr = "name" }, ServiceName = { relation = "attribute_reference", target_type = "container_app", attr = "name" } } }, else = { object = { LoadBalancer = { relation = "attribute_reference", target_type = "load_balancer", attr = "arn_suffix" } } } } } } }

[providers.aws.outputs]
arn = { attr = "arn", description = "Alarm ARN" }

# ---------------------------------------------------------------- Azure
[providers.azure]
status = "partial"

[[providers.azure.fields]]
name = "metric_namespace"
label = "Metric namespace"
type = "string"
required = true
default = "Microsoft.Compute/virtualMachines"
description = "e.g. Microsoft.Compute/virtualMachines, Microsoft.DBforPostgreSQL/flexibleServers, Microsoft.Web/sites, Microsoft.ServiceBus/namespaces, Microsoft.App/containerApps."

[[providers.azure.fields]]
name = "metric_name"
label = "Metric name"
type = "string"
required = true
default = "Percentage CPU"
description = "e.g. Percentage CPU, cpu_percent (PostgreSQL), FunctionExecutionCount, ActiveMessages, Replicas."

[[providers.azure.fields]]
name = "aggregation"
label = "Aggregation"
type = "enum"
required = true
options = ["Average", "Total", "Maximum", "Minimum", "Count"]
default = "Average"

[[providers.azure.fields]]
name = "notify_email"
label = "Notify email"
type = "string"
pattern = "^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$"
pattern_hint = "an email address"
description = "Azure notifies through an action group rather than a topic: when set, an action group with this email receiver is generated and attached to the alert."

# Action group with an email receiver, when an address is given.
[[providers.azure.blocks]]
key = "ag"
resource = "azurerm_monitor_action_group"
when = { provider_field = "notify_email" }

[providers.azure.blocks.args]
name                = { template = "{name}-actions", transform = "kebab" }
resource_group_name = { ancestor = "resource_group", attr = "name" }
short_name          = { value = "ttgalarm" }

[[providers.azure.blocks.nested]]
block = "email_receiver"

[providers.azure.blocks.nested.args]
name          = { value = "email" }
email_address = { provider_field = "notify_email" }

[[providers.azure.blocks]]
key = "main"
resource = "azurerm_monitor_metric_alert"

[providers.azure.blocks.args]
name                = { field = "name", transform = "kebab" }
resource_group_name = { ancestor = "resource_group", attr = "name" }
description         = { template = "{name}" }
frequency           = { value = "PT1M" }
window_size         = { map = "period_seconds", table = { "60" = "PT1M", "300" = "PT5M", "900" = "PT15M" } }
severity            = { value = 2 }
tags                = { object = { Name = { field = "name" } } }

# Scope: the watched resource's primary block; databases and queues have several.
[providers.azure.blocks.args.scopes]
relation = "attribute_reference"
target_type = "compute_instance"
attr = "id"
wrap = "list"
fallback = { relation = "attribute_reference", target_type = "relational_database", block = "pg", attr = "id", wrap = "list", fallback = { relation = "attribute_reference", target_type = "relational_database", block = "my", attr = "id", wrap = "list", fallback = { relation = "attribute_reference", target_type = "function", attr = "id", wrap = "list", fallback = { relation = "attribute_reference", target_type = "event_queue", block = "ns", attr = "id", wrap = "list", fallback = { relation = "attribute_reference", target_type = "event_queue", ancestor = "servicebus_namespace", attr = "id", wrap = "list", fallback = { relation = "attribute_reference", target_type = "container_app", attr = "id", wrap = "list", fallback = { relation = "attribute_reference", target_type = "load_balancer", attr = "id", wrap = "list" } } } } } } }

[[providers.azure.blocks.nested]]
block = "action"
when = { provider_field = "notify_email" }

[providers.azure.blocks.nested.args]
action_group_id = { self_block = "ag", attr = "id" }

[[providers.azure.blocks.nested]]
block = "criteria"

[providers.azure.blocks.nested.args]
metric_namespace = { provider_field = "metric_namespace" }
metric_name      = { provider_field = "metric_name" }
aggregation      = { provider_field = "aggregation" }
operator         = { map = "comparison", table = { greater_than = "GreaterThan", less_than = "LessThan" } }
threshold        = { field = "threshold" }

[providers.azure.outputs]
id = { attr = "id", description = "Metric alert id" }

[[providers.azure.checks]]
when = { field = "evaluation_periods", not_equals = "1" }
message = "\"{name}\": Azure metric alerts evaluate a single window, so 'Consecutive periods' is approximated by the window size (use a dynamic-threshold alert for N-of-M behaviour)"

[[providers.azure.manual_steps]]
title = "Notifications need an action group"
when = { all = [ { relation = "sends_to" }, { provider_field = "notify_email", absent = true } ] }
body = """
Azure Monitor notifies through an *action group*, not a Service Bus topic. Set the Azure
**Notify email** field to generate an action group with an email receiver, or create an
`azurerm_monitor_action_group` with a webhook / Logic App that forwards to the linked topic
and add an `action { action_group_id = … }` block to the alert.
"""

# ---------------------------------------------------------------- GCP
[providers.gcp]
status = "partial"
notes = "A Cloud Monitoring alert policy with a threshold condition. The metric filter is a provider field (CPU utilisation of the watched instance by default); an email notification channel is generated when an address is given."

[[providers.gcp.fields]]
name = "metric_filter"
label = "Metric filter"
type = "string"
description = "Overrides the per-type default (CPU utilisation for instances and databases, execution count for functions, undelivered messages for queues, CPU for container apps, latency for load balancers). Cloud Monitoring filter, e.g. metric.type=\"cloudsql.googleapis.com/database/cpu/utilization\" AND resource.type=\"cloudsql_database\", or metric.type=\"cloudfunctions.googleapis.com/function/execution_count\" AND resource.type=\"cloud_function\". CPU utilisation metrics are fractions (0..1), so a threshold of 80 needs 0.8."

[[providers.gcp.fields]]
name = "notify_email"
label = "Notify email"
type = "string"
pattern = "^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$"
pattern_hint = "an email address"
description = "When set, an email notification channel is generated and attached to the policy."

[[providers.gcp.blocks]]
key = "channel"
resource = "google_monitoring_notification_channel"
when = { provider_field = "notify_email" }

[providers.gcp.blocks.args]
display_name = { template = "{name} email" }
type         = { value = "email" }
labels       = { object = { email_address = { provider_field = "notify_email" } } }

[[providers.gcp.blocks]]
key = "main"
resource = "google_monitoring_alert_policy"

[providers.gcp.blocks.args]
display_name          = { field = "name" }
combiner              = { value = "OR" }
notification_channels = { if = { provider_field = "notify_email" }, then = { self_block = "channel", attr = "id", wrap = "list" } }

[[providers.gcp.blocks.nested]]
block = "conditions"

[providers.gcp.blocks.nested.args]
display_name = { template = "{name} threshold" }

[[providers.gcp.blocks.nested.nested]]
block = "condition_threshold"

[providers.gcp.blocks.nested.nested.args]
comparison      = { map = "comparison", table = { greater_than = "COMPARISON_GT", less_than = "COMPARISON_LT" } }
threshold_value = { field = "threshold" }
duration        = { map = "period_seconds", table = { "60" = "60s", "300" = "300s", "900" = "900s" } }

# The filter follows the watched resource: the provider field when set, else a
# per-type default scoped to that resource.
[providers.gcp.blocks.nested.nested.args.filter]
provider_field = "metric_filter"
fallback = { if = { relation = "attribute_reference", target_type = "compute_instance" }, then = { func = "format", args = [ { value = "metric.type=\"compute.googleapis.com/instance/cpu/utilization\" AND resource.type=\"gce_instance\" AND resource.labels.instance_id=\"%s\"" }, { relation = "attribute_reference", target_type = "compute_instance", attr = "instance_id" } ] }, else = { if = { relation = "attribute_reference", target_type = "relational_database" }, then = { func = "format", args = [ { value = "metric.type=\"cloudsql.googleapis.com/database/cpu/utilization\" AND resource.type=\"cloudsql_database\" AND resource.labels.database_id=\"%s:%s\"" }, { var = "project" }, { relation = "attribute_reference", target_type = "relational_database", attr = "name" } ] }, else = { if = { relation = "attribute_reference", target_type = "function" }, then = { func = "format", args = [ { value = "metric.type=\"cloudfunctions.googleapis.com/function/execution_count\" AND resource.type=\"cloud_function\" AND resource.labels.function_name=\"%s\"" }, { relation = "attribute_reference", target_type = "function", attr = "name" } ] }, else = { if = { relation = "attribute_reference", target_type = "event_queue" }, then = { func = "format", args = [ { value = "metric.type=\"pubsub.googleapis.com/subscription/num_undelivered_messages\" AND resource.type=\"pubsub_subscription\" AND resource.labels.subscription_id=\"%s\"" }, { relation = "attribute_reference", target_type = "event_queue", block = "sub", attr = "name" } ] }, else = { if = { relation = "attribute_reference", target_type = "container_app" }, then = { func = "format", args = [ { value = "metric.type=\"run.googleapis.com/container/cpu/utilizations\" AND resource.type=\"cloud_run_revision\" AND resource.labels.service_name=\"%s\"" }, { relation = "attribute_reference", target_type = "container_app", attr = "name" } ] }, else = { func = "format", args = [ { value = "metric.type=\"loadbalancing.googleapis.com/l3/external/rtt_latencies\" AND resource.type=\"loadbalancing.googleapis.com/ExternalNetworkLoadBalancerRule\" AND resource.labels.forwarding_rule_name=\"%s\"" }, { relation = "attribute_reference", target_type = "load_balancer", block = "rule", attr = "name" } ] } } } } } }

[[providers.gcp.blocks.nested.nested.nested]]
block = "aggregations"

[providers.gcp.blocks.nested.nested.nested.args]
alignment_period   = { value = "60s" }
per_series_aligner = { value = "ALIGN_MEAN" }

[[providers.gcp.blocks.nested.nested.nested]]
block = "trigger"

[providers.gcp.blocks.nested.nested.nested.args]
count = { value = 1 }

[providers.gcp.outputs]
id = { attr = "id", description = "Alert policy id" }

[[providers.gcp.manual_steps]]
title = "Threshold units follow the metric"
body = """
Cloud Monitoring compares the raw metric value: CPU utilisation is a fraction (0.8, not
80), request counts are absolute. Check the threshold against the metric named in the
filter. 'Consecutive periods' is approximated by the duration.
"""
