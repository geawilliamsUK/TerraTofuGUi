# Abstract type: Alarm  (schema_version 2)
#
# A metric alarm on one linked resource: fires when a metric crosses a threshold for
# a number of periods, optionally notifying a Topic.
#   AWS:   aws_cloudwatch_metric_alarm (namespace / metric name / dimension follow the
#          watched resource type).
#   Azure: azurerm_monitor_metric_alert scoped to the watched resource.
#   GCP:   google_monitoring_alert_policy with a threshold condition.
#
# The **Metric** field is a preset: it names the thing being watched ("queue depth")
# rather than a provider's spelling of it, and each provider mapping turns it into its own
# metric name, namespace and aggregation for the type of resource the alarm watches, and the
# threshold is in the unit the preset names (`units`), converted where a cloud measures in
# another one. Not
# every cloud publishes every metric for every type, so each mapping also carries one
# design-time check for a combination it cannot express, and `custom` always falls back to
# the free-text provider fields. Those fields, when set, win over the preset, so a project
# that was drawn before presets existed keeps the metric it chose.
#
# On Azure and Google Cloud that check is an `omit`: the gap belongs to the one cloud, so
# the alarm is left out of that cloud's export with a warning rather than blocking a design
# the other clouds can express (see MAPPING_FORMAT.md §2.6). On AWS it stays an `error`,
# because AWS is the reference for these presets: it covers every combination the other two
# do except a cluster's cpu / memory, which EKS publishes only through Container Insights.

schema_version = 2

[resource]
type = "alarm"
category = "monitoring"
display_name = "Alarm"
description = "A metric alarm on a linked resource. Pick what it watches and which metric; the provider names are filled in."
kind = "node"
allowed_parents = ["resource_group", "virtual_network"]
network_agnostic = true
icon = "ALM"

[[fields]]
name = "metric"
label = "Metric"
type = "enum"
options = ["cpu", "memory", "disk", "queue_depth", "dlq_depth", "queue_oldest_message_age", "db_storage", "db_connections", "lb_5xx", "lb_5xx_rate", "lb_latency", "lb_unhealthy_hosts", "lb_healthy_hosts", "function_errors", "node_count", "bucket_size", "custom"]
default = "custom"
description = "What to watch, in portable terms. Each provider maps it to its own metric for the watched resource type; 'custom' uses the provider's metric fields instead. 'db_storage' is the free storage as a percentage of what the database has. 'lb_5xx' counts the load balancer's 5xx responses per period, 'lb_5xx_rate' is them as a percentage of all requests, and 'lb_unhealthy_hosts' / 'lb_healthy_hosts' count the targets behind it that fail / pass their health check. 'dlq_depth' follows each cloud's shape of a dead-letter queue: on AWS and Google Cloud it is a queue of its own, so link the alarm to it; on Azure dead letters are a sub-queue, so link the alarm to the working queue."

[[fields]]
name = "statistic"
label = "Statistic"
type = "enum"
options = ["auto", "Average", "Sum", "Minimum", "Maximum", "p50", "p90", "p95", "p99"]
default = "auto"
description = "How the data points of each period are combined. 'auto' lets the metric decide: Sum for counts, Maximum for queue depth and connections, Minimum for free storage and healthy targets, Average for everything else, 'custom' included. A percentile such as p95 (95 % of requests were at least this fast) suits latencies. Azure metric alerts have no percentiles, so a percentile alarm is left out of the Azure export, and Cloud Monitoring offers p50, p95 and p99 only (p90 becomes p95). The rate and storage-percentage metrics combine their own inputs and ignore this."
moved_from = { provider = "aws", field = "statistic", skip = ["Average"] }

[[fields]]
name = "threshold"
label = "Threshold"
type = "number"
required = true
default = 80
description = "The value the metric is compared with, in the unit shown beside it, which the Metric decides: 0.5 is half a second of latency, 10 is 10 % free storage, 1 is 1 % of requests failing. Clouds that measure in other units (Cloud Monitoring's utilisation fractions and millisecond latencies, Azure's percentage of storage used) are converted for you."
units = { field = "metric", values = { cpu = "percent", memory = "percent", disk = "percent used", queue_depth = "messages", dlq_depth = "messages", queue_oldest_message_age = "seconds", db_storage = "percent free", db_connections = "connections", lb_5xx = "5xx responses per period", lb_5xx_rate = "percent of requests", lb_latency = "seconds", lb_unhealthy_hosts = "targets", lb_healthy_hosts = "targets", function_errors = "errors per period", node_count = "nodes", bucket_size = "bytes", custom = "the metric's own unit" } }

[[fields]]
name = "comparison"
label = "Fires when metric is"
type = "enum"
required = true
options = ["greater_than", "less_than"]
default = "greater_than"

[[fields]]
name = "period_seconds"
label = "Period (s)"
type = "enum"
required = true
options = ["60", "300", "900"]
default = "300"

[[fields]]
name = "evaluation_periods"
label = "Consecutive periods"
type = "int"
required = true
default = 2

[[relations]]
kind = "attribute_reference"
label = "Watches"
targets = ["compute_instance", "relational_database", "function", "event_queue", "load_balancer", "container_app", "kubernetes_cluster", "object_storage", "topic", "cache", "file_system"]
cardinality = "one"

[[relations]]
kind = "sends_to"
label = "Notifies topic"
providers = ["aws"]
targets = ["topic"]
cardinality = "optional"

# ---------------------------------------------------------------- AWS
[providers.aws]
status = "full"
notes = "Two presets are CloudWatch metric math rather than one metric: 'lb_5xx_rate' divides the 5xx count by the request count, and 'db_storage' divides FreeStorageSpace by the database's allocated storage. Target-health metrics carry the load balancer's target group as well as the load balancer, the only dimensions CloudWatch publishes them with."

[[providers.aws.fields]]
name = "metric_namespace"
label = "CloudWatch namespace"
type = "string"
description = "Overrides the namespace the watched resource type implies (AWS/EC2, AWS/RDS, AWS/SQS, ...). Needed for 'custom' metrics outside those namespaces."

[[providers.aws.fields]]
name = "metric_name"
label = "CloudWatch metric"
type = "string"
default = "CPUUtilization"
description = "Metric name, used when Metric is 'custom' (every other preset names its own metric): e.g. CPUUtilization, Errors (Lambda), ApproximateNumberOfMessagesVisible (SQS), or a metric your own code publishes. A target-health metric of a load balancer (UnHealthyHostCount, HealthyHostCount, RequestCountPerTarget, ...) gets the target group dimension it needs."

# Combinations CloudWatch does not publish for the watched type. One clause per type: the
# alarm watches a T, and the preset is none of the ones T has.
[[providers.aws.checks]]
severity = "error"
when = { any = [ { all = [ { relation = "attribute_reference", target_type = "compute_instance" }, { field = "metric", not_one_of = ["custom", "cpu", "disk"] } ] }, { all = [ { relation = "attribute_reference", target_type = "relational_database" }, { field = "metric", not_one_of = ["custom", "cpu", "db_storage", "db_connections"] } ] }, { all = [ { relation = "attribute_reference", target_type = "function" }, { field = "metric", not_one_of = ["custom", "function_errors"] } ] }, { all = [ { relation = "attribute_reference", target_type = "event_queue" }, { field = "metric", not_one_of = ["custom", "queue_depth", "dlq_depth", "queue_oldest_message_age"] } ] }, { all = [ { relation = "attribute_reference", target_type = "load_balancer" }, { field = "metric", not_one_of = ["custom", "lb_5xx", "lb_5xx_rate", "lb_latency", "lb_unhealthy_hosts", "lb_healthy_hosts"] } ] }, { all = [ { relation = "attribute_reference", target_type = "container_app" }, { field = "metric", not_one_of = ["custom", "cpu", "memory"] } ] }, { all = [ { relation = "attribute_reference", target_type = "kubernetes_cluster" }, { field = "metric", not_one_of = ["custom", "node_count"] } ] }, { all = [ { relation = "attribute_reference", target_type = "object_storage" }, { field = "metric", not_one_of = ["custom", "bucket_size"] } ] }, { all = [ { relation = "attribute_reference", target_type = "topic" }, { field = "metric", not_equals = "custom" } ] }, { all = [ { relation = "attribute_reference", target_type = "cache" }, { field = "metric", not_one_of = ["custom", "cpu", "memory"] } ] }, { all = [ { relation = "attribute_reference", target_type = "file_system" }, { field = "metric", not_equals = "custom" } ] } ] }
message = "\"{name}\": CloudWatch does not publish that metric for the resource this alarm watches. Pick a metric the resource has, or choose 'custom' and name the CloudWatch metric yourself (SNS: NumberOfNotificationsFailed; EFS: PercentIOLimit, BurstCreditBalance)"

[[providers.aws.checks]]
severity = "error"
when = { all = [ { relation = "attribute_reference", target_type = "load_balancer", target_field = "protocol", equals = "tcp" }, { field = "metric", one_of = ["lb_5xx", "lb_5xx_rate", "lb_latency"] } ] }
message = "\"{name}\" watches HTTP responses of a tcp (network) load balancer, which counts no status codes and measures no response time; watch its targets' health, or choose 'custom' with an AWS/NetworkELB metric"

[[providers.aws.checks]]
when = { field = "metric", equals = "disk" }
message = "\"{name}\" watches disk usage, which EC2 does not publish on its own: the CloudWatch agent must be running on the instance and writing `disk_used_percent` into the CWAgent namespace, with the same dimensions the alarm uses"

[[providers.aws.checks]]
when = { field = "metric", equals = "bucket_size" }
message = "\"{name}\" watches bucket size, which S3 reports once a day: use a period of 900 seconds or more and expect the alarm to sit in INSUFFICIENT_DATA between daily reports"

[[providers.aws.checks]]
when = { all = [ { field = "metric", equals = "node_count" }, { relation = "attribute_reference", target_type = "kubernetes_cluster", target_field = "container_insights", not_equals = "true" } ] }
message = "\"{name}\" watches the cluster's node count, which only exists once Container Insights is on: tick it on the linked Kubernetes Cluster"

[[providers.aws.checks]]
when = { all = [ { field = "metric", one_of = ["db_storage", "lb_5xx_rate"] }, { field = "threshold", greater_than = 100 } ] }
message = "\"{name}\" compares a percentage with a threshold above 100, so it can never fire"

[[providers.aws.blocks]]
key = "main"
resource = "aws_cloudwatch_metric_alarm"

[providers.aws.blocks.args]
alarm_name          = { field = "name", transform = "kebab" }
comparison_operator = { map = "comparison", table = { greater_than = "GreaterThanThreshold", less_than = "LessThanThreshold" } }
evaluation_periods  = { field = "evaluation_periods" }
threshold           = { field = "threshold" }
alarm_description   = { template = "{name}" }
alarm_actions       = { relation = "sends_to", target_type = "topic", attr = "arn", wrap = "list" }
tags                = { object = { Name = { field = "name" } } }
# A metric-math alarm names its metrics inside `metric_query`, and CloudWatch refuses the
# single-metric arguments next to it.
period              = { if = { field = "metric", not_one_of = ["lb_5xx_rate", "db_storage"] }, then = { map = "period_seconds", table = { "60" = 60, "300" = 300, "900" = 900 } } }
# A percentile is an extended statistic; the two are mutually exclusive.
extended_statistic  = { if = { all = [ { field = "metric", not_one_of = ["lb_5xx_rate", "db_storage"] }, { field = "statistic", one_of = ["p50", "p90", "p95", "p99"] } ] }, then = { field = "statistic" } }

# The preset names the metric; only `memory` is spelled differently per type.
[providers.aws.blocks.args.metric_name]
if = { field = "metric", not_one_of = ["lb_5xx_rate", "db_storage"] }
then = { if = { field = "metric", equals = "custom" }, then = { provider_field = "metric_name", fallback = { value = "CPUUtilization" } }, else = { if = { field = "metric", equals = "memory" }, then = { if = { relation = "attribute_reference", target_type = "cache" }, then = { value = "DatabaseMemoryUsagePercentage" }, else = { value = "MemoryUtilization" } }, else = { map = "metric", optional = true, table = { cpu = "CPUUtilization", disk = "disk_used_percent", queue_depth = "ApproximateNumberOfMessagesVisible", dlq_depth = "ApproximateNumberOfMessagesVisible", queue_oldest_message_age = "ApproximateAgeOfOldestMessage", db_connections = "DatabaseConnections", lb_5xx = "HTTPCode_Target_5XX_Count", lb_latency = "TargetResponseTime", lb_unhealthy_hosts = "UnHealthyHostCount", lb_healthy_hosts = "HealthyHostCount", function_errors = "Errors", node_count = "cluster_node_count", bucket_size = "BucketSizeBytes" } } } }

# The Statistic field when it names one, otherwise the preset's own.
[providers.aws.blocks.args.statistic]
if = { all = [ { field = "metric", not_one_of = ["lb_5xx_rate", "db_storage"] }, { field = "statistic", not_one_of = ["p50", "p90", "p95", "p99"] } ] }
then = { if = { field = "statistic", one_of = ["Average", "Sum", "Minimum", "Maximum"] }, then = { field = "statistic" }, else = { map = "metric", table = { cpu = "Average", memory = "Average", disk = "Average", queue_depth = "Maximum", dlq_depth = "Maximum", queue_oldest_message_age = "Maximum", db_storage = "Minimum", db_connections = "Maximum", lb_5xx = "Sum", lb_5xx_rate = "Sum", lb_latency = "Average", lb_unhealthy_hosts = "Maximum", lb_healthy_hosts = "Minimum", function_errors = "Sum", node_count = "Average", bucket_size = "Average", custom = "Average" } } }

# Namespace follows the watched type; the CloudWatch agent's metrics are the exception.
[providers.aws.blocks.args.namespace]
if = { field = "metric", not_one_of = ["lb_5xx_rate", "db_storage"] }
then = { provider_field = "metric_namespace", fallback = { if = { field = "metric", equals = "disk" }, then = { value = "CWAgent" }, else = { if = { relation = "attribute_reference", target_type = "compute_instance" }, then = { value = "AWS/EC2" }, else = { if = { relation = "attribute_reference", target_type = "relational_database" }, then = { value = "AWS/RDS" }, else = { if = { relation = "attribute_reference", target_type = "function" }, then = { value = "AWS/Lambda" }, else = { if = { relation = "attribute_reference", target_type = "event_queue" }, then = { value = "AWS/SQS" }, else = { if = { relation = "attribute_reference", target_type = "container_app" }, then = { value = "AWS/ECS" }, else = { if = { relation = "attribute_reference", target_type = "kubernetes_cluster" }, then = { value = "ContainerInsights" }, else = { if = { relation = "attribute_reference", target_type = "object_storage" }, then = { value = "AWS/S3" }, else = { if = { relation = "attribute_reference", target_type = "topic" }, then = { value = "AWS/SNS" }, else = { if = { relation = "attribute_reference", target_type = "cache" }, then = { value = "AWS/ElastiCache" }, else = { if = { relation = "attribute_reference", target_type = "file_system" }, then = { value = "AWS/EFS" }, else = { if = { relation = "attribute_reference", target_type = "load_balancer", target_field = "protocol", equals = "tcp" }, then = { value = "AWS/NetworkELB" }, else = { value = "AWS/ApplicationELB" } } } } } } } } } } } } } }

# Target-health metrics are published per target group and load balancer only, never per
# load balancer alone; the load balancer has one target group (`tg`).
[providers.aws.blocks.args.dimensions]
if = { field = "metric", not_one_of = ["lb_5xx_rate", "db_storage"] }
then = { if = { relation = "attribute_reference", target_type = "compute_instance" }, then = { object = { InstanceId = { relation = "attribute_reference", target_type = "compute_instance", attr = "id" } } }, else = { if = { relation = "attribute_reference", target_type = "relational_database" }, then = { object = { DBInstanceIdentifier = { relation = "attribute_reference", target_type = "relational_database", attr = "identifier" } } }, else = { if = { relation = "attribute_reference", target_type = "function" }, then = { object = { FunctionName = { relation = "attribute_reference", target_type = "function", attr = "function_name" } } }, else = { if = { relation = "attribute_reference", target_type = "event_queue" }, then = { object = { QueueName = { relation = "attribute_reference", target_type = "event_queue", attr = "name" } } }, else = { if = { relation = "attribute_reference", target_type = "container_app" }, then = { object = { ClusterName = { relation = "attribute_reference", target_type = "container_app", block = "cluster", attr = "name", fallback = { relation = "attribute_reference", target_type = "container_app", ancestor = "container_environment", attr = "name" } }, ServiceName = { relation = "attribute_reference", target_type = "container_app", attr = "name" } } }, else = { if = { relation = "attribute_reference", target_type = "kubernetes_cluster" }, then = { object = { ClusterName = { relation = "attribute_reference", target_type = "kubernetes_cluster", attr = "name" } } }, else = { if = { relation = "attribute_reference", target_type = "object_storage" }, then = { object = { BucketName = { relation = "attribute_reference", target_type = "object_storage", attr = "id" }, StorageType = { value = "StandardStorage" } } }, else = { if = { relation = "attribute_reference", target_type = "topic" }, then = { object = { TopicName = { relation = "attribute_reference", target_type = "topic", attr = "name" } } }, else = { if = { relation = "attribute_reference", target_type = "cache" }, then = { object = { CacheClusterId = { relation = "attribute_reference", target_type = "cache", attr = "cluster_id" } } }, else = { if = { relation = "attribute_reference", target_type = "file_system" }, then = { object = { FileSystemId = { relation = "attribute_reference", target_type = "file_system", attr = "id" } } }, else = { if = { any = [ { field = "metric", one_of = ["lb_unhealthy_hosts", "lb_healthy_hosts"] }, { all = [ { field = "metric", equals = "custom" }, { provider_field = "metric_name", one_of = ["UnHealthyHostCount", "HealthyHostCount", "HealthyStateDNS", "HealthyStateRouting", "UnhealthyStateDNS", "UnhealthyStateRouting", "RequestCountPerTarget"] } ] } ] }, then = { object = { TargetGroup = { relation = "attribute_reference", target_type = "load_balancer", block = "tg", attr = "arn_suffix" }, LoadBalancer = { relation = "attribute_reference", target_type = "load_balancer", attr = "arn_suffix" } } }, else = { object = { LoadBalancer = { relation = "attribute_reference", target_type = "load_balancer", attr = "arn_suffix" } } } } } } } } } } } } } }

# 'lb_5xx_rate': 5xx responses as a percentage of requests. FILL keeps a period with
# requests but no 5xx (CloudWatch publishes no zero) at 0 % instead of missing data.
[[providers.aws.blocks.nested]]
block = "metric_query"
when = { field = "metric", equals = "lb_5xx_rate" }

[providers.aws.blocks.nested.args]
id          = { value = "rate" }
expression  = { value = "100 * FILL(errors, 0) / requests" }
label       = { value = "5xx responses, % of requests" }
return_data = { value = true }

[[providers.aws.blocks.nested]]
block = "metric_query"
when = { field = "metric", equals = "lb_5xx_rate" }

[providers.aws.blocks.nested.args]
id          = { value = "errors" }
return_data = { value = false }

[[providers.aws.blocks.nested.nested]]
block = "metric"

[providers.aws.blocks.nested.nested.args]
metric_name = { value = "HTTPCode_Target_5XX_Count" }
namespace   = { value = "AWS/ApplicationELB" }
period      = { map = "period_seconds", table = { "60" = 60, "300" = 300, "900" = 900 } }
stat        = { value = "Sum" }
dimensions  = { object = { LoadBalancer = { relation = "attribute_reference", target_type = "load_balancer", attr = "arn_suffix" } } }

[[providers.aws.blocks.nested]]
block = "metric_query"
when = { field = "metric", equals = "lb_5xx_rate" }

[providers.aws.blocks.nested.args]
id          = { value = "requests" }
return_data = { value = false }

[[providers.aws.blocks.nested.nested]]
block = "metric"

[providers.aws.blocks.nested.nested.args]
metric_name = { value = "RequestCount" }
namespace   = { value = "AWS/ApplicationELB" }
period      = { map = "period_seconds", table = { "60" = 60, "300" = 300, "900" = 900 } }
stat        = { value = "Sum" }
dimensions  = { object = { LoadBalancer = { relation = "attribute_reference", target_type = "load_balancer", attr = "arn_suffix" } } }

# 'db_storage': free storage as a percentage of the storage the instance has now. The
# allocated size is read from the instance, so storage autoscaling moves it on the next
# apply.
[[providers.aws.blocks.nested]]
block = "metric_query"
when = { field = "metric", equals = "db_storage" }

[providers.aws.blocks.nested.args]
id          = { value = "free_pct" }
expression  = { func = "format", args = [ { value = "100 * free / (%d * 1073741824)" }, { relation = "attribute_reference", target_type = "relational_database", attr = "allocated_storage" } ] }
label       = { value = "Free storage, % of allocated" }
return_data = { value = true }

[[providers.aws.blocks.nested]]
block = "metric_query"
when = { field = "metric", equals = "db_storage" }

[providers.aws.blocks.nested.args]
id          = { value = "free" }
return_data = { value = false }

[[providers.aws.blocks.nested.nested]]
block = "metric"

[providers.aws.blocks.nested.nested.args]
metric_name = { value = "FreeStorageSpace" }
namespace   = { value = "AWS/RDS" }
period      = { map = "period_seconds", table = { "60" = 60, "300" = 300, "900" = 900 } }
stat        = { value = "Minimum" }
dimensions  = { object = { DBInstanceIdentifier = { relation = "attribute_reference", target_type = "relational_database", attr = "identifier" } } }

[providers.aws.outputs]
arn = { attr = "arn", description = "Alarm ARN" }

# ---------------------------------------------------------------- Azure
[providers.azure]
status = "partial"

[[providers.azure.fields]]
name = "metric_namespace"
label = "Metric namespace"
type = "string"
default = "Microsoft.Compute/virtualMachines"
description = "Namespace for the custom metric, e.g. Microsoft.Compute/virtualMachines, Microsoft.DBforPostgreSQL/flexibleServers, Microsoft.Web/sites, Microsoft.ServiceBus/namespaces. A preset uses the namespace of the watched type itself."

[[providers.azure.fields]]
name = "metric_name"
label = "Metric name"
type = "string"
default = "Percentage CPU"
description = "Metric name for the custom metric, e.g. Percentage CPU, cpu_percent (PostgreSQL), ActiveMessages (Service Bus)."

[[providers.azure.fields]]
name = "aggregation"
label = "Aggregation"
type = "enum"
options = ["Average", "Total", "Maximum", "Minimum", "Count"]
default = "Average"
description = "Aggregation for the custom metric. A preset picks its own."

[[providers.azure.fields]]
name = "notify_email"
label = "Notify email"
type = "string"
pattern = "^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$"
pattern_hint = "an email address"
description = "Azure notifies through an action group rather than a topic: when set, an action group with this email receiver is generated and attached to the alert."

[[providers.azure.checks]]
severity = "omit"
when = { any = [ { all = [ { relation = "attribute_reference", target_type = "compute_instance" }, { field = "metric", not_equals = "custom" }, { field = "metric", not_equals = "cpu" } ] }, { all = [ { relation = "attribute_reference", target_type = "relational_database" }, { field = "metric", not_equals = "custom" }, { field = "metric", not_equals = "cpu" }, { field = "metric", not_equals = "db_storage" }, { field = "metric", not_equals = "db_connections" } ] }, { all = [ { relation = "attribute_reference", target_type = "function" }, { field = "metric", not_equals = "custom" }, { field = "metric", not_equals = "function_errors" } ] }, { all = [ { relation = "attribute_reference", target_type = "event_queue" }, { field = "metric", not_equals = "custom" }, { field = "metric", not_equals = "queue_depth" }, { field = "metric", not_equals = "dlq_depth" } ] }, { all = [ { relation = "attribute_reference", target_type = "load_balancer" }, { field = "metric", not_equals = "custom" } ] }, { all = [ { relation = "attribute_reference", target_type = "container_app" }, { field = "metric", not_equals = "custom" }, { field = "metric", not_equals = "cpu" }, { field = "metric", not_equals = "memory" } ] }, { all = [ { relation = "attribute_reference", target_type = "kubernetes_cluster" }, { field = "metric", not_equals = "custom" }, { field = "metric", not_equals = "cpu" }, { field = "metric", not_equals = "memory" } ] }, { all = [ { relation = "attribute_reference", target_type = "object_storage" }, { field = "metric", not_equals = "custom" }, { field = "metric", not_equals = "bucket_size" } ] }, { all = [ { relation = "attribute_reference", target_type = "topic" }, { field = "metric", not_equals = "custom" } ] }, { all = [ { relation = "attribute_reference", target_type = "cache" }, { field = "metric", not_equals = "custom" }, { field = "metric", not_equals = "cpu" }, { field = "metric", not_equals = "memory" } ] }, { all = [ { relation = "attribute_reference", target_type = "file_system" }, { field = "metric", not_equals = "custom" } ] } ] }
message = "\"{name}\": Azure Monitor has no platform metric of that kind for the resource this alarm watches. Notable gaps: a VM's disk usage is a guest metric published by the diagnostics extension, an Azure Load Balancer is layer 4 and counts no HTTP status codes, Service Bus reports no message age, and AKS reports node utilisation rather than a node count. Choose 'custom' and name the metric (and its namespace) yourself"

[[providers.azure.checks]]
severity = "omit"
when = { field = "statistic", one_of = ["p50", "p90", "p95", "p99"] }
message = "\"{name}\" asks for a percentile, and Azure metric alerts only aggregate with Average, Minimum, Maximum, Total or Count; a percentile alert is a log alert over Application Insights data"

[[providers.azure.checks]]
when = { field = "metric", equals = "dlq_depth" }
message = "\"{name}\" watches dead letters, which Service Bus keeps in a sub-queue of the queue itself rather than in a separate queue. The alert is scoped to the whole namespace, so it counts dead letters of every queue and topic in it"

[[providers.azure.checks]]
when = { field = "metric", equals = "function_errors" }
message = "\"{name}\" watches function errors as `Http5xx` on the function app, which only sees HTTP-triggered failures; queue- and timer-triggered failures are visible in Application Insights, not in platform metrics"

[[providers.azure.checks]]
when = { field = "evaluation_periods", not_equals = "1" }
message = "\"{name}\": Azure metric alerts evaluate a single window, so 'Consecutive periods' is approximated by the window size (use a dynamic-threshold alert for N-of-M behaviour)"

# Action group with an email receiver, when an address is given.
[[providers.azure.blocks]]
key = "ag"
resource = "azurerm_monitor_action_group"
when = { provider_field = "notify_email" }

[providers.azure.blocks.args]
name                = { template = "{name}-actions", transform = "kebab" }
resource_group_name = { ancestor = "resource_group", attr = "name" }
short_name          = { value = "ttgalarm" }

[[providers.azure.blocks.nested]]
block = "email_receiver"

[providers.azure.blocks.nested.args]
name          = { value = "email" }
email_address = { provider_field = "notify_email" }

[[providers.azure.blocks]]
key = "main"
resource = "azurerm_monitor_metric_alert"

[providers.azure.blocks.args]
name                = { field = "name", transform = "kebab" }
resource_group_name = { ancestor = "resource_group", attr = "name" }
description         = { template = "{name}" }
frequency           = { value = "PT1M" }
window_size         = { map = "period_seconds", table = { "60" = "PT1M", "300" = "PT5M", "900" = "PT15M" } }
severity            = { value = 2 }
tags                = { object = { Name = { field = "name" } } }

# Scope: the watched resource's primary block; databases, queues and shares have several.
[providers.azure.blocks.args.scopes]
relation = "attribute_reference"
target_type = "compute_instance"
attr = "id"
wrap = "list"
fallback = { relation = "attribute_reference", target_type = "relational_database", block = "pg", attr = "id", wrap = "list", fallback = { relation = "attribute_reference", target_type = "relational_database", block = "my", attr = "id", wrap = "list", fallback = { relation = "attribute_reference", target_type = "function", attr = "id", wrap = "list", fallback = { relation = "attribute_reference", target_type = "event_queue", block = "ns", attr = "id", wrap = "list", fallback = { relation = "attribute_reference", target_type = "event_queue", ancestor = "servicebus_namespace", attr = "id", wrap = "list", fallback = { relation = "attribute_reference", target_type = "topic", block = "ns", attr = "id", wrap = "list", fallback = { relation = "attribute_reference", target_type = "topic", ancestor = "servicebus_namespace", attr = "id", wrap = "list", fallback = { relation = "attribute_reference", target_type = "container_app", attr = "id", wrap = "list", fallback = { relation = "attribute_reference", target_type = "kubernetes_cluster", attr = "id", wrap = "list", fallback = { relation = "attribute_reference", target_type = "object_storage", attr = "id", wrap = "list", fallback = { relation = "attribute_reference", target_type = "cache", attr = "id", wrap = "list", fallback = { relation = "attribute_reference", target_type = "file_system", block = "account", attr = "id", wrap = "list", fallback = { relation = "attribute_reference", target_type = "load_balancer", attr = "id", wrap = "list" } } } } } } } } } } } } }

[[providers.azure.blocks.nested]]
block = "action"
when = { provider_field = "notify_email" }

[providers.azure.blocks.nested.args]
action_group_id = { self_block = "ag", attr = "id" }

[[providers.azure.blocks.nested]]
block = "criteria"

# Azure reports storage used, not free: "less than 10 % free" is "more than 90 % used".
[providers.azure.blocks.nested.args]
operator  = { if = { field = "metric", equals = "db_storage" }, then = { map = "comparison", table = { greater_than = "LessThan", less_than = "GreaterThan" } }, else = { map = "comparison", table = { greater_than = "GreaterThan", less_than = "LessThan" } } }
threshold = { if = { field = "metric", equals = "db_storage" }, then = { raw = "100 - @threshold@", refs = { threshold = { field = "threshold" } } }, else = { field = "threshold" } }

[providers.azure.blocks.nested.args.metric_namespace]
if = { field = "metric", equals = "custom" }
then = { provider_field = "metric_namespace", fallback = { value = "Microsoft.Compute/virtualMachines" } }
else = { if = { relation = "attribute_reference", target_type = "compute_instance" }, then = { value = "Microsoft.Compute/virtualMachines" }, else = { if = { relation = "attribute_reference", target_type = "relational_database", target_field = "engine", equals = "mysql" }, then = { value = "Microsoft.DBforMySQL/flexibleServers" }, else = { if = { relation = "attribute_reference", target_type = "relational_database" }, then = { value = "Microsoft.DBforPostgreSQL/flexibleServers" }, else = { if = { relation = "attribute_reference", target_type = "function" }, then = { value = "Microsoft.Web/sites" }, else = { if = { relation = "attribute_reference", target_type = "event_queue" }, then = { value = "Microsoft.ServiceBus/namespaces" }, else = { if = { relation = "attribute_reference", target_type = "topic" }, then = { value = "Microsoft.ServiceBus/namespaces" }, else = { if = { relation = "attribute_reference", target_type = "container_app" }, then = { value = "Microsoft.App/containerApps" }, else = { if = { relation = "attribute_reference", target_type = "kubernetes_cluster" }, then = { value = "Microsoft.ContainerService/managedClusters" }, else = { if = { relation = "attribute_reference", target_type = "object_storage" }, then = { value = "Microsoft.Storage/storageAccounts" }, else = { if = { relation = "attribute_reference", target_type = "file_system" }, then = { value = "Microsoft.Storage/storageAccounts" }, else = { if = { relation = "attribute_reference", target_type = "cache" }, then = { value = "Microsoft.Cache/Redis" }, else = { value = "Microsoft.Network/loadBalancers" } } } } } } } } } } } }

[providers.azure.blocks.nested.args.metric_name]
if = { field = "metric", equals = "custom" }
then = { provider_field = "metric_name", fallback = { value = "Percentage CPU" } }
else = { if = { field = "metric", equals = "cpu" }, then = { if = { relation = "attribute_reference", target_type = "compute_instance" }, then = { value = "Percentage CPU" }, else = { if = { relation = "attribute_reference", target_type = "relational_database" }, then = { value = "cpu_percent" }, else = { if = { relation = "attribute_reference", target_type = "container_app" }, then = { value = "UsageNanoCores" }, else = { if = { relation = "attribute_reference", target_type = "kubernetes_cluster" }, then = { value = "node_cpu_usage_percentage" }, else = { value = "percentProcessorTime" } } } } }, else = { if = { field = "metric", equals = "memory" }, then = { if = { relation = "attribute_reference", target_type = "container_app" }, then = { value = "WorkingSetBytes" }, else = { if = { relation = "attribute_reference", target_type = "kubernetes_cluster" }, then = { value = "node_memory_working_set_percentage" }, else = { value = "usedmemorypercentage" } } }, else = { map = "metric", optional = true, table = { queue_depth = "ActiveMessages", dlq_depth = "DeadletteredMessages", db_storage = "storage_percent", db_connections = "active_connections", function_errors = "Http5xx", bucket_size = "UsedCapacity" } } } }

[providers.azure.blocks.nested.args.aggregation]
if = { field = "statistic", one_of = ["Average", "Sum", "Minimum", "Maximum"] }
then = { map = "statistic", table = { Average = "Average", Sum = "Total", Minimum = "Minimum", Maximum = "Maximum" } }
else = { if = { field = "metric", equals = "custom" }, then = { provider_field = "aggregation", fallback = { value = "Average" } }, else = { map = "metric", table = { cpu = "Average", memory = "Average", disk = "Average", queue_depth = "Maximum", dlq_depth = "Maximum", queue_oldest_message_age = "Maximum", db_storage = "Average", db_connections = "Average", lb_5xx = "Total", lb_5xx_rate = "Total", lb_latency = "Average", lb_unhealthy_hosts = "Maximum", lb_healthy_hosts = "Minimum", function_errors = "Total", node_count = "Average", bucket_size = "Average", custom = "Average" } } }

[providers.azure.outputs]
id = { attr = "id", description = "Metric alert id" }

[[providers.azure.manual_steps]]
title = "Notifications need an action group"
when = { all = [ { relation = "sends_to" }, { provider_field = "notify_email", absent = true } ] }
body = """
Azure Monitor notifies through an *action group*, not a Service Bus topic. Set the Azure
**Notify email** field to generate an action group with an email receiver, or create an
`azurerm_monitor_action_group` with a webhook / Logic App that forwards to the linked topic
and add an `action { action_group_id = … }` block to the alert.
"""

[[providers.azure.manual_steps]]
title = "Check the metric against the resource it is scoped to"
body = """
A metric alert is rejected at apply time when its metric does not exist in the scoped
resource's namespace. The mapping picks the platform metric that matches the preset for
the watched type; if you overrode the metric fields, confirm the pair with
`az monitor metrics list-definitions --resource <id>`.
"""

# ---------------------------------------------------------------- GCP
[providers.gcp]
status = "partial"
notes = "A Cloud Monitoring alert policy with a threshold condition. The filter follows the metric preset and the watched resource; an email notification channel is generated when an address is given."

[[providers.gcp.fields]]
name = "metric_filter"
label = "Metric filter"
type = "string"
description = "Overrides the filter the preset implies. Cloud Monitoring filter, e.g. metric.type=\"cloudsql.googleapis.com/database/cpu/utilization\" AND resource.type=\"cloudsql_database\". Required when Metric is 'custom'. Utilisation metrics are fractions (0..1), so a threshold of 80 needs 0.8."

[[providers.gcp.fields]]
name = "notify_email"
label = "Notify email"
type = "string"
pattern = "^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$"
pattern_hint = "an email address"
description = "When set, an email notification channel is generated and attached to the policy."

[[providers.gcp.checks]]
when = { all = [ { field = "metric", equals = "custom" }, { provider_field = "metric_filter", absent = true } ] }
message = "\"{name}\" uses a custom metric but names no filter, so the alert watches the usual metric of the type it is linked to; write a Cloud Monitoring metric filter to watch anything else"

[[providers.gcp.checks]]
severity = "omit"
when = { any = [ { all = [ { relation = "attribute_reference", target_type = "compute_instance" }, { field = "metric", not_equals = "custom" }, { field = "metric", not_equals = "cpu" }, { field = "metric", not_equals = "disk" } ] }, { all = [ { relation = "attribute_reference", target_type = "relational_database" }, { field = "metric", not_equals = "custom" }, { field = "metric", not_equals = "cpu" }, { field = "metric", not_equals = "db_storage" }, { field = "metric", not_equals = "db_connections" } ] }, { all = [ { relation = "attribute_reference", target_type = "function" }, { field = "metric", not_equals = "custom" }, { field = "metric", not_equals = "function_errors" } ] }, { all = [ { relation = "attribute_reference", target_type = "event_queue" }, { field = "metric", not_equals = "custom" }, { field = "metric", not_equals = "queue_depth" }, { field = "metric", not_equals = "dlq_depth" }, { field = "metric", not_equals = "queue_oldest_message_age" } ] }, { all = [ { relation = "attribute_reference", target_type = "load_balancer" }, { field = "metric", not_equals = "custom" }, { field = "metric", not_equals = "lb_latency" } ] }, { all = [ { relation = "attribute_reference", target_type = "container_app" }, { field = "metric", not_equals = "custom" }, { field = "metric", not_equals = "cpu" }, { field = "metric", not_equals = "memory" } ] }, { all = [ { relation = "attribute_reference", target_type = "kubernetes_cluster" }, { field = "metric", not_equals = "custom" }, { field = "metric", not_equals = "cpu" }, { field = "metric", not_equals = "memory" } ] }, { all = [ { relation = "attribute_reference", target_type = "object_storage" }, { field = "metric", not_equals = "custom" }, { field = "metric", not_equals = "bucket_size" } ] }, { all = [ { relation = "attribute_reference", target_type = "topic" }, { field = "metric", not_equals = "custom" } ] }, { all = [ { relation = "attribute_reference", target_type = "cache" }, { field = "metric", not_equals = "custom" }, { field = "metric", not_equals = "cpu" }, { field = "metric", not_equals = "memory" } ] }, { all = [ { relation = "attribute_reference", target_type = "file_system" }, { field = "metric", not_equals = "custom" } ] } ] }
message = "\"{name}\": Cloud Monitoring has no metric of that kind for the resource this alarm watches. Notable gaps: the generated load balancer is a layer-3 passthrough and counts no HTTP status codes, a Pub/Sub topic is measured through its subscriptions, and Filestore metrics are per instance. Choose 'custom' and write the metric filter yourself"

[[providers.gcp.checks]]
when = { field = "metric", equals = "disk" }
message = "\"{name}\" watches disk usage through `agent.googleapis.com/disk/percent_used`, which only exists while the Ops Agent is installed on the instance"

[[providers.gcp.checks]]
when = { field = "statistic", equals = "p90" }
message = "\"{name}\" asks for p90, which Cloud Monitoring does not align to (it has p5, p50, p95 and p99); the policy uses p95"

[[providers.gcp.checks]]
when = { all = [ { field = "statistic", one_of = ["p50", "p90", "p95", "p99"] }, { field = "metric", not_one_of = ["lb_latency", "custom"] } ] }
message = "\"{name}\" asks for a percentile of a metric Cloud Monitoring keeps as a single value per point rather than a distribution, so the policy will be rejected; percentiles are for latency distributions"

[[providers.gcp.blocks]]
key = "channel"
resource = "google_monitoring_notification_channel"
when = { provider_field = "notify_email" }

[providers.gcp.blocks.args]
display_name = { template = "{name} email" }
type         = { value = "email" }
labels       = { object = { email_address = { provider_field = "notify_email" } } }

[[providers.gcp.blocks]]
key = "main"
resource = "google_monitoring_alert_policy"

[providers.gcp.blocks.args]
display_name          = { field = "name" }
combiner              = { value = "OR" }
notification_channels = { if = { provider_field = "notify_email" }, then = { self_block = "channel", attr = "id", wrap = "list" } }

[[providers.gcp.blocks.nested]]
block = "conditions"

[providers.gcp.blocks.nested.args]
display_name = { template = "{name} threshold" }

[[providers.gcp.blocks.nested.nested]]
block = "condition_threshold"

[providers.gcp.blocks.nested.nested.args]
# Cloud SQL reports disk used as a fraction, so "less than 10 % free" is "more than 0.9 used".
comparison      = { if = { field = "metric", equals = "db_storage" }, then = { map = "comparison", table = { greater_than = "COMPARISON_LT", less_than = "COMPARISON_GT" } }, else = { map = "comparison", table = { greater_than = "COMPARISON_GT", less_than = "COMPARISON_LT" } } }
# Utilisation metrics are fractions (0..1) and load-balancer latency is in milliseconds,
# while the threshold is in the preset's own unit (percent, seconds).
threshold_value = { if = { field = "metric", one_of = ["cpu", "memory"] }, then = { raw = "@threshold@ / 100", refs = { threshold = { field = "threshold" } } }, else = { if = { field = "metric", equals = "db_storage" }, then = { raw = "(100 - @threshold@) / 100", refs = { threshold = { field = "threshold" } } }, else = { if = { field = "metric", equals = "lb_latency" }, then = { raw = "@threshold@ * 1000", refs = { threshold = { field = "threshold" } } }, else = { field = "threshold" } } } }
duration        = { map = "period_seconds", table = { "60" = "60s", "300" = "300s", "900" = "900s" } }

# The filter follows the watched resource first, then the preset within it.
[providers.gcp.blocks.nested.nested.args.filter]
provider_field = "metric_filter"
fallback = { if = { relation = "attribute_reference", target_type = "compute_instance" }, then = { if = { field = "metric", equals = "disk" }, then = { func = "format", args = [ { value = "metric.type=\"agent.googleapis.com/disk/percent_used\" AND resource.type=\"gce_instance\" AND resource.labels.instance_id=\"%s\"" }, { relation = "attribute_reference", target_type = "compute_instance", attr = "instance_id" } ] }, else = { func = "format", args = [ { value = "metric.type=\"compute.googleapis.com/instance/cpu/utilization\" AND resource.type=\"gce_instance\" AND resource.labels.instance_id=\"%s\"" }, { relation = "attribute_reference", target_type = "compute_instance", attr = "instance_id" } ] } }, else = { if = { relation = "attribute_reference", target_type = "relational_database" }, then = { func = "format", args = [ { map = "metric", table = { custom = "metric.type=\"cloudsql.googleapis.com/database/cpu/utilization\" AND resource.type=\"cloudsql_database\" AND resource.labels.database_id=\"%s:%s\"", cpu = "metric.type=\"cloudsql.googleapis.com/database/cpu/utilization\" AND resource.type=\"cloudsql_database\" AND resource.labels.database_id=\"%s:%s\"", db_storage = "metric.type=\"cloudsql.googleapis.com/database/disk/utilization\" AND resource.type=\"cloudsql_database\" AND resource.labels.database_id=\"%s:%s\"", db_connections = "metric.type=\"cloudsql.googleapis.com/database/network/connections\" AND resource.type=\"cloudsql_database\" AND resource.labels.database_id=\"%s:%s\"" }, optional = true }, { var = "project" }, { relation = "attribute_reference", target_type = "relational_database", attr = "name" } ] }, else = { if = { relation = "attribute_reference", target_type = "function" }, then = { func = "format", args = [ { value = "metric.type=\"cloudfunctions.googleapis.com/function/execution_count\" AND resource.type=\"cloud_function\" AND resource.labels.function_name=\"%s\"" }, { relation = "attribute_reference", target_type = "function", attr = "name" } ] }, else = { if = { relation = "attribute_reference", target_type = "event_queue" }, then = { func = "format", args = [ { map = "metric", table = { custom = "metric.type=\"pubsub.googleapis.com/subscription/num_undelivered_messages\" AND resource.type=\"pubsub_subscription\" AND resource.labels.subscription_id=\"%s\"", queue_depth = "metric.type=\"pubsub.googleapis.com/subscription/num_undelivered_messages\" AND resource.type=\"pubsub_subscription\" AND resource.labels.subscription_id=\"%s\"", queue_oldest_message_age = "metric.type=\"pubsub.googleapis.com/subscription/oldest_unacked_message_age\" AND resource.type=\"pubsub_subscription\" AND resource.labels.subscription_id=\"%s\"", dlq_depth = "metric.type=\"pubsub.googleapis.com/subscription/num_undelivered_messages\" AND resource.type=\"pubsub_subscription\" AND resource.labels.subscription_id=\"%s\"" }, optional = true }, { relation = "attribute_reference", target_type = "event_queue", block = "sub", attr = "name" } ] }, else = { if = { relation = "attribute_reference", target_type = "container_app" }, then = { func = "format", args = [ { map = "metric", table = { custom = "metric.type=\"run.googleapis.com/container/cpu/utilizations\" AND resource.type=\"cloud_run_revision\" AND resource.labels.service_name=\"%s\"", cpu = "metric.type=\"run.googleapis.com/container/cpu/utilizations\" AND resource.type=\"cloud_run_revision\" AND resource.labels.service_name=\"%s\"", memory = "metric.type=\"run.googleapis.com/container/memory/utilizations\" AND resource.type=\"cloud_run_revision\" AND resource.labels.service_name=\"%s\"" }, optional = true }, { relation = "attribute_reference", target_type = "container_app", attr = "name" } ] }, else = { if = { relation = "attribute_reference", target_type = "kubernetes_cluster" }, then = { func = "format", args = [ { map = "metric", table = { custom = "metric.type=\"kubernetes.io/node/cpu/allocatable_utilization\" AND resource.type=\"k8s_node\" AND resource.labels.cluster_name=\"%s\"", cpu = "metric.type=\"kubernetes.io/node/cpu/allocatable_utilization\" AND resource.type=\"k8s_node\" AND resource.labels.cluster_name=\"%s\"", memory = "metric.type=\"kubernetes.io/node/memory/allocatable_utilization\" AND resource.type=\"k8s_node\" AND resource.labels.cluster_name=\"%s\"" }, optional = true }, { relation = "attribute_reference", target_type = "kubernetes_cluster", attr = "name" } ] }, else = { if = { relation = "attribute_reference", target_type = "object_storage" }, then = { func = "format", args = [ { value = "metric.type=\"storage.googleapis.com/storage/total_bytes\" AND resource.type=\"gcs_bucket\" AND resource.labels.bucket_name=\"%s\"" }, { relation = "attribute_reference", target_type = "object_storage", attr = "name" } ] }, else = { if = { relation = "attribute_reference", target_type = "cache" }, then = { func = "format", args = [ { map = "metric", table = { custom = "metric.type=\"redis.googleapis.com/stats/cpu_utilization\" AND resource.type=\"redis_instance\" AND resource.labels.instance_id=\"%s\"", cpu = "metric.type=\"redis.googleapis.com/stats/cpu_utilization\" AND resource.type=\"redis_instance\" AND resource.labels.instance_id=\"%s\"", memory = "metric.type=\"redis.googleapis.com/stats/memory/usage_ratio\" AND resource.type=\"redis_instance\" AND resource.labels.instance_id=\"%s\"" }, optional = true }, { relation = "attribute_reference", target_type = "cache", attr = "id" } ] }, else = { func = "format", args = [ { value = "metric.type=\"loadbalancing.googleapis.com/l3/external/rtt_latencies\" AND resource.type=\"loadbalancing.googleapis.com/ExternalNetworkLoadBalancerRule\" AND resource.labels.forwarding_rule_name=\"%s\"" }, { relation = "attribute_reference", target_type = "load_balancer", block = "rule", attr = "name" } ] } } } } } } } } }

[[providers.gcp.blocks.nested.nested.nested]]
block = "aggregations"

[providers.gcp.blocks.nested.nested.nested.args]
alignment_period   = { value = "60s" }
per_series_aligner = { if = { field = "statistic", not_equals = "auto" }, then = { map = "statistic", table = { Average = "ALIGN_MEAN", Sum = "ALIGN_SUM", Minimum = "ALIGN_MIN", Maximum = "ALIGN_MAX", p50 = "ALIGN_PERCENTILE_50", p90 = "ALIGN_PERCENTILE_95", p95 = "ALIGN_PERCENTILE_95", p99 = "ALIGN_PERCENTILE_99" } }, else = { value = "ALIGN_MEAN" } }

[[providers.gcp.blocks.nested.nested.nested]]
block = "trigger"

[providers.gcp.blocks.nested.nested.nested.args]
count = { value = 1 }

[providers.gcp.outputs]
id = { attr = "id", description = "Alert policy id" }

[[providers.gcp.manual_steps]]
title = "Threshold units follow the metric"
body = """
Cloud Monitoring compares the raw metric value. The presets convert the threshold for
you (a cpu or memory percentage becomes a fraction, a latency in seconds becomes
milliseconds, free storage becomes storage used), but a 'custom' filter is compared as
written: utilisation metrics are fractions (0.8, not 80), message and byte counts are
absolute. 'Consecutive periods' is approximated by the duration.
"""
