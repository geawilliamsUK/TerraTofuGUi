# Abstract type: Function (serverless)  (schema_version 2)
#
# A serverless function and everything it needs to talk to the rest of the diagram:
#   * `http_trigger`          -> AWS Lambda function URL (public); Azure: HTTP trigger is code-side
#   * 'Runs as'               -> IAM Role / user-assigned identity (required)
#   * 'Uses'                  -> event queue (trigger), relational database (connection env vars),
#                                security group (with subnets: network placement)
#   * 'Sends to'              -> event queue / topic / storage queue it publishes to (env var + send permission)
#   * 'Reads'                 -> secrets (SECRETS env var as JSON name->id, read permission)
#   * 'Logs to'               -> log group / Log Analytics workspace
#   * 'Attached to'           -> object storage: its bucket (AWS env var) or, on Azure, the
#                                storage account the function app is hosted in
#   * subnets ('Subnets')     -> AWS VPC config; Azure VNet integration (needs EP1 plan and a
#                                subnet delegated to Microsoft.Web/serverFarms)
#
# AWS generates one least-privilege inline policy on the linked role from these links.
# Azure grants the identity the matching built-in roles per linked resource.
# The deployment package (AWS) is an input variable; Azure code deploy is a manual step.

schema_version = 2

[resource]
type = "function"
category = "serverless"
display_name = "Function"
description = "A serverless function. Link the role it runs as; then link queues, secrets, a database, a log group and subnets to wire it up."
kind = "node"
allowed_parents = ["resource_group", "virtual_network"]
icon = "FN"

[[fields]]
name = "runtime"
label = "Runtime"
type = "enum"
required = true
options = ["python3.12", "nodejs20.x"]
default = "python3.12"

[[fields]]
name = "handler"
label = "Handler"
type = "string"
required = true
default = "app.handler"
description = "Entry point (AWS handler string; on Azure the function project decides)."

[[fields]]
name = "memory_mb"
label = "Memory (MB)"
type = "int"
required = true
default = 128

[[fields]]
name = "timeout_seconds"
label = "Timeout (s)"
type = "int"
required = true
default = 30

[[fields]]
name = "http_trigger"
label = "HTTP trigger"
type = "bool"
default = false
description = "Expose the function over HTTPS (AWS: public function URL; Azure: HTTP-triggered function in the project)."

[[relations]]
kind = "iam_binding"
label = "Runs as role / identity"
targets = ["iam_role"]
cardinality = "one"

[[relations]]
kind = "attribute_reference"
label = "Uses (queue trigger, database, security group)"
providers = ["aws", "azure"]
targets = ["event_queue", "storage_queue", "relational_database", "security_group"]
cardinality = "many"

[[relations]]
kind = "sends_to"
label = "Sends to (queue, topic, storage queue)"
targets = ["event_queue", "topic", "storage_queue"]
cardinality = "many"

[[relations]]
kind = "reads"
label = "Reads secrets"
targets = ["secret"]
cardinality = "many"

[[relations]]
kind = "logs_to"
label = "Logs to"
providers = ["aws", "azure"]
targets = ["log_group"]
cardinality = "optional"

[[relations]]
kind = "attachment"
label = "Stored in / uses bucket"
targets = ["object_storage"]
cardinality = "optional"

[[relations]]
kind = "network_membership"
label = "Subnets (run inside the network)"
targets = ["subnet"]
cardinality = "many"

# ---------------------------------------------------------------- AWS
[providers.aws]
status = "full"

[[providers.aws.checks]]
when = { all = [ { relation = "network_membership" }, { relation = "attribute_reference", target_type = "security_group", absent = true } ] }
message = "\"{name}\" runs inside subnets but has no security group linked; AWS requires one for VPC-attached functions"
severity = "error"

[[providers.aws.blocks]]
key = "main"
resource = "aws_lambda_function"

[providers.aws.blocks.args]
function_name    = { field = "name", transform = "kebab" }
role             = { relation = "iam_binding", attr = "arn" }
handler          = { field = "handler" }
runtime          = { field = "runtime" }
memory_size      = { field = "memory_mb" }
timeout          = { field = "timeout_seconds" }
filename         = { entity_var = "package", description = "Path to the deployment zip for function \"{name}\"." }
source_code_hash = { func = "filebase64sha256", args = [ { entity_var = "package", description = "Path to the deployment zip for function \"{name}\"." } ] }
tags             = { object = { Name = { field = "name" } } }

[[providers.aws.blocks.nested]]
block = "environment"

[providers.aws.blocks.nested.args.variables]
object.QUEUE_URL      = { relation = "sends_to", target_type = "event_queue", attr = "url" }
object.TOPIC_ARN      = { relation = "sends_to", target_type = "topic", attr = "arn" }
object.DB_HOST        = { relation = "attribute_reference", target_type = "relational_database", attr = "address" }
object.DB_PORT        = { relation = "attribute_reference", target_type = "relational_database", attr = "port" }
object.DB_NAME        = { relation = "attribute_reference", target_type = "relational_database", attr = "db_name" }
object.DB_USER        = { relation = "attribute_reference", target_type = "relational_database", attr = "username" }
object.STORAGE_BUCKET = { relation = "attachment", target_type = "object_storage", attr = "bucket" }
object.SECRETS        = { if = { relation = "reads" }, then = { func = "jsonencode", args = [ { func = "zipmap", args = [ { relation = "reads", attr = "name", wrap = "list" }, { relation = "reads", attr = "arn", wrap = "list" } ] } ] } }

[[providers.aws.blocks.nested]]
block = "vpc_config"
when = { relation = "network_membership" }

[providers.aws.blocks.nested.args]
subnet_ids         = { relation = "network_membership", attr = "id", wrap = "list" }
security_group_ids = { relation = "attribute_reference", target_type = "security_group", attr = "id", wrap = "list" }

[[providers.aws.blocks.nested]]
block = "logging_config"
when = { relation = "logs_to" }

[providers.aws.blocks.nested.args]
log_format = { value = "Text" }
log_group  = { relation = "logs_to", attr = "name" }

# Queue trigger.
[[providers.aws.blocks]]
key = "trigger"
resource = "aws_lambda_event_source_mapping"
when = { relation = "attribute_reference", target_type = "event_queue" }

[providers.aws.blocks.args]
event_source_arn = { relation = "attribute_reference", target_type = "event_queue", attr = "arn" }
function_name    = { self_block = "main", attr = "arn" }
batch_size       = { value = 10 }

# Public HTTPS endpoint.
[[providers.aws.blocks]]
key = "url"
resource = "aws_lambda_function_url"
when = { field = "http_trigger" }

[providers.aws.blocks.args]
function_name      = { self_block = "main", attr = "function_name" }
authorization_type = { value = "NONE" }

[[providers.aws.blocks]]
key = "url_permission"
resource = "aws_lambda_permission"
when = { field = "http_trigger" }

[providers.aws.blocks.args]
statement_id           = { value = "AllowPublicInvokeUrl" }
action                 = { value = "lambda:InvokeFunctionUrl" }
function_name          = { self_block = "main", attr = "function_name" }
principal              = { value = "*" }
function_url_auth_type = { value = "NONE" }

# Least-privilege inline policy on the linked role, derived from this function's links.
[[providers.aws.blocks]]
key = "policy"
resource = "aws_iam_role_policy"

[providers.aws.blocks.args]
name = { template = "{name}-policy", transform = "kebab" }
role = { relation = "iam_binding", attr = "id" }

[providers.aws.blocks.args.policy]
func = "jsonencode"

[[providers.aws.blocks.args.policy.args]]
[providers.aws.blocks.args.policy.args.object]
Version = { value = "2012-10-17" }

# Always: write its own CloudWatch logs.
[[providers.aws.blocks.args.policy.args.object.Statement.list]]
object = { Sid = { value = "Logs" }, Effect = { value = "Allow" }, Action = { value = ["logs:CreateLogGroup", "logs:CreateLogStream", "logs:PutLogEvents"] }, Resource = { value = "*" } }

# Inside subnets: manage its network interfaces.
[[providers.aws.blocks.args.policy.args.object.Statement.list]]
if = { relation = "network_membership" }
then = { object = { Sid = { value = "Vpc" }, Effect = { value = "Allow" }, Action = { value = ["ec2:CreateNetworkInterface", "ec2:DescribeNetworkInterfaces", "ec2:DeleteNetworkInterface", "ec2:AssignPrivateIpAddresses", "ec2:UnassignPrivateIpAddresses"] }, Resource = { value = "*" } } }

# Consume the queue(s) that trigger it.
[[providers.aws.blocks.args.policy.args.object.Statement.list]]
if = { relation = "attribute_reference", target_type = "event_queue" }
then = { object = { Sid = { value = "QueueConsume" }, Effect = { value = "Allow" }, Action = { value = ["sqs:ReceiveMessage", "sqs:DeleteMessage", "sqs:GetQueueAttributes"] }, Resource = { relation = "attribute_reference", target_type = "event_queue", attr = "arn", wrap = "list" } } }

# Publish to the queue(s) it sends to.
[[providers.aws.blocks.args.policy.args.object.Statement.list]]
if = { relation = "sends_to", target_type = "event_queue" }
then = { object = { Sid = { value = "QueueSend" }, Effect = { value = "Allow" }, Action = { value = ["sqs:SendMessage", "sqs:GetQueueUrl", "sqs:GetQueueAttributes"] }, Resource = { relation = "sends_to", target_type = "event_queue", attr = "arn", wrap = "list" } } }

# Publish to the topic(s) it sends to.
[[providers.aws.blocks.args.policy.args.object.Statement.list]]
if = { relation = "sends_to", target_type = "topic" }
then = { object = { Sid = { value = "TopicPublish" }, Effect = { value = "Allow" }, Action = { value = ["sns:Publish"] }, Resource = { relation = "sends_to", target_type = "topic", attr = "arn", wrap = "list" } } }

# Read the secrets it reads.
[[providers.aws.blocks.args.policy.args.object.Statement.list]]
if = { relation = "reads" }
then = { object = { Sid = { value = "Secrets" }, Effect = { value = "Allow" }, Action = { value = ["secretsmanager:GetSecretValue", "secretsmanager:DescribeSecret"] }, Resource = { relation = "reads", attr = "arn", wrap = "list" } } }

# Read / write its bucket.
[[providers.aws.blocks.args.policy.args.object.Statement.list]]
if = { relation = "attachment", target_type = "object_storage" }
then = { object = { Sid = { value = "Bucket" }, Effect = { value = "Allow" }, Action = { value = ["s3:GetObject", "s3:PutObject", "s3:DeleteObject", "s3:ListBucket"] }, Resource = { func = "concat", args = [ { relation = "attachment", target_type = "object_storage", attr = "arn", wrap = "list" }, { func = "formatlist", args = [ { value = "%s/*" }, { relation = "attachment", target_type = "object_storage", attr = "arn", wrap = "list" } ] } ] } } }

[providers.aws.outputs]
arn = { attr = "arn", description = "Function ARN" }
url = { block = "url", attr = "function_url", description = "Public HTTPS URL" }

# ---------------------------------------------------------------- Azure
[providers.azure]
status = "partial"

[[providers.azure.fields]]
name = "app_name"
label = "Function app name"
type = "string"
required = true
pattern = "^[a-z0-9][a-z0-9-]{1,58}[a-z0-9]$"
pattern_hint = "3-60 lowercase letters, digits and hyphens; globally unique"
unique_scope = "function_app"

[[providers.azure.fields]]
name = "storage_account_name"
label = "Storage account name"
type = "string"
pattern = "^[a-z0-9]{3,24}$"
pattern_hint = "3-24 lowercase letters and digits; globally unique"
description = "Only needed when the function is not 'Attached to' an Object Storage node."
required_unless_relation = "attachment"
unique_scope = "storage_account"

# Backing storage account, only when no Object Storage node is linked.
[[providers.azure.blocks]]
key = "sa"
resource = "azurerm_storage_account"
when = { relation = "attachment", target_type = "object_storage", absent = true }

[providers.azure.blocks.args]
name                     = { provider_field = "storage_account_name" }
resource_group_name      = { ancestor = "resource_group", attr = "name" }
location                 = { var = "location" }
account_tier             = { value = "Standard" }
account_replication_type = { value = "LRS" }

[[providers.azure.blocks]]
key = "plan"
resource = "azurerm_service_plan"

[providers.azure.blocks.args]
name                = { template = "{name}-plan", transform = "kebab" }
resource_group_name = { ancestor = "resource_group", attr = "name" }
location            = { var = "location" }
os_type             = { value = "Linux" }
sku_name            = { if = { relation = "network_membership" }, then = { value = "EP1" }, else = { value = "Y1" } }

[[providers.azure.blocks]]
key = "main"
resource = "azurerm_linux_function_app"

[providers.azure.blocks.args]
name                       = { provider_field = "app_name" }
resource_group_name        = { ancestor = "resource_group", attr = "name" }
location                   = { var = "location" }
storage_account_name       = { if = { relation = "attachment", target_type = "object_storage" }, then = { relation = "attachment", target_type = "object_storage", attr = "name" }, else = { self_block = "sa", attr = "name" } }
storage_account_access_key = { if = { relation = "attachment", target_type = "object_storage" }, then = { relation = "attachment", target_type = "object_storage", attr = "primary_access_key" }, else = { self_block = "sa", attr = "primary_access_key" } }
service_plan_id            = { self_block = "plan", attr = "id" }
virtual_network_subnet_id  = { relation = "network_membership", attr = "id", optional = true }
zip_deploy_file            = { entity_var = "package", description = "Path to the deployment zip for function \"{name}\"." }

[providers.azure.blocks.args.app_settings]
object.WEBSITE_RUN_FROM_PACKAGE = { value = "1" }
object.QUEUE_NAME            = { relation = "sends_to", target_type = "event_queue", attr = "name" }
object.SERVICEBUS_CONNECTION = { relation = "sends_to", target_type = "event_queue", block = "ns", attr = "default_primary_connection_string", fallback = { relation = "sends_to", target_type = "event_queue", ancestor = "servicebus_namespace", attr = "default_primary_connection_string" } }
object.TOPIC_NAME            = { relation = "sends_to", target_type = "topic", attr = "name" }
object.TOPIC_CONNECTION      = { relation = "sends_to", target_type = "topic", block = "ns", attr = "default_primary_connection_string", fallback = { relation = "sends_to", target_type = "topic", ancestor = "servicebus_namespace", attr = "default_primary_connection_string" } }
object.STORAGE_QUEUE_NAME    = { relation = "sends_to", target_type = "storage_queue", attr = "name" }
object.STORAGE_QUEUE_CONNECTION = { relation = "sends_to", target_type = "storage_queue", block = "sa", attr = "primary_connection_string" }
object.AzureWebJobsServiceBus = { relation = "attribute_reference", target_type = "event_queue", block = "ns", attr = "default_primary_connection_string", fallback = { relation = "attribute_reference", target_type = "event_queue", ancestor = "servicebus_namespace", attr = "default_primary_connection_string" } }
object.TRIGGER_QUEUE_NAME    = { relation = "attribute_reference", target_type = "event_queue", attr = "name" }
object.StorageQueueConnection = { relation = "attribute_reference", target_type = "storage_queue", block = "sa", attr = "primary_connection_string" }
object.TRIGGER_STORAGE_QUEUE_NAME = { relation = "attribute_reference", target_type = "storage_queue", attr = "name" }
object.DB_HOST               = { relation = "attribute_reference", target_type = "relational_database", block = "pg", attr = "fqdn" }
object.DB_PORT               = { if = { relation = "attribute_reference", target_type = "relational_database" }, then = { value = "5432" } }
object.DB_NAME               = { relation = "attribute_reference", target_type = "relational_database", block = "pgdb", attr = "name" }
object.DB_USER               = { relation = "attribute_reference", target_type = "relational_database", block = "pg", attr = "administrator_login" }
object.SECRETS               = { if = { relation = "reads" }, then = { func = "jsonencode", args = [ { func = "zipmap", args = [ { relation = "reads", attr = "name", wrap = "list" }, { relation = "reads", attr = "versionless_id", wrap = "list" } ] } ] } }

[[providers.azure.blocks.nested]]
block = "site_config"

[[providers.azure.blocks.nested.nested]]
block = "application_stack"
when = { field = "runtime", equals = "python3.12" }

[providers.azure.blocks.nested.nested.args]
python_version = { value = "3.12" }

[[providers.azure.blocks.nested.nested]]
block = "application_stack"
when = { field = "runtime", equals = "nodejs20.x" }

[providers.azure.blocks.nested.nested.args]
node_version = { value = "20" }

[[providers.azure.blocks.nested]]
block = "identity"
when = { relation = "iam_binding" }

[providers.azure.blocks.nested.args]
type         = { value = "UserAssigned" }
identity_ids = { relation = "iam_binding", attr = "id", wrap = "list" }

# Least-privilege role assignments for the identity, one per linked resource.
[[providers.azure.blocks]]
key = "send"
resource = "azurerm_role_assignment"
for_each_relation = "sends_to"
for_each_target_type = "event_queue"

[providers.azure.blocks.args]
scope                = { target = "id" }
role_definition_name = { value = "Azure Service Bus Data Sender" }
principal_id         = { relation = "iam_binding", attr = "principal_id" }

[[providers.azure.blocks]]
key = "publish"
resource = "azurerm_role_assignment"
for_each_relation = "sends_to"
for_each_target_type = "topic"

[providers.azure.blocks.args]
scope                = { target = "id" }
role_definition_name = { value = "Azure Service Bus Data Sender" }
principal_id         = { relation = "iam_binding", attr = "principal_id" }

[[providers.azure.blocks]]
key = "sq_send"
resource = "azurerm_role_assignment"
for_each_relation = "sends_to"
for_each_target_type = "storage_queue"

[providers.azure.blocks.args]
scope                = { target = "id", block = "sa" }
role_definition_name = { value = "Storage Queue Data Message Sender" }
principal_id         = { relation = "iam_binding", attr = "principal_id" }

[[providers.azure.blocks]]
key = "sq_receive"
resource = "azurerm_role_assignment"
for_each_relation = "attribute_reference"
for_each_target_type = "storage_queue"

[providers.azure.blocks.args]
scope                = { target = "id", block = "sa" }
role_definition_name = { value = "Storage Queue Data Message Processor" }
principal_id         = { relation = "iam_binding", attr = "principal_id" }

[[providers.azure.blocks]]
key = "receive"
resource = "azurerm_role_assignment"
for_each_relation = "attribute_reference"
for_each_target_type = "event_queue"

[providers.azure.blocks.args]
scope                = { target = "id" }
role_definition_name = { value = "Azure Service Bus Data Receiver" }
principal_id         = { relation = "iam_binding", attr = "principal_id" }

[[providers.azure.blocks]]
key = "secret_read"
resource = "azurerm_role_assignment"
for_each_relation = "reads"

[providers.azure.blocks.args]
scope                = { target = "id" }
role_definition_name = { value = "Key Vault Secrets User" }
principal_id         = { relation = "iam_binding", attr = "principal_id" }

[[providers.azure.blocks]]
key = "blob"
resource = "azurerm_role_assignment"
for_each_relation = "attachment"
for_each_target_type = "object_storage"

[providers.azure.blocks.args]
scope                = { target = "id" }
role_definition_name = { value = "Storage Blob Data Contributor" }
principal_id         = { relation = "iam_binding", attr = "principal_id" }

# A linked Security Group becomes the NSG of the integration subnet(s).
[[providers.azure.blocks]]
key = "nsg"
resource = "azurerm_subnet_network_security_group_association"
for_each_relation = "network_membership"
when = { relation = "attribute_reference", target_type = "security_group" }

[providers.azure.blocks.args]
subnet_id                 = { target = "id" }
network_security_group_id = { relation = "attribute_reference", target_type = "security_group", attr = "id" }

# Logs to a Log Analytics workspace.
[[providers.azure.blocks]]
key = "diag"
resource = "azurerm_monitor_diagnostic_setting"
for_each_relation = "logs_to"

[providers.azure.blocks.args]
name                       = { template = "{name}-logs", transform = "kebab" }
target_resource_id         = { self_block = "main", attr = "id" }
log_analytics_workspace_id = { target = "id" }

[[providers.azure.blocks.nested]]
block = "enabled_log"

[providers.azure.blocks.nested.args]
category = { value = "FunctionAppLogs" }

[providers.azure.outputs]
hostname = { attr = "default_hostname", description = "Function app host name (HTTP triggers are served here)" }

[[providers.azure.checks]]
when = { all = [ { relation = "network_membership" }, { relation = "network_membership", target_provider_field = "delegation", equals = "web_serverfarms", absent = true } ] }
message = "\"{name}\" is VNet-integrated but no linked subnet is delegated to web_serverfarms (set the subnet's Azure Delegation field; a subnet carries one delegation, so keep databases in another subnet)"

[[providers.azure.manual_steps]]
title = "Queue trigger bindings"
when = { any = [ { relation = "attribute_reference", target_type = "event_queue" }, { relation = "attribute_reference", target_type = "storage_queue" } ] }
body = """
The deployment package (the `package` variable, deployed with `WEBSITE_RUN_FROM_PACKAGE`)
must bind its queue trigger to the generated settings: Service Bus triggers use the
`AzureWebJobsServiceBus` connection and the `TRIGGER_QUEUE_NAME` queue; Storage Queue
triggers use `StorageQueueConnection` and `TRIGGER_STORAGE_QUEUE_NAME`.
"""

# ---------------------------------------------------------------- GCP
[providers.gcp]
status = "partial"
notes = "Cloud Functions (2nd gen). The deployment zip is uploaded to a source bucket; Pub/Sub queues trigger through an event trigger; VPC integration goes through a Serverless VPC Access connector."

[[providers.gcp.fields]]
name = "entry_point"
label = "Entry point"
type = "string"
default = "handler"
description = "Name of the exported function in the source (the abstract handler's last segment, usually)."

# Source bucket unless the function is attached to an Object Storage node.
[[providers.gcp.blocks]]
key = "src_bucket"
resource = "google_storage_bucket"
when = { relation = "attachment", target_type = "object_storage", absent = true }

[providers.gcp.blocks.args]
name                        = { func = "format", args = [ { value = "%s-%s-src" }, { var = "project" }, { field = "name", transform = "kebab" } ] }
location                    = { var = "region" }
uniform_bucket_level_access = { value = true }
force_destroy               = { value = true }

[[providers.gcp.blocks]]
key = "source"
resource = "google_storage_bucket_object"

[providers.gcp.blocks.args]
name   = { template = "{name}-source", transform = "kebab" }
bucket = { if = { relation = "attachment", target_type = "object_storage" }, then = { relation = "attachment", target_type = "object_storage", attr = "name" }, else = { self_block = "src_bucket", attr = "name" } }
source = { entity_var = "package", description = "Path to the deployment zip for function \"{name}\"." }

# Serverless VPC Access connector when the function is placed in a subnet.
[[providers.gcp.blocks]]
key = "connector"
resource = "google_vpc_access_connector"
when = { relation = "network_membership" }

[providers.gcp.blocks.args]
name   = { template = "{name}-vpc", transform = "kebab" }
region = { var = "region" }

[[providers.gcp.blocks.nested]]
block = "subnet"

[providers.gcp.blocks.nested.args]
name = { relation = "network_membership", attr = "name" }

[[providers.gcp.blocks]]
key = "main"
resource = "google_cloudfunctions2_function"

[providers.gcp.blocks.args]
name     = { field = "name", transform = "kebab" }
location = { var = "region" }

[[providers.gcp.blocks.nested]]
block = "build_config"

[providers.gcp.blocks.nested.args]
runtime     = { map = "runtime", table = { "python3.12" = "python312", "nodejs20.x" = "nodejs20" } }
entry_point = { provider_field = "entry_point", fallback = { value = "handler" } }

[[providers.gcp.blocks.nested.nested]]
block = "source"

[[providers.gcp.blocks.nested.nested.nested]]
block = "storage_source"

[providers.gcp.blocks.nested.nested.nested.args]
bucket = { self_block = "source", attr = "bucket" }
object = { self_block = "source", attr = "name" }

[[providers.gcp.blocks.nested]]
block = "service_config"

[providers.gcp.blocks.nested.args]
available_memory              = { func = "format", args = [ { value = "%dM" }, { field = "memory_mb" } ] }
timeout_seconds               = { field = "timeout_seconds" }
service_account_email         = { relation = "iam_binding", attr = "email" }
ingress_settings              = { if = { field = "http_trigger" }, then = { value = "ALLOW_ALL" }, else = { value = "ALLOW_INTERNAL_ONLY" } }
vpc_connector                 = { if = { relation = "network_membership" }, then = { self_block = "connector", attr = "id" } }
vpc_connector_egress_settings = { if = { relation = "network_membership" }, then = { value = "ALL_TRAFFIC" } }

[providers.gcp.blocks.nested.args.environment_variables]
object.QUEUE_TOPIC         = { relation = "sends_to", target_type = "event_queue", attr = "id" }
object.TOPIC               = { relation = "sends_to", target_type = "topic", attr = "id" }
object.TRIGGER_SUBSCRIPTION = { relation = "attribute_reference", target_type = "event_queue", block = "sub", attr = "id" }
object.BUCKET              = { relation = "attachment", target_type = "object_storage", attr = "name" }
object.DB_HOST             = { relation = "attribute_reference", target_type = "relational_database", attr = "private_ip_address", fallback = { relation = "attribute_reference", target_type = "relational_database", attr = "public_ip_address" } }
object.DB_NAME             = { relation = "attribute_reference", target_type = "relational_database", block = "db", attr = "name" }
object.DB_USER             = { relation = "attribute_reference", target_type = "relational_database", block = "user", attr = "name" }
object.SECRETS             = { if = { relation = "reads" }, then = { func = "jsonencode", args = [ { func = "zipmap", args = [ { relation = "reads", attr = "secret_id", wrap = "list" }, { relation = "reads", attr = "id", wrap = "list" } ] } ] } }

# Pub/Sub trigger from the linked queue's topic.
[[providers.gcp.blocks.nested]]
block = "event_trigger"
when = { relation = "attribute_reference", target_type = "event_queue" }

[providers.gcp.blocks.nested.args]
event_type            = { value = "google.cloud.pubsub.topic.v1.messagePublished" }
pubsub_topic          = { relation = "attribute_reference", target_type = "event_queue", attr = "id" }
trigger_region        = { var = "region" }
retry_policy          = { value = "RETRY_POLICY_RETRY" }
service_account_email = { relation = "iam_binding", attr = "email" }

# Public HTTP: anyone may invoke the underlying Cloud Run service.
[[providers.gcp.blocks]]
key = "invoker"
resource = "google_cloud_run_v2_service_iam_member"
when = { field = "http_trigger" }

[providers.gcp.blocks.args]
name     = { self_block = "main", attr = "name" }
location = { var = "region" }
role     = { value = "roles/run.invoker" }
member   = { value = "allUsers" }

# Least-privilege bindings for the service account, one per linked resource.
[[providers.gcp.blocks]]
key = "publish"
resource = "google_pubsub_topic_iam_member"
for_each_relation = "sends_to"
for_each_target_type = "event_queue"

[providers.gcp.blocks.args]
topic  = { target = "id" }
role   = { value = "roles/pubsub.publisher" }
member = { relation = "iam_binding", attr = "member" }

[[providers.gcp.blocks]]
key = "publish_topic"
resource = "google_pubsub_topic_iam_member"
for_each_relation = "sends_to"
for_each_target_type = "topic"

[providers.gcp.blocks.args]
topic  = { target = "id" }
role   = { value = "roles/pubsub.publisher" }
member = { relation = "iam_binding", attr = "member" }

[[providers.gcp.blocks]]
key = "consume"
resource = "google_pubsub_subscription_iam_member"
for_each_relation = "attribute_reference"
for_each_target_type = "event_queue"

[providers.gcp.blocks.args]
subscription = { target = "id", block = "sub" }
role         = { value = "roles/pubsub.subscriber" }
member       = { relation = "iam_binding", attr = "member" }

[[providers.gcp.blocks]]
key = "secret_read"
resource = "google_secret_manager_secret_iam_member"
for_each_relation = "reads"

[providers.gcp.blocks.args]
secret_id = { target = "id" }
role      = { value = "roles/secretmanager.secretAccessor" }
member    = { relation = "iam_binding", attr = "member" }

[[providers.gcp.blocks]]
key = "bucket_rw"
resource = "google_storage_bucket_iam_member"
for_each_relation = "attachment"
for_each_target_type = "object_storage"

[providers.gcp.blocks.args]
bucket = { target = "name" }
role   = { value = "roles/storage.objectAdmin" }
member = { relation = "iam_binding", attr = "member" }

[providers.gcp.outputs]
url = { attr = "url", description = "HTTPS URL of the function" }

[[providers.gcp.manual_steps]]
title = "Connector subnet must be a dedicated /28"
when = { relation = "network_membership" }
body = """
The Serverless VPC Access connector is created on the linked subnet, which must be a
/28 range used by nothing else. Give the function its own small subnet.
"""

[[providers.gcp.manual_steps]]
title = "Database access needs the Cloud SQL client role"
when = { relation = "attribute_reference", target_type = "relational_database" }
body = """
The function reaches the database over its private IP (through the connector) or the
public IP. Grant the service account `roles/cloudsql.client` if you connect through the
Cloud SQL Auth Proxy instead, and store the password in a Secret rather than the
`db_password` variable.
"""
