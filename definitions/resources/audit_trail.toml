# Abstract type: Audit Trail  (schema_version 2)
#
# The record of who did what to the cloud account itself — not application logs, which
# are a Log Group.
#
# AWS:   aws_cloudtrail writing into a linked bucket. CloudTrail checks the bucket policy
#        when the trail is created, so Object Storage grows the two statements the service
#        needs as soon as a trail is attached to it (see object_storage.toml).
# Azure: the Activity Log records control-plane operations for every subscription with no
#        resource at all, so there is nothing to generate.
# GCP:   google_project_iam_audit_config. Admin activity is always recorded; what this
#        turns on is data access logging.

schema_version = 2

[resource]
type = "audit_trail"
category = "monitoring"
display_name = "Audit Trail"
description = "A record of control-plane activity on the account. On AWS, link the bucket it writes into."
kind = "node"
allowed_parents = ["resource_group"]
network_agnostic = true
icon = "AUD"

[[fields]]
name = "multi_region"
label = "All regions"
type = "bool"
default = true
description = "Record activity in every region, not only the one this configuration deploys to. A single-region trail misses anything an attacker does elsewhere in the account."

[[fields]]
name = "data_events"
label = "Record data access"
type = "bool"
default = false
description = "Also record reads and writes of objects, not only management calls. Far more voluminous, and far more useful after an incident."

# AWS needs somewhere to put the trail; Azure and Google Cloud keep audit records
# themselves, so the link is not their business.
[[relations]]
kind = "attachment"
label = "Writes to bucket"
providers = ["aws"]
targets = ["object_storage"]
cardinality = "optional"

# ---------------------------------------------------------------- AWS
[providers.aws]
status = "full"
file = "monitoring"
notes = "The linked bucket gets the CloudTrail bucket-policy statements automatically, and the trail waits for that policy: CloudTrail refuses to be created until it can write."

[[providers.aws.checks]]
when = { relation = "attachment", absent = true }
severity = "error"
message = "\"{name}\" needs a bucket: CloudTrail delivers into one, so link an Object Storage node with 'Writes to bucket'"

[[providers.aws.blocks]]
key = "main"
resource = "aws_cloudtrail"

[providers.aws.blocks.args]
name                          = { field = "name", transform = "kebab" }
s3_bucket_name                = { relation = "attachment", target_type = "object_storage", attr = "id" }
include_global_service_events = { value = true }
is_multi_region_trail         = { field = "multi_region", fallback = { value = true } }
enable_log_file_validation    = { value = true }
enable_logging                = { value = true }
depends_on                    = { relation = "attachment", target_type = "object_storage", block = "policy", attr = "", wrap = "list" }
tags                          = { object = { Name = { field = "name" } } }

[[providers.aws.blocks.nested]]
block = "event_selector"
when = { field = "data_events" }

[providers.aws.blocks.nested.args]
read_write_type           = { value = "All" }
include_management_events = { value = true }

[providers.aws.outputs]
arn = { attr = "arn", description = "Trail ARN" }

# ---------------------------------------------------------------- Azure
[providers.azure]
status = "logical"
file = "monitoring"
notes = "Azure records control-plane operations in the subscription's Activity Log whether you ask for it or not, and keeps them for 90 days. Nothing is generated: exporting them for longer, or into a workspace, is a diagnostic setting on the *subscription*, which is above the scope of a resource-group deployment."

# ---------------------------------------------------------------- GCP
[providers.gcp]
status = "full"
file = "monitoring"
notes = "Admin Activity logs are always on and cannot be turned off; this configures Data Access logging for every service. It replaces the project's audit configuration for `allServices`, so a project that configures audit logs elsewhere will fight with it."

[[providers.gcp.blocks]]
key = "main"
resource = "google_project_iam_audit_config"

[providers.gcp.blocks.args]
project = { var = "project" }
service = { value = "allServices" }

[[providers.gcp.blocks.nested]]
block = "audit_log_config"

[providers.gcp.blocks.nested.args]
log_type = { value = "ADMIN_READ" }

[[providers.gcp.blocks.nested]]
block = "audit_log_config"
when = { field = "data_events" }

[providers.gcp.blocks.nested.args]
log_type = { value = "DATA_READ" }

[[providers.gcp.blocks.nested]]
block = "audit_log_config"
when = { field = "data_events" }

[providers.gcp.blocks.nested.args]
log_type = { value = "DATA_WRITE" }

[providers.gcp.outputs]
id = { attr = "id", description = "Audit config id" }
