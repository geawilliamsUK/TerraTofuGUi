# Abstract type: Container Registry  (schema_version 2)
#
# AWS: aws_ecr_repository (+ aws_ecr_lifecycle_policy when old images are expired).
# Azure: azurerm_container_registry (Basic).
# GCP: google_artifact_registry_repository in Docker format.

schema_version = 2

[resource]
type = "container_registry"
category = "container"
display_name = "Container Registry"
description = "A private registry for container images."
kind = "node"
allowed_parents = ["resource_group", "virtual_network"]
network_agnostic = true
icon = "REG"

[[fields]]
name = "repositories"
label = "Repositories"
type = "string_list"
description = "Image repositories to create. Empty means one repository named after this node, which is how an ECR 'registry' with a single image is usually drawn. Azure and Google Cloud create repositories on first push, so the list only documents them there."

[[fields]]
name = "immutable_tags"
label = "Immutable tags"
type = "bool"
default = false
description = "Refuse to move or overwrite a tag once it points at an image, so a deployed tag always means the same bytes."

[[fields]]
name = "scan_on_push"
label = "Scan images on push"
type = "bool"
default = true
description = "Run a vulnerability scan as each image arrives."

[[fields]]
name = "keep_last_images"
label = "Keep only the last N images"
type = "int"
default = 0
description = "Expire older images automatically. 0 keeps every image for ever, which is what most registry bills are made of."

[[fields]]
name = "force_delete"
label = "Delete even with images"
type = "bool"
default = false
description = "Let `destroy` delete a repository that still holds images, release images and immutable tags included. Off, ECR refuses to delete a non-empty repository, so a stray destroy cannot take the images with it. Azure and Google Cloud have no such guard: deleting their registry always deletes its images."

# ---------------------------------------------------------------- AWS
[providers.aws]
status = "full"
notes = "ECR has no registry resource: each repository is its own. With no repositories listed the node itself is the one repository; otherwise it is one repository per name, all with the same posture."

# The single-repository form: the node is the repository.
[[providers.aws.blocks]]
key = "main"
resource = "aws_ecr_repository"
when = { field = "repositories", absent = true }

[providers.aws.blocks.args]
name                 = { field = "name", transform = "kebab" }
image_tag_mutability = { if = { field = "immutable_tags" }, then = { value = "IMMUTABLE" }, else = { value = "MUTABLE" } }
force_delete         = { if = { field = "force_delete" }, then = { value = true }, else = { value = false } }
tags                 = { object = { Name = { field = "name" } } }

[[providers.aws.blocks.nested]]
block = "image_scanning_configuration"

[providers.aws.blocks.nested.args]
scan_on_push = { if = { field = "scan_on_push" }, then = { value = true }, else = { value = false } }

[[providers.aws.blocks]]
key = "repo"
resource = "aws_ecr_repository"
for_each_field = "repositories"

[providers.aws.blocks.args]
name                 = { item = "value", transform = "kebab" }
image_tag_mutability = { if = { field = "immutable_tags" }, then = { value = "IMMUTABLE" }, else = { value = "MUTABLE" } }
force_delete         = { if = { field = "force_delete" }, then = { value = true }, else = { value = false } }
tags                 = { object = { Name = { item = "value" }, Registry = { field = "name" } } }

[[providers.aws.blocks.nested]]
block = "image_scanning_configuration"

[providers.aws.blocks.nested.args]
scan_on_push = { if = { field = "scan_on_push" }, then = { value = true }, else = { value = false } }

[[providers.aws.blocks]]
key = "lifecycle"
resource = "aws_ecr_lifecycle_policy"
when = { all = [ { field = "keep_last_images" }, { field = "repositories", absent = true } ] }

[providers.aws.blocks.args]
repository = { self_block = "main", attr = "name" }

[providers.aws.blocks.args.policy]
func = "jsonencode"

[[providers.aws.blocks.args.policy.args]]
[[providers.aws.blocks.args.policy.args.object.rules.list]]
[providers.aws.blocks.args.policy.args.object.rules.list.object]
rulePriority = { value = 1 }
description  = { template = "Keep only the last {keep_last_images} images" }
selection    = { object = { tagStatus = { value = "any" }, countType = { value = "imageCountMoreThan" }, countNumber = { field = "keep_last_images" } } }
action       = { object = { type = { value = "expire" } } }

# One policy per listed repository. The repository is addressed by name rather than by
# the matching `repo` instance (a repeated block has no single address), so the block
# carries an explicit dependency on all of them.
[[providers.aws.blocks]]
key = "repo_lifecycle"
resource = "aws_ecr_lifecycle_policy"
for_each_field = "repositories"
when = { field = "keep_last_images" }

[providers.aws.blocks.args]
repository = { item = "value", transform = "kebab" }
depends_on = { self_block = "repo", attr = "", wrap = "list" }

[providers.aws.blocks.args.policy]
func = "jsonencode"

[[providers.aws.blocks.args.policy.args]]
[[providers.aws.blocks.args.policy.args.object.rules.list]]
[providers.aws.blocks.args.policy.args.object.rules.list.object]
rulePriority = { value = 1 }
description  = { template = "Keep only the last {keep_last_images} images" }
selection    = { object = { tagStatus = { value = "any" }, countType = { value = "imageCountMoreThan" }, countNumber = { field = "keep_last_images" } } }
action       = { object = { type = { value = "expire" } } }

# The registry host a Kubernetes workload's image is pulled from: every repository URL is
# <account>.dkr.ecr.<region>.amazonaws.com/<name>, whichever block created it.
[providers.aws.connection]
REGISTRY = { raw = "split(\"/\", @urls@[0])[0]", refs = { urls = { func = "concat", args = [ { self_block = "main", attr = "repository_url", wrap = "list" }, { self_block = "repo", attr = "repository_url", wrap = "list" } ] } } }

[providers.aws.outputs]
url             = { attr = "repository_url", description = "Repository URL" }
repository_urls = { block = "repo", attr = "repository_url", description = "URL of each listed repository" }

# ---------------------------------------------------------------- Azure
[providers.azure]
status = "full"
notes = "A Basic registry. Tag immutability and a retention policy are Premium-SKU features, and 'Scan images on push' is Microsoft Defender for Containers on the subscription rather than a registry setting."

[[providers.azure.fields]]
name = "registry_name"
label = "Registry name"
type = "string"
required = true
pattern = "^[a-zA-Z0-9]{5,50}$"
pattern_hint = "5-50 letters and digits; globally unique"
unique_scope = "container_registry"

[[providers.azure.checks]]
when = { field = "repositories" }
message = "\"{name}\" lists repositories, which Azure creates on first push: one registry is generated and each repository appears as a path inside it (push `<login server>/<repository>:<tag>`)"

[[providers.azure.checks]]
when = { any = [ { field = "immutable_tags" }, { field = "keep_last_images" } ] }
message = "\"{name}\" asks for immutable tags or an image retention policy; both need a Premium registry, and this mapping creates a Basic one (raise the SKU with an extra argument and set the policy there)"

[[providers.azure.blocks]]
key = "main"
resource = "azurerm_container_registry"

[providers.azure.blocks.args]
name                = { provider_field = "registry_name" }
resource_group_name = { ancestor = "resource_group", attr = "name" }
location            = { var = "location" }
sku                 = { value = "Basic" }
admin_enabled       = { value = false }

[providers.azure.connection]
REGISTRY = { self_block = "main", attr = "login_server" }

[providers.azure.outputs]
url = { attr = "login_server", description = "Registry login server" }

# A Kubernetes Workload that runs its image from here ('Runs image from') is pulled by the
# cluster's kubelet identity, which has no rights on the registry by default. One step per
# registry, however many workloads pull from it.
[[providers.azure.manual_steps]]
title = "Let the Kubernetes cluster pull from the registry"
when = { relation = "attachment", incoming = true, target_type = "kubernetes_workload" }
body = """
AKS pulls images with the cluster's kubelet identity, which cannot read an Azure Container
Registry until it holds **AcrPull** on it: run
`az aks update -n <cluster> -g <resource group> --attach-acr <registry>`, or add an
`azurerm_role_assignment` with `role_definition_name = "AcrPull"`, this registry's id as
the scope and `azurerm_kubernetes_cluster.<cluster>.kubelet_identity[0].object_id` as the
principal — once per cluster that runs workloads from it.
"""

# ---------------------------------------------------------------- GCP
[providers.gcp]
status = "full"
notes = "Artifact Registry scans images through Artifact Analysis, which is enabled for the whole project (the Container Scanning API) rather than per repository, so 'Scan images on push' has no setting here."

[[providers.gcp.checks]]
when = { field = "repositories" }
message = "\"{name}\" lists repositories, which Artifact Registry creates on first push: one Docker repository is generated and each name becomes an image path inside it (push `<region>-docker.pkg.dev/<project>/<repository>/<image>:<tag>`)"

[[providers.gcp.blocks]]
key = "main"
resource = "google_artifact_registry_repository"

[providers.gcp.blocks.args]
repository_id = { field = "name", transform = "kebab" }
location      = { var = "region" }
format        = { value = "DOCKER" }
description   = { template = "{name} (managed by TerraTofu GUI)" }

[[providers.gcp.blocks.nested]]
block = "docker_config"
when = { field = "immutable_tags" }

[providers.gcp.blocks.nested.args]
immutable_tags = { value = true }

# A KEEP policy alone deletes nothing; the DELETE policy is what expires the rest, and
# KEEP wins wherever the two overlap.
[[providers.gcp.blocks.nested]]
block = "cleanup_policies"
when = { field = "keep_last_images" }

[providers.gcp.blocks.nested.args]
id     = { value = "keep-recent" }
action = { value = "KEEP" }

[[providers.gcp.blocks.nested.nested]]
block = "most_recent_versions"

[providers.gcp.blocks.nested.nested.args]
keep_count = { field = "keep_last_images" }

[[providers.gcp.blocks.nested]]
block = "cleanup_policies"
when = { field = "keep_last_images" }

[providers.gcp.blocks.nested.args]
id     = { value = "expire-the-rest" }
action = { value = "DELETE" }

[[providers.gcp.blocks.nested.nested]]
block = "condition"

[providers.gcp.blocks.nested.nested.args]
tag_state = { value = "ANY" }

# <location>-docker.pkg.dev/<project>/<repository>, the prefix of every image path in it.
[providers.gcp.connection]
REGISTRY = { func = "format", args = [ { value = "%s-docker.pkg.dev/%s/%s" }, { self_block = "main", attr = "location" }, { self_block = "main", attr = "project" }, { self_block = "main", attr = "repository_id" } ] }

[providers.gcp.outputs]
id = { attr = "id", description = "Repository id" }
