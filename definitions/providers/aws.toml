# Provider definition: Amazon Web Services
#
# Declares how the `aws` provider is wired into generated projects: registry source,
# version constraint, provider-level input variables and the `provider "aws" {}` block.
# Resource mappings that target this provider live under definitions/resources/*.toml
# in their `[providers.aws]` sections.

schema_version = 1

[provider]
id = "aws"
display_name = "Amazon Web Services"
description = "hashicorp/aws provider, 5.x series."
source_namespace = "hashicorp"
source_name = "aws"
version_constraint = "~> 5.0"

# Provider-level variables. Values come from the project's settings.provider_settings.aws
# map and are emitted into variables.tf with these defaults.
[[variables]]
name = "region"
type = "string"
description = "AWS region to deploy into."
default = "eu-west-2"

[provider_block.args]
region = { var = "region" }

# A second configuration of the same provider, used by blocks that say
# `provider_alias = "us_east_1"`. It is only emitted when some block does.
[[aliases]]
name = "us_east_1"
description = "CloudFront's home region: its certificates and Web ACLs live here"
args = { region = { value = "us-east-1" } }

# Generated values (Secret "generate value") come from hashicorp/random; the provider is
# only required when some emitted block is a `random_*` resource.
[[helper_providers]]
source = "hashicorp/random"
version = "~> 3.6"
prefix = "random_"

# The project's default tags: AWS applies them to every taggable resource itself.
[default_tags]
block = "default_tags"
arg = "tags"
