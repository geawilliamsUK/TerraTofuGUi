# Unit prices for the cost estimate (ttg_codegen::cost), Microsoft Azure.
#
# Pay-as-you-go retail list prices in US dollars, Linux, with no free grants, no reserved
# instances or savings plans, no Azure Hybrid Benefit and no tax. Real bills differ; the
# estimate says so every time it is shown. Layout: see the header of aws.toml and
# docs/PRICES.md. Every mapped type that is neither `[free]` nor `[not_estimated]` must be
# priced by `crates/ttg-codegen/src/cost/azure.rs`.

schema_version = 1
provider = "azure"
currency = "USD"
retrieved = "2026-09-29"
regions = ["eastus", "westeurope", "uksouth"]
fallback_region = "eastus"
basis = "Azure pay-as-you-go retail prices (Linux), USD, excluding tax, free grants, reservations and savings plans"

[free]
resource_group = "Resource groups cost nothing."
container_environment = "A Consumption Container Apps environment costs nothing; its apps and jobs are priced on their own lines."
virtual_network = "Virtual networks cost nothing; peering and gateways are billed separately."
subnet = "Subnets cost nothing."
route_table = "Route tables cost nothing."
security_group = "Network security groups cost nothing."
iam_role = "Managed identities and role assignments cost nothing."
kubernetes_workload = "Pods run on the cluster's node pools, which are priced on the cluster and pool lines."
budget = "Cost Management budgets cost nothing."
dns_record = "Records are part of the DNS zone; queries are priced on the zone's line."
network_peering = "Peering costs nothing to create; traffic across it is billed per GB in each direction and is not estimated."
key_vault = "A vault costs nothing by itself; the keys and secrets in it are priced on their own lines (per operation)."

[not_estimated]
web_application_firewall = "A WAF policy is free by itself. In front of a CDN it runs on Front Door Premium, whose base fee includes it (priced on the CDN's line); in front of a load balancer it is billed through the Application Gateway (WAF_v2) it is attached to, which the diagram does not model."
tls_certificate = "Key Vault charges per certificate renewal request plus whatever the issuing certificate authority charges; neither depends on the diagram."

