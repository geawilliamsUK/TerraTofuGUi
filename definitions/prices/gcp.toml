# Unit prices for the cost estimate (ttg_codegen::cost), Google Cloud.
#
# On-demand list prices in US dollars with no free tier, no sustained- or committed-use
# discounts and no tax. Real bills differ; the estimate says so every time it is shown.
# Layout: see the header of aws.toml and docs/PRICES.md. Every mapped type that is neither
# `[free]` nor `[not_estimated]` must be priced by `crates/ttg-codegen/src/cost/gcp.rs`.

schema_version = 1
provider = "gcp"
currency = "USD"
retrieved = "2026-09-29"
regions = ["us-central1", "europe-west1", "europe-west2"]
fallback_region = "us-central1"
basis = "Google Cloud on-demand list prices, USD, excluding tax, free tiers, sustained-use and committed-use discounts"

[free]
virtual_network = "VPC networks cost nothing."
subnet = "Subnets cost nothing."
security_group = "Firewall rules cost nothing."
iam_role = "Service accounts and IAM bindings cost nothing."
kubernetes_workload = "Pods run on the cluster's node pools, which are priced on the cluster and pool lines."
budget = "Cloud Billing budgets cost nothing."
dns_record = "Records are part of the managed zone; queries are priced on the zone's line."
network_peering = "VPC peering costs nothing to create; traffic across zones or regions is billed per GB and is not estimated."
tls_certificate = "Google-managed SSL certificates cost nothing."
user_identity = "Identity Platform: the first 50,000 monthly active users (email, social sign-in) cost nothing; above that it is billed per user and not estimated."

[not_estimated]
audit_trail = "Data Access audit logs are billed as Cloud Logging ingestion, whose volume follows API traffic the diagram does not describe; Admin Activity logs are free."

