# Unit prices for the cost estimate (ttg_codegen::cost), Amazon Web Services.
#
# List prices, in US dollars, for the few things the curated types turn into on AWS. They
# are on-demand, Linux, shared-tenancy prices with no free tier, no Savings Plans, no
# reserved capacity, no enterprise discount and no tax. Real bills differ; the estimate
# says so every time it is shown.
#
# Layout (see docs/PRICES.md):
#   [tables.<name>]           one table per service and unit
#     unit / description / source / checked
#   [tables.<name>.rows]      one row per SKU: `"<sku>" = { <region> = price, ... }`
#                             `"*"` is a price that is the same in every region; a row may
#                             carry its own `unit` when it differs from the table's.
# `[free]` and `[not_estimated]` name the abstract types that have no priced model on
# this provider, with the reason shown in the estimate. Every other mapped type must be
# priced by `crates/ttg-codegen/src/cost/aws.rs`; a test fails when one is missing.

schema_version = 1
provider = "aws"
currency = "USD"
retrieved = "2026-09-29"
regions = ["us-east-1", "eu-west-1", "eu-west-2"]
# Prices used when the project's region has no column here (the estimate says so).
fallback_region = "us-east-1"
basis = "AWS on-demand list prices (Linux, shared tenancy), USD, excluding tax, free tier, Savings Plans and reserved capacity"

[free]
virtual_network = "VPCs cost nothing. Flow logs are billed as ingestion on the log group they write to."
subnet = "Subnets cost nothing."
route_table = "Route tables cost nothing."
security_group = "Security groups cost nothing."
internet_gateway = "Internet gateways cost nothing; data transfer out to the internet is billed per GB and is not estimated."
iam_role = "IAM roles and policies cost nothing."
kubernetes_workload = "Pods run on the cluster's node pools, which are priced on the cluster and pool lines."
budget = "AWS Budgets: monitoring budgets cost nothing (the first two action-enabled budgets are free too)."
tls_certificate = "Public ACM certificates cost nothing."
dns_record = "Records are part of the hosted zone; queries are priced on the zone's line."
network_peering = "A peering connection costs nothing to create; traffic across it is billed per GB and is not estimated."
container_environment = "An ECS cluster costs nothing; its services and tasks are priced on their own lines. Container Insights metrics are billed as CloudWatch metrics and are not estimated."

[not_estimated]

