name: CI

on:
  push:
    branches: [master, main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Shared provider plugin cache: the aws/azurerm/google providers are downloaded once
  # per run instead of once per validated example directory.
  TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.plugin-cache

jobs:
  test:
    name: Build, lint, test, validate generated HCL
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      # egui/eframe need these on Linux even for a headless build.
      - name: Install GUI build dependencies
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libxkbcommon-dev libssl-dev

      - name: Install OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_wrapper: false

      - name: Cache provider plugins
        uses: actions/cache@v4
        with:
          path: .plugin-cache
          key: tofu-providers-${{ hashFiles('definitions/providers/*.toml') }}

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy (default features)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Clippy (app without MCP)
        run: cargo clippy -p ttg-app --no-default-features -- -D warnings

      - name: Tests (includes `tofu validate` on every example x provider x tool and the headless MCP test)
        env:
          TTG_REQUIRE_VALIDATE: "1"
        run: cargo test --workspace --no-fail-fast

      - name: Catalog loads and passes the strict checks
        run: cargo run -p ttg-cli -- catalog --strict

      - name: Export the examples (artifact)
        run: |
          mkdir -p .plugin-cache
          for f in examples/*.ttg.json; do
            name=$(basename "$f" .ttg.json)
            cargo run -p ttg-cli -- export-all "$f" --out "out/$name" || true
          done

      - uses: actions/upload-artifact@v4
        with:
          name: generated-terraform
          path: out/
