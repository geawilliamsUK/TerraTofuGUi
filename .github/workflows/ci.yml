name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Build, lint, test, validate generated HCL
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      # egui/eframe need these on Linux even for a headless build.
      - name: Install GUI build dependencies
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libxkbcommon-dev libssl-dev

      - name: Install OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_wrapper: false

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests (includes `tofu validate` on every example)
        env:
          TTG_REQUIRE_VALIDATE: "1"
        run: cargo test --workspace

      - name: Catalog loads
        run: cargo run -p ttg-cli -- catalog --definitions ./definitions

      - name: Export examples (artifact)
        run: |
          cargo run -p ttg-cli -- export-all examples/three-tier.ttg.json --out out/three-tier --validate
          cargo run -p ttg-cli -- export examples/existing-network.ttg.json --provider aws --out out/existing-network/aws --validate

      - uses: actions/upload-artifact@v4
        with:
          name: generated-terraform
          path: out/
